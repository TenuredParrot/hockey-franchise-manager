  // ════════════════════════════════════════════════════════════════════════
  // Modals: box score, player, series, saves, new game
  // ════════════════════════════════════════════════════════════════════════
  function boxHTML(id) {
    const s = S(), g = s.games[id], v = Stats.boxScoreView(s, id), H = g.homeId, A = g.awayId;
    const fin = g.result.decidedIn === 'REG' ? 'Final' : g.result.decidedIn === 'SO' ? 'Final / SO' : g.result.otPeriods > 1 ? `Final / ${g.result.otPeriods}OT` : 'Final / OT';
    const winner = g.result.home > g.result.away ? H : A;
    const line = tid => `<div class="matchup" style="justify-content:space-between"><span>${chip(tid, { big: true })} <b>${esc(teamName(tid))}</b></span><span class="bigscore"${tid === winner ? '' : ' style="color:var(--ink-3)"'}>${tid === H ? g.result.home : g.result.away}</span></div>`;
    const head = `<div class="card">${line(A)}<div style="height:6px"></div>${line(H)}
      <div class="muted small" style="margin-top:8px">${esc(fin)} · ${esc(fmtDate(g.date, { year: 'numeric' }))} · ${g.league}${g.type === 'PO' ? ` · Playoffs game ${g.gameNumber} · ${esc(Game.seriesStatus(g.seriesId))}` : ''} · shots ${g.result.shots[1]}–${g.result.shots[0]}</div></div>`;
    if (!v.detail) return head + '<p class="muted">Only the final score is kept for this game. Full box scores are saved for your NHL and AHL games; other NHL games keep a scoring summary.</p>';
    const nP = v.shotsByPeriod[H].length;
    const pLabel = i => (i < 3 ? String(i + 1) : i === 3 ? 'OT' : `${i - 2}OT`);
    const byPeriod = tid => Array.from({ length: nP }, (_, i) => v.goals.filter(x => x.teamId === tid && x.period === i + 1).length);
    const periodTable = `<table class="t"><thead><tr><th></th>${Array.from({ length: nP }, (_, i) => `<th class="num">${pLabel(i)}</th>`).join('')}<th class="num">T</th><th class="num">Shots</th></tr></thead><tbody>
      ${[A, H].map(tid => `<tr><td>${chip(tid)}</td>${byPeriod(tid).map(n => `<td class="num">${n}</td>`).join('')}<td class="num"><b>${tid === H ? g.result.home : g.result.away}</b></td><td class="num">${U.sum(v.shotsByPeriod[tid])}</td></tr>`).join('')}</tbody></table>`;
    const str = x => (x === 'EV' ? '' : `<span class="badge ${x === 'PP' ? 'acc' : x === 'SH' ? 'warn' : ''}">${x}</span>`);
    const scoring = Array.from({ length: nP }, (_, i) => {
      const goals = v.goals.filter(x => x.period === i + 1);
      return `<tr class="sub"><td colspan="4">${i < 3 ? `Period ${i + 1}` : pLabel(i)}</td></tr>${goals.length ? goals.map(x =>
        `<tr><td class="muted nowrap">${x.clock}</td><td>${chip(x.teamId)}</td><td>${plink(P(x.scorer))}${x.assists.length ? ` <span class="muted small">(${x.assists.map(a => esc(P(a).lastName)).join(', ')})</span>` : ' <span class="muted small">(unassisted)</span>'}</td><td>${str(x.strength)}</td></tr>`).join('') : '<tr><td colspan="4" class="muted small">No scoring</td></tr>'}`;
    }).join('');
    const stars = v.stars.map((id, i) => `<div>${'★'.repeat(i + 1)} ${plink(P(id))} ${chip(P(id).position === 'G' ? (v.goalies.find(x => x.playerId === id) || {}).teamId : (v.skaters ? (v.skaters.find(x => x.playerId === id) || {}).teamId : null) || P(id).teamId)}</div>`).join('');
    const goalies = `<table class="t"><thead><tr><th>Goalie</th><th></th><th class="num">SA</th><th class="num">SV</th><th class="num">GA</th><th class="num">SV%</th><th class="num">TOI</th><th class="num">Dec</th></tr></thead><tbody>
      ${v.goalies.map(x => `<tr><td>${plink(P(x.playerId))}</td><td>${chip(x.teamId)}</td><td class="num">${x.sa}</td><td class="num">${x.saves}</td><td class="num">${x.ga}</td><td class="num">${x.svPct === null ? '–' : pct3(x.svPct)}</td><td class="num">${mmss(x.toiSec)}</td><td class="num">${x.decision || ''}</td></tr>`).join('')}</tbody></table>`;
    const skaters = v.skaters ? [A, H].map(tid => {
      const list = v.skaters.filter(x => x.teamId === tid).sort((a, b) => b.toiSec - a.toiSec);
      return `<div class="card"><h2>${chip(tid)} ${esc(team(tid).name)}</h2><div class="scroll"><table class="t"><thead><tr><th>Skater</th><th class="num">G</th><th class="num">A</th><th class="num">P</th><th class="num">+/-</th><th class="num">PIM</th><th class="num">SOG</th><th class="num">FO</th><th class="num">TOI</th></tr></thead><tbody>
        ${list.map(x => `<tr><td><span class="pos">${P(x.playerId).position}</span> ${plink(P(x.playerId))}</td><td class="num">${x.g}</td><td class="num">${x.a}</td><td class="num"><b>${x.pts}</b></td><td class="num">${signed(x.pm)}</td><td class="num">${x.pim}</td><td class="num">${x.sog}</td><td class="num">${x.fow + x.fol ? `${x.fow}-${x.fol}` : ''}</td><td class="num">${mmss(x.toiSec)}</td></tr>`).join('')}</tbody></table></div></div>`;
    }).join('') : '';
    const so = v.shootout ? `<div class="card"><h2>Shootout</h2>${v.shootout.map(x => `<div>${chip(x.teamId)} ${plink(P(x.playerId))} — ${x.scored ? '<b>scored</b>' : 'no goal'}</div>`).join('')}</div>` : '';
    const pens = v.penalties.length ? `<div class="card"><h2>Penalties</h2><table class="t"><tbody>${v.penalties.map(x => `<tr><td class="muted nowrap">${x.period <= 3 ? `P${x.period}` : 'OT'} ${x.clock}</td><td>${chip(x.teamId)}</td><td>${plink(P(x.playerId))}</td><td class="num">${x.minutes} min</td></tr>`).join('')}</tbody></table></div>` : '';
    return `${head}<div class="grid wide"><div class="card"><h2>By period</h2>${periodTable}</div><div class="card"><h2>Three stars</h2>${stars}</div></div>
      <div class="card"><h2>Scoring</h2><table class="t"><tbody>${scoring}</tbody></table></div>
      ${so}<div class="card"><h2>Goalies</h2>${goalies}</div>${skaters ? `<div class="grid wide">${skaters}</div>` : '<p class="muted small">Skater lines are kept only for your games.</p>'}${pens}`;
  }

  function careerTable(p) {
    const goalie = p.position === 'G', lines = [...p.stats].sort((a, b) => a.season - b.season || (a.type < b.type ? 1 : -1));
    const pr = p.career && p.career.prior;
    if (!lines.length && !pr) return '<p class="muted">No games played.</p>';
    const tot = lines.filter(L => L.league === 'NHL' && L.type === 'REG').reduce((t, L) => { for (const [k, v] of Object.entries(L)) if (typeof v === 'number' && k !== 'season') t[k] = (t[k] || 0) + v; return t; }, {});
    // His career before the league's first season is an estimate (games are real; the rest is from his rating).
    if (pr) for (const k of ['gp', 'g', 'a', 'pim', 'w', 'so']) tot[k] = (tot[k] || 0) + (pr[k] || 0);
    for (const k of ['g', 'a', 'pm', 'pim', 'sog', 'toiSec', 'w', 'l', 'otl', 'sa', 'ga', 'so']) tot[k] = tot[k] || 0;
    const est = '<span class="badge" title="Estimated from his games and rating before the league began">est.</span>';
    const before = pr ? (goalie
      ? `<tr><td class="muted" colspan="2">Before ${seasonLabel(CONFIG.START_SEASON)}</td><td>${est}</td><td class="num">${pr.gp}</td><td class="num">${pr.w} W</td><td class="num">–</td><td class="num">–</td><td class="num">${pr.so}</td></tr>`
      : `<tr><td class="muted" colspan="2">Before ${seasonLabel(CONFIG.START_SEASON)}</td><td>${est}</td><td class="num">${pr.gp}</td><td class="num">${pr.g}</td><td class="num">${pr.a}</td><td class="num"><b>${pr.g + pr.a}</b></td><td class="num">–</td><td class="num">${pr.pim}</td><td class="num">–</td><td class="num">–</td></tr>`) : '';
    const lg = L => (L.league === 'AHL' ? ' <span class="muted small">AHL</span>' : '');
    return goalie
      ? `<table class="t"><thead><tr><th>Season</th><th>Team</th><th></th><th class="num">GP</th><th class="num">W-L-OT</th><th class="num">SV%</th><th class="num">GAA</th><th class="num">SO</th></tr></thead><tbody>${before}${lines.map(L => `<tr><td>${seasonLabel(L.season)}</td><td>${chip(L.teamId)}${lg(L)}</td><td>${L.type === 'PO' ? '<span class="badge acc">Playoffs</span>' : ''}</td><td class="num">${L.gp}</td><td class="num">${L.w}-${L.l}-${L.otl}</td><td class="num">${L.sa ? pct3(1 - L.ga / L.sa) : '–'}</td><td class="num">${L.toiSec ? (L.ga * 3600 / L.toiSec).toFixed(2) : '–'}</td><td class="num">${L.so}</td></tr>`).join('')}
         ${tot.gp ? `<tr class="sub"><td colspan="3">NHL career</td><td class="num">${tot.gp}</td><td class="num">${pr ? `${tot.w} W` : `${tot.w}-${tot.l}-${tot.otl}`}</td><td class="num">${tot.sa ? pct3(1 - tot.ga / tot.sa) : '–'}</td><td class="num">${tot.toiSec ? (tot.ga * 3600 / tot.toiSec).toFixed(2) : '–'}</td><td class="num">${tot.so}</td></tr>` : ''}</tbody></table>`
      : `<table class="t"><thead><tr><th>Season</th><th>Team</th><th></th><th class="num">GP</th><th class="num">G</th><th class="num">A</th><th class="num">P</th><th class="num">+/-</th><th class="num">PIM</th><th class="num">SOG</th><th class="num">TOI</th></tr></thead><tbody>${before}${lines.map(L => `<tr><td>${seasonLabel(L.season)}</td><td>${chip(L.teamId)}${lg(L)}</td><td>${L.type === 'PO' ? '<span class="badge acc">Playoffs</span>' : ''}</td><td class="num">${L.gp}</td><td class="num">${L.g}</td><td class="num">${L.a}</td><td class="num"><b>${L.g + L.a}</b></td><td class="num">${signed(L.pm)}</td><td class="num">${L.pim}</td><td class="num">${L.sog}</td><td class="num">${L.gp ? mmss(L.toiSec / L.gp) : '–'}</td></tr>`).join('')}
         ${tot.gp ? `<tr class="sub"><td colspan="3">NHL career</td><td class="num">${tot.gp}</td><td class="num">${tot.g}</td><td class="num">${tot.a}</td><td class="num"><b>${tot.g + tot.a}</b></td><td class="num">${signed(tot.pm)}</td><td class="num">${tot.pim}</td><td class="num">${tot.sog}</td><td class="num">${tot.toiSec && tot.gp - (pr ? pr.gp : 0) > 0 ? mmss(tot.toiSec / (tot.gp - (pr ? pr.gp : 0))) : '–'}</td></tr>` : ''}</tbody></table>`;
  }

  // What you can do with this player right now (contracts, waivers, free agency).
  function playerActions(p) {
    const s = S(), me = user(), out = [], ph = s.calendar.phase;
    if (p.teamId === me && p.contract && p.contract.type !== 'PTO') {
      if (p.contract.expiresAfterSeason === s.calendar.season && !p.extension && ph !== 'FREE_AGENCY') out.push(`<button class="btn" data-act="resign" data-id="${p.id}">Re-sign…</button>`);
      const b = Contracts.isOffseason(s) && Contracts.buyoutTerms(s, p);
      if (b) out.push(`<button class="btn danger" data-act="buyout" data-id="${p.id}" title="${U.money(b.amount)} dead cap a season for ${b.toSeason - b.fromSeason + 1} seasons">Buy out…</button>`);
    }
    if (p.teamId === me && team(me).roster.reserve.includes(p.id)) out.push(`<button class="btn primary" data-act="sign-elc" data-id="${p.id}">Sign entry-level deal</button>`);
    if (p.assignment === 'FA' && marketOpen()) out.push(`<button class="btn primary" data-act="offer" data-id="${p.id}">Make an offer…</button>`);
    const w = s.pending.waivers.find(x => x.playerId === p.id && x.fromTeamId !== me);
    if (w) out.push(`<label class="small"><input type="checkbox" data-change="claim" data-id="${p.id}"${w.userClaim ? ' checked' : ''}> Claim him off waivers</label>`);
    if (p.teamId && Trade.isOpen(s) && !p.archived) {
      const why = p.teamId === me ? Trade.assetProblem(s, me, { type: 'player', id: p.id }) : Trade.assetProblem(s, p.teamId, { type: 'player', id: p.id }, me);
      if (p.teamId === me) out.push(`<button class="btn" data-act="trade-add" data-id="${p.id}"${why ? ` disabled title="${esc(why)}"` : ''}>Add to a trade</button>`, `<button class="btn" data-act="trade-shop" data-id="${p.id}"${why ? ` disabled title="${esc(why)}"` : ''}>Shop him…</button>`);
      else out.push(`<button class="btn" data-act="trade-for" data-id="${p.id}"${why ? ` disabled title="${esc(why)}"` : ''}>Trade for him…</button>`);
    }
    return out.length ? `<div class="toolbar" style="margin:10px 0 0">${out.join('')}</div>` : '';
  }

  function playerHTML(id) {
    const s = S(), p = P(id);
    if (p.missing) return '<p class="muted">This player has left the league and is no longer on file.</p>';
    if (p.archived) {
      const d = p.career.draft;
      return `<div class="card"><div class="matchup">${ovr(p.dev.peakOvr)}<div><b style="font-size:17px">${esc(Select.fullName(p))}</b> <span class="pos">${p.position}</span>
          <div class="muted small"><span class="badge">Retired</span> ${hofBadge(p.id)} after ${seasonLabel(p.retired.season)} at ${p.retired.age} · peak OVR ${p.dev.peakOvr} · ${p.career.nhlGP} NHL games · ${d ? `drafted ${d.year} #${d.overall} by ${chip(d.teamId)}` : 'undrafted'}</div></div></div></div>
        ${awardsCard(p.id)}
        <div class="card"><h2>Career</h2><div class="scroll">${careerTable(p)}</div></div>`;
    }
    const pAge = age(p), c = p.contract, goalie = p.position === 'G';
    const inches = Math.round(p.heightCm / 2.54);
    const A = p.attributes;
    const groups = goalie
      ? [['Goaltending', ['reflexes', 'positioning', 'reboundControl', 'puckTracking', 'mental']], ['Physical', ['stamina', 'durability']]]
      : [['Offense', ['shooting', 'passing', 'puckHandling', 'offIQ']], ['Defense', ['defIQ', 'physicality']], ['Skating', ['skating', 'stamina']], ['Other', ['faceoffs', 'discipline', 'durability']]];
    const label = k => ({ offIQ: 'Offensive IQ', defIQ: 'Defensive IQ', puckHandling: 'Puck handling', reboundControl: 'Rebound control', puckTracking: 'Puck tracking' }[k] || k.charAt(0).toUpperCase() + k.slice(1));
    const bar = v => `<span class="bar"><i style="width:${v}%;background:var(--${ovrClass(v)})"></i></span>`;
    const attrs = groups.map(([g, keys]) => `<div><div class="section-title">${g}</div>${keys.map(k => `<div class="attr"><span>${label(k)}</span>${bar(A[k])}<b class="num">${A[k]}</b></div>`).join('')}</div>`).join('');
    const where = p.teamId ? `${chip(p.assignment === 'AHL' ? team(p.teamId).affiliateId : p.teamId)} ${esc(p.assignment === 'AHL' ? teamName(team(p.teamId).affiliateId) : teamName(p.teamId))} <span class="badge">${p.assignment}</span>` : '<span class="badge">Free agent</span>';
    const d = p.career.draft;
    const statsTable = careerTable(p);
    const where2 = p.assignment === 'PROSPECT' ? '<span class="badge">Draft-eligible prospect</span>' : p.assignment === 'JUNIOR' || p.assignment === 'EUROPE' ? `${chip(p.teamId)} <span class="badge">Unsigned draft pick · ${p.assignment === 'EUROPE' ? 'Europe' : 'junior'}</span>` : where;
    const contractRows = c ? `<dl class="kv"><dt>Type</dt><dd>${c.type === 'PTO' ? 'AHL tryout' : c.type.replace('_', '-')}</dd>${c.type !== 'PTO' ? `<dt>Cap hit</dt><dd>${U.money(c.capHit)}</dd><dt>Years left</dt><dd>${c.yearsRemaining} (through ${seasonLabel(c.expiresAfterSeason)})</dd>
        <dt>At expiry</dt><dd>${c.expiresAfterSeason === s.calendar.season ? Contracts.faStatus(s, p) : Contracts.expiryStatus(s, p)}</dd>
        <dt>Waivers</dt><dd>${p.waivers ? '<span class="badge warn">On waivers now</span>' : Contracts.waiverExempt(p) ? 'Exempt' : 'Required to send down'}</dd>` : ''}

  function toast(text, kind = '') {
    const box = document.getElementById('toast'), div = document.createElement('div');
    div.textContent = text;
    if (kind) div.className = kind;
    box.appendChild(div);
    while (box.children.length > 3) box.firstChild.remove();
    setTimeout(() => div.remove(), kind === 'bad' ? 6000 : 3500);
  }

  // ════════════════════════════════════════════════════════════════════════
  // Simulation (yields to the browser every few days so the page stays responsive)
  // ════════════════════════════════════════════════════════════════════════
  const nextFrame = () => new Promise(r => setTimeout(r, 0));
  async function runSim(kind) {
    if (ui.busy || !S()) return;
    const s = S(), startPhase = s.calendar.phase;
    if (kind === 'next' && !Calendar.teamGames(s, user()).some(g => !g.played)) { toast('No game is scheduled for your team.'); return; }
    ui.busy = true; ui.blockers = null; ui.progress = fmtShort(s.calendar.date); render();
    let days = 0, stopped = null, needs = null, lastUserGame = null;
    const done = {
      day: () => true,
      next: res => res.played.some(id => userGame(s.games[id])),
      week: () => days >= 7,
      month: () => days >= 30,
      phase: () => s.calendar.phase !== startPhase,
    }[kind];
    try {
      for (let guard = 0; guard < 400; guard++) {
        const res = Game.advanceDay();
        if (!res.ok) { stopped = res.blockers; needs = res.needs || null; break; }
        days++;
        const ug = res.played.map(id => s.games[id]).find(userGame);
        if (ug) lastUserGame = ug;
        if (done(res)) break;
        if (kind !== 'phase' && res.interrupts.length) { toast(res.interrupts[0].title); break; }   // "sim to …" runs straight through
        if (days % 4 === 0) { ui.progress = fmtShort(s.calendar.date); renderBusy(); await nextFrame(); }
      }
    } catch (e) {
      console.error(e); window.__uiErrors.push(String(e.stack || e));
      toast(`Simulation error: ${e.message}`, 'bad');
    }
    ui.busy = false;
    if (stopped && needs === 'DRAFT') { ui.view = 'draft'; toast(stopped[0]); }
    else if (stopped) { ui.blockers = stopped; openModal('blockers', stopped); }
    if (lastUserGame && kind !== 'phase') {
      const r = resultFor(lastUserGame, user()), opp = lastUserGame.homeId === user() ? lastUserGame.awayId : lastUserGame.homeId;
      toast(`${r.label} ${r.score} ${lastUserGame.homeId === user() ? 'vs' : '@'} ${team(opp).abbrev}`);
    } else if (days > 1) toast(`Simulated ${days} days.`);
    render();
    if (days) autosave();
  }
  // Light re-render of the header only while a sim runs.
  function renderBusy() { const h = document.querySelector('.topbar'); if (h) h.outerHTML = headerHTML(); }

  // One autosave at a time. A request that arrives while one is being written isn't dropped: the save runs again when
  // it finishes, so the autosave always ends up with the latest state (two quick sims used to leave it one behind).
  let saving = null, saveAgain = false;
  function autosave() {
    if (saving) { saveAgain = true; return saving; }
    saving = (async () => {
      do {
        saveAgain = false;
        try { await Game.save('autosave'); } catch (e) { toast(`Autosave failed: ${e.message}`, 'bad'); }
      } while (saveAgain);
    })().finally(() => { saving = null; });
    return saving;
  }

  async function startNewGame(teamId, seed) {
    const seedVal = seed === undefined || seed === null || String(seed).trim() === '' ? Date.now() : (isNaN(Number(seed)) ? String(seed) : Number(seed));
    ui.view = 'dashboard'; ui.rosterTeam = null; ui.lineSel = null; ui.blockers = null;
    Game.newGame({ seed: seedVal, userTeamId: teamId });
    closeModal(); render();
    toast(`Welcome to ${teamName(teamId)}. Training camp opens today.`);
    await autosave();
  }

    continue: async () => { try { await Game.load('autosave'); render(); } catch (e) { toast(e.message, 'bad'); } },
  };
  const CHANGES = {
    'roster-team': el => { ui.rosterTeam = el.value; render(); },
    'auto-draft': el => { Game.setAutoDraft(el.checked); toast(el.checked ? 'Your staff will make your picks.' : 'You make your own picks.'); render(); },
    'auto-contracts': el => { Game.setAutoContracts(el.checked); toast(el.checked ? 'Staff will re-sign, qualify and sign prospects each summer.' : 'You handle contracts yourself.'); render(); },
    qualify: el => { Game.setQualify(el.dataset.id, el.checked); render(); },
    'news-filter': el => { ui.newsFilter = el.value; ui.newsShow = 100; render(); },
    'hist-team': el => { ui.histTeam = el.value; render(); },
    'trade-partner': el => { ui.tradePartner = el.value; ui.trade.theirs = { players: [], picks: [], retain: {} }; ui.tradeTabTheirs = 'NHL'; render(); },
    'trade-asset': el => {
      const g = ui.trade[el.dataset.side], k = el.dataset.kind === 'pick' ? 'picks' : 'players', id = el.dataset.id;
      if (el.checked) { if (!g[k].includes(id)) g[k].push(id); } else { g[k] = g[k].filter(x => x !== id); delete g.retain[id]; }
      render();
    },
    'trade-retain': el => { const v = Number(el.value); if (v > 0) ui.trade.mine.retain[el.dataset.id] = v; else delete ui.trade.mine.retain[el.dataset.id]; render(); },
    claim: el => { try { Game.claimWaivers(el.dataset.id, el.checked); toast(el.checked ? 'Claim submitted.' : 'Claim withdrawn.'); } catch (e) { toast(e.message, 'bad'); } render(); if (ui.modal) renderModal(); },
    'auto-roster': el => { Game.setAutoRoster(el.checked); toast(el.checked ? 'Call-ups and injured reserve will be handled automatically.' : 'You now manage call-ups and injured reserve yourself.'); render(); },
    'import-file': el => {
      const f = el.files && el.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => { try { const { problems } = Game.importSave(String(reader.result)); closeModal(); ui.view = 'dashboard'; render(); autosave(); toast(problems.length ? `Imported with ${problems.length} warning(s).` : 'Save imported.'); } catch (e) { toast(e.message, 'bad'); } };
      reader.readAsText(f);
    },
  };
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || (el.disabled)) return;
    const fn = ACTIONS[el.dataset.act];
    if (fn) { if (el.tagName === 'A') e.preventDefault(); fn(el.dataset, el, e); }
  });
  document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && ui.modal) { closeModal(); return; }
    if (ui.modal || !S() || e.metaKey || e.ctrlKey || e.altKey || /input|select|textarea/i.test(e.target.tagName)) return;
    const k = { d: 'day', n: 'next', w: 'week' }[e.key.toLowerCase()];
    if (k) runSim(k);
  });

  async function boot() {
    try { ui.welcomeSaves = await Game.listSaves(); } catch (e) { ui.welcomeSaves = []; }
    render();
  }

  window.HFM_UI = { ui, render, renderModal, show: v => ACTIONS.view({ view: v }), newGame: startNewGame, sim: runSim, openModal, closeModal, onSlot, boot, ready: boot() };
})();

</script>
</body>
</html>
