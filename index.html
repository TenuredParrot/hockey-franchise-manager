<script>
/* ── game.js ── */
/*
 * Hockey Franchise Manager — engine (game.js)
 *
 * Four rules (BLUEPRINT.md §6):
 *   1. The UI changes state only through Game.*.
 *   2. Nothing in this file touches the DOM.
 *   3. Every tunable number lives in CONFIG.
 *   4. Every random number comes from RNG, whose state lives in state.meta (so saves replay exactly).
 *
 * Built so far: Phase 1 (foundation), Phase 2 (schedule, lines, game engine, stats),
 *               Phase 3 (daily loop, phases, energy & injuries, roster moves, playoffs, inbox),
 *               Phase 4 (offseason: progression, retirements, draft, re-signing, free agency, waivers, cap rules),
 *               Phase 5 (AI GM: trade values, the strategy classifier, AI-to-AI trades, offers to the user, the trade screen),
 *               Phase 6 (polish: scouting fog, the news feed, records and milestones, more awards, the Hall of Fame).
 * Sections are in dependency order; later phases slot in where marked.
 */
'use strict';

// ════════════════════════════════════════════════════════════════════════════
// §1 CONFIG — every tunable number
// ════════════════════════════════════════════════════════════════════════════

function deepFreeze(o) {
  for (const v of Object.values(o)) if (v && typeof v === 'object') deepFreeze(v);
  return Object.freeze(o);
}

const CONFIG = deepFreeze({
  SAVE_VERSION: 6,
  START_SEASON: 2026,                 // the 2026-27 season
  START_MMDD: '09-20',                // a new game opens at training camp
  AGE_CUTOFF_MMDD: '09-15',           // "season age" = age on Sept 15 (NHL draft convention)
  LEAGUE_YEAR_START_MONTH: 7,         // July 1 starts a new league year

  roster: {
    nhlMax: 23, minSkatersDressed: 18, minGoaliesDressed: 2, contractMax: 50,
    nhlSlots: { C: 5, LW: 4, RW: 4, D: 8, G: 2 },     // 23
    ahlSlots: { C: 5, LW: 4, RW: 4, D: 7, G: 2 },     // 22
    reservePerOrg: 6,                                   // unsigned draftees in junior / Europe
    freeAgents: { C: 16, LW: 14, RW: 14, D: 22, G: 8 },
  },

  cap: {
    // Defaults approximating the 2026-27 NHL. Change freely to model another CBA.
    upper: 104_000_000, lowerPct: 0.74, minSalary: 850_000, maxContractPct: 0.20,
    elcMax: 975_000, maxTermResign: 8, maxTermFA: 7, rounding: 25_000,
    goalieMarketMult: 0.75,          // top goalies earn well below top skaters of equal OVR
    buryExtra: 375_000,              // in the minors, a cap hit above minSalary + buryExtra still counts ("buried" cap)
    offseasonOverage: 0.10,          // from the end of the season to training camp, payrolls may run 10% over the upper limit
    buyout: { share: 2 / 3, youngShare: 1 / 3, youngUnder: 26 },   // of the remaining money, spread over twice the remaining years
  },

  // Waivers (simplified CBA). A player who isn't exempt must clear waivers to be sent to the minors in-season.
  waivers: {
    exempt: [[20, 3, 160], [21, 3, 80], [22, 2, 80], [23, 2, 60], [24, 1, 60], [99, 1, 60]],   // [age signed ≤, pro seasons, NHL GP]
    phases: ['PRESEASON', 'REGULAR_SEASON', 'PLAYOFFS'],
    claimMargin: 1.5,                // an AI team claims a player who beats its weakest dressed player at his position by this much
    claimMaxAge: 34, claimMaxOverpay: 1.3,
  },

  attr: { min: 20, max: 99 },

// §2 U — utilities (pure; no randomness)
// ════════════════════════════════════════════════════════════════════════════

const U = (() => {
  const DAY_MS = 86_400_000;
  const clamp = (x, lo, hi) => (x < lo ? lo : x > hi ? hi : x);
  const round = (x, dp = 0) => { const f = 10 ** dp; return Math.round(x * f) / f; };
  const roundTo = (x, step) => Math.round(x / step) * step;
  const sum = arr => arr.reduce((s, x) => s + x, 0);
  const mean = arr => (arr.length ? sum(arr) / arr.length : 0);

  // Dates are ISO "YYYY-MM-DD" strings in state; they compare correctly as plain strings.
  const dateToDay = iso => { const [y, m, d] = iso.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / DAY_MS); };
  const dayToDate = n => new Date(n * DAY_MS).toISOString().slice(0, 10);
  const addDays = (iso, n) => dayToDate(dateToDay(iso) + n);
  const daysBetween = (a, b) => dateToDay(b) - dateToDay(a);
  const mmdd = iso => iso.slice(5);
  const ageOn = (birthDate, onDate) => {
    let age = Number(onDate.slice(0, 4)) - Number(birthDate.slice(0, 4));
    if (onDate.slice(5) < birthDate.slice(5)) age--;
    return age;
  };
  const seasonAge = (birthDate, season) => ageOn(birthDate, `${season}-${CONFIG.AGE_CUTOFF_MMDD}`);
  // League year: July → June. 2027-03-01 belongs to season 2026; 2027-07-01 starts season 2027.
  const seasonOf = iso => {
    const y = Number(iso.slice(0, 4)), m = Number(iso.slice(5, 7));
    return m >= CONFIG.LEAGUE_YEAR_START_MONTH ? y : y - 1;
  };
  const seasonDate = (season, mmddStr) =>
    `${Number(mmddStr.slice(0, 2)) >= CONFIG.LEAGUE_YEAR_START_MONTH ? season : season + 1}-${mmddStr}`;

  const nextId = (s, kind, prefix, width = 6) => {
    const n = (s.meta.counters[kind] = (s.meta.counters[kind] || 0) + 1);
    return prefix + String(n).padStart(width, '0');
  };

  // FNV-1a: turns any seed (number or string) into a 32-bit int.
  const hashString = str => {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return h | 0;
  };

  // Deterministic uniform [0, 1) from a string: stable "random" traits that don't consume RNG state.
  const hash01 = str => (hashString(str) >>> 0) / 4294967296;
  // Deterministic standard normal from a string (Box–Muller over two hashes).
  const hashNormal = str => Math.sqrt(-2 * Math.log(Math.max(1e-9, hash01(`${str}:a`)))) * Math.cos(2 * Math.PI * hash01(`${str}:b`));

  const money = n => `$${(n / 1e6).toFixed(n % 1e6 === 0 ? 1 : 2)}M`;

  return { clamp, round, roundTo, sum, mean, dateToDay, dayToDate, addDays, daysBetween, mmdd,
           ageOn, seasonAge, seasonOf, seasonDate, nextId, hashString, hash01, hashNormal, money };
})();

// ════════════════════════════════════════════════════════════════════════════
// §3 RNG — seeded mulberry32. ALL generator state is holder.rngState (state.meta),
//          so a save/load resumes the exact same random sequence.
//          No cached spare normals: anything cached outside state would break replays.
// ════════════════════════════════════════════════════════════════════════════

const RNG = (() => {
  const seedFrom = seed => (typeof seed === 'number' && Number.isFinite(seed) ? seed | 0 : U.hashString(String(seed)));

  function bind(holder) {
    if (!Number.isInteger(holder.rngState)) throw new Error('RNG.bind: holder.rngState must be an integer');
    const next = () => {
      const a = (holder.rngState = (holder.rngState + 0x6D2B79F5) | 0);
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const r = {
      next,
      float: (lo, hi) => lo + (hi - lo) * next(),
      int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)),          // inclusive
      chance: p => next() < p,
      normal: (mu = 0, sd = 1) => {
        let u = 0; while (u === 0) u = next();
        return mu + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * next());
      },
      truncNormal: (sd, lim) => U.clamp(r.normal(0, sd), -lim, lim),
      poisson: lambda => { const L = Math.exp(-lambda); let k = 0, p = 1; do { k++; p *= next(); } while (p > L); return k - 1; },
      pick: arr => arr[Math.floor(next() * arr.length)],
      weightedIndex: weights => {
        let total = 0; for (const w of weights) total += w;
        let x = next() * total;
        for (let i = 0; i < weights.length; i++) { x -= weights[i]; if (x < 0) return i; }
        return weights.length - 1;
      },
      weighted: (items, weightFn) => items[r.weightedIndex(items.map(weightFn))],
      weightedKey: obj => { const keys = Object.keys(obj); return keys[r.weightedIndex(keys.map(k => obj[k]))]; },
      shuffle: arr => {
        for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
        return arr;
      },
    };
    return r;
  }

  return { bind, seedFrom };
})();

// ════════════════════════════════════════════════════════════════════════════
// §5 Ratings — OVR and unit ratings (BLUEPRINT §1.2, §3.1)
// ════════════════════════════════════════════════════════════════════════════

const Ratings = (() => {
  for (const [grp, w] of Object.entries(CONFIG.ovrWeights)) {
    const total = U.sum(Object.values(w));
    if (Math.abs(total - 1) > 1e-9) throw new Error(`CONFIG.ovrWeights.${grp} sums to ${total}, must be 1`);
  }
  const group = pos => (pos === 'LW' || pos === 'RW' ? 'W' : pos);       // C | W | D | G
  const isForward = pos => pos === 'C' || pos === 'LW' || pos === 'RW';
  const attrsOf = x => x.attributes || x;                                 // player or bare attributes
  const lin = (a, w) => { let t = 0; for (const k in w) t += w[k] * a[k]; return t; };

  const ovrRaw = p => lin(p.attributes, CONFIG.ovrWeights[group(p.position)]);
  const ovr = p => Math.round(ovrRaw(p));
  const refresh = p => { p.ovr = ovr(p); return p; };

  const K = CONFIG.unit;
  const fOff = x => lin(attrsOf(x), K.fOff);
  const fDef = x => lin(attrsOf(x), K.fDef);
  const dOff = x => lin(attrsOf(x), K.dOff);
  const dDef = x => lin(attrsOf(x), K.dDef);
  const goalie = x => lin(attrsOf(x), CONFIG.ovrWeights.G);
  // A unit with no D (e.g. 3v3 forwards-only or empty list) falls back to the forwards.
  const unitOff = (fwds, defs) => (defs.length
    ? K.offMix.F * U.mean(fwds.map(fOff)) + K.offMix.D * U.mean(defs.map(dOff))
    : U.mean(fwds.map(fOff)));
  const unitDef = (fwds, defs) => (defs.length
    ? K.defMix.F * U.mean(fwds.map(fDef)) + K.defMix.D * U.mean(defs.map(dDef))
    : U.mean(fwds.map(fDef)));

  // Lineup-independent display index for a whole NHL roster (Sim.aggregates has the lineup-based ratings).
  function teamOverall(s, orgId) {
    const ps = s.teams[orgId].roster.nhl.map(id => s.players[id]);
    const top = (list, n) => U.mean(list.map(p => p.ovr).sort((a, b) => b - a).slice(0, n));
    const F = top(ps.filter(p => isForward(p.position)), 12);
    const D = top(ps.filter(p => p.position === 'D'), 6);
    const G = top(ps.filter(p => p.position === 'G'), 1);
    return { F: U.round(F, 1), D: U.round(D, 1), G: U.round(G, 1), overall: U.round(0.5 * F + 0.3 * D + 0.2 * G, 1) };
  }

  return { group, isForward, ovrRaw, ovr, refresh, fOff, fDef, dOff, dDef, goalie, unitOff, unitDef, teamOverall };
})();

// ════════════════════════════════════════════════════════════════════════════
// §6 Progression — OVR career curve (BLUEPRINT §4.2), attribute changes (§4.4), ice time, retirement
//    Phase 1 uses the curve to age generated players; Phase 4 runs it every offseason.
// ════════════════════════════════════════════════════════════════════════════

const Progression = (() => {
  const P = CONFIG.progression;
  const curveGroup = pos => (pos === 'D' ? 'D' : pos === 'G' ? 'G' : 'F');

  // st: { age, ovr, potential, peakAge, workEthic, durability, group: F|D|G, tier }
  // Returns the OVR change for the offseason that follows the season played at st.age.
  // In every regime a gain is capped so OVR never passes potential + 1.
  function delta(st, rng, iceTimeMult = 1) {
    const ytp = st.peakAge - st.age;
    let d;
    if (ytp > 0) {
      const gap = Math.max(0, st.potential - st.ovr);
      d = gap * Math.min(1, P.kGrow / ytp) * st.workEthic * iceTimeMult + rng.truncNormal(P.growNoise.sd, P.growNoise.lim);
    } else if (st.age <= st.peakAge + P.plateauYears) {
      d = rng.truncNormal(P.plateauNoise.sd, P.plateauNoise.lim);
    } else {
      const y = st.age - st.peakAge - P.plateauYears;
      d = -P.decline[st.group] * y ** P.declineExp * (1.15 - st.durability / 200)
        + rng.truncNormal(P.declineNoise.sd, P.declineNoise.lim);
      d = Math.max(d, -(P.floorBase + P.floorPerYear * y));
    }
    return d > 0 ? Math.min(d, Math.max(0, st.potential + 1 - st.ovr)) : d;
  }

  function step(st, rng, iceTimeMult = 1) {
    st.ovr = U.clamp(st.ovr + delta(st, rng, iceTimeMult), P.ovrClamp[0], P.ovrClamp[1]);
    st.age++;
    const drift = P.potentialDrift;
    if (st.age <= drift.untilAge) {
      const [lo, hi] = CONFIG.tiers[st.tier];
      st.potential = U.clamp(st.potential + rng.truncNormal(drift.sd, drift.lim),
                             Math.max(lo - drift.belowTier, st.ovr), Math.min(99, hi + drift.aboveTier));
    }
    return st;
  }

  // Generate genes for a player of `tier` and run his career from age 18 to `age`.
  function careerToDate(rng, { tier, group, age, durability }) {
    const [lo, hi] = CONFIG.tiers[tier], mu = P.peakAge[group];
    const st = {
      tier, group, durability, age: 18,
      potential: rng.float(lo, hi),
      peakAge: U.clamp(rng.normal(mu, P.peakAgeSd), mu - P.peakAgeRange, mu + P.peakAgeRange),
      workEthic: rng.float(P.workEthic[0], P.workEthic[1]),
    };
    st.ovr = st.potential - rng.float(P.startGap[0], P.startGap[1]);
    st.peak = st.ovr;
    while (st.age < age) { step(st, rng); st.peak = Math.max(st.peak, st.ovr); }
    return st;
  }

  // ── Phase 4: real players ────────────────────────────────────────────────
  const ZERO = { truncNormal: () => 0 };                    // noise-free "rng" for projections

  // A player's curve state for the season his current ratings apply to.
  const stateOf = (p, season) => ({
    age: U.seasonAge(p.birthDate, season), ovr: Ratings.ovrRaw(p), potential: p.dev.potential, peakAge: p.dev.peakAge,
    workEthic: p.dev.workEthic, durability: p.attributes.durability, group: curveGroup(p.position), tier: p.dev.potentialTier,
  });

  // Expected OVR (no noise) for seasons [fromSeason, fromSeason + n), given ratings that apply to `ratedSeason`.
  // The trade engine (Phase 5) and contract demands both use this.
  function project(p, ratedSeason, fromSeason, n, potential = null) {
    const st = stateOf(p, ratedSeason), out = [];
    if (potential !== null) st.potential = potential;            // a team's scouting estimate (Phase 6)
    for (let season = ratedSeason; season < fromSeason + n; season++) {
      if (season >= fromSeason) out.push(st.ovr);
      st.ovr = U.clamp(st.ovr + delta(st, ZERO), P.ovrClamp[0], P.ovrClamp[1]);
      st.age++;
    }
    return out;
  }

  // Ice time in `season` → growth multiplier (§4.2).
  function iceTimeMult(p, season) {
    const T = P.iceTime;
    if (p.assignment === 'JUNIOR' || p.assignment === 'EUROPE' || p.assignment === 'PROSPECT') return T.regular;   // big minutes in junior
    let nhlGP = 0, nhlToi = 0, starts = 0, gp = 0;
    for (const L of p.stats) {
      if (L.season !== season || L.type !== 'REG') continue;
      gp += L.gp;
      if (L.league === 'NHL') { nhlGP += L.gp; nhlToi += L.toiSec; starts += L.gs || 0; }
    }
    if (p.position === 'G' ? starts >= T.topStarts : nhlGP >= T.topGP && nhlToi / nhlGP >= (p.position === 'D' ? T.topToiD : T.topToiF)) return T.top;
    return gp >= T.regularGP ? T.regular : T.buried;
  }

  // Spread an OVR change d across the attributes (§4.4) so Σ w·Δattr = d, keeping attributes integral in [min, max].
  function applyDelta(p, d, rng) {
    const w = CONFIG.ovrWeights[Ratings.group(p.position)], A = CONFIG.attr, a = p.attributes;
    const m = d >= 0 ? P.attrMult.growth : P.attrMult.decline;
    const mult = k => (m[k] === undefined ? 1 : m[k]);
    const target = Ratings.ovrRaw(p) + d;
    const norm = U.sum(Object.keys(w).map(k => w[k] * mult(k)));
    const x = {};
    for (const k in w) x[k] = a[k] + d * mult(k) / norm + rng.float(-P.attrJitter, P.attrJitter);
    // Re-balance (jitter and clamping) until the weighted mean hits the target.
    for (let iter = 0; iter < 8; iter++) {
      let cur = 0;
      for (const k in w) { x[k] = U.clamp(x[k], A.min, A.max); cur += w[k] * x[k]; }
      const err = target - cur;
      if (Math.abs(err) < 1e-6) break;
      const free = Object.keys(w).filter(k => (err > 0 ? x[k] < A.max : x[k] > A.min));
      const fw = U.sum(free.map(k => w[k]));
      if (!fw) break;
      for (const k of free) x[k] += err / fw;
    }
    // Round to integers: start from the floors, then round up (largest fractions first) while that brings the
    // weighted mean closer to the target. Symmetric, so it doesn't drift OVR up or down over a career.
    const keys = Object.keys(w).sort((k1, k2) => (x[k2] - Math.floor(x[k2])) - (x[k1] - Math.floor(x[k1])) || w[k2] - w[k1]);
    let err = target;
    for (const k of keys) { a[k] = U.clamp(Math.floor(x[k]), A.min, A.max); err -= w[k] * a[k]; }
    for (const k of keys) {
      if (a[k] + 1 <= A.max && Math.abs(err - w[k]) < Math.abs(err)) { a[k]++; err -= w[k]; }
    }
    // Attributes outside OVR.
    const sm = d >= 0 ? P.stamina.growth : P.stamina.decline;
    a.stamina = Math.round(U.clamp(a.stamina + d * sm + rng.float(-0.5, 0.5), A.min, A.max));
    if (a.faceoffs !== undefined && w.faceoffs === undefined) a.faceoffs = Math.round(U.clamp(a.faceoffs + d * 0.5 + rng.float(-0.5, 0.5), A.min, A.max));
    if (a.discipline !== undefined) a.discipline = Math.round(U.clamp(a.discipline + rng.float(-1.5, 1.5), A.min, A.max));
    Ratings.refresh(p);
  }

  // One offseason for a real player: the curve step for the season just played, applied to his attributes.
  function develop(p, rng, season) {
    const st = stateOf(p, season), before = st.ovr;
    const d = U.clamp(st.ovr + delta(st, rng, iceTimeMult(p, season)), P.ovrClamp[0], P.ovrClamp[1]) - st.ovr;
    applyDelta(p, d, rng);
    p.dev.peakOvr = Math.max(p.dev.peakOvr || 0, Math.round(before), p.ovr);
    const drift = P.potentialDrift;
    if (st.age + 1 <= drift.untilAge) {
      const [lo, hi] = CONFIG.tiers[p.dev.potentialTier];
      p.dev.potential = U.round(U.clamp(p.dev.potential + rng.truncNormal(drift.sd, drift.lim),
                                        Math.max(lo - drift.belowTier, Ratings.ovrRaw(p)), Math.min(99, hi + drift.aboveTier)), 1);
    }
    return { before, after: Ratings.ovrRaw(p), delta: d };
  }

  const logistic = z => 1 / (1 + Math.exp(-z));
  function retireChance(age, ovr, unsigned) {
    const R = CONFIG.retirement;
    if (age < R.minAge) return 0;
    return logistic(R.ageCoef * (age - R.ageMid) + R.ovrCoef * (R.ovrMid - ovr) + (unsigned ? R.unsigned : 0)) * (unsigned ? 1 : R.underContract);
  }

  return { curveGroup, delta, step, careerToDate, stateOf, project, iceTimeMult, applyDelta, develop, retireChance };
})();

// ════════════════════════════════════════════════════════════════════════════
// §7 Contracts — cap math, buried cap, LTIR relief, waiver exemption, demands, ELCs, buyouts
// ════════════════════════════════════════════════════════════════════════════

const Contracts = (() => {
  const C = CONFIG.cap;
  const maxContract = () => C.maxContractPct * C.upper;
  const capLower = () => U.roundTo(C.lowerPct * C.upper, 100_000);

  // BLUEPRINT §1.2: MIN + (MAX − MIN) · clamp((ovr − 60)/39, 0, 1)², goalies discounted
  const fairCap = (ovr, position = 'C') => {
    const x = U.clamp((ovr - 60) / 39, 0, 1);
    const raw = C.minSalary + (maxContract() - C.minSalary) * x * x;
    return U.roundTo(Math.max(C.minSalary, raw * (position === 'G' ? C.goalieMarketMult : 1)), C.rounding);
  };

  // Share of a player's cap hit retained by OTHER teams in `season` (team.finances.retained is the source of truth).
  // An entry covers the contract he was traded on (untilSeason = its last season), never a later extension.
  const retainedShare = (s, playerId, season = s.calendar.season) => {
    let pct = 0;
    for (const t of Object.values(s.teams)) {
      if (t.league !== 'NHL') continue;
      for (const r of t.finances.retained) if (r.playerId === playerId && r.untilSeason >= season) pct += r.pct;
    }
    return pct;
  };
  const activeRetained = (t, season) => t.finances.retained.filter(r => r.untilSeason >= season);

  // Buried cap: in the minors, only the part of a cap hit above minSalary + buryExtra counts.
  const buryAllowance = () => C.minSalary + C.buryExtra;
  const buried = c => (c && c.type !== 'PTO' ? Math.max(0, c.capHit - buryAllowance()) : 0);
  const callUpCost = c => c.capHit - buried(c);              // what a call-up adds to the payroll
  const deadCapFor = (t, season) => U.sum(t.finances.deadCap.filter(d => d.fromSeason <= season && season <= d.toSeason).map(d => d.amount));

  // The contract a player will be on in `season` (an in-season extension replaces an expiring deal).
  const contractIn = (p, season) => {
    if (p.contract && p.contract.type !== 'PTO' && p.contract.expiresAfterSeason >= season) return p.contract;
    if (p.extension && p.extension.expiresAfterSeason >= season) return p.extension;
    return null;
  };

  // Payroll for `season`: the NHL roster (IR/LTIR included) at full cap hit less any share retained elsewhere, buried
  // AHL cap, dead cap and salary this team retains. For a future season, qualified RFAs count at their expected
  // one-year award. `hyp` prices a trade before it happens: { out: Set of ids leaving, add: [{ id, level }],
  // retained: [{ teamId, playerId, pct, capHit, untilSeason }] }.
  function payrollFor(s, orgId, season, hyp = null) {
    const t = s.teams[orgId], out = hyp && hyp.out, add = (hyp && hyp.add) || [], extra = (hyp && hyp.retained) || [];
    const shares = new Map();
    for (const tt of Object.values(s.teams)) if (tt.league === 'NHL') for (const r of tt.finances.retained) if (r.untilSeason >= season) shares.set(r.playerId, (shares.get(r.playerId) || 0) + r.pct);
    for (const r of extra) if (r.untilSeason >= season) shares.set(r.playerId, (shares.get(r.playerId) || 0) + r.pct);
    const share = id => shares.get(id) || 0;
    const keep = id => !out || !out.has(id);
    let total = deadCapFor(t, season);
    const lists = [[[...t.roster.nhl.filter(keep), ...add.filter(a => a.level === 'nhl').map(a => a.id)], true],
                   [[...t.roster.ahl.filter(keep), ...add.filter(a => a.level === 'ahl').map(a => a.id)], false]];
    for (const [list, full] of lists) {
      for (const id of list) {
        const p = s.players[id], c = contractIn(p, season);
        if (c) total += full ? c.capHit * (1 - share(id)) : buried(c);
        else if (season > s.calendar.season && p.qualified && p.contract && p.contract.type !== 'PTO') total += full ? demand(s, p, 1) : buried({ capHit: demand(s, p, 1) });
      }
    }
    for (const r of [...activeRetained(t, season), ...extra.filter(r => r.teamId === orgId && r.untilSeason >= season)]) total += r.capHit * r.pct;
    return Math.round(total);
  }
  // This league year's payroll (what the cap ceiling binds in-season).
  const capPayroll = (s, orgId) => payrollFor(s, orgId, s.calendar.season);
  // Next season's commitments, for planning (re-signing budgets, extension checks).
  const projectedPayroll = (s, orgId, season) => payrollFor(s, orgId, season);

  // Standard + two-way + ELC contracts across NHL and AHL rosters (unsigned reserves don't count).
  const contractCount = (s, orgId) => {
    const t = s.teams[orgId];
    return [...t.roster.nhl, ...t.roster.ahl].filter(id => { const c = s.players[id].contract; return c && c.type !== 'PTO'; }).length;
  };

  // Simplified: UFA if he'll be 27+ at expiry or reach 7 accrued seasons, otherwise RFA.
  function expiryStatus(s, p) {
    if (!p.contract) return null;
    const ageAtExpiry = U.seasonAge(p.birthDate, p.contract.expiresAfterSeason + 1);
    const accrued = p.career.accruedSeasons + p.contract.yearsRemaining;
    return ageAtExpiry >= 27 || accrued >= 7 ? 'UFA' : 'RFA';
  }
  // NHL games in a season (regular season).
  const nhlGamesIn = (p, season) => U.sum(p.stats.filter(L => L.season === season && L.league === 'NHL' && L.type === 'REG').map(L => L.gp));
  // Status when the current deal runs out at the end of THIS league year (counts this season if it accrues).
  function faStatus(s, p) {
    const season = p.contract ? p.contract.expiresAfterSeason : s.calendar.season;
    const accrued = p.career.accruedSeasons + (season === s.calendar.season && nhlGamesIn(p, season) >= CONFIG.contracts.accrueGP ? 1 : 0);
    return U.seasonAge(p.birthDate, season + 1) >= 27 || accrued >= 7 ? 'UFA' : 'RFA';
  }

  // LTIR (CBA-style): placing a player on LTIR raises the ceiling by his cap hit minus the cap space the team
  // had at that moment (stored as p.ltirRelief). Emergency recalls (no one fit under the cap) are allowed over
  // the ceiling until they go back down.
  const ltirRelief = (s, orgId) => U.sum(s.teams[orgId].roster.nhl.map(id => s.players[id]).filter(p => p.rosterStatus === 'LTIR').map(p => p.ltirRelief || 0));
  const emergencyAllowance = (s, orgId) => U.sum(s.teams[orgId].roster.nhl.map(id => s.players[id]).filter(p => p.emergencyRecall && p.contract).map(p => p.contract.capHit));
  const capCeiling = (s, orgId) => C.upper + ltirRelief(s, orgId) + emergencyAllowance(s, orgId);
  const capSpace = (s, orgId) => capCeiling(s, orgId) - capPayroll(s, orgId);

  // ── Phase 4: when contracts start, demands, ELCs, waivers, buyouts ──
  const EARLY_OFFSEASON = ['SEASON_END', 'DRAFT', 'RE_SIGNING'];
  const OFFSEASON = [...EARLY_OFFSEASON, 'FREE_AGENCY'];
  const isOffseason = s => OFFSEASON.includes(s.calendar.phase);
  // From the end of the season to June 30 a new deal starts next season; the summer's progression has
  // already run, so the current ratings are next season's ratings.
  const contractStart = s => (EARLY_OFFSEASON.includes(s.calendar.phase) ? s.calendar.season + 1 : s.calendar.season);
  const ratedSeason = contractStart;
  const waiversApply = s => CONFIG.waivers.phases.includes(s.calendar.phase);

  // Term a player wants: stars want security, depth players take one year at a time.
  function preferredTerm(s, p, start = contractStart(s)) {
    const age = U.seasonAge(p.birthDate, start);
    const q = Math.max(p.ovr, ...Progression.project(p, ratedSeason(s), start, 3));
    if (age >= 35) return 1;
    if (age >= 33) return q >= 78 ? 2 : 1;
    if (q >= 80) return U.clamp(36 - age, 2, 8);
    if (q >= 72) return U.clamp(34 - age, 2, 5);
    return q >= 66 ? 2 : 1;
  }

  // Asking cap hit for `years`, starting `start`: the average market value of his projected OVR over the term,
  // with team-controlled (RFA) seasons at a discount unless he's on the open market, then personality, age and
  // term preference.
  function demand(s, p, years, { start = contractStart(s), market = false } = {}) {
    const K = CONFIG.contracts;
    const ovrs = Progression.project(p, ratedSeason(s), start, years);
    let total = 0;
    ovrs.forEach((o, i) => {
      const controlled = !market && U.seasonAge(p.birthDate, start + i) < 27 && p.career.accruedSeasons + i < 7;
      total += fairCap(o, p.position) * (controlled ? K.rfaFactor : 1);
    });
    const age = U.seasonAge(p.birthDate, start);
    const aav = total / years * K.marketScale * (K.greed[0] + (K.greed[1] - K.greed[0]) * p.personality.greed)
      * (age >= K.oldAge ? K.oldFactor : 1) * (1 + K.termPremium * Math.abs(years - preferredTerm(s, p, start)));
    return U.clamp(U.roundTo(aav, C.rounding), C.minSalary, maxContract());
  }

  function newContract(capHit, years, start, clauses = null) {
    const twoWay = capHit < CONFIG.contracts.twoWayBelow;
    return { type: twoWay ? 'TWO_WAY' : 'STANDARD', capHit, yearsRemaining: years, expiresAfterSeason: start + years - 1, startSeason: start,
             ahlSalary: twoWay ? 100_000 : null, clauses: clauses || { nmc: false, ntc: false } };
  }
  // Stars signing long deals get trade protection, as in a new league: a no-trade clause, half of them no-movement.
  function clausesFor(s, p, years, start) {
    const star = p.ovr >= 82 && U.seasonAge(p.birthDate, start) >= 26 && years >= 3 && U.hash01(`${s.meta.seed}:${p.id}:${start}:ntc`) < 0.5;
    return { nmc: star && U.hash01(`${s.meta.seed}:${p.id}:${start}:nmc`) < 0.5, ntc: star };
  }

  // Entry-level contract: 3 years if he signs at 21 or younger, 2 at 22–23, 1 at 24; pay by draft slot.
  function elc(s, p, start = contractStart(s)) {
    const age = U.seasonAge(p.birthDate, start), len = age <= 21 ? 3 : age <= 23 ? 2 : 1;
    const pick = p.career.draft ? p.career.draft.overall : 999;
    const capHit = pick <= 10 ? C.elcMax : pick <= 32 ? U.roundTo(0.95 * C.elcMax, C.rounding) : pick <= 96 ? 900_000 : C.minSalary;
    return { type: 'ELC', capHit, yearsRemaining: len, expiresAfterSeason: start + len - 1, startSeason: start, ahlSalary: 80_000, clauses: { nmc: false, ntc: false } };
  }

  // Waiver exemption by age when he signed his first pro deal: [age ≤, pro seasons, NHL games].
  function waiverExempt(p) {
    if (!p.contract || p.contract.type === 'PTO' || p.emergencyRecall) return true;
    const signed = p.career.signedAt === null || p.career.signedAt === undefined ? 25 : p.career.signedAt;
    const [, years, gp] = CONFIG.waivers.exempt.find(([age]) => signed <= age);
    return p.career.proSeasons < years && p.career.nhlGP < gp;
  }

  // Buyout (offseason only): a share of the remaining money, spread evenly over twice the remaining seasons.
  function buyoutTerms(s, p) {
    const c = p.contract;
    if (!c || c.type === 'PTO') return null;
    const start = contractStart(s), left = c.expiresAfterSeason - start + 1;
    if (left <= 0) return null;
    const share = U.seasonAge(p.birthDate, start) < C.buyout.youngUnder ? C.buyout.youngShare : C.buyout.share;
    const seasons = 2 * left;
    return { amount: U.roundTo(c.capHit * left * share / seasons, 1000), fromSeason: start, toSeason: start + seasons - 1, seasonsLeft: left, total: Math.round(c.capHit * left * share) };
  }

  return { maxContract, capLower, fairCap, retainedShare, activeRetained, buryAllowance, buried, callUpCost, deadCapFor, payrollFor, capPayroll, contractIn, projectedPayroll,
           contractCount, expiryStatus, nhlGamesIn, faStatus, ltirRelief, emergencyAllowance, capCeiling, capSpace,
           OFFSEASON, isOffseason, contractStart, ratedSeason, waiversApply, preferredTerm, demand, newContract, clausesFor, elc, waiverExempt, buyoutTerms };
})();

// ════════════════════════════════════════════════════════════════════════════
// §7b Scouting — what each team believes about a player's potential (Phase 6). No state: the error is a fixed
//     per-(team, player) normal draw, scaled by an uncertainty that shrinks with age and NHL games, so estimates
//     converge on the truth as a career unfolds. OVR is observable and exact; only the ceiling is fogged.
// ════════════════════════════════════════════════════════════════════════════

const Scouting = (() => {
  const F = CONFIG.scouting;
  function sd(s, p, org) {
    const age = U.seasonAge(p.birthDate, Contracts.ratedSeason(s));
    const seen = 1 - Math.min(F.observeMax, (p.career.nhlGP || 0) / F.observeGP);
    return Math.max(F.floor, (F.sd18 - F.perYear * (age - 18)) * seen) * (p.teamId === org ? F.own : 1);
  }
  // A team's estimate of his potential (never below what he already is).
  const estimate = (s, p, org) => U.clamp(p.dev.potential + U.hashNormal(`${s.meta.seed}:${org}:${p.id}:pot`) * sd(s, p, org), Ratings.ovrRaw(p), 99);
  const confidence = (s, p, org) => { const x = sd(s, p, org); return x < F.sure ? 'high' : x < F.likely ? 'medium' : 'low'; };
  return { sd, estimate, confidence };
})();

// ════════════════════════════════════════════════════════════════════════════
// §8 Select — read-only lookups (derived data lives here, not in state)
// ════════════════════════════════════════════════════════════════════════════

const Select = {
  nhlTeams: s => Object.values(s.teams).filter(t => t.league === 'NHL'),
  ahlTeams: s => Object.values(s.teams).filter(t => t.league === 'AHL'),
  org: (s, teamId) => { const t = s.teams[teamId]; return t.league === 'AHL' ? s.teams[t.parentId] : t; },
  // An AHL team's roster is its parent org's roster.ahl (single source of truth).
  rosterIds: (s, teamId) => { const t = s.teams[teamId]; return t.league === 'AHL' ? s.teams[t.parentId].roster.ahl : t.roster.nhl; },
  rosterPlayers: (s, teamId) => Select.rosterIds(s, teamId).map(id => s.players[id]),
  orgPlayers: (s, orgId) => { const r = s.teams[orgId].roster; return [...r.nhl, ...r.ahl, ...r.reserve].map(id => s.players[id]); },
  freeAgents: s => Object.values(s.players).filter(p => p.assignment === 'FA'),
  age: (s, p) => U.ageOn(p.birthDate, s.calendar.date),
  seasonAge: (s, p) => U.seasonAge(p.birthDate, s.calendar.season),
  picksOwnedBy: (s, orgId) => Object.values(s.draftPicks).filter(pk => pk.ownerTeamId === orgId),
  fullName: p => `${p.firstName} ${p.lastName}`,
  // Any player ever: an active one, or a retired one from the archive (as a read-only view).
  person: (s, id) => {
    if (s.players[id]) return s.players[id];
    const r = s.history.retired && s.history.retired[id];
    if (!r) return null;
    return { ...r, assignment: 'RETIRED', teamId: null, contract: null, archived: true, stats: r.stats.map(a => Stats.unpackLine(a, r.position)),
             career: { draft: r.draft, nhlGP: r.nhlGP, prior: r.prior || null }, dev: { peakOvr: r.peakOvr }, condition: { injury: null } };
  },
};

// ════════════════════════════════════════════════════════════════════════════
// §9 Factory — players, teams, and a complete 32 + 32 league
// ════════════════════════════════════════════════════════════════════════════

const Factory = (() => {
  const G = CONFIG.generation, A = CONFIG.attr, R = CONFIG.roster;

  function emptyState(seed, userTeamId) {
    const rngState = RNG.seedFrom(seed);
    return {
      meta: { version: CONFIG.SAVE_VERSION, seed, rngState, userTeamId, counters: {} },
      calendar: { date: `${CONFIG.START_SEASON}-${CONFIG.START_MMDD}`, season: CONFIG.START_SEASON, phase: 'PRESEASON', dayIndex: 0 },
      flags: { tradesLocked: false },
      settings: { autoRoster: true, autoDraft: false, autoContracts: false, tradeDifficulty: 'NORMAL' },
      players: {}, teams: {}, games: {}, scheduleByDate: {}, draftPicks: {}, norms: {},
      playoffs: null, draft: null,
      pending: { waivers: [], tradeOffers: [], faOffers: [] },
      transactions: [], inbox: [],
      history: { champions: [], awards: [], draftClasses: {}, seasons: [], retired: {}, trades: [],
                 records: { game: {}, season: {}, career: {}, team: {} }, hallOfFame: [] },
      news: [],
    };
  }

  const emptyRecord = () => ({ gp: 0, w: 0, l: 0, otl: 0, pts: 0, gf: 0, ga: 0, rw: 0, row: 0, streak: '', last10: [],
                               home: { w: 0, l: 0, otl: 0 }, away: { w: 0, l: 0, otl: 0 } });
  const emptyLineup = () => ({ F: [], D: [], G: [], PP: [], PK: [], autoLines: true });

  function buildTeams(s, rng) {
    for (const t of DATA.teams) {
      const ahlId = `${t.id}-AHL`;
      s.teams[t.id] = {
        id: t.id, league: 'NHL', city: t.city, name: t.name, abbrev: t.id,
        conference: t.conf, division: t.div,
        colors: { primary: t.colors[0], secondary: t.colors[1] },
        controller: t.id === s.meta.userTeamId ? 'USER' : 'AI',
        affiliateId: ahlId,
        roster: { nhl: [], ahl: [], reserve: [] },
        lineup: emptyLineup(),
        finances: { deadCap: [], retained: [], budget: U.roundTo(CONFIG.cap.upper * rng.float(0.92, 1.08), 1_000_000) },
        record: emptyRecord(),
        ai: { strategy: 'BUBBLE', strategyLockedUntil: null, needs: { C: 0, W: 0, D: 0, G: 0 },
              profile: { aggression: U.round(rng.float(0.2, 0.8), 2), prospectBias: U.round(rng.float(0.8, 1.2), 2) } },
      };
      s.teams[ahlId] = {
        id: ahlId, league: 'AHL', parentId: t.id, city: t.ahl[0], name: t.ahl[1], abbrev: t.ahl[2],
        conference: t.conf, division: DATA.ahlDivisionOf[t.div],
        colors: { primary: t.colors[0], secondary: t.colors[1] },
        controller: t.id === s.meta.userTeamId ? 'USER' : 'AI',
        lineup: emptyLineup(),
        record: emptyRecord(),
      };
    }
  }

  function birthDateForSeasonAge(rng, season, age) {
    // Season age a ⇔ born in [(season−a−1)-09-16, (season−a)-09-15]
    const lo = U.dateToDay(`${season - age - 1}-09-16`), hi = U.dateToDay(`${season - age}-09-15`);
    return U.dayToDate(rng.int(lo, hi));
  }

  // Attributes whose position-weighted OVR equals `target` (to rounding), shaped by the style's offsets.
  function makeAttributes(rng, pos, style, target, durability) {
    const grp = Ratings.group(pos), w = CONFIG.ovrWeights[grp];
    const mods = DATA.styles[grp][style].mods;
    const tgt = U.clamp(target, A.min, A.max);
    const a = {};
    for (const k in w) a[k] = tgt + (mods[k] || 0) + rng.normal(0, G.attrNoiseSd);
    // Shift free attributes until the weighted mean hits the target, respecting [min, max].
    for (let iter = 0; iter < 8; iter++) {
      let cur = 0;
      for (const k in w) { a[k] = U.clamp(a[k], A.min, A.max); cur += w[k] * a[k]; }
      const err = tgt - cur;
      if (Math.abs(err) < 0.01) break;
      const free = Object.keys(w).filter(k => (err > 0 ? a[k] < A.max : a[k] > A.min));
      const fw = U.sum(free.map(k => w[k]));
      if (fw === 0) break;
      for (const k of free) a[k] += err / fw;
    }
    for (const k in w) a[k] = Math.round(U.clamp(a[k], A.min, A.max));

    const phys = DATA.physicalStyles.includes(style);
    const att = (mu, sd) => Math.round(U.clamp(rng.normal(mu, sd), A.min, A.max));
    a.stamina = att(62 + 0.35 * (tgt - 60) + (style === 'TWO_WAY' || style === 'GRINDER' ? 4 : 0), 8);
    a.durability = durability;
    if (grp !== 'G') {
      a.discipline = att(68 - (phys ? 8 : 0), 12);
      if (grp === 'W') a.faceoffs = att(45 + 0.2 * (tgt - 70), 7);
      if (grp === 'D') a.faceoffs = att(30, 5);
    }
    return a;
  }

  function body(rng, grp, style) {
    const big = DATA.physicalStyles.includes(style);
    const [h, w] = grp === 'D' ? [188, 93] : grp === 'G' ? [190, 89] : [183, 88];
    return {
      heightCm: Math.round(rng.normal(h + (big ? 4 : 0), 5)),
      weightKg: Math.round(rng.normal(w + (big ? 7 : 0), 6)),
    };
  }

  const ALT_POSITIONS = { C: [['LW'], ['RW'], []], LW: [['RW'], ['C'], [], []], RW: [['LW'], ['C'], [], []], D: [[]], G: [[]] };
  const LEFT_SHOT = { C: 0.6, LW: 0.7, RW: 0.45, D: 0.6, G: 0.8 };   // G: catches left

  // A player object without an id. Placement (registerPlayer) assigns the id.
  function makePlayer(rng, { pos, tier, age, season }) {
    const grp = Ratings.group(pos);
    const durability = Math.round(U.clamp(rng.normal(70, 12), 35, 99));
    const career = Progression.careerToDate(rng, { tier, group: Progression.curveGroup(pos), age, durability });
    // Depth archetypes (grinder, physical D) become rare among stars.
    const depthBias = U.clamp((84 - career.ovr) / 14, 0.1, 1.6);
    const style = rng.weightedKey(Object.fromEntries(Object.entries(DATA.styles[grp])
      .map(([k, v]) => [k, v.w * (DATA.depthStyles.includes(k) ? depthBias : 1)])));
    const nat = rng.weightedKey(G.nationality);
    const names = DATA.names[DATA.nationalities[nat].pool];
    const p = {
      id: null,
      firstName: rng.pick(names.first), lastName: rng.pick(names.last),
      birthDate: birthDateForSeasonAge(rng, season, age),
      nationality: nat,
      handedness: rng.chance(LEFT_SHOT[pos]) ? 'L' : 'R',
      ...body(rng, grp, style),
      position: pos,
      altPositions: [...rng.pick(ALT_POSITIONS[pos])],
      style,
      teamId: null, assignment: 'FA', rosterStatus: 'ACTIVE',
      attributes: makeAttributes(rng, pos, style, career.ovr, durability),
      dev: {
        potential: U.round(career.potential, 1),
        potentialTier: tier,
        peakAge: U.round(career.peakAge, 1),
        peakOvr: Math.round(career.peak),
        workEthic: U.round(career.workEthic, 2),
        consistency: Math.round(U.clamp(rng.normal(60, 15), 20, 95)),
        injuryProneness: U.round(U.clamp(Math.exp(rng.normal(0, 0.25)), 0.6, 1.7), 2),
      },
      scouting: {},
      ovr: 0,
      condition: { energy: 100, morale: Math.round(U.clamp(rng.normal(70, 8), 40, 95)), injury: null, lastPlayed: null },
      contract: null,
      personality: { greed: U.round(rng.next(), 2), loyalty: U.round(rng.next(), 2), winDesire: U.round(rng.next(), 2) },
      career: { draft: null, signedAt: null, proSeasons: 0, nhlGP: 0, accruedSeasons: 0 },
      stats: [],
    };
    return Ratings.refresh(p);
  }

  function registerPlayer(s, p) {
    p.id = U.nextId(s, 'player', 'p_');
    s.players[p.id] = p;
    return p;
  }

  // Best-first lottery: each player goes to an org with an open slot, with probability ∝ weight × open slots.
  // Strong orgs win more of the early (better) draws, so team quality varies without being scripted.
  function lottery(rng, players, orgIds, slotsPerOrg, weightOf) {
    const open = Object.fromEntries(orgIds.map(id => [id, slotsPerOrg]));
    const out = [];
    for (const p of players) {
      const cands = orgIds.filter(id => open[id] > 0);
      if (!cands.length) break;
      const org = cands[rng.weightedIndex(cands.map(id => weightOf(id) * open[id]))];
      open[org]--;
      out.push([p, org]);
    }
    return out;
  }

  function makeDrafter(rng, orgIds) {
    const taken = new Set();
    return function draftRecord(p, season, teamId, forceDrafted) {
      const tier = p.dev.potentialTier;
      if (!forceDrafted && !rng.chance(G.draftedProb[tier])) return null;
      const year = season - (U.seasonAge(p.birthDate, season) - 18);
      const [lo, hi] = G.draftPickRange[tier];
      const maxPick = 32 * G.draftRounds;
      for (let tries = 0; tries < 30; tries++) {
        const overall = tries < 25 ? rng.int(lo, hi) : rng.int(1, maxPick);
        const key = `${year}:${overall}`;
        if (!taken.has(key)) {
          taken.add(key);
          return { year, round: Math.ceil(overall / 32), overall, teamId: teamId || rng.pick(orgIds) };
        }
      }
      return null;
    };
  }

  const elcLength = signedAt => (signedAt <= 21 ? 3 : signedAt <= 23 ? 2 : signedAt <= 24 ? 1 : 0);

  function fillCareer(rng, p, season) {
    const age = U.seasonAge(p.birthDate, season);
    p.career.signedAt = p.career.draft ? Math.min(age, 18 + rng.int(1, 2)) : Math.min(age, rng.int(20, 23));
    p.career.proSeasons = Math.max(0, age - p.career.signedAt);
    const share = U.clamp((p.ovr - 62) / 16, 0.05, 0.95) * rng.float(0.75, 1);
    p.career.nhlGP = Math.round(p.career.proSeasons * 82 * share);
    p.career.accruedSeasons = Math.min(p.career.proSeasons, Math.floor(p.career.nhlGP / 60));
  }

  function makeContract(rng, p, season, level) {
    const C = CONFIG.cap, age = U.seasonAge(p.birthDate, season);
    const elcLeft = elcLength(p.career.signedAt) - p.career.proSeasons;
    if (elcLeft > 0) {
      const pick = p.career.draft ? p.career.draft.overall : 999;
      const raw = pick <= 10 ? C.elcMax : pick <= 32 ? rng.float(0.9, 1) * C.elcMax : rng.float(C.minSalary, 0.92 * C.elcMax);
      return {
        type: 'ELC', capHit: U.clamp(U.roundTo(raw, C.rounding), C.minSalary, C.elcMax),
        yearsRemaining: elcLeft, expiresAfterSeason: season + elcLeft - 1,
        ahlSalary: 80_000, clauses: { nmc: false, ntc: false },
      };
    }
    let term = p.ovr >= 78 ? rng.int(4, 8) : p.ovr >= 70 ? rng.int(2, 5) : rng.int(1, 3);
    if (age >= 35) term = 1; else if (age >= 32) term = Math.min(term, 3);
    const yrs = rng.int(1, term);
    const value = Contracts.fairCap(p.ovr, p.position) * U.clamp(rng.normal(1, G.contractNoiseSd), G.contractNoiseRange[0], G.contractNoiseRange[1]) * (age >= 33 ? 0.85 : 1);
    // Minor-league deals stay under the buried-cap allowance, so a new league's AHL rosters don't eat cap space.
    const capHit = U.clamp(U.roundTo(value, C.rounding), C.minSalary, level === 'AHL' ? Contracts.buryAllowance() : Contracts.maxContract());
    const twoWay = level === 'AHL' || capHit < 1_000_000;
    const protectedStar = p.ovr >= 82 && age >= 26 && yrs >= 3 && rng.chance(0.5);
    return {
      type: twoWay ? 'TWO_WAY' : 'STANDARD', capHit,
      yearsRemaining: yrs, expiresAfterSeason: season + yrs - 1,
      ahlSalary: twoWay ? rng.int(8, 35) * 10_000 : null,
      clauses: { nmc: protectedStar && rng.chance(0.5), ntc: protectedStar },
    };
  }

  // Move each org's NHL payroll toward a target share of the cap, then guarantee cap floor ≤ payroll ≤ cap.
  // No contract ends up above maxOverpay × its market value; floor shortfalls are spread evenly, so weak
  // teams overpay their depth rather than handing stars max deals.
  function normalizePayroll(rng, s, orgId) {
    const C = CONFIG.cap;
    const target = rng.float(G.payrollTargetPct[0], G.payrollTargetPct[1]) * C.upper;
    const floor = Contracts.capLower() * 1.02;
    const roster = s.teams[orgId].roster.nhl.map(id => s.players[id]);
    const fixed = U.sum(roster.filter(p => p.contract.type === 'ELC').map(p => p.contract.capHit));
    const flex = roster.filter(p => p.contract.type !== 'ELC');
    const ceilingOf = (p, floorPass = false) => {
      const fair = Contracts.fairCap(p.ovr, p.position);
      const cap = floorPass ? Math.max(G.maxOverpay * fair, fair + G.floorTopUpMax) : G.maxOverpay * fair;
      return Math.max(C.minSalary, Math.min(Contracts.maxContract(), cap));
    };
    const set = (p, v, floorPass) => { p.contract.capHit = U.clamp(U.roundTo(v, C.rounding), C.minSalary, ceilingOf(p, floorPass)); };
    const total = () => fixed + U.sum(flex.map(p => p.contract.capHit));

    for (let iter = 0; iter < 6 && Math.abs(total() - target) >= 250_000; iter++) {
      const f = (target - fixed) / (total() - fixed);
      const g = f > 1 ? Math.min(f, G.payrollMaxScaleUp) : f;
      for (const p of flex) set(p, p.contract.capHit * g);
      if (g < f) break;
    }
    for (let iter = 0; iter < 20 && total() < floor; iter++) {
      const room = flex.filter(p => p.contract.capHit < ceilingOf(p, true));
      if (!room.length) break;
      const add = (floor - total()) / room.length + C.rounding;
      for (const p of room) set(p, p.contract.capHit + add, true);
    }
    for (let iter = 0; iter < 20 && total() > C.upper; iter++) {
      const f = (C.upper - fixed) / (total() - fixed) - 0.002;
      for (const p of flex) set(p, p.contract.capHit * f, true);
    }
  }

  function newLeague(seed, userTeamId) {
    const s = emptyState(seed, userTeamId);
    const rng = RNG.bind(s.meta);
    const season = s.calendar.season;
    buildTeams(s, rng);
    const orgIds = DATA.teams.map(t => t.id);

    // 1. Candidate pool per position, best first.
    const pool = {};
    for (const pos of DATA.positions) {
      pool[pos] = [];
      for (let i = 0; i < G.proPool[pos]; i++) {
        pool[pos].push(makePlayer(rng, { pos, season, tier: rng.weightedKey(G.tierWeights), age: Number(rng.weightedKey(G.ageWeights)) }));
      }
      pool[pos].sort((a, b) => Ratings.ovrRaw(b) - Ratings.ovrRaw(a));
    }

    // 2. Hidden org strength for the talent lotteries.
    const strength = {}, farm = {};
    for (const id of orgIds) { strength[id] = Math.exp(G.orgStrengthSd * rng.normal()); farm[id] = Math.exp(G.farmStrengthSd * rng.normal()); }
    const place = (p, orgId, level) => {
      registerPlayer(s, p);
      p.teamId = orgId; p.assignment = level;
      s.teams[orgId].roster[level === 'NHL' ? 'nhl' : 'ahl'].push(p.id);
    };

    // 3. NHL: one best-first lottery across all positions, weighted by org strength × remaining cap room,
    //    so a team that has already committed big money rarely lands the next star. Goalies are split into
    //    a starter slot (best 32) and a backup slot (next 32) so every team gets a real starter.
    const nhlPool = [];
    for (const pos of DATA.positions) {
      if (pos === 'G') {
        pool.G.splice(0, orgIds.length).forEach(p => nhlPool.push([p, 'G1']));
        pool.G.splice(0, orgIds.length).forEach(p => nhlPool.push([p, 'G2']));
      } else pool[pos].splice(0, R.nhlSlots[pos] * orgIds.length).forEach(p => nhlPool.push([p, pos]));
    }
    nhlPool.sort((a, b) => Ratings.ovrRaw(b[0]) - Ratings.ovrRaw(a[0]));
    const slotsOf = { ...R.nhlSlots, G1: 1, G2: 1 }; delete slotsOf.G;
    const open = Object.fromEntries(orgIds.map(id => [id, { ...slotsOf }]));
    const committed = Object.fromEntries(orgIds.map(id => [id, 0]));
    const capRoom = id => Math.max(0.02, 1 - committed[id] / CONFIG.cap.upper) ** G.capRoomExp;
    for (const [p, slot] of nhlPool) {
      const cands = orgIds.filter(id => open[id][slot] > 0);
      const org = cands[rng.weightedIndex(cands.map(id => (slot === 'G2' ? 1 : strength[id]) * capRoom(id) * open[id][slot]))];
      open[org][slot]--;
      committed[org] += Contracts.fairCap(p.ovr, p.position);
      place(p, org, 'NHL');
    }
    // AHL: per position, weighted by farm-system strength.
    for (const pos of DATA.positions) {
      for (const [p, org] of lottery(rng, pool[pos].splice(0, R.ahlSlots[pos] * orgIds.length), orgIds, R.ahlSlots[pos], id => farm[id])) place(p, org, 'AHL');
    }

    // 4. Free agents: the best leftovers. Everyone else is discarded (never gets an id).
    for (const pos of DATA.positions) {
      for (const p of pool[pos].slice(0, R.freeAgents[pos])) { registerPlayer(s, p); p.teamId = null; p.assignment = 'FA'; }
    }

    // 5. Reserve prospects (unsigned draftees), drafted by their org.
    const draftRecord = makeDrafter(rng, orgIds);
    for (const org of orgIds) {
      for (let i = 0; i < R.reservePerOrg; i++) {
        const p = makePlayer(rng, { pos: rng.weightedKey(G.prospectPositions), season, age: rng.int(G.prospectAges[0], G.prospectAges[1]),
                                    tier: rng.weightedKey(G.prospectTierWeights) });
        registerPlayer(s, p);
        p.teamId = org;
        p.assignment = DATA.nationalities[p.nationality].european && rng.chance(0.7) ? 'EUROPE' : 'JUNIOR';
        p.career.draft = draftRecord(p, season, org, true);
        s.teams[org].roster.reserve.push(p.id);
      }
    }

    // 6. Draft history, career counters and contracts for signed pros.
    for (const p of Object.values(s.players)) {
      if (p.assignment === 'JUNIOR' || p.assignment === 'EUROPE') continue;
      p.career.draft = draftRecord(p, season, null, false);
      fillCareer(rng, p, season);
      if (p.assignment === 'NHL' || p.assignment === 'AHL') p.contract = makeContract(rng, p, season, p.assignment);
    }
    for (const org of orgIds) normalizePayroll(rng, s, org);

    // 7. Future draft picks, owned by their original teams.
    for (let y = 1; y <= G.futureDraftYears; y++) {
      const year = season + y;
      for (let round = 1; round <= G.draftRounds; round++) {
        for (const org of orgIds) {
          const id = `pk_${year}_${round}_${org}`;
          s.draftPicks[id] = { id, year, round, originalTeamId: org, ownerTeamId: org, usedOnPlayerId: null };
        }
      }
    }
    // 8. Each veteran's estimated NHL career before 2026-27, so career totals and records start lived-in (Phase 6).
    for (const p of Object.values(s.players)) { const pr = Records.priorFor(s, p); if (pr) p.career.prior = pr; }
    return s;
  }

  return { emptyState, emptyRecord, makePlayer, makeAttributes, registerPlayer, newLeague, birthDateForSeasonAge };
})();

// ════════════════════════════════════════════════════════════════════════════
// §10 Calendar — season schedules (NHL 82 games, AHL 72) and date helpers
// ════════════════════════════════════════════════════════════════════════════

const Calendar = (() => {
  const weekday = iso => new Date(U.dateToDay(iso) * 86_400_000).getUTCDay();   // 0 = Sunday
  const inBreak = (iso, season, breaks) => breaks.some(([a, b]) => iso >= U.seasonDate(season, a) && iso <= U.seasonDate(season, b));

  function divisions(s, league) {
    const out = {};
    for (const t of Object.values(s.teams)) {
      if (t.league !== league) continue;
      const key = `${t.conference}|${t.division}`;
      (out[key] = out[key] || []).push(t.id);
    }
    for (const k in out) out[k].sort();
    return out;
  }

  // [a, b, homeGamesForA, homeGamesForB] → individual matchups
  const expand = series => {
    const out = [];
    for (const [a, b, ha, hb] of series) {
      for (let k = 0; k < ha; k++) out.push({ homeId: a, awayId: b });
      for (let k = 0; k < hb; k++) out.push({ homeId: b, awayId: a });
    }
    return out;
  };

  // NHL format: division 26 (5 opponents × 4, 2 × 3), conference 24 (8 × 3), other conference 32 (16 × 2).
  // Every team gets exactly 41 home games; the 3-game pairings rotate with the seeded shuffle each season.
  function nhlMatchups(s, rng) {
    const divs = divisions(s, 'NHL'), keys = Object.keys(divs).sort();
    if (keys.length !== 4 || keys.some(k => divs[k].length !== 8)) {
      throw new Error('The NHL schedule generator expects 2 conferences × 2 divisions × 8 teams (see DATA.teams)');
    }
    const series = [], byConf = {};
    for (const key of keys) {
      const conf = key.split('|')[0], d = rng.shuffle(divs[key].slice()), n = d.length;
      (byConf[conf] = byConf[conf] || []).push(d);
      for (let x = 0; x < n; x++) {
        for (let y = x + 1; y < n; y++) {
          if (y === x + 1) series.push([d[x], d[y], 2, 1]);              // cycle edge x → x+1: x hosts twice
          else if (x === 0 && y === n - 1) series.push([d[x], d[y], 1, 2]); // cycle edge n−1 → 0
          else series.push([d[x], d[y], 2, 2]);
        }
      }
    }
    const confs = Object.keys(byConf).sort();
    for (const conf of confs) {
      const [X, Y] = byConf[conf];
      X.forEach((a, i) => Y.forEach((b, j) => series.push((i + j) % 2 === 0 ? [a, b, 2, 1] : [a, b, 1, 2])));
    }
    const [A, B] = confs.map(c => byConf[c].flat());
    A.forEach(a => B.forEach(b => series.push([a, b, 1, 1])));
    return expand(series);
  }

  // AHL: regional. Division opponents × 8 (4 home), other division in the conference × 2 (1 home) → 72 games.
  function ahlMatchups(s) {
    const divs = divisions(s, 'AHL'), keys = Object.keys(divs).sort(), series = [];
    const cfg = CONFIG.calendar.AHL;
    for (const key of keys) {
      const d = divs[key];
      for (let x = 0; x < d.length; x++) for (let y = x + 1; y < d.length; y++) series.push([d[x], d[y], cfg.divisionGames / 2, cfg.divisionGames / 2]);
    }
    for (let i = 0; i < keys.length; i++) {
      for (let j = i + 1; j < keys.length; j++) {
        if (keys[i].split('|')[0] !== keys[j].split('|')[0]) continue;
        for (const a of divs[keys[i]]) for (const b of divs[keys[j]]) series.push([a, b, cfg.conferenceGames / 2, cfg.conferenceGames / 2]);
      }
    }
    return expand(series);
  }

  // Greedy day-by-day placement. Teams behind pace go first; no team plays 3 days in a row; each team's
  // back-to-backs are paced toward targetB2B (fair across teams) and capped at maxB2B.
  // If games remain at the end, extra days are appended.
  function assignDates(rng, matchups, opts, season) {
    const start = U.seasonDate(season, opts.start), end = U.seasonDate(season, opts.end);
    const days = [];
    for (let d = start; d <= end; d = U.addDays(d, 1)) if (!inBreak(d, season, opts.breaks)) days.push(d);
    const team = {};
    for (const m of matchups) for (const id of [m.homeId, m.awayId]) (team[id] = team[id] || { left: 0, last: -99, prev: -99, b2b: 0 }).left++;
    for (const id in team) team[id].total = team[id].left;
    const wMean = U.mean(opts.weekdayWeights);
    let pending = rng.shuffle(matchups.slice());
    const out = [];
    for (let di = 0; pending.length; di++) {
      if (di > days.length + 90) throw new Error('Schedule generation did not converge');
      const date = di < days.length ? days[di] : U.addDays(days[days.length - 1], di - days.length + 1);
      const dn = U.dateToDay(date), daysLeft = Math.max(1, days.length - di);
      const target = Math.max(1, Math.round(pending.length / daysLeft * opts.weekdayWeights[weekday(date)] / wMean));
      const canPlay = id => {
        const t = team[id];
        if (t.last === dn - 1 && t.prev === dn - 2) return false;
        return !(t.last === dn - 1 && t.b2b >= opts.maxB2B);
      };
      const pri = id => {
        const t = team[id], aheadOfQuota = t.b2b >= opts.targetB2B * (t.total - t.left + 1) / t.total;
        return t.left / daysLeft - (t.last === dn - 1 && aheadOfQuota ? CONFIG.calendar.b2bPenalty : 0);
      };
      const ranked = pending.map(m => [pri(m.homeId) + pri(m.awayId) + rng.next() * CONFIG.calendar.jitter, m]).sort((a, b) => b[0] - a[0]);
      const busy = new Set(), chosen = new Set();
      for (const [, m] of ranked) {
        if (chosen.size >= target) break;
        if (busy.has(m.homeId) || busy.has(m.awayId) || !canPlay(m.homeId) || !canPlay(m.awayId)) continue;
        chosen.add(m); busy.add(m.homeId); busy.add(m.awayId);
      }
      for (const m of chosen) {
        for (const id of [m.homeId, m.awayId]) {
          const t = team[id];
          if (t.last === dn - 1) t.b2b++;
          t.prev = t.last; t.last = dn; t.left--;
        }
        out.push({ date, homeId: m.homeId, awayId: m.awayId });
      }
      if (chosen.size) pending = pending.filter(m => !chosen.has(m));
    }
    return out;
  }

  function buildSeason(s, rng, season = s.calendar.season) {
    for (const league of ['NHL', 'AHL']) {
      const matchups = league === 'NHL' ? nhlMatchups(s, rng) : ahlMatchups(s);
      for (const g of assignDates(rng, matchups, CONFIG.calendar[league], season)) {
        const id = U.nextId(s, 'game', 'g_', 6);
        s.games[id] = { id, season, date: g.date, league, type: 'REG', homeId: g.homeId, awayId: g.awayId,
                        played: false, result: null, boxScore: null };
        (s.scheduleByDate[g.date] = s.scheduleByDate[g.date] || []).push(id);
      }
    }
  }

  const gameDates = s => Object.keys(s.scheduleByDate).sort();
  const gamesOn = (s, date) => (s.scheduleByDate[date] || []).map(id => s.games[id]);
  const teamGames = (s, teamId, season = s.calendar.season) =>
    Object.values(s.games).filter(g => g.season === season && (g.homeId === teamId || g.awayId === teamId)).sort((a, b) => (a.date < b.date ? -1 : 1));
  const seasonSpan = (s, league, season = s.calendar.season) => {
    const ds = Object.values(s.games).filter(g => g.league === league && g.season === season && g.type === 'REG').map(g => g.date).sort();
    return ds.length ? { first: ds[0], last: ds[ds.length - 1] } : null;
  };

  function fireEvents(s, date, events) {
    for (const e of CONFIG.calendar.events) {
      if (U.seasonDate(s.calendar.season, e.mmdd) !== date) continue;
      if (e.id === 'TRADE_DEADLINE') s.flags.tradesLocked = true;
      events.push({ kind: 'CALENDAR', date, id: e.id, title: e.name });
    }
  }

  return { weekday, nhlMatchups, ahlMatchups, assignDates, buildSeason, gameDates, gamesOn, teamGames, seasonSpan, fireEvents };
})();

// ════════════════════════════════════════════════════════════════════════════
// §11 Lineup — auto lines, PP/PK units, position fit, validation
// ════════════════════════════════════════════════════════════════════════════

const Lineup = (() => {
  const FIT = CONFIG.lineup.fit;
  const SLOTS = ['LW', 'C', 'RW'];

  function fit(p, slot) {
    const pos = p.position;
    if (pos === slot) return 1;
    if (pos === 'G' || slot === 'G') return FIT.goalie;
    if (p.altPositions.includes(slot)) return FIT.alt;
    const fwd = x => x === 'C' || x === 'LW' || x === 'RW';
    if (fwd(pos) && fwd(slot)) return pos === 'C' ? FIT.centerOnWing : slot === 'C' ? FIT.wingAtCenter : FIT.offWing;
    return slot === 'D' ? FIT.forwardAtD : FIT.dAtForward;
  }

  const available = p => !p.condition.injury && p.rosterStatus !== 'IR' && p.rosterStatus !== 'LTIR' && !p.waivers;
  const empty = () => ({ F: [], D: [], G: [], PP: [], PK: [], autoLines: true });

  function auto(s, teamId) {
    const at = (p, slot) => p.ovr * fit(p, slot);
    const byOvr = (a, b) => b.ovr - a.ovr || (a.id < b.id ? -1 : 1);
    const roster = Select.rosterPlayers(s, teamId).filter(available);
    const goalies = roster.filter(p => p.position === 'G').sort(byOvr);
    // Who dresses: the best players; in the AHL, prospects (≤ ahlYouth.age) get a head start.
    const Y = CONFIG.lineup.ahlYouth, ahl = s.teams[teamId].league === 'AHL', season = U.seasonOf(s.calendar.date);
    const prio = p => p.ovr + (ahl && U.seasonAge(p.birthDate, season) <= Y.age ? Y.bonus : 0);
    const byPrio = (a, b) => prio(b) - prio(a) || byOvr(a, b);
    const fwd = roster.filter(p => Ratings.isForward(p.position)).sort(byPrio);
    const def = roster.filter(p => p.position === 'D').sort(byPrio);
    const F = fwd.slice(0, 12), D = def.slice(0, 6);
    const spare = [...fwd.slice(12), ...def.slice(6)];
    const fill = (group, n, slot) => {
      while (group.length < n && spare.length) { spare.sort((a, b) => at(b, slot) - at(a, slot)); group.push(spare.shift()); }
    };
    fill(F, 12, 'LW');
    fill(D, 6, 'D');

    // Centers: the four who gain most from playing C rather than the wing (this maximises the total),
    // then split the wingers the same way (largest LW-vs-RW lean go left).
    const wingValue = p => Math.max(at(p, 'LW'), at(p, 'RW'));
    const centers = [...F].sort((a, b) => (at(b, 'C') - wingValue(b)) - (at(a, 'C') - wingValue(a)) || byOvr(a, b)).slice(0, 4)
      .sort((a, b) => at(b, 'C') - at(a, 'C') || byOvr(a, b));
    const wings = F.filter(p => !centers.includes(p));
    const lean = p => at(p, 'LW') - at(p, 'RW');
    const byLean = [...wings].sort((a, b) => lean(b) - lean(a) || byOvr(a, b));
    const half = Math.ceil(byLean.length / 2);
    const lw = byLean.slice(0, half).sort((a, b) => at(b, 'LW') - at(a, 'LW'));
    const rw = byLean.slice(half).sort((a, b) => at(b, 'RW') - at(a, 'RW'));
    const lines = [0, 1, 2, 3].map(k => [lw[k], centers[k], rw[k]].map(p => (p ? p.id : null)));

    const dSorted = [...D].sort((a, b) => at(b, 'D') - at(a, 'D') || byOvr(a, b));
    const pairs = [0, 1, 2].map(k => {
      const pr = [dSorted[2 * k], dSorted[2 * k + 1]];
      if (pr[0] && pr[1] && pr[0].handedness === 'R' && pr[1].handedness === 'L') pr.reverse();   // lefty plays LD
      return pr.map(p => (p ? p.id : null));
    });

    const { PP, PK } = specialUnits(s, F.map(p => p.id), D.map(p => p.id));
    return { F: lines, D: pairs, G: goalies.slice(0, 2).map(p => p.id), PP, PK, autoLines: true };
  }

  // PP1 runs 4F + 1D, PP2 3F + 2D. Penalty killers come from forwards not on PP1 where possible,
  // which spreads ice time down the lineup the way coaches do.
  function specialUnits(s, fIds, dIds) {
    const byOvr = (a, b) => b.ovr - a.ovr || (a.id < b.id ? -1 : 1);
    const F = fIds.filter(Boolean).map(id => s.players[id]), D = dIds.filter(Boolean).map(id => s.players[id]);
    const rank = (list, key) => [...list].sort((a, b) => key(b) - key(a) || byOvr(a, b));
    const ppF = rank(F, Ratings.fOff), ppD = rank(D, Ratings.dOff);
    const PP = [[...ppF.slice(0, 4), ppD[0]], [...ppF.slice(4, 7), ppD[1], ppD[2]]].map(u => u.filter(Boolean).map(p => p.id));
    const pp1 = new Set(PP[0]);
    const pkF = rank(F, Ratings.fDef), pkPool = [...pkF.filter(p => !pp1.has(p.id)), ...pkF.filter(p => pp1.has(p.id))];
    const pkD = rank(D, Ratings.dDef);
    const PK = [0, 1].map(u => [...pkPool.slice(2 * u, 2 * u + 2), ...pkD.slice(2 * u, 2 * u + 2)].map(p => p.id));
    return { PP, PK };
  }

  // A coach's own lines (special teams are rebuilt from the dressed players). Rejected if illegal.
  function manual(s, teamId, { F, D, G }) {
    const lu = { F, D, G, ...specialUnits(s, F.flat(), D.flat()), autoLines: false };
    const problems = validate(s, teamId, lu);
    if (problems.length) return { ok: false, problems };
    s.teams[teamId].lineup = lu;
    return { ok: true, problems: [] };
  }

  // structuralOnly: just "do these players exist on this roster" (used by Integrity between games).
  function validate(s, teamId, lu, { structuralOnly = false } = {}) {
    const problems = [];
    const onRoster = new Set(Select.rosterIds(s, teamId));
    const es = [...lu.F.flat(), ...lu.D.flat()];
    const all = [...es, ...lu.G, ...lu.PP.flat(), ...lu.PK.flat()];
    for (const id of all) {
      if (id === null || id === undefined) { if (!structuralOnly) problems.push('empty lineup slot'); continue; }
      if (!s.players[id]) { problems.push(`unknown player ${id}`); continue; }
      if (!onRoster.has(id)) problems.push(`${id} is not on the ${teamId} roster`);
      else if (!structuralOnly && !available(s.players[id])) problems.push(`${id} is unavailable`);
    }
    if (structuralOnly) return [...new Set(problems)];
    if (lu.F.length !== 4 || lu.F.some(l => l.length !== 3)) problems.push('need 4 forward lines of 3');
    if (lu.D.length !== 3 || lu.D.some(p => p.length !== 2)) problems.push('need 3 defence pairs');
    if (lu.G.length < 2) problems.push('need 2 goalies dressed');
    if (new Set(es).size !== es.length) problems.push('a skater appears twice in the even-strength lines');
    for (const id of lu.G) if (s.players[id] && s.players[id].position !== 'G') problems.push(`${id} is not a goalie`);
    for (const id of es) if (s.players[id] && s.players[id].position === 'G') problems.push(`goalie ${id} in a skater slot`);
    const dressed = new Set(es);
    if (lu.PP.length !== 2 || lu.PP.some(u => u.length !== 5)) problems.push('need 2 power-play units of 5');
    if (lu.PK.length !== 2 || lu.PK.some(u => u.length !== 4)) problems.push('need 2 penalty-kill units of 4');
    for (const id of [...lu.PP.flat(), ...lu.PK.flat()]) if (!dressed.has(id)) problems.push(`${id} is on a special-teams unit but not dressed`);
    return [...new Set(problems)];
  }

  // Lineup used for the next game: auto teams are rebuilt; a manual lineup is used if still valid,
  // otherwise replaced by auto lines (the autoLines flag is kept).
  function prepare(s, teamId) {
    const t = s.teams[teamId];
    if (!t.lineup.autoLines && validate(s, teamId, t.lineup).length === 0) return t.lineup;
    const lu = auto(s, teamId);
    lu.autoLines = t.lineup.autoLines;
    t.lineup = lu;
    return lu;
  }

  const autoAll = s => { for (const id of Object.keys(s.teams)) s.teams[id].lineup = auto(s, id); };

  // Target share of starts for the backup (0 for manual lineups, which always start G[0]).
  function backupShare(s, teamId) {
    const lu = s.teams[teamId].lineup, [a, b] = lu.G;
    if (!b || !lu.autoLines) return 0;
    const R = CONFIG.lineup.backupShare;
    return U.clamp(R.tandem - R.perOvrGap * (s.players[a].ovr - s.players[b].ovr), R.min, R.max);
  }

  // Who starts in goal on `date`. Manual lineups always start G[0]; in the playoffs the starter plays
  // unless he's exhausted; in the regular season the backup also gets back-to-backs and his share.
  function starterFor(s, teamId, date, type = 'REG') {
    const lu = s.teams[teamId].lineup, [a, b] = lu.G;
    if (!b || !lu.autoLines) return a;
    const A = s.players[a], B = s.players[b];
    if (A.condition.energy < CONFIG.condition.goalieRestBelow && B.condition.energy > A.condition.energy) return b;
    if (type === 'PO') return a;
    const share = backupShare(s, teamId);
    if (!share) return a;
    if (A.condition.lastPlayed === U.addDays(date, -1)) return b;          // back-to-back: rest the starter
    const season = U.seasonOf(date), league = s.teams[teamId].league;
    const starts = p => U.sum(p.stats.filter(L => L.season === season && L.teamId === teamId && L.league === league && L.type === 'REG').map(L => L.gs));
    const sa = starts(A), sb = starts(B);
    return sb < share * (sa + sb + 1) - 0.5 ? b : a;
  }

  return { SLOTS, fit, available, empty, auto, specialUnits, manual, validate, prepare, autoAll, backupShare, starterFor };
})();

// ════════════════════════════════════════════════════════════════════════════
// §12 Sim — the minute-tick game engine (BLUEPRINT §3), league norms, win probability
// ════════════════════════════════════════════════════════════════════════════

const Sim = (() => {
  const S = CONFIG.sim;
  const SKILLS = ['skating', 'shooting', 'passing', 'puckHandling', 'offIQ', 'defIQ', 'physicality', 'faceoffs'];

  const perf = p => {
    const e = p.condition.energy, c = CONFIG.condition;
    return e >= c.perfFullAt ? 1 : c.perfFloor + (1 - c.perfFloor) * e / c.perfFullAt;
  };

  // A dressed skater as the engine sees him: skills × position fit × fatigue, plus precomputed weights.
  function effSkater(p, slot) {
    const f = Lineup.fit(p, slot) * perf(p), a = p.attributes;
    const e = { id: p.id, isD: slot === 'D', discipline: a.discipline };
    for (const k of SKILLS) e[k] = a[k] * f;
    e.shootW = (S.shooterMix.shooting * e.shooting + S.shooterMix.offIQ * e.offIQ) ** S.shootExp * (e.isD ? S.dShootW : 1);
    e.passW = (S.passerMix.passing * e.passing + S.passerMix.offIQ * e.offIQ + S.passerMix.puckHandling * e.puckHandling) ** S.assistExp;
    e.soSkill = (e.shooting + e.puckHandling) / 2;
    return e;
  }

  const shotQ = (e, skaters) => {
    const mates = skaters.filter(x => x !== e);
    return S.shotQ.shooting * e.shooting + S.shotQ.offIQ * e.offIQ + S.shotQ.matesPassing * U.mean(mates.map(x => x.passing));
  };

  function unit(F, D, center) {
    const skaters = [...F, ...D];
    const fwd = F.length ? F : skaters;
    return { skaters, off: Ratings.unitOff(fwd, D), def: Ratings.unitDef(fwd, D),
             center: center || fwd.reduce((b, x) => (x.faceoffs > b.faceoffs ? x : b), fwd[0]) };
  }

  // Frozen per-game snapshot of one team.
  function buildSide(s, teamId, date = s.calendar.date, type = 'REG') {
    const lu = Lineup.prepare(s, teamId);
    const problems = Lineup.validate(s, teamId, lu);
    if (problems.length) throw new Error(`${teamId} can't dress a legal lineup: ${problems.join('; ')}`);
    const starterId = Lineup.starterFor(s, teamId, date, type);
    const slot = new Map();
    lu.F.forEach(l => l.forEach((id, k) => slot.set(id, Lineup.SLOTS[k])));
    lu.D.forEach(pr => pr.forEach(id => slot.set(id, 'D')));
    const cache = new Map();
    const E = id => {
      let e = cache.get(id);
      if (!e) { const p = s.players[id]; e = effSkater(p, slot.get(id) || p.position); cache.set(id, e); }
      return e;
    };
    const lines = lu.F.map(l => l.map(E)), pairs = lu.D.map(pr => pr.map(E));
    const special = ids => { const es = ids.map(E); return unit(es.filter(e => !e.isD), es.filter(e => e.isD)); };
    const gp = s.players[starterId];
    const dressed = [...lines.flat(), ...pairs.flat()];
    return {
      teamId,
      ev: lines.map(l => pairs.map(pr => unit(l, pr, l[1]))),
      pp: lu.PP.map(special), pk: lu.PK.map(special),
      goalie: { id: gp.id, rating: Ratings.goalie(gp) * perf(gp), consistency: gp.dev.consistency },
      backupId: lu.G.find(id => id !== starterId) || null,
      dressed: dressed.map(e => e.id),
      otF: [...lines[0], ...lines[1]], otD: [pairs[0], pairs[1]],
      soOrder: [...dressed].sort((a, b) => b.soSkill - a.soSkill || (a.id < b.id ? -1 : 1)),
      disc: U.mean(dressed.map(e => e.discipline)),
    };
  }

  // Shot-weighted shot quality of a unit (what an average shot from this unit looks like).
  const unitShotQ = u => {
    const tw = U.sum(u.skaters.map(e => e.shootW));
    return U.sum(u.skaters.map(e => e.shootW * shotQ(e, u.skaters))) / tw;
  };
  // Mean finishing multiplier of a unit's shots (defencemen convert at dFinish).
  const unitFinish = u => {
    const tw = U.sum(u.skaters.map(e => e.shootW));
    return U.sum(u.skaters.map(e => e.shootW * (e.isD ? S.dFinish : 1))) / tw;
  };

  // Team aggregates feeding the closed-form win probability (BLUEPRINT §3.3).
  function aggregates(side) {
    let off = 0, def = 0, sq = 0, fin = 0, w = 0;
    side.ev.forEach((row, i) => row.forEach((u, j) => {
      const wt = S.shares.F[i] * S.shares.D[j];
      off += wt * u.off; def += wt * u.def; sq += wt * unitShotQ(u); fin += wt * unitFinish(u); w += wt;
    }));
    const mix = (units, shares, key) => U.sum(units.map((u, k) => shares[k] * u[key]));
    return { off: off / w, def: def / w, sq: sq / w, fin: fin / w, pp: mix(side.pp, S.shares.PP, 'off'), pk: mix(side.pk, S.shares.PK, 'def'), g: side.goalie.rating };
  }

  // League-wide means. Every formula is relative to these, so rating inflation can't drift scoring.
  // The goalie norm uses each team's expected starter/backup usage, so it doesn't depend on who
  // happens to be scheduled to start on the day the norms are recomputed.
  function computeNorms(s, league, date) {
    let off = 0, def = 0, sq = 0, g = 0, disc = 0, so = 0, n = 0;
    const gRating = id => { const p = s.players[id]; return Ratings.goalie(p) * perf(p); };
    for (const t of Object.values(s.teams)) {
      if (t.league !== league) continue;
      if (Lineup.validate(s, t.id, Lineup.prepare(s, t.id)).length) continue;   // can't dress today (e.g. a blocked user)
      const side = buildSide(s, t.id, date), a = aggregates(side);
      const [ga, gb] = t.lineup.G, share = Lineup.backupShare(s, t.id);
      off += a.off; def += a.def; sq += a.sq; disc += side.disc;
      g += (1 - share) * gRating(ga) + (share ? share * gRating(gb) : 0);
      so += U.mean(side.soOrder.slice(0, S.shootout.rounds).map(e => e.soSkill));
      n++;
    }
    return { computedOn: date, off: off / n, def: def / n, sq: sq / n, g: g / n, disc: disc / n, so: so / n };
  }

  function ensureNorms(s, league, date) {
    const cur = s.norms[league];
    if (!cur || Math.abs(U.daysBetween(cur.computedOn, date)) >= S.normsMaxAgeDays) s.norms[league] = computeNorms(s, league, date);
    return s.norms[league];
  }

  // ── the engine ────────────────────────────────────────────────────────────
  function simulate(ctx, rng) {
    const N = ctx.norms, T = [ctx.home, ctx.away];
    const goals = [0, 0], pen = [0, 0];                     // pen[i] = minutes team i is short-handed
    const shots = [[0, 0, 0], [0, 0, 0]];                   // by period; overtime periods are appended
    const lines = new Map();
    const line = id => {
      let x = lines.get(id);
      if (!x) { x = { side: -1, g: 0, a: 0, sog: 0, pm: 0, pim: 0, toi: 0, ppg: 0, ppa: 0, shg: 0, sha: 0, gwg: 0, fow: 0, fol: 0 }; lines.set(id, x); }
      return x;
    };
    T.forEach((t, i) => t.dressed.forEach(id => { line(id).side = i; }));
    const gl = T.map((t, i) => ({ id: t.goalie.id, side: i, sa: 0, ga: 0, toi: 0, decision: null, so: 0 }));
    const form = T.map(t => t.goalie.rating + rng.normal() * S.goalieForm.sd * (S.goalieForm.base - t.goalie.consistency / 100));
    const goalList = [], penList = [];

    function deploy(t, i, pp, ot) {
      if (ot) {
        const a = rng.int(0, t.otF.length - 1);
        const pair = t.otD[rng.weightedIndex(S.shares.otD)];
        return unit([t.otF[a], t.otF[(a + 1) % t.otF.length]], [pair[rng.int(0, 1)]]);
      }
      if (pp === i) return t.pp[rng.weightedIndex(S.shares.PP)];
      if (pp === 1 - i) return t.pk[rng.weightedIndex(S.shares.PK)];
      return t.ev[rng.weightedIndex(S.shares.F)][rng.weightedIndex(S.shares.D)];
    }

    // mode: 'REG' (regulation), 'OT3' (regular-season 3-on-3), 'OT5' (playoff 5-on-5). Overtime is sudden death.
    function tick(m, mode) {
      const ot = mode === 'OT3', sudden = mode !== 'REG';
      const pp = (pen[0] > 0) !== (pen[1] > 0) ? (pen[0] > 0 ? 1 : 0) : -1;   // team on the PP, or −1
      const Un = T.map((t, i) => deploy(t, i, pp, ot));
      const lead = goals[0] - goals[1];
      const pulled = mode === 'REG' && m >= S.pull.fromMinute && Math.abs(lead) >= 1 && Math.abs(lead) <= S.pull.maxDeficit ? (lead > 0 ? 1 : 0) : -1;
      const period = mode === 'REG' ? Math.floor(m / 20) : mode === 'OT3' ? 3 : 3 + Math.floor((m - 60) / CONFIG.playoffs.otPeriodMinutes);
      while (shots[0].length <= period) { shots[0].push(0); shots[1].push(0); }
      for (let i = 0; i < 2; i++) {
        if (pulled !== i) gl[i].toi += 60;
        for (const e of Un[i].skaters) line(e.id).toi += 60;
      }
      // Faceoff: the winner gets a slightly better minute.
      const c0 = Un[0].center, c1 = Un[1].center;
      const foWin = rng.next() < U.clamp(0.5 + (c0.faceoffs - c1.faceoffs) * S.faceoff.k, S.faceoff.min, S.faceoff.max) ? 0 : 1;
      line(Un[foWin].center.id).fow++; line(Un[1 - foWin].center.id).fol++;

      // Random order each minute: otherwise home would always get the first chance (decisive in sudden death).
      for (const i of rng.next() < 0.5 ? [0, 1] : [1, 0]) {
        const j = 1 - i, att = Un[i], dfd = Un[j];
        const st = ot ? 'OT' : pp < 0 ? 'EV' : pp === i ? 'PP' : 'SH';
        let lam = S.shots[st] * Math.exp(S.kShot * ((att.off - N.off) - (dfd.def - N.def))) * (i === 0 ? S.home : S.away);
        lam *= foWin === i ? S.faceoff.winBoost : 2 - S.faceoff.winBoost;
        if (mode === 'REG') {                               // score effects: the trailing team pushes
          const d = goals[i] - goals[j], E = S.scoreEffects;
          lam *= d < 0 ? 1 + E.trail * Math.min(E.cap, -d) : d > 0 ? 1 - E.lead * Math.min(E.cap, d) : 1;
        }
        if (pulled === i) lam *= S.pull.mult;
        const n = rng.poisson(lam) + (pulled === j ? rng.poisson(S.pull.enShots) : 0);
        for (let k = 0; k < n; k++) {
          const shooter = rng.weighted(att.skaters, e => e.shootW);
          const mates = att.skaters.filter(e => e !== shooter);
          line(shooter.id).sog++;
          shots[i][period]++;
          let scored;
          if (pulled === j) {
            scored = rng.next() < S.pull.enP;                // empty net: no goalie stats
          } else {
            gl[j].sa++;
            const pGoal = S.baseSh * S.finish[st] * (shooter.isD ? S.dFinish : 1)
              * Math.exp(S.kShooter * (shotQ(shooter, att.skaters) - N.sq))
              * Math.exp(-S.kGoalie * (form[j] - N.g));
            scored = rng.next() < pGoal;
            if (scored) gl[j].ga++;
          }
          if (!scored) continue;
          goals[i]++;
          line(shooter.id).g++;
          const a1 = mates.length && rng.next() < S.pA1 ? rng.weighted(mates, e => e.passW * (e.isD ? S.dA1W : 1)) : null;
          const rest = a1 ? mates.filter(e => e !== a1) : [];
          const a2 = a1 && rest.length && rng.next() < S.pA2 ? rng.weighted(rest, e => e.passW * (e.isD ? S.dA2W : 1)) : null;
          for (const a of [a1, a2]) if (a) line(a.id).a++;
          const strength = pulled === j ? 'EN' : st === 'OT' ? 'EV' : st;
          if (st === 'PP') {
            line(shooter.id).ppg++; for (const a of [a1, a2]) if (a) line(a.id).ppa++;
            pen[j] = 0;                                     // a PP goal ends the minor
          } else {
            if (st === 'SH') { line(shooter.id).shg++; for (const a of [a1, a2]) if (a) line(a.id).sha++; }
            for (const e of att.skaters) line(e.id).pm++;
            for (const e of dfd.skaters) line(e.id).pm--;
          }
          goalList.push({ period: period + 1, sec: m * 60 + rng.int(m === 0 ? 8 : 1, 59), side: i, scorer: shooter.id,
                          a1: a1 ? a1.id : null, a2: a2 ? a2.id : null, strength });
          if (sudden) return true;                          // sudden death
        }
      }
      for (let i = 0; i < 2; i++) if (pen[i] > 0) pen[i]--;
      if (!ot && pp < 0) {                                  // minors are called at even strength (not in 3-on-3)
        for (let i = 0; i < 2; i++) {
          if (pen[i] === 0 && rng.next() < S.penRate * Math.exp(-S.kDisc * (T[i].disc - N.disc))) {
