  const offersFor = (s, playerId) => s.pending.faOffers.filter(o => o.playerId === playerId);
  const committed = (s, org, except = null) => U.sum(s.pending.faOffers.filter(o => o.teamId === org && o.playerId !== except).map(o => o.capHit));
  const pendingCount = (s, org, except = null) => s.pending.faOffers.filter(o => o.teamId === org && o.playerId !== except).length;
  const decisionDays = amount => M.decisionDays.find(([lim]) => amount < lim)[1];

  // Why `org` can't make this offer (null = it can). Offers are commitments: they must fit in the cap space left
  // after the team's other pending offers, and count toward the 50-contract limit.
  function offerProblem(s, org, p, capHit, years) {
    if (!isOpen(s)) return 'Free agency is closed until July 1';
    if (!p || p.assignment !== 'FA') return 'He is not a free agent';
    if (!Number.isInteger(years) || years < 1 || years > maxTerm(p, org)) return `Term must be 1–${maxTerm(p, org)} years`;
    if (!(capHit >= C.minSalary && capHit <= Contracts.maxContract())) return `Cap hit must be ${U.money(C.minSalary)}–${U.money(Contracts.maxContract())}`;
    if (Contracts.contractCount(s, org) + pendingCount(s, org, p.id) >= R.contractMax) return `At the ${R.contractMax}-contract limit (counting pending offers)`;
    const space = Contracts.capSpace(s, org) - committed(s, org, p.id);
    if (capHit > space) return `Not enough cap space (${U.money(Math.max(0, space))} left after other offers)`;
    return null;
  }

  function offer(s, org, playerId, capHit, years, date) {
    const p = s.players[playerId], problem = offerProblem(s, org, p, capHit, years);
    if (problem) throw new Error(problem);
    s.pending.faOffers = s.pending.faOffers.filter(o => !(o.playerId === playerId && o.teamId === org));
    s.pending.faOffers.push({ playerId, teamId: org, capHit, years, date });
    p.market = p.market || { since: date, decideOn: null };
    if (!p.market.decideOn) {
      const days = Contracts.waiversApply(s) ? 1 : decisionDays(ask(s, p, Contracts.preferredTerm(s, p)));
      p.market.decideOn = U.addDays(date, days);
    }
  }
  const withdraw = (s, org, playerId) => { s.pending.faOffers = s.pending.faOffers.filter(o => !(o.playerId === playerId && o.teamId === org)); };

  const score = (s, p, o, table) => o.capHit * appeal(s, p, o.teamId, table) * (1 + M.termValue * Math.min(o.years, Contracts.preferredTerm(s, p)));
  const acceptable = (s, p, o, table) => o.capHit * appeal(s, p, o.teamId, table) >= ask(s, p, o.years) - 1;

  // Where a new signing goes: the NHL roster if there's room and he'd play, otherwise the AHL.
  function place(s, p, org, level = null) {
    const t = s.teams[org], g = group(p);
    const active = t.roster.nhl.filter(id => Roster.isActive(s.players[id])).length;
    const mine = t.roster.nhl.map(id => s.players[id]).filter(x => group(x) === g).map(x => x.ovr).sort((a, b) => a - b);
    const up = level ? level === 'NHL' : active < R.nhlMax && (mine.length <= Roster.NEED[g] || p.ovr > mine[0]);
    t.roster[up ? 'nhl' : 'ahl'].push(p.id);
    p.assignment = up ? 'NHL' : 'AHL';
    if (t.controller !== 'USER' && !Contracts.waiversApply(s)) Roster.offseasonSort(s, org);
    if (Contracts.waiversApply(s)) Roster.refreshLines(s, org);
  }

  function sign(s, p, org, capHit, years, date, events, via = 'FA', level = null) {
    const start = Contracts.contractStart(s);
    const lost = offersFor(s, p.id).filter(o => o.teamId !== org).map(o => o.teamId);
    s.pending.faOffers = s.pending.faOffers.filter(o => o.playerId !== p.id);
    p.contract = Contracts.newContract(capHit, years, start, Contracts.clausesFor(s, p, years, start));
    p.teamId = org; p.rosterStatus = 'ACTIVE'; p.market = null;
    if (p.career.signedAt === null || p.career.signedAt === undefined) p.career.signedAt = U.seasonAge(p.birthDate, start);
    const former = p.lastTeamId; delete p.lastTeamId;
    place(s, p, org, level);
    log(s, date, 'SIGN', p, org, `${U.money(capHit)} × ${years}`);
    events.push({ kind: 'SIGNING', date, playerId: p.id, teamId: org, capHit, years, via, lost, former });
    return p;
  }

  // On his decision day a free agent takes the best acceptable offer; if none is good enough he waits a day
  // (his ask keeps falling).
  function decide(s, p, date, events, table) {
    const list = offersFor(s, p.id).filter(o => acceptable(s, p, o, table))
      .sort((a, b) => score(s, p, b, table) - score(s, p, a, table) || (a.teamId < b.teamId ? -1 : 1));
    for (const o of list) {
      if (o.capHit <= Contracts.capSpace(s, o.teamId) && Contracts.contractCount(s, o.teamId) < R.contractMax) { sign(s, p, o.teamId, o.capHit, o.years, date, events); return true; }
      withdraw(s, o.teamId, p.id);
      events.push({ kind: 'OFFER_VOID', date, playerId: p.id, teamId: o.teamId });
    }
    p.market.decideOn = U.addDays(date, 1);
    return false;
  }

  // AI teams: each day, one offer to the free agent who'd improve them most among those they can afford; or,
  // if they're short at a position, the best cheap depth player.
  function aiOffers(s, rng, date, table) {
    const start = Contracts.contractStart(s), user = s.meta.userTeamId;
    const fas = Select.freeAgents(s).filter(p => !(p.condition.injury && p.condition.injury.daysOut > 30)).sort((a, b) => b.ovr - a.ovr);
    const cands = { F: [], D: [], G: [] };
    for (const p of fas) if (cands[group(p)].length < 50) cands[group(p)].push(p);
    const memo = new Map();
    const askOf = (p, years) => { const k = `${p.id}:${years}`; if (!memo.has(k)) memo.set(k, ask(s, p, years)); return memo.get(k); };
    const termOf = new Map();
    const frenzy = s.calendar.phase === 'FREE_AGENCY' && U.daysBetween(`${s.calendar.season}-07-01`, date) < A.frenzyDays;
    const turns = [];
    for (let k = 0; k < (frenzy ? A.frenzyOffers : A.offersPerDay); k++) turns.push(...rng.shuffle(Select.nhlTeams(s).filter(x => x.id !== user)));
    for (const t of turns) {
      const org = t.id;
      if (pendingCount(s, org) >= A.maxPending || Contracts.contractCount(s, org) + pendingCount(s, org) >= R.contractMax - 1) continue;
      const budget = Contracts.capSpace(s, org) - committed(s, org) - A.reserve;
      const base = orgDepth(s, org, start);
      const belowFloor = Contracts.capPayroll(s, org) + committed(s, org) < Contracts.capLower();
      const extra = belowFloor ? A.belowFloor.raise : 0, minGain = belowFloor ? A.belowFloor.minGain : A.minGain;
      let best = null;
      for (const g of ['F', 'D', 'G']) {
        for (const p of cands[g]) {
          if (p.assignment !== 'FA' || s.pending.faOffers.some(o => o.playerId === p.id && o.teamId === org)) continue;
          if (!termOf.has(p.id)) termOf.set(p.id, aiTerm(s, p, start));
          const years = Math.min(termOf.get(p.id), maxTerm(p, org));
          const price = U.clamp(U.roundTo(askOf(p, years) / appeal(s, p, org, table) * (rng.float(A.raise[0], A.raise[1]) + extra), C.rounding), C.minSalary, Contracts.maxContract());
          if (price > budget || (price > A.depthMaxAsk && price > A.overpayLimit * Contracts.fairCap(p.ovr, p.position))) continue;
          const gain = gainOf(base, p);
          if (gain < minGain || gain <= 0) continue;
          const v = gain * rng.float(0.85, 1.15);
          if (!best || v > best.v) best = { v, p, price, years };
        }
      }
      if (!best) {
        for (const g of ['G', 'D', 'F']) {
          if (base[g].length >= A.depthTargets[g]) continue;
          const p = cands[g].find(x => x.assignment === 'FA' && !s.pending.faOffers.some(o => o.playerId === x.id && o.teamId === org)
            && askOf(x, 1) <= Math.min(A.depthMaxAsk, budget));
          if (p) { best = { p, price: askOf(p, 1), years: 1 }; break; }
        }
      }
      if (best && !offerProblem(s, org, best.p, best.price, best.years)) offer(s, org, best.p.id, best.price, best.years, date);
    }
  }

  function tick(s, rng, date, events) {
    if (!isOpen(s)) return;
    const table = strengthTable(s);
    if (M.aiOfferPhases.includes(s.calendar.phase)) aiOffers(s, rng, date, table);
    for (const p of Select.freeAgents(s)) if (p.market && p.market.decideOn && p.market.decideOn <= date) decide(s, p, date, events, table);
  }

  // ── Re-signing your own players ──
  // From the start of a player's final season until June 30. In-season deals are extensions that take effect
  // next season; after the season ends they replace the expiring contract.
  function reSignProblem(s, p, years) {
    const season = s.calendar.season, phase = s.calendar.phase;
    if (!p || !p.contract || p.contract.type === 'PTO') return 'He has no contract to extend';
    if (phase === 'FREE_AGENCY') return 'His contract has expired';
    if (p.contract.expiresAfterSeason !== season) return 'Only players in the last year of their contract can be re-signed';
    if (p.extension) return 'He has already signed an extension';
    if (!Number.isInteger(years) || years < 1 || years > C.maxTermResign) return `Term must be 1–${C.maxTermResign} years`;
    const start = season + 1, capHit = reSignPrice(s, p, years);
    const q = p.qualified; delete p.qualified;
    const projected = Contracts.projectedPayroll(s, p.teamId, start);
    if (q !== undefined) p.qualified = q;
    if (projected + capHit > C.upper) return `Not enough cap space next season (${U.money(Math.max(0, C.upper - projected))} projected)`;
    return null;
  }
  // His price to re-sign for `years` (starting next season): his demand, plus a premium if he'd rather test the market.
  const reSignPrice = (s, p, years) => {
    const d = Contracts.demand(s, p, years, { start: s.calendar.season + 1 });
    return Contracts.faStatus(s, p) === 'UFA' && !willing(s, p) ? U.clamp(U.roundTo(d * K.unwillingPremium, C.rounding), C.minSalary, Contracts.maxContract()) : d;
  };
  function reSign(s, p, years, date, events) {
    const problem = reSignProblem(s, p, years);
    if (problem) throw new Error(problem);
    const start = s.calendar.season + 1, c = Contracts.newContract(reSignPrice(s, p, years), years, start, Contracts.clausesFor(s, p, years, start));
    if (Contracts.contractStart(s) === start) p.contract = c; else p.extension = c;
    delete p.qualified;
    log(s, date, 'RE_SIGN', p, p.teamId, `${U.money(c.capHit)} × ${years}`);
    events.push({ kind: 'RE_SIGN', date, playerId: p.id, teamId: p.teamId, capHit: c.capHit, years });
    return c;
  }

  // Would the AI keep this expiring player? He has to improve next season's lineup (or be a real prospect).
  function wantsToKeep(s, p, base) {
    const young = U.seasonAge(p.birthDate, s.calendar.season + 1) <= 24 && p.dev.potential >= 72;
    return young || gainOf(base, p) >= A.keepGain;
  }

  // RE_SIGNING opens (the day after the draft): AI teams re-sign the players they want and can afford,
  // qualify the RFAs they'd keep at a one-year award, and let the rest walk on July 1.
  function aiReSign(s, date, events, { only = null } = {}) {
    const season = s.calendar.season, start = season + 1, table = strengthTable(s);
    for (const t of Select.nhlTeams(s)) {
      if ((only && t.id !== only) || (t.id === s.meta.userTeamId && !s.settings.autoContracts)) continue;
      const org = t.id, all = [...t.roster.nhl, ...t.roster.ahl].map(id => s.players[id]).filter(p => p.contract && p.contract.type !== 'PTO');
      const expiring = all.filter(p => p.contract.expiresAfterSeason <= season).sort((a, b) => b.ovr - a.ovr);
      const base = groupsOf(all.filter(p => p.contract.expiresAfterSeason > season));
      let payroll = Contracts.projectedPayroll(s, org, start), count = all.length - expiring.length;
      for (const p of expiring) {
        if (!wantsToKeep(s, p, base) || count >= R.contractMax - 3) continue;
        const status = Contracts.faStatus(s, p), years = aiTerm(s, p, start);
        const price = Contracts.demand(s, p, years, { start }), room = C.upper - A.reserve - payroll;
        const sane = price <= A.overpayLimit * Contracts.fairCap(p.ovr, p.position) || price <= A.depthMaxAsk || p.dev.potential >= 72;
        if (sane && price <= room && (status === 'RFA' || willing(s, p, table))) {
          p.contract = Contracts.newContract(price, years, start, Contracts.clausesFor(s, p, years, start));
          log(s, date, 'RE_SIGN', p, org, `${U.money(price)} × ${years}`);
          events.push({ kind: 'RE_SIGN', date, playerId: p.id, teamId: org, capHit: price, years, auto: true });
        } else if (status === 'RFA') {
          const award = Contracts.demand(s, p, 1, { start });
          if (award > room) continue;
          p.qualified = true;
          payroll += award - price;
        } else continue;
        payroll += price; count++;
        base[group(p)] = [...base[group(p)], p.ovr].sort((a, b) => b - a);
      }
    }
  }
  // Staff recommendation for the user's expiring players (used as the default for qualifying offers).
  function recommend(s, p) {
    const t = s.teams[p.teamId], season = s.calendar.season;
    const base = groupsOf([...t.roster.nhl, ...t.roster.ahl].map(id => s.players[id]).filter(x => x.id !== p.id && x.contract && x.contract.type !== 'PTO' && x.contract.expiresAfterSeason > season));
    return wantsToKeep(s, p, base);
  }

  // ── Entry-level deals for drafted prospects ──
  function signProspect(s, p, date, events) {
    const org = p && p.teamId;
    if (!org || !s.teams[org].roster.reserve.includes(p.id)) throw new Error('Only your unsigned draft picks can be signed to entry-level deals');
    if (!Contracts.isOffseason(s) && s.calendar.phase === 'PLAYOFFS') throw new Error('Prospects can’t be signed during the playoffs');
    if (Contracts.contractCount(s, org) >= R.contractMax) throw new Error(`At the ${R.contractMax}-contract limit`);
    const start = Contracts.contractStart(s);
    p.contract = Contracts.elc(s, p, start);
    p.career.signedAt = U.seasonAge(p.birthDate, start);
    const r = s.teams[org].roster;
    r.reserve = r.reserve.filter(id => id !== p.id);
    r.ahl.push(p.id); p.assignment = 'AHL'; p.rosterStatus = 'ACTIVE';
    if (s.teams[org].controller !== 'USER' && !Contracts.waiversApply(s)) Roster.offseasonSort(s, org);
    log(s, date, 'SIGN_ELC', p, org, `${U.money(p.contract.capHit)} × ${p.contract.yearsRemaining}`);
    events.push({ kind: 'SIGN_ELC', date, playerId: p.id, teamId: org });
    return p;
  }
  // AI orgs sign the prospects who are 20+ next season (or NHL-ready) and good enough to matter.
  const prospectReady = (s, p) => {
    const age = U.seasonAge(p.birthDate, s.calendar.season + 1);
    return age <= D.rightsUntilAge && (age >= D.signAge || p.ovr >= D.nhlReadyOvr) && p.dev.potential >= D.signMinPotential;
  };
  function aiSignProspects(s, date, events, { only = null } = {}) {
    for (const t of Select.nhlTeams(s)) {
      if ((only && t.id !== only) || (t.id === s.meta.userTeamId && !s.settings.autoContracts)) continue;
      for (const id of [...t.roster.reserve]) {
        const p = s.players[id];
        if (prospectReady(s, p) && Contracts.contractCount(s, t.id) < R.contractMax - 2) signProspect(s, p, date, events);
        else if (t.id !== s.meta.userTeamId && p.dev.potential < D.relinquishBelow && U.seasonAge(p.birthDate, s.calendar.season + 1) >= 19) {
          t.roster.reserve = t.roster.reserve.filter(x => x !== id);
          p.teamId = null; p.assignment = 'RETIRED'; p.retired = { season: s.calendar.season, age: U.seasonAge(p.birthDate, s.calendar.season), undrafted: true };
        }
      }
    }
  }

  // ── Minimum depth: instant one-year deals for cheap free agents (training camp, or when the pool runs dry,
  //    generated minor-leaguers). Keeps every org able to dress an NHL and an AHL lineup.
  function depthFill(s, rng, org, date, events) {
    const t = s.teams[org];
    for (const g of ['G', 'D', 'F']) {
      for (let guard = 0; guard < 20; guard++) {
        const have = [...t.roster.nhl, ...t.roster.ahl].map(id => s.players[id]).filter(p => group(p) === g && p.contract && p.contract.type !== 'PTO').length;
        if (have >= A.depthTargets[g] || Contracts.contractCount(s, org) >= R.contractMax) break;
        let p = Select.freeAgents(s).filter(x => group(x) === g && !x.condition.injury).sort((a, b) => b.ovr - a.ovr).find(x => ask(s, x, 1) <= A.depthMaxAsk);
        if (!p) {
          const pos = g === 'F' ? rng.pick(['C', 'LW', 'RW']) : g;
          p = Factory.registerPlayer(s, Factory.makePlayer(rng, { pos, tier: 'AHL_DEPTH', age: rng.int(22, 29), season: s.calendar.season }));
          p.career.signedAt = U.seasonAge(p.birthDate, s.calendar.season) - rng.int(1, 4);
          p.career.proSeasons = U.seasonAge(p.birthDate, s.calendar.season) - p.career.signedAt;
        }
        sign(s, p, org, p.assignment === 'FA' ? ask(s, p, 1) : C.minSalary, 1, date, events, 'DEPTH', 'AHL');
      }
    }
  }

  return { strength, groupsOf, gainOf, orgDepth, strengthTable, appeal, willing, ask, askFrom, maxTerm, aiTerm, offersFor, committed,
           offerProblem, offer, withdraw, acceptable, decide, aiOffers, tick, reSignProblem, reSignPrice, reSign, wantsToKeep, aiReSign, recommend,
           signProspect, prospectReady, aiSignProspects, depthFill, sign, isOpen };
})();

// ════════════════════════════════════════════════════════════════════════════
// §19 Offseason — season end (archive, progression, retirements, draft setup), July 1 rollover, training camp
// ════════════════════════════════════════════════════════════════════════════

const Offseason = (() => {
  const D = CONFIG.draft, K = CONFIG.contracts, C = CONFIG.cap;
  const ON_ICE = ['NHL', 'AHL', 'FA'];

  const awardWinners = s => new Set(s.history.awards.flatMap(a => a.list.map(x => x.playerId).filter(Boolean)));
  const notable = (s, p, winners = awardWinners(s)) => p.career.nhlGP >= CONFIG.retirement.keepGP || winners.has(p.id);

  // A retired player's permanent record (Select.person turns it back into a read-only player view).
  const archive = p => ({ id: p.id, firstName: p.firstName, lastName: p.lastName, position: p.position, nationality: p.nationality,
    birthDate: p.birthDate, handedness: p.handedness, retired: p.retired, draft: p.career.draft, nhlGP: p.career.nhlGP,
    ovr: p.ovr, peakOvr: Math.max(p.dev.peakOvr || 0, p.ovr), prior: p.career.prior || null, stats: p.stats.map(L => Stats.packLine(L, p.position)) });

  function clearPlayerFlags(p) { for (const k of ['extension', 'qualified', 'market', 'waivers', 'ltirRelief', 'emergencyRecall']) delete p[k]; }

  // Move a player to free agency (contract over, released, or draft rights lapsed).
  function toFA(s, p, date) {
    if (p.teamId) {
      const r = s.teams[p.teamId].roster;
      for (const k of ['nhl', 'ahl', 'reserve']) r[k] = r[k].filter(id => id !== p.id);
      p.lastTeamId = p.teamId;
    }
    clearPlayerFlags(p);
    p.teamId = null; p.assignment = 'FA'; p.contract = null; p.rosterStatus = 'ACTIVE';
    p.market = { since: date, decideOn: null };
  }

  function retire(s, p, season, date, events) {
    const org = p.teamId;
    if (org) { const r = s.teams[org].roster; for (const k of ['nhl', 'ahl', 'reserve']) r[k] = r[k].filter(id => id !== p.id); }
    s.pending.faOffers = s.pending.faOffers.filter(o => o.playerId !== p.id);
    clearPlayerFlags(p); delete p.lastTeamId;
    p.assignment = 'RETIRED'; p.teamId = null; p.contract = null; p.rosterStatus = 'ACTIVE'; p.condition.injury = null;
    p.retired = { season, age: U.seasonAge(p.birthDate, season) };
    events.push({ kind: 'RETIRE', date, playerId: p.id, teamId: org });
  }

  // Retirement rolls (BLUEPRINT §4.4) for pros and free agents; `ageSeason` is the season just played.
  function retirements(s, rng, ageSeason, events, { unsignedOnly = false } = {}) {
    const date = s.calendar.date;
    for (const p of Object.values(s.players)) {
      if (!ON_ICE.includes(p.assignment)) continue;
      const c = p.contract;
      const unsigned = !c || c.type === 'PTO' || (c.expiresAfterSeason <= ageSeason && !p.extension);
      if (unsignedOnly && !unsigned) continue;
      const age = U.seasonAge(p.birthDate, ageSeason);
      if (!unsigned && age < 33) continue;
      if (rng.next() < Progression.retireChance(age, Ratings.ovrRaw(p), unsigned)) retire(s, p, ageSeason, date, events);
    }
  }

  // ── SEASON_END (the day after the final) ──
  function endSeason(s, rng, events) {
    const season = s.calendar.season, date = s.calendar.date, user = s.meta.userTeamId;
    const row = id => { const r = s.teams[id].record; return [id, r.gp, r.w, r.l, r.otl, r.pts, r.gf, r.ga]; };
    const reached = {};
    for (const round of s.playoffs ? s.playoffs.rounds : []) for (const sr of round) { reached[sr.high] = sr.round; reached[sr.low] = sr.round; }
    s.history.seasons.push({ season, nhl: Stats.standings(s, 'NHL', 'league').map(r => row(r.teamId)), ahl: Stats.standings(s, 'AHL', 'league').map(r => row(r.teamId)),
                             championId: s.playoffs ? s.playoffs.championId : null, finalistId: s.playoffs ? s.playoffs.finalistId : null, playoffRound: reached });
    for (const w of s.pending.waivers) { const p = s.players[w.playerId]; if (p) delete p.waivers; }
    s.pending.waivers = [];
    // Injured reserve is an in-season status; camp re-applies it (Roster.dailyMoves).
    for (const p of Object.values(s.players)) { if (p.rosterStatus !== 'ACTIVE') p.rosterStatus = 'ACTIVE'; delete p.ltirRelief; delete p.emergencyRecall; }
    // Summer development for everyone still playing (the draft class doesn't exist yet).
    const changes = [];
    for (const p of Object.values(s.players)) {
      if (p.assignment === 'RETIRED') continue;
      const before = p.ovr;
      Progression.develop(p, rng, season);
      if (p.teamId === user) changes.push({ playerId: p.id, before, after: p.ovr });
    }
    events.push({ kind: 'DEVELOPMENT', date, season, changes });
    retirements(s, rng, season, events);
    Draft.setup(s, rng, events);
    // Trades reopen; every team re-reads its outlook for next season.
    s.flags.tradesLocked = false;
    s.pending.tradeOffers = [];
    Trade.classify(s, { force: true });
  }

  // ── RE_SIGNING (the day after the draft) ──
  function openReSigning(s, rng, events) {
    const date = s.calendar.date, season = s.calendar.season, user = s.meta.userTeamId;
    Draft.finish(s, events);
    Market.aiReSign(s, date, events);
    Market.aiSignProspects(s, date, events);
    const t = s.teams[user];
    const expiring = [...t.roster.nhl, ...t.roster.ahl].map(id => s.players[id]).filter(p => p.contract && p.contract.type !== 'PTO' && p.contract.expiresAfterSeason <= season);
    // Default qualifying offers for your RFAs: the staff's picks, best first, while the one-year awards fit next
    // season's cap. (With staff-run contracts, aiReSign already decided.)
    let room = CONFIG.cap.upper - Contracts.projectedPayroll(s, user, season + 1);
    for (const p of [...expiring].sort((a, b) => b.ovr - a.ovr)) {
      if (p.qualified !== undefined || p.contract.expiresAfterSeason > season || Contracts.faStatus(s, p) !== 'RFA') continue;
      const award = Contracts.demand(s, p, 1, { start: season + 1 });
      p.qualified = !s.settings.autoContracts && Market.recommend(s, p) && award <= room;
      if (p.qualified) room -= award;
    }
    const prospects = t.roster.reserve.map(id => s.players[id]).filter(p => U.seasonAge(p.birthDate, season + 1) >= D.rightsUntilAge - 1);
    events.push({ kind: 'RE_SIGNING', date, expiring: expiring.map(p => p.id), lastChance: prospects.map(p => p.id) });
  }

  // ── FREE_AGENCY (July 1): the new league year ──
  function rollover(s, rng, events) {
    const old = s.calendar.season, season = old + 1, date = s.calendar.date, user = s.meta.userTeamId;
    s.calendar.season = season;
    const left = [], awards = [], lapsed = [];
    for (const p of Object.values(s.players)) {
      const c = p.contract;
      if (!c) continue;
      if (c.type !== 'PTO' && (c.startSeason === undefined || c.startSeason <= old)) {
        p.career.proSeasons++;
        if (Contracts.nhlGamesIn(p, old) >= K.accrueGP) p.career.accruedSeasons++;
      }
      if (c.type === 'PTO') { toFA(s, p, date); continue; }
      if (c.expiresAfterSeason >= season) { c.yearsRemaining = c.expiresAfterSeason - season + 1; continue; }
      if (p.extension) { p.contract = p.extension; delete p.extension; p.contract.yearsRemaining = p.contract.expiresAfterSeason - season + 1; continue; }
      if (p.qualified && Contracts.faStatus(s, p) === 'RFA') {
        const capHit = U.clamp(U.roundTo(Contracts.demand(s, p, 1, { start: season }) * K.arbitration, C.rounding), C.minSalary, Contracts.maxContract());
        p.contract = Contracts.newContract(capHit, 1, season);
        delete p.qualified;
        s.transactions.push({ date, type: 'ARBITRATION', playerId: p.id, teamId: p.teamId, note: `${U.money(capHit)} × 1` });
        if (p.teamId === user) awards.push(p.id);
        continue;
      }
      if (p.teamId === user) left.push(p.id);
      toFA(s, p, date);
    }
    for (const t of Select.nhlTeams(s)) {
      for (const id of [...t.roster.reserve]) {
        const p = s.players[id];
        if (U.seasonAge(p.birthDate, season) < D.rightsUntilAge) continue;
        if (t.id === user) lapsed.push(p.id);
        if (p.dev.potential >= D.undraftedFaPotential) toFA(s, p, date);
        else { t.roster.reserve = t.roster.reserve.filter(x => x !== id); p.teamId = null; p.assignment = 'RETIRED'; p.retired = { season: old, age: U.seasonAge(p.birthDate, old) }; }
      }
      t.finances.deadCap = t.finances.deadCap.filter(d => d.toSeason >= season);
      t.finances.retained = t.finances.retained.filter(r => r.untilSeason >= season);
    }
    for (const p of Object.values(s.players)) {
      delete p.qualified;
      if (p.assignment === 'FA') p.market = { since: date, decideOn: null };
    }
    s.pending.faOffers = [];
    events.push({ kind: 'FREE_AGENCY', date, season, left, awards, lapsed, pool: Select.freeAgents(s).length,
                  top: Select.freeAgents(s).sort((a, b) => b.ovr - a.ovr).slice(0, 5).map(p => p.id) });
  }

  // ── PRESEASON (training camp): a new season ──
  function startSeason(s, rng, events) {
    const season = s.calendar.season, date = s.calendar.date, user = s.meta.userTeamId;
    // 1. Unsigned free agents may hang them up; the pool is trimmed to the best faPoolMax.
    retirements(s, rng, season - 1, events, { unsignedOnly: true });
    const fas = Select.freeAgents(s).sort((a, b) => (b.ovr + Math.max(0, b.dev.potential - b.ovr) / 2) - (a.ovr + Math.max(0, a.dev.potential - a.ovr) / 2));
    for (const p of fas.slice(CONFIG.market.faPoolMax)) retire(s, p, season - 1, date, []);
    // 2. Prune last season: games, norms, playoffs, old transactions, forgettable retirees.
    s.games = {}; s.scheduleByDate = {}; s.norms = {}; s.playoffs = null;
    s.transactions = s.transactions.filter(x => U.seasonOf(x.date) > season - CONFIG.transactionSeasons);
    const winners = awardWinners(s);
    for (const p of Object.values(s.players)) {
      if (p.assignment !== 'RETIRED') continue;
      if (notable(s, p, winners)) { Records.induct(s, p, season, events); s.history.retired[p.id] = archive(p); }
      delete s.players[p.id];
    }
    // 3. A clean slate: records, schedule, energy.
    for (const t of Object.values(s.teams)) t.record = Factory.emptyRecord();
    s.flags.tradesLocked = false;
    for (const p of Object.values(s.players)) p.condition.energy = 100;
    Calendar.buildSeason(s, rng, season);
    // 4. Rosters: minimum depth, then camp cuts (with waivers) and cap compliance.
    const moves = [];
    for (const t of Select.nhlTeams(s)) {
      if (t.id === user && s.settings.autoRoster === false) continue;
      Market.depthFill(s, rng, t.id, date, events);
      const mine = [];
      Roster.preseasonCuts(s, t.id, date, mine, rng);
      if (t.id === user) moves.push(...mine);
    }
    for (const [type, p] of moves) events.push({ kind: 'ROSTER', date, type, playerId: p.id, teamId: user, auto: true });
    Lineup.autoAll(s);
    Trade.classify(s, { force: true });
    events.push({ kind: 'NEW_SEASON', date, season });
    events.push(preview(s, date));
  }

  // The classifier's odds as a season preview for the news feed.
  function preview(s, date) {
    const odds = Select.nhlTeams(s).map(t => ({ teamId: t.id, odds: t.ai.odds || 0 })).sort((a, b) => b.odds - a.odds || (a.teamId < b.teamId ? -1 : 1));
    return { kind: 'SEASON_PREVIEW', date, favorites: odds.slice(0, 3), longShots: odds.slice(-3).reverse() };
  }

  // Buyout (user command, offseason): dead cap for twice the remaining seasons; the player becomes a free agent.
  function buyout(s, p, date, events) {
    if (!Contracts.isOffseason(s)) throw new Error('Buyouts are only allowed in the offseason (after the season ends, until training camp)');
    const terms = Contracts.buyoutTerms(s, p);
    if (!terms) throw new Error('There is nothing left on his contract to buy out');
    const org = p.teamId;
    s.teams[org].finances.deadCap.push({ playerId: p.id, name: Select.fullName(p), amount: terms.amount, fromSeason: terms.fromSeason, toSeason: terms.toSeason });
    s.transactions.push({ date, type: 'BUYOUT', playerId: p.id, teamId: org, note: `${U.money(terms.amount)} × ${terms.toSeason - terms.fromSeason + 1}` });
    toFA(s, p, date);
    events.push({ kind: 'BUYOUT', date, playerId: p.id, teamId: org, terms });
    return terms;
  }

  return { notable, archive, toFA, retire, retirements, endSeason, openReSigning, rollover, startSeason, buyout, preview };
})();

// ════════════════════════════════════════════════════════════════════════════
// §20 Season — the phase state machine and the daily loop (BLUEPRINT §2)
// ════════════════════════════════════════════════════════════════════════════

const Season = (() => {
  const regularSeasonDone = (s, league) =>
    !Object.values(s.games).some(g => g.league === league && g.type === 'REG' && g.season === s.calendar.season && !g.played);

  // The full year (BLUEPRINT §2.1). onEnter runs when the phase begins (after the date has advanced).
  const PHASES = {
    PRESEASON: { onEnter: (s, ev, rng) => Offseason.startSeason(s, rng, ev),
                 next: 'REGULAR_SEASON', exitWhen: s => { const span = Calendar.seasonSpan(s, 'NHL'); return !!span && s.calendar.date >= span.first; } },
    REGULAR_SEASON: { next: 'PLAYOFFS', exitWhen: s => regularSeasonDone(s, 'NHL') },
    PLAYOFFS: { onEnter: (s, ev) => { Records.endRegularSeason(s, ev); Playoffs.start(s, ev); }, next: 'SEASON_END', exitWhen: s => !!(s.playoffs && s.playoffs.championId) },
    SEASON_END: { onEnter: (s, ev, rng) => { finishSeason(s, ev); Offseason.endSeason(s, rng, ev); },
                  next: 'DRAFT', exitWhen: s => !!s.draft && s.calendar.date >= s.draft.date },
    DRAFT: { next: 'RE_SIGNING', exitWhen: s => !!s.draft && s.draft.done },
    RE_SIGNING: { onEnter: (s, ev, rng) => Offseason.openReSigning(s, rng, ev),
                  next: 'FREE_AGENCY', exitWhen: s => s.calendar.date >= `${s.calendar.season + 1}-07-01` },
    FREE_AGENCY: { onEnter: (s, ev, rng) => Offseason.rollover(s, rng, ev),
                   next: 'PRESEASON', exitWhen: s => s.calendar.date >= U.seasonDate(s.calendar.season, CONFIG.START_MMDD) },
  };
  const LABELS = { PRESEASON: 'Training camp', REGULAR_SEASON: 'Regular season', PLAYOFFS: 'Playoffs', SEASON_END: 'Season complete',
                   DRAFT: 'Draft', RE_SIGNING: 'Re-signing period', FREE_AGENCY: 'Free agency' };
  const IN_SEASON = ['PRESEASON', 'REGULAR_SEASON', 'PLAYOFFS'];

  function checkTransition(s, rng, events) {
    for (let guard = 0; guard < 4; guard++) {
      const P = PHASES[s.calendar.phase];
      if (!P.exitWhen(s)) return;
      s.calendar.phase = P.next;
      events.push({ kind: 'PHASE', date: s.calendar.date, phase: P.next });
      if (PHASES[P.next].onEnter) PHASES[P.next].onEnter(s, events, rng);
    }
  }

  function finishSeason(s, events) {
    const season = s.calendar.season;
    const list = Stats.awards(s, season);
    s.history.awards.push({ season, list });
    events.push({ kind: 'AWARDS', date: s.calendar.date, season, list });
    s.history.champions.push({ season, championId: s.playoffs.championId, finalistId: s.playoffs.finalistId });
    events.push({ kind: 'SEASON_END', date: s.calendar.date, season, championId: s.playoffs.championId });
  }
  const seasonLabel = season => `${season}-${String(season + 1).slice(2)}`;

  // Turn engine events into inbox messages for the user. Returns the ones that should stop a multi-day sim.
  function post(s, events) {
    const user = s.meta.userTeamId, userAhl = s.teams[user].affiliateId;
    const mine = id => id === user || id === userAhl;
    const team = id => (s.teams[id] ? `${s.teams[id].city} ${s.teams[id].name}` : id);
    const name = id => { const p = s.players[id]; return p ? `${Select.fullName(p)} (${p.position})` : id; };
    const out = [];
    const add = (e, title, body, interrupt) => {
      const msg = { id: U.nextId(s, 'msg', 'm_', 6), date: e.date, kind: e.kind, title, body, read: false, interrupt: !!interrupt,
                    playerId: e.playerId || null, gameId: e.gameId || null, seriesId: e.seriesId || null };
      s.inbox.push(msg); out.push(msg);
    };
    const depth = events.filter(e => e.kind === 'SIGNING' && e.via === 'DEPTH' && e.teamId === user);
    if (depth.length) add(depth[0], `Depth signings: ${depth.length} player${depth.length > 1 ? 's' : ''}`, `${depth.map(e => name(e.playerId)).join(', ')}. One-year minor-league deals (auto-manage roster).`, false);
    const myRet = events.filter(e => e.kind === 'RETIRE' && e.teamId === user);
    if (myRet.length) add(myRet[0], `${myRet.length} of your player${myRet.length > 1 ? 's' : ''} retire${myRet.length > 1 ? '' : 's'}`, myRet.map(e => `${name(e.playerId)}, ${s.players[e.playerId] ? s.players[e.playerId].career.nhlGP : 0} NHL games`).join(' · '), false);
    const autoRe = events.filter(e => e.kind === 'RE_SIGN' && e.auto && e.teamId === user);
    if (autoRe.length) add(autoRe[0], `Staff re-signed ${autoRe.length} player${autoRe.length > 1 ? 's' : ''}`, autoRe.map(e => `${name(e.playerId)} ${U.money(e.capHit)} × ${e.years}`).join(' · '), false);
    for (const e of events) {
      const p = e.playerId ? s.players[e.playerId] : null;
      switch (e.kind) {
        case 'INJURY':
          if (p && p.teamId === user) add(e, `${name(e.playerId)} injured`, `${e.type}${e.cause === 'practice' ? ' (in practice)' : ''}. Expected out about ${e.days} day${e.days === 1 ? '' : 's'}${p.assignment === 'AHL' ? ' (AHL).' : '.'}`, p.assignment === 'NHL');
          break;
        case 'RETURN':
          if (p && p.teamId === user) add(e, `${name(e.playerId)} is healthy`, `Recovered from: ${e.type}.`, false);
          break;
        case 'ROSTER': {
          const verbs = { CALL_UP: 'called up from the AHL', EMERGENCY_RECALL: 'recalled on an emergency basis (cap)', SEND_DOWN: 'sent down to the AHL', WAIVE: 'placed on waivers (to be sent down)', IR: 'placed on injured reserve', LTIR: 'placed on long-term injured reserve', ACTIVATE: 'activated from injured reserve', SIGN_PTO: 'signed to an AHL tryout', RELEASE: 'released from his AHL tryout', EMERGENCY_SIGN: 'signed in an emergency (no one healthy at his position)' };
          add(e, `Roster move: ${name(e.playerId)} ${verbs[e.type]}`, 'Made automatically (auto-manage roster is on).', false);
          break;
        }
        case 'WAIVERS':
          if (e.type === 'CLAIMED' && e.fromTeamId === user) add(e, `${name(e.playerId)} claimed off waivers`, `${team(e.teamId)} claimed him. He's gone.`, true);
          else if (e.type === 'CLAIMED' && e.teamId === user) add(e, `Waiver claim: ${name(e.playerId)} is yours`, `Claimed from ${team(e.fromTeamId)}. He joins your NHL roster.`, true);
          else if (e.type === 'CLEARED' && e.teamId === user) add(e, `${name(e.playerId)} cleared waivers`, 'He reports to the AHL.', false);
          break;
        case 'PHASE':
          if (e.phase === 'REGULAR_SEASON') add(e, 'The regular season begins', 'Opening night is here.', true);
          if (e.phase === 'DRAFT') add(e, `Draft day: the ${s.draft.year} draft`, `You pick ${userPicks(s).map(n => `#${n}`).join(', ') || '(no picks)'}. Open the Draft page to make your selections.`, true);
          break;
        case 'DEVELOPMENT': {
          const top = [...e.changes].filter(c => c.after !== c.before).sort((a, b) => Math.abs(b.after - b.before) - Math.abs(a.after - a.before)).slice(0, 6);
          add(e, 'Summer development report', top.length ? top.map(c => `${Select.fullName(s.players[c.playerId])} ${c.before}→${c.after}`).join(' · ') : 'No rating changes.', false);
          break;
        }
        case 'RETIRE':
          if (e.teamId !== user && p && (p.ovr >= 82 || p.career.nhlGP >= 900)) add(e, `${name(e.playerId)} retires`, `After ${p.career.nhlGP} NHL games (peak OVR ${p.dev.peakOvr || p.ovr}).`, false);
          break;
        case 'DRAFT_LOTTERY': {
          const win = e.lottery[0];
          add(e, `Draft lottery: ${team(win.teamId)} win the #1 pick`, `${e.lottery.map(l => `${s.teams[l.teamId].abbrev} ${l.from}→${l.to}`).join(' · ')}. Your picks: ${e.userPicks.map(n => `#${n}`).join(', ') || 'none'}. The class is on the Draft page.`, false);
          break;
        }
        case 'DRAFTED':
          if (e.teamId === user) add(e, `Drafted #${e.overall}: ${name(e.playerId)}`, `Round ${e.round}. He joins your reserve list (unsigned).`, false);
          break;
        case 'RE_SIGNING':
          add(e, 'The re-signing window is open', `${e.expiring.length} of your contracts expire on July 1. Re-sign the players you want (Contracts page); qualified RFAs you don't sign go to a one-year arbitration award, everyone else becomes a free agent.${e.lastChance.length ? ` ${e.lastChance.length} prospect(s) must be signed by next July or their rights lapse.` : ''}`, true);
          break;
        case 'FREE_AGENCY':
          add(e, `Free agency opens: ${seasonLabel(e.season)}`, `${e.pool} free agents available.${e.left.length ? ` Leaving your organization: ${e.left.map(id => Select.fullName(s.players[id])).join(', ')}.` : ''}${e.awards.length ? ` Arbitration awards: ${e.awards.map(id => `${Select.fullName(s.players[id])} ${U.money(s.players[id].contract.capHit)}`).join(', ')}.` : ''}${e.lapsed.length ? ` Draft rights lapsed: ${e.lapsed.map(id => Select.fullName(s.players[id])).join(', ')}.` : ''}`, true);
          break;
        case 'SIGNING':
          if (e.via === 'DEPTH') break;
          if (e.teamId === user) add(e, `Signed: ${name(e.playerId)}`, `${U.money(e.capHit)} × ${e.years} year${e.years > 1 ? 's' : ''}.`, true);
          else if (e.lost.includes(user)) add(e, `${name(e.playerId)} signs with ${team(e.teamId)}`, `${U.money(e.capHit)} × ${e.years}. Your offer was not the best.`, false);
          else if (p && p.ovr >= 82) add(e, `${name(e.playerId)} signs with ${team(e.teamId)}`, `${U.money(e.capHit)} × ${e.years}.`, false);
          break;
        case 'OFFER_VOID':
          if (e.teamId === user) add(e, `Offer to ${name(e.playerId)} withdrawn`, 'You no longer had the cap space or a contract slot when he decided.', false);
          break;
        case 'RE_SIGN':
          if (e.teamId === user && !e.auto) add(e, `Re-signed: ${name(e.playerId)}`, `${U.money(e.capHit)} × ${e.years} year${e.years > 1 ? 's' : ''}.`, false);
          break;
        case 'BUYOUT':
          if (e.teamId === user) add(e, `Bought out: ${name(e.playerId)}`, `Dead cap ${U.money(e.terms.amount)} a season through ${seasonLabel(e.terms.toSeason)}.`, false);
          break;
        case 'NEW_SEASON':
          add(e, `Training camp opens: ${seasonLabel(e.season)}`, 'Rosters are set for camp; the schedule is out.', true);
          break;
        case 'PLAYOFFS_START':
          add(e, e.qualified ? 'You made the playoffs!' : 'Eliminated from playoff contention',
              e.qualified ? `${team(user)} open as ${s.playoffs.labels[user]}.` : 'Your season is over. The playoffs continue without you.', true);
          break;
        case 'SERIES':
          if (mine(e.winner) || mine(e.loser)) {
            const won = mine(e.winner);
            add(e, won ? `Series won: ${Playoffs.roundName(e.round)}` : `Eliminated in the ${Playoffs.roundName(e.round).toLowerCase()}`,
                `${team(e.winner)} defeat ${team(e.loser)} ${e.wins}.`, true);
          }
          break;
        case 'CHAMPION':
          add(e, mine(e.teamId) ? 'CHAMPIONS!' : `${team(e.teamId)} win the championship`, `${team(e.teamId)} defeat ${team(e.finalistId)} in the final.`, true);
          break;
        case 'SEASON_END':
          add(e, `The ${seasonLabel(e.season)} season is complete`, 'Season awards are posted. Next: player development, retirements and the draft lottery, then the draft.', true);
          break;
        case 'CALENDAR':
          add(e, e.title, e.id === 'TRADE_DEADLINE' ? 'Trades are closed for the rest of the season. They reopen the day after the final.' : '', false);
          break;
        case 'TRADE': {
          const r = s.history.trades.find(x => x.id === e.tradeId);
          if (!r) break;
          const [a, b] = r.teams;
          if (r.teams.includes(user)) {
            const them = a === user ? b : a;
            add(e, `Trade with the ${team(them)}`, `You get: ${Trade.describe(s, r, them)}. You give: ${Trade.describe(s, r, user)}.`, false);
          } else if ([...r.give[a].players, ...r.give[b].players].some(x => x[3] >= 80) || [...r.give[a].picks, ...r.give[b].picks].some(x => x[2] === 1)) {
            add(e, `Trade: ${s.teams[a].abbrev} and ${s.teams[b].abbrev}`, `${team(a)} get ${Trade.describe(s, r, b)}. ${team(b)} get ${Trade.describe(s, r, a)}.`, false);
          }
          break;
        }
        case 'MILESTONE':
        case 'RECORD':
          if (e.teamId === user && e.playerId) add(e, e.kind === 'RECORD' ? `Record: ${name(e.playerId)}` : `Milestone: ${name(e.playerId)}`,
            e.kind === 'RECORD' ? `${Records.LABEL[e.stat]} (single ${e.scope === 'career' ? 'career' : e.scope}): ${Records.fmt(e.stat, e.value)}.` : e.scope === 'season' ? `${e.value} ${Records.LABEL[e.stat]} this season.` : `Career ${Records.LABEL[e.stat]}: ${e.value}.`, false);
          break;
        case 'HOF':
          add(e, `Hall of Fame: ${e.row.name}`, `Inducted: ${e.row.reasons.join(', ')}.`, false);
          break;
        case 'TRADE_OFFER': {
          const o = s.pending.tradeOffers.find(x => x.id === e.offerId);
          if (o) add(e, `Trade offer from the ${team(e.teamId)}`, `They offer ${Trade.describeDeal(s, o.deal, e.teamId)} for ${Trade.describeDeal(s, o.deal, user)}. Open the Trades page to respond (expires ${o.expires}).`, true);
          break;
        }
        default:
      }
    }
    if (s.inbox.length > CONFIG.inboxMax) s.inbox.splice(0, s.inbox.length - CONFIG.inboxMax);
    News.post(s, events);
    return out;
  }

  const userPicks = s => (s.draft ? s.draft.picks.filter(pk => !pk.playerId && Draft.ownerOf(s, pk) === s.meta.userTeamId).map(pk => pk.overall) : []);

  // ── "Advance 1 Day" (BLUEPRINT §2.2) ──────────────────────────────────────
  function advanceDay(s, rng) {
    const today = s.calendar.date, phase = s.calendar.phase;
    const events = [];
    // 1. Morning: in-season roster moves (waivers, IR, call-ups, tryouts) for every org; the draft; free agency.
    if (IN_SEASON.includes(phase)) Roster.dailyMoves(s, rng, today, events);

      const { userOnClock } = Draft.run(s, events);
      if (userOnClock) {
        const messages = post(s, events), pk = Draft.current(s);
        return { ok: false, date: today, needs: 'DRAFT', blockers: [`You're on the clock with pick #${pk.overall} (round ${pk.round}): make your selection on the Draft page`], played: [], messages, interrupts: messages.filter(m => m.interrupt) };
      }
    }
    Market.tick(s, rng, today, events);
    Trade.tick(s, rng, today, events);           // strategy reviews, AI-to-AI trades, offers to you
    // 0. Gate: the user's NHL team must be legal if it plays today.
    const user = s.meta.userTeamId;
    const todays = (s.scheduleByDate[today] || []).map(id => s.games[id]).filter(g => !g.played);
    if (todays.some(g => g.homeId === user || g.awayId === user)) {
      const blockers = Roster.problems(s, user);
      if (blockers.length) { const messages = post(s, events); return { ok: false, date: today, blockers, played: [], messages, interrupts: messages.filter(m => m.interrupt) }; }
    }
    // 2. Games.
    const played = [], playedToday = new Set();
    for (const g of todays) {
      const box = Sim.playGame(s, g.id, rng);
      Condition.afterGame(s, g, box, rng, events);
      Records.afterGame(s, g, box, events);       // feats, milestones, records, streaks (Phase 6)
      for (const id of Object.keys(box.skaters)) playedToday.add(id);
      for (const x of box.goalies) playedToday.add(x.id);

    // 4. Calendar events (trade deadline, …).
    Calendar.fireEvents(s, today, events);
    // 5. Advance the date and check for a phase change.
    s.calendar.date = U.addDays(today, 1);
    s.calendar.dayIndex++;
    checkTransition(s, rng, events);
    // 6. Inbox.
    const messages = post(s, events);
    return { ok: true, date: today, played, messages, interrupts: messages.filter(m => m.interrupt) };
  }

  return { PHASES, LABELS, IN_SEASON, regularSeasonDone, checkTransition, advanceDay, post, seasonLabel, userPicks };
})();

// ════════════════════════════════════════════════════════════════════════════
// §21 Trade — the AI GM (BLUEPRINT §5): asset values, packages and acceptance, legality, the strategy classifier,
//     AI-to-AI trading (an arbitrage search), offers to the user, and executing a deal.
//     A deal is { teams: [a, b], give: { [a]: { players, picks, retain }, [b]: { … } } }: give[x] lists what team x

const Trade = (() => {
  const T = CONFIG.trade, C = CONFIG.cap, H = CONFIG.trade.horizon;
  const ZERO = { truncNormal: () => 0 };

  const name = p => Select.fullName(p);

  const deadline = s => U.seasonDate(s.calendar.season, DEADLINE_MMDD);
  const inSeason = s => Season.IN_SEASON.includes(s.calendar.phase);
  const daysToDeadline = s => (inSeason(s) && !s.flags.tradesLocked ? U.daysBetween(s.calendar.date, deadline(s)) : null);

  let memo = null, projMemo = { s: null, key: '', map: new Map() };

  }
  function after(s, deal, org, fn) {

    const mine = [...r.nhl, ...r.ahl].map(id => s.players[id]).filter(p => !outIds.has(p.id) && p.contract && p.contract.type !== 'PTO');
    const incoming = deal.give[other(deal, org)].players.map(id => s.players[id]).filter(p => p.contract && p.contract.type !== 'PTO');

  // Every reason the deal can't happen (empty = legal).

    const [a, b] = deal.teams;
    if (!a || !b || a === b || !s.teams[a] || !s.teams[b] || s.teams[a].league !== 'NHL' || s.teams[b].league !== 'NHL') return ['A trade needs two different NHL teams'];
    const out = [], all = [...assetsOf(deal.give[a]), ...assetsOf(deal.give[b])];
    if (!all.length) return ['The trade is empty'];
    if (new Set(all.map(keyOf)).size !== all.length) out.push('An asset is listed twice');
    const season = capSeason(s);
    for (const org of deal.teams) {
      const g = deal.give[org], dest = other(deal, org), ab = s.teams[org].abbrev;
      if (count(g) > T.maxAssets) out.push(`${ab} can send at most ${T.maxAssets} assets`);
      for (const x of assetsOf(g)) { const pr = assetProblem(s, org, x, dest); if (pr) out.push(pr); }
      const ret = Object.entries(g.retain);
      for (const [id, pct] of ret) {
        const p = s.players[id];
        if (!p || !g.players.includes(id)) { out.push('Salary can only be retained on a player you send'); continue; }
        if (!p.contract || Contracts.contractIn(p, season) !== p.contract) { out.push(`${name(p)} has no cap hit to retain`); continue; }
        if (pct > T.retain.maxPct + 1e-9 || Contracts.retainedShare(s, id, season) + pct > T.retain.maxPct + 1e-9) out.push(`At most ${T.retain.maxPct * 100}% of ${name(p)}'s cap hit can be retained`);
      }
      if (ret.length && Contracts.activeRetained(s.teams[org], season).length + ret.length > T.retain.maxContracts) out.push(`${ab} can retain salary on at most ${T.retain.maxContracts} contracts`);
    }
    if (out.length) return out;
    for (const org of deal.teams) {
      const ab = s.teams[org].abbrev, cap = capCheck(s, deal, org);
      if (cap.after > cap.ceiling && cap.after > cap.before) out.push(`${ab} would be ${U.money(cap.after - cap.ceiling)} over the cap`);
      const n = after(s, deal, org, () => true);
      if (n > CONFIG.roster.contractMax && n > Contracts.contractCount(s, org)) out.push(`${ab} would have ${n} contracts (max ${CONFIG.roster.contractMax})`);
      if (inSeason(s) && after(s, deal, org, p => p.position === 'G') < T.minGoalies) out.push(`${ab} must keep ${T.minGoalies} goalies under contract`);

  }

  // ── The strategy classifier (§5.4) ──
  // Strength = the lineup index (CONFIG.depth) of each org's players under contract; P(home win) is a logistic in
  // the strength gap, fitted to simulated seasons. Playoff odds come from simulating the rest of the season (in
  // the summer, a full schedule) CONFIG.trade.classify.sims times.
  function coreAge(s, org, season) {
    const t = s.teams[org], ps = [...t.roster.nhl, ...t.roster.ahl].map(id => s.players[id]).filter(p => Contracts.contractIn(p, season));
    const top = (g, n) => ps.filter(p => Roster.group(p) === g).sort((a, b) => b.ovr - a.ovr).slice(0, n);
    const core = [...top('F', 6), ...top('D', 4), ...top('G', 1)];
    return core.length ? U.mean(core.map(p => U.seasonAge(p.birthDate, season))) : 27;
  }
  function classify(s, { force = false, events = null } = {}) {
    const K = T.classify, date = s.calendar.date, teams = Select.nhlTeams(s), n = teams.length, season0 = capSeason(s);
    const str = {};
    for (const t of teams) str[t.id] = Market.strength(Market.orgDepth(s, t.id, season0));
    const rng = RNG.bind({ rngState: U.hashString(`${s.meta.seed}:${date}:classify`) });
    const reg = Object.values(s.games).filter(g => g.league === 'NHL' && g.type === 'REG' && g.season === s.calendar.season);
    const live = inSeason(s) && reg.length > 0;
    const games = live ? reg.filter(g => !g.played) : Calendar.nhlMatchups(s, rng);
    const idx = Object.fromEntries(teams.map((t, i) => [t.id, i]));
    const base = teams.map(t => (live ? t.record.pts : 0));
    const hi = games.map(g => idx[g.homeId]), ai = games.map(g => idx[g.awayId]);
    const pw = games.map(g => 1 / (1 + Math.exp(-(K.win.home + K.win.perPoint * (str[g.homeId] - str[g.awayId])))));
    const divs = {}, confs = {};
    teams.forEach((t, i) => { const d = `${t.conference}|${t.division}`; (divs[d] = divs[d] || []).push(i); (confs[t.conference] = confs[t.conference] || new Set()).add(d); });
    const made = new Array(n).fill(0), total = new Array(n).fill(0), pts = new Array(n);
    const P = CONFIG.playoffs;
    for (let k = 0; k < K.sims; k++) {
      for (let i = 0; i < n; i++) pts[i] = base[i] + rng.next() * 0.5;          // the fraction breaks ties
      for (let j = 0; j < games.length; j++) {
        const ot = rng.next() < K.otShare;
        if (rng.next() < pw[j]) { pts[hi[j]] += 2; if (ot) pts[ai[j]] += 1; } else { pts[ai[j]] += 2; if (ot) pts[hi[j]] += 1; }
      }
      for (const set of Object.values(confs)) {
        const rest = [];
        for (const d of set) { const sorted = [...divs[d]].sort((x, y) => pts[y] - pts[x]); sorted.slice(0, P.divisionSpots).forEach(i => made[i]++); rest.push(...sorted.slice(P.divisionSpots)); }
        rest.sort((x, y) => pts[y] - pts[x]).slice(0, P.wildCards).forEach(i => made[i]++);
      }
      for (let i = 0; i < n; i++) total[i] += pts[i];
    }
    const byStrength = [...teams].sort((a, b) => str[b.id] - str[a.id] || (a.id < b.id ? -1 : 1)).map(t => t.id);
    const Hy = K.hysteresis;
    for (const t of teams) {
      const x = t.ai, i = idx[t.id], odds = made[i] / K.sims, rank = byStrength.indexOf(t.id) + 1, core = coreAge(s, t.id, season0);
      const h = x.reviewedOn ? 1 : 0, cur = x.strategy, isC = cur === 'CONTENDER', isR = cur === 'REBUILD';
      const contender = odds >= K.contender.odds + h * (isC ? -Hy.odds : Hy.odds) && rank <= K.contender.rank + h * (isC ? Hy.rank : 0);
      const rebuild = odds <= K.rebuild.odds + h * (isR ? Hy.odds : -Hy.odds) || (rank > n - K.rebuild.rank - h * (isR ? Hy.rank : 0) && core > K.rebuild.coreAge);
      const next = contender ? 'CONTENDER' : rebuild ? 'REBUILD' : 'BUBBLE';
      const locked = !force && x.strategyLockedUntil && date < x.strategyLockedUntil;
      if (next !== cur && !locked) {
        if (events && x.reviewedOn) events.push({ kind: 'STRATEGY', date, teamId: t.id, from: cur, to: next });
        x.strategy = next; x.strategyLockedUntil = U.addDays(date, K.lockDays);
      }
      Object.assign(x, { odds: U.round(odds, 3), projPts: U.round(total[i] / K.sims, 1), rating: U.round(str[t.id], 2), rank, coreAge: U.round(core, 1), reviewedOn: date });
    }
    s.flags.nextStrategyReview = U.addDays(date, K.everyDays);
    reset();
  }

  // ── Executing a deal ──
  // Players keep their level (NHL, AHL, unsigned); an NHL player joining a full active roster in-season reports
  // to the AHL. Afterwards AI orgs (and yours, with auto-manage on) fix their rosters and lines.
  function execute(s, deal, date, events, { via = 'AI', rng = null } = {}) {
    const [x, y] = deal.teams, ratedSeason = Contracts.ratedSeason(s);
    const vals = Object.fromEntries(deal.teams.map(org => { const ctx = context(s, org), v = values(s, ctx, deal); return [org, { vin: U.round(v.vin, 1), vout: U.round(v.vout, 1), strategy: ctx.strategy }]; }));
    const record = { id: U.nextId(s, 'trade', 't_', 5), date, season: s.calendar.season, teams: [x, y], via, values: vals, give: {} };
    const moving = [];
    for (const org of deal.teams) {
      const g = deal.give[org], to = other(deal, org), r = s.teams[org].roster;
      record.give[org] = sideSummary(s, deal, org, ratedSeason);
      for (const id of g.players) {
        const p = s.players[id], level = levelOf(s, p);
        r[level] = r[level].filter(z => z !== id);
        moving.push({ p, level, to });

      for (const id of g.picks) s.draftPicks[id].ownerTeamId = to;
      for (const [id, pct] of Object.entries(g.retain)) {
        const p = s.players[id];

      }
    }
    for (const { p, level, to } of moving) {
      let dest = level;

      s.teams[to].roster[dest].push(p.id);
      if (dest === 'ahl') { p.assignment = 'AHL'; p.rosterStatus = 'ACTIVE'; }

      p.teamId = to; p.tradedOn = date; delete p.emergencyRecall;

    }
    s.history.trades.push(record);
    reset();
    for (const org of deal.teams) settle(s, org, date, rng, events);
    expireOffers(s, date);

  }
  function settle(s, org, date, rng, events) {
    const user = s.meta.userTeamId;

      if (org !== user || s.settings.autoRoster !== false) { Roster.fixNHL(s, org, date, moves, rng); Roster.ensureCap(s, org, date, moves); }
      if (rng) Roster.fixAHL(s, rng, org, date, moves);           // the farm team must still dress a lineup tonight
      if (org === user) for (const [type, p] of moves) events.push({ kind: 'ROSTER', date, type, playerId: p.id, teamId: org, auto: true });
      Roster.refreshLines(s, org);
    } else if (org !== user) Roster.offseasonSort(s, org);
    reset();
  }

  // ── Building a deal (§5.4 steps 2–4) ──
  const recentlyTraded = (s, a) => a.type === 'player' && s.players[a.id].tradedOn && U.daysBetween(s.players[a.id].tradedOn, s.calendar.date) < T.ai.noFlipDays;

    }
    for (const pk of m.picksBy.get(org) || []) if (!targets || pk.round <= T.ai.maxTargetRound) out.push({ type: 'pick', id: pk.id });
    return out;
  }

  // An AI team gives up at most one star (OVR ≥ starOvr) per trade, and (unless it's rebuilding) at most one core
  // player, one who fills a top slot. Multi-star blockbusters are left to you.
  function canAdd(s, deal, giver, ctx) {

    const core = id => needMult(ctx, s.players[id]) === T.need.top, star = id => s.players[id].ovr >= T.ai.starOvr;
    const sent = deal.give[giver].players;

  // `giver` adds assets until `recv` accepts: the cheapest single asset that does it (by the giver's own values),
  // or a greedy package of the assets the receiver values most relative to the giver, whichever costs the giver
  // less. The giver never lets its own gain go negative (unless `free`: you decide for yourself).
  function sweeten(s, deal, giver, ctx, mult, { maxAssets, free = false, avoidRecent = true }) {
    const recv = other(deal, giver), room = maxAssets - count(deal.give[giver]);

    const short = r0.vout + Math.max(T.margin.min, T.margin.pct * r0.vout) * mult[recv] - r0.vin;
    if (!greedy && add.length && cands.find(c => c.a === add[0]).vr >= T.ai.minProgress * short) greedy = { add: add.slice(0, 1), cost: Infinity, done: false };
    const pick = single && (!greedy || !greedy.done || single.cost <= greedy.cost) ? single : greedy;

  }

  // The team over the cap gets relief: its partner keeps up to half of the salary it sends (AI partners only),
  // or it sends a contract back (the one it values least that covers the overage).
  function fixCap(s, deal, ctx, { maxAssets }) {
    const season = capSeason(s), user = s.meta.userTeamId;
    for (const org of deal.teams) {

      if (!(cap.after > cap.ceiling && cap.after > cap.before)) continue;
      const over = cap.after - cap.ceiling, partner = other(deal, org), sent = deal.give[partner];
      if (partner !== user) {
        const slots = T.retain.maxContracts - Contracts.activeRetained(s.teams[partner], season).length - Object.keys(sent.retain).length;
        const p = sent.players.map(id => s.players[id]).filter(q => q.contract && Contracts.contractIn(q, season) === q.contract && !sent.retain[q.id]
          && q.contract.expiresAfterSeason - season < T.retain.aiMaxYears)
          .sort((a, b) => b.contract.capHit - a.contract.capHit)[0];
        if (p && slots > 0 && !Object.keys(sent.retain).length) {        // one retained contract per side
          const room = T.retain.maxPct - Contracts.retainedShare(s, p.id, season), steps = T.retain.steps.filter(x => x <= room + 1e-9);
          const pct = steps.find(x => p.contract.capHit * x >= over) || steps[steps.length - 1];

        }

      const allowed = canAdd(s, deal, org, ctx[org]);
      const fill = tradeable(s, org).filter(a => a.type === 'player' && !has(deal, a) && allowed(a) && !assetProblem(s, org, a, partner) && s.teams[org].roster.nhl.includes(a.id))
        .map(a => ({ a, v: value(s, ctx[org], a), cap: (Contracts.contractIn(s.players[a.id], season) || { capHit: 0 }).capHit })).filter(x => x.cap > 0);
