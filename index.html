  // A wants `target` from B: balance the values (whichever side is unhappy gets more), then make it cap-legal.
  // Returns a legal deal both sides accept, or null. Options: `deal` to start from, `freeA` (A's acceptance is
  // its own business: the user asking "what would it take?"), `lockB` (B never adds value).
  function negotiate(s, A, B, target, { deal: start = null, freeA = false, lockB = false, maxAssets = T.ai.maxAssets } = {}) {
    const deal = start ? clone(start) : makeDeal(A, B);
    if (target && !has(deal, target)) addAsset(deal, B, target);
    const ctx = { [A]: context(s, A), [B]: context(s, B) };
    const mult = { [A]: marginMult(s, deal, A), [B]: marginMult(s, deal, B) };
    const verdict = org => { const v = values(s, ctx[org], deal); return judge(v.vin, v.vout, mult[org]); };
    for (let step = 0; step < T.ai.steps; step++) {
      const okA = freeA || verdict(A).accept, okB = verdict(B).accept;
      if (okA && okB) {
        const probs = legality(s, deal);
        if (!probs.length) return deal;
        if (!probs.some(p => / over the cap$/.test(p)) || !fixCap(s, deal, ctx, { maxAssets })) return null;
        continue;
      }
      const giver = okB ? B : A;
      if (giver === B && lockB) return null;
      const add = sweeten(s, deal, giver, ctx, mult, { maxAssets, free: giver === A && freeA });
      if (!add) return null;
      for (const a of add) addAsset(deal, giver, a);
    }
    return null;
  }

  // One AI team looks for a deal (§5.4). A buyer (contender or bubble team) shops for players elsewhere who'd make
  // its lineup; a seller (rebuilder) shops its veterans to the buyers who'd value them most. Each candidate
  // is ranked by the disagreement gap (the buyer's value minus the owner's), weighted toward partners on the other
  // side of the market; one of the best is chosen and the buyer builds the offer. Offers to the user are made the
  // same way (`only` = the user's team).
  const roleOf = strategy => (strategy === 'REBUILD' ? 'SELL' : 'BUY');
  function partnerWeight(a, b) {
    const W = T.ai.partnerWeight;
    if (a === b) return a === 'BUBBLE' ? W.bubbles : 0;
    return a === 'BUBBLE' || b === 'BUBBLE' ? W.bubble : W.opposite;
  }
  // A buyer's need: a player who'd make its lineup (better than someone it dresses now).
  const wouldDress = (s, ctx, a) => a.type === 'player' && needMult(ctx, s.players[a.id]) >= T.need.dress;
  const stats = { attempts: 0, noCandidates: 0, failed: 0, trades: 0, offers: 0 };     // diagnostics for tests/report_trades.js
  function attempt(s, rng, org, date, events, { only = null } = {}) {
    const user = s.meta.userTeamId, ctxA = context(s, org), cands = [];
    stats.attempts++;
    const partners = Select.nhlTeams(s).filter(t => t.id !== org && (only ? t.id === only : t.id !== user));
    const consider = (buyer, seller, a, ctxBuy, ctxSell) => {
      if ((seller !== user && recentlyTraded(s, a)) || assetProblem(s, seller, a, buyer) || !wouldDress(s, ctxBuy, a)) return;
      const vBuy = value(s, ctxBuy, a);
      if (vBuy < T.ai.minValue) return;
      const vSell = value(s, ctxSell, a), gap = vBuy - vSell;
      const w = partnerWeight(ctxBuy.strategy, ctxSell.strategy);
      if (w > 0 && gap > T.ai.minGap && gap >= T.ai.minRelGap * Math.max(vSell, T.ai.minValue)) cands.push({ a, buyer, seller, score: gap * w });
    };
    if (roleOf(ctxA.strategy) === 'BUY') {
      for (const t of partners) { const ctxB = context(s, t.id); for (const a of tradeable(s, t.id, { targets: true })) consider(org, t.id, a, ctxA, ctxB); }
    } else {
      const vets = tradeable(s, org, { targets: true }).filter(a => a.type === 'player' && U.seasonAge(s.players[a.id].birthDate, ctxA.season0) >= T.ai.vetAge);
      for (const t of partners) { const ctxB = context(s, t.id); if (roleOf(ctxB.strategy) === 'BUY') for (const a of vets) consider(t.id, org, a, ctxB, ctxA); }
    }
    if (!cands.length) { stats.noCandidates++; return null; }
    cands.sort((x, y) => y.score - x.score);
    const top = cands.slice(0, T.ai.targets), pick = top[rng.weightedIndex(top.map(x => x.score))];
    const deal = negotiate(s, pick.buyer, pick.seller, pick.a);
    if (!deal) { stats.failed++; return null; }
    token(s, deal);
    if (deal.teams.includes(user)) { stats.offers++; return makeOffer(s, org, deal, date, events); }
    stats.trades++;
    return execute(s, deal, date, events, { via: 'AI', rng });
  }
  // Nobody trades for nothing: a side that sends no assets adds its least valuable pick (a late-round "token").
  function token(s, deal) {
    for (const org of deal.teams) {
      if (count(deal.give[org])) continue;
      const ctx = context(s, org);
      const pk = tradeable(s, org).filter(a => a.type === 'pick' && !has(deal, a)).map(a => ({ a, v: value(s, ctx, a), pk: s.draftPicks[a.id] }))
        .sort((x, y) => x.v - y.v || y.pk.round - x.pk.round || y.pk.year - x.pk.year)[0];
      if (pk && !legality(s, { ...deal, give: { ...deal.give, [org]: { ...deal.give[org], picks: [pk.a.id] } } }).length) addAsset(deal, org, pk.a);
    }
  }

  // ── Offers to the user ──
  function offerAllowed(s, date) {
    const O = T.offers, last = s.flags.lastTradeOfferOn;
    if (s.pending.tradeOffers.length >= O.maxPending) return false;
    return !last || U.daysBetween(last, date) >= (deadlineWindow(s) ? O.deadlineGapDays : O.gapDays);
  }
  function makeOffer(s, from, deal, date, events) {
    const id = U.nextId(s, 'tradeOffer', 'to_', 5);
    let expires = U.addDays(date, T.offers.expireDays);
    if (inSeason(s) && date <= deadline(s) && expires > deadline(s)) expires = deadline(s);
    s.pending.tradeOffers.push({ id, fromTeamId: from, date, expires, deal });
    s.flags.lastTradeOfferOn = date;
    events.push({ kind: 'TRADE_OFFER', date, offerId: id, teamId: from, playerId: deal.give[s.meta.userTeamId].players[0] || null });
    return { offer: id };
  }
  // Offers lapse on their expiry date, at the deadline, or when an asset in them has moved.
  function expireOffers(s, date) {
    s.pending.tradeOffers = s.pending.tradeOffers.filter(o => isOpen(s) && o.expires >= date
      && o.deal.teams.every(org => assetsOf(o.deal.give[org]).every(a => !assetProblem(s, org, a, other(o.deal, org)))));
  }
  function acceptOffer(s, id, date, events, rng) {
    const o = s.pending.tradeOffers.find(x => x.id === id);
    if (!o) throw new Error('That offer is no longer available');
    s.pending.tradeOffers = s.pending.tradeOffers.filter(x => x.id !== id);
    const ev = evaluate(s, o.fromTeamId, o.deal);
    if (ev.problems.length) throw new Error(ev.problems[0]);
    if (!ev.accept) throw new Error(`${s.teams[o.fromTeamId].abbrev} have changed their minds`);
    return execute(s, o.deal, date, events, { via: 'OFFER', rng });
  }
  const declineOffer = (s, id) => { s.pending.tradeOffers = s.pending.tradeOffers.filter(x => x.id !== id); };

  // ── The user's side ──
  const partnerOf = (s, deal) => {
    const user = s.meta.userTeamId;
    if (!deal.teams.includes(user)) throw new Error('Your team must be part of the trade');
    return other(deal, user);
  };
  // Everything the trade screen shows: legality, the partner's verdict, both payrolls.
  function preview(s, deal) {
    deal = normalize(deal);
    const ai = partnerOf(s, deal), ev = evaluate(s, ai, deal);
    const cap = Object.fromEntries(deal.teams.map(org => [org, capCheck(s, deal, org)]));
    return { ...ev, partner: ai, cap, reply: reply(ev) };
  }
  const reply = ev => (ev.problems.length ? ev.problems[0] : ev.accept ? 'They would accept this trade.'
    : ev.interest >= 0.9 ? 'Close: they want a little more.' : ev.interest >= 0.6 ? 'They want more in return.' : 'Not interested.');
  function propose(s, deal, date, events, rng) {
    deal = normalize(deal);
    const ai = partnerOf(s, deal), ev = evaluate(s, ai, deal);
    if (!ev.accept) return { accepted: false, reason: reply(ev), interest: ev.interest };
    return { accepted: true, record: execute(s, deal, date, events, { via: 'USER', rng }), interest: ev.interest };
  }
  // "What would it take?": add your assets (the ones they value most relative to you) until they'd accept.
  function suggest(s, deal) {
    deal = normalize(deal);
    const ai = partnerOf(s, deal), user = s.meta.userTeamId;
    return negotiate(s, user, ai, null, { deal, freeA: true, lockB: true, maxAssets: T.maxAssets });
  }
  // The most AI team A would give you for `target`: it adds what your staff value most relative to its own cost
  // while it still wants the deal, stopping once your staff would call it fair. Null if A doesn't want him.
  function bestOffer(s, A, target) {
    const B = s.meta.userTeamId, deal = makeDeal(A, B);
    addAsset(deal, B, target);
    const ctx = { [A]: context(s, A), [B]: context(s, B) }, mult = { [A]: marginMult(s, deal, A), [B]: T.margin.ai };
    const verdict = org => { const v = values(s, ctx[org], deal); return judge(v.vin, v.vout, mult[org]); };
    if (!verdict(A).accept) return null;
    for (let step = 0; step < T.ai.maxAssets && !verdict(B).accept; step++) {
      const allowed = canAdd(s, deal, A, ctx[A]), a0 = values(s, ctx[A], deal);
      const cands = tradeable(s, A).filter(a => !has(deal, a) && allowed(a) && !assetProblem(s, A, a, B))
        .map(a => ({ a, vb: value(s, ctx[B], a), va: value(s, ctx[A], a) })).filter(c => c.vb > 0)
        .sort((x, y) => y.vb / Math.max(y.va, 1) - x.vb / Math.max(x.va, 1));
      const next = cands.find(c => judge(a0.vin, packageValue([...a0.outs, c.va]), mult[A]).accept);
      if (!next) break;
      addAsset(deal, A, next.a);
    }
    for (let k = 0; k < 3 && legality(s, deal).some(p => / over the cap$/.test(p)); k++) if (!fixCap(s, deal, ctx, { maxAssets: T.maxAssets })) break;
    return count(deal.give[A]) && !legality(s, deal).length && verdict(A).accept ? deal : null;
  }
  // "Shop a player": each AI team's best offer for one of your players, the best (by your staff's values) first.
  function shop(s, playerId, { limit = 6 } = {}) {
    const user = s.meta.userTeamId, a = { type: 'player', id: playerId };
    const pr = assetProblem(s, user, a);
    if (pr) throw new Error(pr);
    const out = [];
    for (const t of Select.nhlTeams(s)) {
      if (t.id === user || assetProblem(s, user, a, t.id)) continue;
      const deal = bestOffer(s, t.id, a);
      if (!deal) continue;
      const v = values(s, context(s, user), deal);
      out.push({ teamId: t.id, deal, gain: v.vin - v.vout, fair: judge(v.vin, v.vout, T.margin.ai).accept });
    }
    return out.sort((x, y) => y.gain - x.gain).slice(0, limit);
  }

  // ── The daily tick ──
  function activity(s) {
    const A = T.ai, ph = s.calendar.phase;
    if (deadlineWindow(s)) return A.deadlineMult;
    if (EARLY.includes(ph)) return A.draftMult;
    if (ph === 'FREE_AGENCY' && U.daysBetween(`${s.calendar.season}-07-01`, s.calendar.date) < A.faDays) return A.faMult;
    return 1;
  }
  function tick(s, rng, date, events) {
    if (!s.flags.nextStrategyReview || date >= s.flags.nextStrategyReview) classify(s, { events });
    expireOffers(s, date);
    if (!isOpen(s)) return;
    const user = s.meta.userTeamId, mult = activity(s), ai = Select.nhlTeams(s).filter(t => t.id !== user);
    for (const t of rng.shuffle(ai.slice())) if (rng.next() < T.ai.dailyChance * mult) attempt(s, rng, t.id, date, events);
    if (rng.next() < T.offers.dailyChance * mult && offerAllowed(s, date)) {
      const from = rng.shuffle(ai.filter(t => !s.pending.tradeOffers.some(o => o.fromTeamId === t.id))).slice(0, T.offers.tries);
      for (const t of from) if (attempt(s, rng, t.id, date, events, { only: user })) break;
    }
  }

  // A side of a deal as plain data for the trade log: players [id, name, pos, ovr, age], picks [id, year, round, original team].
  const sideSummary = (s, deal, org, ratedSeason = Contracts.ratedSeason(s)) => {
    const g = deal.give[org];
    return { players: g.players.map(id => { const p = s.players[id]; return [id, name(p), p.position, p.ovr, U.seasonAge(p.birthDate, ratedSeason)]; }),
             picks: g.picks.map(id => { const pk = s.draftPicks[id]; return [id, pk.year, pk.round, pk.originalTeamId]; }), retain: { ...g.retain } };
  };
  const describeDeal = (s, deal, org) => describe(s, { give: { [org]: sideSummary(s, deal, org) } }, org);
  // Short text for an inbox message or a log row: "Jane Doe (C, 84), 2027 1st (MTL)".
  function describe(s, record, org) {
    const g = record.give[org], ab = id => (s.teams[id] ? s.teams[id].abbrev : id);
    const rd = r => ['1st', '2nd', '3rd'][r - 1] || `${r}th`;
    const items = [...g.players.map(([id, nm, pos, ovr]) => `${nm} (${pos}, ${ovr})${g.retain[id] ? ` [${Math.round(g.retain[id] * 100)}% retained]` : ''}`),
                   ...g.picks.map(([, year, round, orig]) => `${year} ${rd(round)}${orig !== org ? ` (${ab(orig)})` : ''}`)];
    return items.join(', ') || 'nothing';
  }

  return { isOpen, deadline, daysToDeadline, deadlineWindow, capSeason, SV, costOf, sigmaOf, packageValue, strategyOf, context,
           playerValue, retainValue, pickValue, projectedSlot, value, assetValue, makeDeal, normalize, other, values, judge, evaluate,
           assetProblem, capCheck, legality, classify, execute, tradeable, sweeten, negotiate, attempt, offerAllowed, makeOffer,
           expireOffers, acceptOffer, declineOffer, preview, propose, suggest, shop, tick, sideSummary, describe, describeDeal, reset, stats };
})();

// ════════════════════════════════════════════════════════════════════════════
// §22 Integrity — structural invariants. Returns a list of problems (empty = healthy).
// ════════════════════════════════════════════════════════════════════════════

const Integrity = {
  check(s) {
    const errs = [];
    const seen = new Map();
    const LIST_ASSIGNMENTS = { nhl: ['NHL'], ahl: ['AHL'], reserve: ['JUNIOR', 'EUROPE'] };
    if (!Number.isInteger(s.meta.rngState)) errs.push('meta.rngState is not an integer');
    if (!s.teams[s.meta.userTeamId]) errs.push(`userTeamId ${s.meta.userTeamId} does not exist`);

    for (const [key, t] of Object.entries(s.teams)) {
      if (t.id !== key) errs.push(`team key ${key} ≠ id ${t.id}`);
      if (t.league === 'AHL') {
        const parent = s.teams[t.parentId];
        if (!parent || parent.affiliateId !== t.id) errs.push(`AHL team ${t.id} has a broken parent link`);
        continue;
      }
      if (!s.teams[t.affiliateId]) errs.push(`${t.id} affiliate ${t.affiliateId} missing`);
      for (const [list, allowed] of Object.entries(LIST_ASSIGNMENTS)) {
        for (const id of t.roster[list]) {
          const p = s.players[id];
          if (!p) { errs.push(`${t.id}.roster.${list} references missing player ${id}`); continue; }
          if (seen.has(id)) errs.push(`player ${id} is listed twice (${seen.get(id)} and ${t.id}.${list})`);
          seen.set(id, `${t.id}.${list}`);
          if (p.teamId !== t.id) errs.push(`player ${id} is on ${t.id}.${list} but teamId = ${p.teamId}`);
          if (!allowed.includes(p.assignment)) errs.push(`player ${id} on ${t.id}.${list} has assignment ${p.assignment}`);
        }
      }
      const active = t.roster.nhl.filter(id => s.players[id] && Roster.isActive(s.players[id])).length;
      if (active > CONFIG.roster.nhlMax && Season.IN_SEASON.includes(s.calendar.phase)) errs.push(`${t.id}: ${active} players on NHL roster (max ${CONFIG.roster.nhlMax})`);   // no limit in the summer
      if ([...t.roster.nhl, ...t.roster.ahl].some(id => !s.players[id])) continue;   // can't total a broken roster
      const contracts = Contracts.contractCount(s, t.id);
      if (contracts > CONFIG.roster.contractMax) errs.push(`${t.id}: ${contracts} contracts (max ${CONFIG.roster.contractMax})`);
      // The cap binds in-season; in the summer payrolls may run up to offseasonOverage over (they must comply by camp).
      const payroll = Contracts.capPayroll(s, t.id), inSeason = Season.IN_SEASON.includes(s.calendar.phase);
      const ceiling = inSeason ? Contracts.capCeiling(s, t.id) : CONFIG.cap.upper * (1 + CONFIG.cap.offseasonOverage);
      if (payroll > ceiling && (inSeason || s.calendar.phase === 'FREE_AGENCY')) errs.push(`${t.id}: payroll ${U.money(payroll)} exceeds its cap ceiling ${U.money(ceiling)}`);
      for (const id of t.roster.ahl) if (s.players[id] && s.players[id].rosterStatus !== 'ACTIVE' && s.players[id].rosterStatus !== undefined) errs.push(`${id} is on the AHL list with status ${s.players[id].rosterStatus}`);
      for (const id of t.roster.nhl) if (s.players[id] && s.players[id].waivers) errs.push(`${id} is on waivers but still on the NHL list`);
    }

    for (const [key, p] of Object.entries(s.players)) {
      if (p.id !== key) errs.push(`player key ${key} ≠ id ${p.id}`);
      const offRoster = p.assignment === 'FA' || p.assignment === 'RETIRED' || p.assignment === 'PROSPECT';
      if (!seen.has(key) && !offRoster) errs.push(`player ${key} (${p.assignment}) is on no roster`);
      if (seen.has(key) && offRoster) errs.push(`player ${key} (${p.assignment}) is still on a roster`);
      if (offRoster && (p.teamId !== null || p.contract)) errs.push(`${p.assignment} player ${key} still has a team or contract`);
      if ((p.assignment === 'JUNIOR' || p.assignment === 'EUROPE') && p.contract) errs.push(`unsigned prospect ${key} has a contract`);
      if ((p.assignment === 'NHL' || p.assignment === 'AHL') && !p.contract) errs.push(`player ${key} (${p.assignment}) has no contract`);
      if (p.extension && (!p.contract || p.extension.expiresAfterSeason <= p.contract.expiresAfterSeason)) errs.push(`player ${key} has an invalid extension`);
      for (const [k, v] of Object.entries(p.attributes)) {
        if (!Number.isInteger(v) || v < CONFIG.attr.min || v > CONFIG.attr.max) errs.push(`player ${key} attribute ${k} = ${v}`);
      }
      if (p.ovr !== Ratings.ovr(p)) errs.push(`player ${key} has stale OVR cache (${p.ovr} vs ${Ratings.ovr(p)})`);
      if (p.contract) {
        if (p.contract.type !== 'PTO' && p.contract.capHit < CONFIG.cap.minSalary) errs.push(`player ${key} cap hit below league minimum`);
        if (p.contract.type === 'PTO' && p.assignment !== 'AHL') errs.push(`player ${key} on a tryout but not in the AHL`);
        if (p.contract.yearsRemaining < 1) errs.push(`player ${key} contract has ${p.contract.yearsRemaining} years remaining`);
      }
    }
    for (const pk of Object.values(s.draftPicks)) {
      if (!s.teams[pk.ownerTeamId] || !s.teams[pk.originalTeamId]) errs.push(`draft pick ${pk.id} references a missing team`);
      else if (s.teams[pk.ownerTeamId].league !== 'NHL') errs.push(`draft pick ${pk.id} is owned by a non-NHL team`);
    }
    // Retained salary: at most 50% of a contract, at most three contracts per team (CONFIG.trade.retain).
    const retainedPct = {};
    for (const t of Object.values(s.teams)) {
      if (t.league !== 'NHL') continue;
      const active = Contracts.activeRetained(t, s.calendar.season);
      if (active.length > CONFIG.trade.retain.maxContracts) errs.push(`${t.id} retains salary on ${active.length} contracts`);
      for (const r of active) {
        retainedPct[r.playerId] = (retainedPct[r.playerId] || 0) + r.pct;
        if (!(r.capHit > 0) || !(r.pct > 0)) errs.push(`${t.id} has an invalid retained-salary entry for ${r.playerId}`);
      }
    }
    for (const [id, pct] of Object.entries(retainedPct)) if (pct > CONFIG.trade.retain.maxPct + 1e-9) errs.push(`${id} has ${Math.round(pct * 100)}% of his cap hit retained`);
    for (const o of s.pending.tradeOffers) {
      if (!s.teams[o.fromTeamId] || !o.deal || !Array.isArray(o.deal.teams) || !o.deal.teams.includes(s.meta.userTeamId) || !o.deal.teams.includes(o.fromTeamId)) errs.push(`trade offer ${o.id} is malformed`);
    }
    for (const o of s.pending.faOffers) {
      if (!s.players[o.playerId] || s.players[o.playerId].assignment !== 'FA') errs.push(`offer to ${o.playerId}, who isn't a free agent`);
      if (!s.teams[o.teamId] || s.teams[o.teamId].league !== 'NHL') errs.push(`offer from unknown team ${o.teamId}`);
    }
    for (const w of s.pending.waivers) if (!s.players[w.playerId] || !s.players[w.playerId].waivers) errs.push(`waiver entry for ${w.playerId} without a waived player`);
    if (s.draft && !s.draft.finished) for (const id of s.draft.pool) if (!s.players[id] || s.players[id].assignment !== 'PROSPECT') errs.push(`draft pool lists ${id}, who isn't a prospect`);
    for (const [id, g] of Object.entries(s.games)) {
      const h = s.teams[g.homeId], a = s.teams[g.awayId];
      if (!h || !a) { errs.push(`game ${id} references a missing team`); continue; }
      if (h.league !== g.league || a.league !== g.league) errs.push(`game ${id} mixes leagues`);
      if (!(s.scheduleByDate[g.date] || []).includes(id)) errs.push(`game ${id} missing from scheduleByDate[${g.date}]`);
      if (g.played !== !!g.result) errs.push(`game ${id} played flag and result disagree`);
    }
    for (const [date, ids] of Object.entries(s.scheduleByDate)) {
      for (const id of ids) if (!s.games[id] || s.games[id].date !== date) errs.push(`scheduleByDate[${date}] lists ${id} wrongly`);
    }
    // Lineups are only kept current in-season (they're rebuilt at training camp).
    for (const t of Season.IN_SEASON.includes(s.calendar.phase) ? Object.values(s.teams) : []) {
      if (!t.lineup || !t.lineup.F.length) continue;
      for (const prob of Lineup.validate(s, t.id, t.lineup, { structuralOnly: true })) errs.push(`${t.id} lineup: ${prob}`);
    }
    return errs;
  },
};

// ════════════════════════════════════════════════════════════════════════════
// §23 Persistence — versioned saves. IndexedDB → localStorage → memory, auto-detected.
// ════════════════════════════════════════════════════════════════════════════

const Persistence = (() => {
  const FORMAT = 'hockey-franchise-manager-save';
  // Frozen phase builds (phaseN/phaseN.html) set globalThis.HFM_SAVE_NAMESPACE before game.js loads, so their
  // saves live in a separate IndexedDB database / localStorage prefix and never collide with the current build.
  const NS = typeof globalThis !== 'undefined' && globalThis.HFM_SAVE_NAMESPACE ? String(globalThis.HFM_SAVE_NAMESPACE) : '';
  // MIGRATIONS[n] upgrades a version-n state to version n+1. Add one whenever the schema changes,
  // and bump CONFIG.SAVE_VERSION.
  const MIGRATIONS = {
    // v1 (Phase 1) → v2 (Phase 2): league norms, regulation wins, lastPlayed, and the season schedule + lines.
    1: st => {
      st.norms = st.norms || {};
      for (const t of Object.values(st.teams)) { if (t.record.rw === undefined) t.record.rw = 0; }
      for (const p of Object.values(st.players)) { if (p.condition.lastPlayed === undefined) p.condition.lastPlayed = null; }
      if (!Object.keys(st.games).length) Calendar.buildSeason(st, RNG.bind(st.meta));
      for (const t of Object.values(st.teams)) if (!t.lineup.F.length) t.lineup = Lineup.auto(st, t.id);
      return st;
    },
    // v2 (Phase 2) → v3 (Phase 3): roster automation setting.
    2: st => {
      st.settings = st.settings || {};
      if (st.settings.autoRoster === undefined) st.settings.autoRoster = true;
      if (st.playoffs === undefined) st.playoffs = null;
      return st;
    },
    // v3 (Phase 3) → v4 (Phase 4): the offseason. Buried cap and the CBA-style LTIR relief arrive, dead cap
    // gets seasons, and a save left at SEASON_END (terminal in Phase 3) gets its offseason started.
    3: st => {
      if (st.settings.autoDraft === undefined) st.settings.autoDraft = false;
      if (st.settings.autoContracts === undefined) st.settings.autoContracts = false;
      if (st.draft === undefined) st.draft = null;
      st.history.seasons = st.history.seasons || [];
      st.history.draftClasses = st.history.draftClasses || {};
      st.history.retired = st.history.retired || {};
      st.pending = { waivers: [], tradeOffers: [], faOffers: [], ...(st.pending || {}) };
      for (const t of Object.values(st.teams)) {
        if (t.league !== 'NHL') continue;
        t.finances.deadCap = t.finances.deadCap.map(d => (d.fromSeason === undefined ? { ...d, fromSeason: st.calendar.season, toSeason: st.calendar.season } : d));
      }
      for (const p of Object.values(st.players)) {
        if (p.rosterStatus === 'LTIR' && p.ltirRelief === undefined && p.contract) p.ltirRelief = p.contract.capHit;   // the Phase 3 rule
        if (p.assignment === 'AHL' && p.contract && p.contract.type === 'TWO_WAY' && p.contract.capHit > Contracts.buryAllowance()) p.contract.capHit = Contracts.buryAllowance();
      }
      if (st.calendar.phase === 'SEASON_END' && !st.draft) Offseason.endSeason(st, RNG.bind(st.meta), []);
      return st;
    },
    // v4 (Phase 4) → v5 (Phase 5): trades. Retained salary is tied to the contract it was traded on, teams get
    // their strategy, and the trade log and difficulty setting appear.
    4: st => {
      if (!st.settings.tradeDifficulty) st.settings.tradeDifficulty = 'NORMAL';
      st.history.trades = st.history.trades || [];
      st.pending.tradeOffers = st.pending.tradeOffers || [];
      for (const t of Object.values(st.teams)) {
        if (t.league !== 'NHL') continue;
        t.finances.retained = (t.finances.retained || []).map(r => (r.untilSeason !== undefined ? r : {
          playerId: r.playerId, name: '', pct: r.pct, capHit: (st.players[r.playerId] && st.players[r.playerId].contract) ? st.players[r.playerId].contract.capHit : 0,
          untilSeason: st.calendar.season + Math.max(1, r.seasonsLeft || 1) - 1 }));
        t.ai = { strategy: 'BUBBLE', strategyLockedUntil: null, ...(t.ai || {}) };
      }
      Trade.classify(st, { force: true });
      return st;
    },
    // v5 (Phase 5) → v6 (Phase 6): the news feed, records, the Hall of Fame, and each veteran's estimated career
    // before the league's first season (games on file before then = career GP − in-game NHL games).
    5: st => {
      st.news = st.news || [];
      st.history.hallOfFame = st.history.hallOfFame || [];
      st.history.records = st.history.records || Records.empty();
      for (const p of Object.values(st.players)) {
        if (p.career.prior !== undefined) continue;
        const inGame = U.sum(p.stats.filter(L => L.league === 'NHL' && L.type === 'REG').map(L => L.gp));
        const before = (p.career.nhlGP || 0) - inGame;
        if (before <= 0) continue;
        const total = p.career.nhlGP;
        p.career.nhlGP = before;
        const pr = Records.priorFor(st, p);
        p.career.nhlGP = total;
        if (pr) p.career.prior = pr;
      }
      Records.backfill(st);
      Records.rebuild(st);
      return st;
    },
  };

  const summarize = s => {
    const t = s.teams[s.meta.userTeamId];
    return { team: t ? `${t.city} ${t.name}` : s.meta.userTeamId, season: s.calendar.season, date: s.calendar.date, phase: s.calendar.phase };
  };

  const serialize = s => JSON.stringify({ format: FORMAT, version: s.meta.version, savedAt: new Date().toISOString(), summary: summarize(s), state: s });

  function migrate(state, fromVersion, migrations = MIGRATIONS, toVersion = CONFIG.SAVE_VERSION) {
    let st = state;
    for (let v = fromVersion; v < toVersion; v++) {
      if (typeof migrations[v] !== 'function') throw new Error(`No migration from save version ${v} to ${v + 1}`);
      st = migrations[v](st);
      st.meta.version = v + 1;
    }
    return st;
  }

  function deserialize(json) {
    let env;
    try { env = JSON.parse(json); } catch (e) { throw new Error('Save data is not valid JSON'); }
    if (!env || env.format !== FORMAT || !env.state) throw new Error('Not a Hockey Franchise Manager save');
    if (!Number.isInteger(env.version)) throw new Error('Save has no version number');
    if (env.version > CONFIG.SAVE_VERSION) throw new Error(`Save is from a newer version (v${env.version}); this build reads up to v${CONFIG.SAVE_VERSION}`);
    return migrate(env.state, env.version);
  }

  // ── backends: all async, same shape { name, put(record), get(slot), list(), remove(slot) } ──
  function memoryBackend() {
    const store = new Map();
    return {
      name: 'memory',
      put: async rec => { store.set(rec.slot, { ...rec }); },
      get: async slot => (store.has(slot) ? { ...store.get(slot) } : null),
      list: async () => [...store.values()].map(({ json, ...meta }) => meta),
      remove: async slot => { store.delete(slot); },
    };
  }

  function localStorageBackend(prefix = NS ? `hfm-${NS}:` : 'hfm:') {
    const indexKey = `${prefix}index`;
    const readIndex = () => JSON.parse(localStorage.getItem(indexKey) || '{}');
    return {
      name: 'localStorage',
      put: async ({ json, ...meta }) => {
        try {
          localStorage.setItem(`${prefix}save:${meta.slot}`, json);
          localStorage.setItem(indexKey, JSON.stringify({ ...readIndex(), [meta.slot]: meta }));
        } catch (e) {
          throw new Error(`localStorage is full (${e.name}). Use Export Save, or a browser with IndexedDB.`);
        }
      },
      get: async slot => {
        const meta = readIndex()[slot], json = localStorage.getItem(`${prefix}save:${slot}`);
        return meta && json ? { ...meta, json } : null;
      },
      list: async () => Object.values(readIndex()),
      remove: async slot => {
        localStorage.removeItem(`${prefix}save:${slot}`);
        const idx = readIndex(); delete idx[slot]; localStorage.setItem(indexKey, JSON.stringify(idx));
      },
    };
  }

  function indexedDBBackend(dbName = NS ? `hockey-franchise-manager-${NS}` : 'hockey-franchise-manager') {
    let dbPromise = null;
    const open = () => dbPromise || (dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(dbName, 1);
      req.onupgradeneeded = () => {
        req.result.createObjectStore('saves', { keyPath: 'slot' });   // { slot, json }
        req.result.createObjectStore('index', { keyPath: 'slot' });   // { slot, savedAt, version, summary }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error('IndexedDB is blocked by another open tab'));
    }));
    const run = async (stores, mode, fn) => {
      const db = await open();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(stores, mode);
        let result;
        fn(tx, r => { result = r; });
        tx.oncomplete = () => resolve(result);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error || new Error('IndexedDB transaction aborted'));
      });
    };
    const request = (req, done) => { req.onsuccess = () => done(req.result); };
    return {
      name: 'indexedDB',
      ready: open,
      put: ({ json, ...meta }) => run(['saves', 'index'], 'readwrite', tx => {
        tx.objectStore('saves').put({ slot: meta.slot, json });
        tx.objectStore('index').put(meta);
      }),
      get: slot => run(['saves', 'index'], 'readonly', (tx, set) => {
        let meta, data;
        const finish = () => { if (meta !== undefined && data !== undefined) set(meta && data ? { ...meta, json: data.json } : null); };
        request(tx.objectStore('index').get(slot), r => { meta = r || null; finish(); });
        request(tx.objectStore('saves').get(slot), r => { data = r || null; finish(); });
      }),
      list: () => run(['index'], 'readonly', (tx, set) => request(tx.objectStore('index').getAll(), set)),
      remove: slot => run(['saves', 'index'], 'readwrite', tx => {
        tx.objectStore('saves').delete(slot);
        tx.objectStore('index').delete(slot);
      }),
    };
  }

  const localStorageWorks = () => {
    try { localStorage.setItem('hfm:probe', '1'); localStorage.removeItem('hfm:probe'); return true; } catch (e) { return false; }
  };

  let backendPromise = null;
  async function detect() {
    if (typeof indexedDB !== 'undefined') {
      try { const b = indexedDBBackend(); await b.ready(); return b; } catch (e) { /* e.g. blocked on file:// → fall back */ }
    }
    if (typeof localStorage !== 'undefined' && localStorageWorks()) return localStorageBackend();
    return memoryBackend();
  }
  const backend = () => backendPromise || (backendPromise = detect());
  const use = b => { backendPromise = Promise.resolve(b); };

  async function save(slot, state) {
    const json = serialize(state);
    await (await backend()).put({ slot, savedAt: new Date().toISOString(), version: state.meta.version, summary: summarize(state), bytes: json.length, json });
    return { slot, bytes: json.length };
  }
  async function load(slot) {
    const rec = await (await backend()).get(slot);
    if (!rec) throw new Error(`No save in slot "${slot}"`);
    return deserialize(rec.json);
  }
  const list = async () => (await (await backend()).list()).sort((a, b) => (a.savedAt < b.savedAt ? 1 : -1));
  const remove = async slot => (await backend()).remove(slot);
  const backendName = async () => (await backend()).name;

  return { FORMAT, NS, serialize, deserialize, migrate, save, load, list, remove, use, backendName,
           backends: { memory: memoryBackend, localStorage: localStorageBackend, indexedDB: indexedDBBackend } };
})();

// ════════════════════════════════════════════════════════════════════════════
// §24 Bus — engine → UI events
// ════════════════════════════════════════════════════════════════════════════

const Bus = (() => {
  const handlers = {};
  return {
    on(evt, fn) { (handlers[evt] = handlers[evt] || []).push(fn); return () => Bus.off(evt, fn); },
    off(evt, fn) { handlers[evt] = (handlers[evt] || []).filter(h => h !== fn); },
    emit(evt, payload) {
      for (const h of handlers[evt] || []) {
        try { h(payload); } catch (e) { if (typeof console !== 'undefined') console.error(`Bus handler for "${evt}" failed`, e); }
      }
    },
  };
})();

// ════════════════════════════════════════════════════════════════════════════
// §25 Game — the only surface the UI calls
// ════════════════════════════════════════════════════════════════════════════

const Game = {
  state: null,
  rng: null,

  newGame({ seed = Date.now(), userTeamId = 'TOR' } = {}) {
    if (!DATA.teams.some(t => t.id === userTeamId)) throw new Error(`Unknown team "${userTeamId}"`);
    const s = Factory.newLeague(seed, userTeamId);
    Game._attach(s);
    Calendar.buildSeason(s, Game.rng);
    Lineup.autoAll(s);
    Trade.classify(s, { force: true });
    Records.rebuild(s);
    News.post(s, [Offseason.preview(s, s.calendar.date)]);
    Bus.emit('game:new', { seed, userTeamId });
    return s;
  },

  _attach(s) { Game.state = s; Game.rng = RNG.bind(s.meta); },
  _require() { if (!Game.state) throw new Error('No game loaded'); return Game.state; },

  // ── the loop ──
  advanceDay() {
    const res = Season.advanceDay(Game._require(), Game.rng);
    Bus.emit('day:advanced', res);
    return res;
  },
  // Advance until done(res, state) is true, the user is blocked, or (unless disabled) an interrupt arrives.
  simUntil(done, { maxDays = 400, stopOnInterrupt = true } = {}) {
    const out = { days: 0, played: 0, stoppedBy: 'limit', last: null, interrupts: [] };
    for (let i = 0; i < maxDays; i++) {
      const res = Game.advanceDay();
      out.last = res;
      if (!res.ok) { out.stoppedBy = 'blocked'; break; }
      out.days++; out.played += res.played.length; out.interrupts.push(...res.interrupts);
      if (done(res, Game.state)) { out.stoppedBy = 'done'; break; }
      if (stopOnInterrupt && res.interrupts.length) { out.stoppedBy = 'interrupt'; break; }
    }
    return out;
  },
  simDays: (n, opts) => { let k = 0; return Game.simUntil(() => ++k >= n, opts); },
  simToDate: (date, opts) => Game.simUntil((res, s) => s.calendar.date >= date, opts),
  simToNextUserGame(opts) {
    const user = Game._require().meta.userTeamId;
    return Game.simUntil(res => res.played.some(id => { const g = Game.state.games[id]; return g.homeId === user || g.awayId === user; }), opts);
  },
  simToPhaseEnd(opts) { const phase = Game._require().calendar.phase; return Game.simUntil((res, s) => s.calendar.phase !== phase, opts); },

  // ── user commands ──
  callUp(playerId) { const s = Game._require(); const p = Roster.callUp(s, playerId, s.calendar.date); Roster.refreshLines(s, p.teamId); Bus.emit('roster:changed', { playerId }); return p; },
  sendDown(playerId) { const s = Game._require(); const p = Roster.sendDown(s, playerId, s.calendar.date); Roster.refreshLines(s, p.teamId); Bus.emit('roster:changed', { playerId }); return p; },
  setAutoRoster(on) { Game._require().settings.autoRoster = !!on; Bus.emit('settings:changed', {}); },
  setLines(teamId, lines) { const res = Lineup.manual(Game._require(), teamId, lines); if (res.ok) Bus.emit('lines:changed', { teamId }); return res; },
  resetLines(teamId) { const s = Game._require(); s.teams[teamId].lineup = Lineup.auto(s, teamId); Bus.emit('lines:changed', { teamId }); },
  markRead(ids = null) { for (const m of Game._require().inbox) if (!ids || ids.includes(m.id)) m.read = true; },

  // ── offseason commands (Phase 4). Each posts its news to the inbox and emits 'state:changed'. ──
  _act(fn) {
    const s = Game._require(), events = [];
    const out = fn(s, events);
    Season.post(s, events);
    Bus.emit('state:changed', {});
    return out;
  },
  // Draft: pick for the user when on the clock; the AI then picks until the user is up again.
  draftPlayer(playerId) {
    return Game._act((s, ev) => {
      if (s.calendar.phase !== 'DRAFT' || !Draft.userOnClock(s)) throw new Error("You're not on the clock");
      const pk = Draft.pick(s, playerId, ev);
      Draft.run(s, ev);
      return pk;
    });
  },
  autoDraftPick() { const s = Game._require(); if (!Draft.userOnClock(s)) throw new Error("You're not on the clock"); return Game.draftPlayer(Draft.aiChoice(s, s.meta.userTeamId)); },
  setAutoDraft(on) { Game._require().settings.autoDraft = !!on; Bus.emit('settings:changed', {}); },
  setAutoContracts(on) { Game._require().settings.autoContracts = !!on; Bus.emit('settings:changed', {}); },
  // "Apply staff recommendations": re-sign / qualify the players the staff would keep and sign ready prospects.
  staffContracts() {
    return Game._act((s, ev) => {
      if (!['SEASON_END', 'DRAFT', 'RE_SIGNING'].includes(s.calendar.phase)) throw new Error('Staff recommendations apply in the re-signing window (after the season, until June 30)');
      const was = s.settings.autoContracts;
      s.settings.autoContracts = true;
      const others = Select.nhlTeams(s).filter(t => t.id !== s.meta.userTeamId).map(t => t.id);
      const before = s.transactions.length;
      try { Market.aiReSign(s, s.calendar.date, ev, { only: s.meta.userTeamId }); Market.aiSignProspects(s, s.calendar.date, ev, { only: s.meta.userTeamId }); }
      finally { s.settings.autoContracts = was; }
      return s.transactions.slice(before).filter(x => x.teamId === s.meta.userTeamId && !others.includes(x.teamId));
    });
  },
  // Contracts
  reSignOptions(playerId) {
    const s = Game._require(), p = s.players[playerId];
    return Array.from({ length: CONFIG.cap.maxTermResign }, (_, i) => ({ years: i + 1, capHit: Market.reSignPrice(s, p, i + 1), problem: Market.reSignProblem(s, p, i + 1) }));
  },
  reSign(playerId, years) { return Game._act((s, ev) => Market.reSign(s, s.players[playerId], years, s.calendar.date, ev)); },
  setQualify(playerId, on) { const p = Game._require().players[playerId]; p.qualified = !!on; Bus.emit('state:changed', {}); },
  signProspect(playerId) { return Game._act((s, ev) => Market.signProspect(s, s.players[playerId], s.calendar.date, ev)); },
  buyoutTerms(playerId) { const s = Game._require(); return Contracts.buyoutTerms(s, s.players[playerId]); },
  buyout(playerId) {
    return Game._act((s, ev) => {
      const p = s.players[playerId];
      if (!p || p.teamId !== s.meta.userTeamId) throw new Error('You can only buy out your own players');
      return Offseason.buyout(s, p, s.calendar.date, ev);
    });
  },
  // Free agency: asks, offers and where your offer stands.
  faOptions(playerId) {
    const s = Game._require(), p = s.players[playerId], org = s.meta.userTeamId, table = Market.strengthTable(s);
    return Array.from({ length: Market.maxTerm(p, org) }, (_, i) => ({ years: i + 1, capHit: Market.askFrom(s, p, org, i + 1, table) }));
  },
  offerStatus(playerId) {
    const s = Game._require(), p = s.players[playerId], org = s.meta.userTeamId, table = Market.strengthTable(s);
    const offers = Market.offersFor(s, playerId), mine = offers.find(o => o.teamId === org) || null;
    const score = o => o.capHit * Market.appeal(s, p, o.teamId, table) * (1 + CONFIG.market.termValue * Math.min(o.years, Contracts.preferredTerm(s, p)));
    const best = offers.filter(o => Market.acceptable(s, p, o, table)).sort((a, b) => score(b) - score(a))[0] || null;
    return { offers: offers.length, mine, decideOn: p.market ? p.market.decideOn : null, preferredTerm: Contracts.preferredTerm(s, p),
             mineAcceptable: !!mine && Market.acceptable(s, p, mine, table), leading: !!mine && !!best && best.teamId === org };
  },
  offerContract(playerId, capHit, years) { const s = Game._require(); Market.offer(s, s.meta.userTeamId, playerId, capHit, years, s.calendar.date); Bus.emit('state:changed', {}); },
  withdrawOffer(playerId) { const s = Game._require(); Market.withdraw(s, s.meta.userTeamId, playerId); Bus.emit('state:changed', {}); },
  // Waivers: claims are processed the morning after a player is placed on waivers, worst record first.
  claimWaivers(playerId, on = true) {
    const s = Game._require(), w = s.pending.waivers.find(x => x.playerId === playerId);
    if (!w) throw new Error('He is not on waivers');
    if (w.fromTeamId === s.meta.userTeamId) throw new Error("You can't claim your own player");
    const p = s.players[playerId];
    if (on && Contracts.capSpace(s, s.meta.userTeamId) < p.contract.capHit) throw new Error(`Not enough cap space to claim him (${U.money(p.contract.capHit)})`);
    w.userClaim = !!on; Bus.emit('state:changed', {});
  },

  // ── trades (Phase 5). A deal: { teams: [yourId, theirId], give: { [id]: { players: [ids], picks: [ids], retain: { id: pct } } } } ──
  tradeStatus() {
    const s = Game._require();
    return { open: Trade.isOpen(s), deadline: Trade.deadline(s), daysToDeadline: Trade.daysToDeadline(s), deadlineWindow: Trade.deadlineWindow(s),
             difficulty: s.settings.tradeDifficulty, offers: s.pending.tradeOffers.length };
  },
  // The partner's verdict on a deal (no changes): { accept, interest (0–2), reply, problems, cap: { [team]: { before, after, ceiling } } }.
  evaluateTrade(deal) { return Trade.preview(Game._require(), deal); },
  // Propose a deal; the partner accepts (and it happens) or says why not: { accepted, reason?, record? }.
  proposeTrade(deal) { return Game._act((s, ev) => Trade.propose(s, deal, s.calendar.date, ev, Game.rng)); },
  // "What would it take?": the deal with your assets added until they'd accept, or null.
  suggestTrade(deal) { return Trade.suggest(Game._require(), deal); },
  // What AI teams would give for one of your players: [{ teamId, deal, fair (your staff would take it) }], best first.
  shopPlayer(playerId) { return Trade.shop(Game._require(), playerId).map(({ teamId, deal, fair }) => ({ teamId, deal, fair })); },
  acceptTradeOffer(id) { return Game._act((s, ev) => Trade.acceptOffer(s, id, s.calendar.date, ev, Game.rng)); },
  declineTradeOffer(id) { Trade.declineOffer(Game._require(), id); Bus.emit('state:changed', {}); },
  setTradeDifficulty(level) {
    if (!CONFIG.trade.difficulty[level]) throw new Error(`Unknown difficulty "${level}"`);
    Game._require().settings.tradeDifficulty = level; Trade.reset(); Bus.emit('settings:changed', {});
  },

  // ── queries for the UI ──
  // Pre-game win probability for a scheduled game, or null if a team can't dress a lineup right now.
  preview(gameId) {
    const s = Game._require(), g = s.games[gameId];
    try { return Sim.winProbability(s, g.homeId, g.awayId, g.date, g.type); } catch (e) { return null; }
  },
  // "TOR leads 3–2", "Series tied 1–1", "TOR wins 4–1" from teamId's point of view.
  seriesStatus(seriesId) {
    const sr = Playoffs.seriesById(Game._require(), seriesId), [a, b] = [sr.high, sr.low], wa = sr.wins[a], wb = sr.wins[b];
    const ab = id => Game.state.teams[id].abbrev;
    if (sr.winner) return `${ab(sr.winner)} won ${sr.wins[sr.winner]}–${sr.wins[sr.loser]}`;
    if (wa === wb) return `Series tied ${wa}–${wb}`;
    return wa > wb ? `${ab(a)} leads ${wa}–${wb}` : `${ab(b)} leads ${wb}–${wa}`;
  },

  async save(slot = 'autosave') {
    const res = await Persistence.save(slot, Game._require());
    Bus.emit('game:saved', res);
    return res;
  },
  async load(slot) {
    const s = await Persistence.load(slot);
    const problems = Integrity.check(s);
    Game._attach(s);
    Bus.emit('game:loaded', { slot, problems });
    return { problems };
  },
  listSaves: () => Persistence.list(),
  deleteSave: slot => Persistence.remove(slot),
  exportSave: () => Persistence.serialize(Game._require()),
  importSave(json) {
    const s = Persistence.deserialize(json);
    const problems = Integrity.check(s);
    Game._attach(s);
    Bus.emit('game:loaded', { slot: null, problems });
    return { problems };
  },
};

// ════════════════════════════════════════════════════════════════════════════
// Exports: browser global, Node module, and JavaScriptCore `load()` all work.
// ════════════════════════════════════════════════════════════════════════════

const HFM = { CONFIG, DATA, U, RNG, Ratings, Progression, Contracts, Select, Factory, Calendar, Lineup, Sim, Stats,
              Condition, Roster, Playoffs, Draft, Market, Offseason, Season, Trade, Scouting, Records, News, Integrity, Persistence, Bus, Game };
globalThis.HFM = HFM;
if (typeof module !== 'undefined' && module.exports) module.exports = HFM;

</script>
<script>
/* ── ui.js ── */
/*
 * Hockey Franchise Manager — user interface (ui.js)
 * Reads engine state for display and changes it only through Game.* commands (BLUEPRINT §6).
 * Every view is a function that returns HTML; clicks are handled by one delegated listener (data-act).
 */
(function () {
  'use strict';
  const { Game, Stats, Select, Calendar, Contracts, Ratings, Roster, Playoffs, Season, Lineup, Draft, Market, Trade, U, CONFIG } = HFM;

  // ════════════════════════════════════════════════════════════════════════
  // Helpers
  // ════════════════════════════════════════════════════════════════════════
  const S = () => Game.state;
  const user = () => S().meta.userTeamId;
  const team = id => S().teams[id];
  // Any player, including retired ones (archived) and ones dropped from the save (a placeholder).
  const GHOST = id => ({ id, missing: true, firstName: 'Former', lastName: 'player', position: '–', altPositions: [], stats: [], attributes: {},
                         career: { nhlGP: 0, draft: null }, dev: { potential: 0 }, condition: { energy: 100, injury: null } });
  const P = id => Select.person(S(), id) || GHOST(id);
  const esc = v => String(v === undefined || v === null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtDate = (iso, extra = {}) => new Date(`${iso}T12:00:00Z`).toLocaleDateString('en-US', { timeZone: 'UTC', weekday: 'short', month: 'short', day: 'numeric', ...extra });
  const fmtShort = iso => new Date(`${iso}T12:00:00Z`).toLocaleDateString('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric' });
  const pct3 = x => (x >= 1 ? '1.000' : x.toFixed(3).replace(/^0/, ''));
  const mmss = sec => `${Math.floor(sec / 60)}:${String(Math.round(sec % 60)).padStart(2, '0')}`;
  const signed = n => (n > 0 ? `+${n}` : String(n));
  const ordinal = n => { const sfx = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (sfx[(v - 20) % 10] || sfx[v] || sfx[0]); };
  const rec = r => `${r.w}-${r.l}-${r.otl}`;
  const teamName = id => `${team(id).city} ${team(id).name}`;
  const isUserTeam = id => id === user() || id === team(user()).affiliateId;
  // Your scouts' read on a player's potential (Phase 6 scouting fog); the true value stays hidden.
  const live = p => !p.missing && !p.archived && p.dev && p.dev.potential !== undefined && S().players[p.id];
  const scouted = p => (live(p) ? HFM.Scouting.estimate(S(), p, user()) : (p.dev && p.dev.potential) || 0);
  const scoutConf = p => (live(p) ? HFM.Scouting.confidence(S(), p, user()) : 'high');
  // Ceiling label from your scouts' estimate, worded by position; "?" when they aren't sure yet.
  const ceiling = p => ceilingLabel(p, scouted(p)) + (scoutConf(p) === 'low' ? '?' : '');
  const ceilingLabel = (p, v) => {
    const g = p.position === 'G' ? 2 : p.position === 'D' ? 1 : 0;
    if (v >= 92) return 'Generational';
    if (v >= 87) return 'Franchise';
    if (v >= 82) return 'Elite';
    if (v >= 76) return ['Top-6', 'Top-4', 'Starter'][g];
    if (v >= 71) return ['Middle-6', 'Top-6 D', '1B'][g];
    if (v >= 65) return ['Bottom-6', 'Third pair', 'Backup'][g];
    return 'Depth';
  };
  const PHASE_LABEL = Season.LABELS;

  // Readable text on any team color: pick white or near-black by luminance.
  const luminance = hex => {
    const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(v => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  };
  const chip = (id, { big = false } = {}) => {
    const t = team(id);
    if (!t) return '';
    const fg = luminance(t.colors.primary) > 0.33 ? '#101318' : '#ffffff';
    return `<span class="chip${big ? ' big' : ''}" style="--c1:${t.colors.primary};--c2:${t.colors.secondary};color:${fg}" title="${esc(teamName(id))}">${esc(t.abbrev)}</span>`;
  };
  const ovrClass = o => (o >= 90 ? 'o90' : o >= 85 ? 'o85' : o >= 80 ? 'o80' : o >= 75 ? 'o75' : o >= 70 ? 'o70' : o >= 65 ? 'o65' : 'o60');
  const ovr = o => `<span class="ovr ${ovrClass(o)}">${o}</span>`;
  const plink = (p, label) => (p.missing ? `<span class="muted">${esc(label || 'Former player')}</span>` : `<a data-act="player" data-id="${p.id}">${esc(label || Select.fullName(p))}</a>`);
  const seasonLabel = Season.seasonLabel;
  const offseason = () => Contracts.OFFSEASON.includes(S().calendar.phase);
  // The season whose games and stats are on display: the league year rolls over on July 1, but last season's
  // games, standings and playoffs stay up until training camp.
  const statSeason = () => (S().calendar.phase === 'FREE_AGENCY' ? S().calendar.season - 1 : S().calendar.season);
  const marketOpen = () => Market.isOpen(S());
  // Age as of the season the current ratings apply to (after the season ends, that's next season).
  const age = p => U.seasonAge(p.birthDate, Contracts.ratedSeason(S()));
  const energyBar = e => {
    const color = e >= 80 ? 'var(--good)' : e >= 60 ? 'var(--warn)' : 'var(--bad)';
    return `<span class="energy" title="Energy ${Math.round(e)}"><i style="width:${Math.max(4, e)}%;background:${color}"></i></span>`;
  };
  const statusBadges = p => {
    const b = [];
    if (p.condition.injury) b.push(`<span class="badge bad" title="${esc(p.condition.injury.type)}">Out ${p.condition.injury.daysOut}d</span>`);
    if (p.rosterStatus === 'IR' || p.rosterStatus === 'LTIR') b.push(`<span class="badge bad">${p.rosterStatus}</span>`);
    if (p.contract && p.contract.type === 'PTO') b.push('<span class="badge">Tryout</span>');
    if (p.emergencyRecall) b.push('<span class="badge warn">Emergency</span>');
    if (p.waivers) b.push('<span class="badge warn" title="Other teams can claim him tomorrow morning">On waivers</span>');
    if (p.extension) b.push(`<span class="badge good" title="Signed through ${seasonLabel(p.extension.expiresAfterSeason)}">Extended ${U.money(p.extension.capHit)} × ${p.extension.yearsRemaining}</span>`);
    return b.join(' ');
  };
  const seg = (key, options, current) => `<div class="seg">${options.map(([v, label]) =>
    `<button data-act="set" data-key="${key}" data-val="${v}" class="${String(current) === String(v) ? 'on' : ''}">${esc(label)}</button>`).join('')}</div>`;

  // Season totals for a player (summed across teams), optionally filtered.
  function totals(p, { league = null, type = 'REG', season = statSeason(), teamId = null } = {}) {
    const t = {};
    for (const L of p.stats) {
      if (L.season !== season || L.type !== type || (league && L.league !== league) || (teamId && L.teamId !== teamId)) continue;
      for (const [k, v] of Object.entries(L)) if (typeof v === 'number' && k !== 'season') t[k] = (t[k] || 0) + v;
    }
    return t;
  }
  const userGame = g => g.homeId === user() || g.awayId === user();
  const resultFor = (g, teamId) => {
    const home = g.homeId === teamId, mine = home ? g.result.home : g.result.away, opp = home ? g.result.away : g.result.home;
    const code = mine > opp ? 'W' : g.result.decidedIn !== 'REG' && g.type === 'REG' ? 'O' : 'L';
    const tag = g.result.decidedIn === 'SO' ? ' SO' : g.result.decidedIn === 'OT' ? (g.result.otPeriods > 1 ? ` ${g.result.otPeriods}OT` : ' OT') : '';
    return { code, label: code === 'O' ? 'OTL' : code, score: `${mine}–${opp}${tag}` };
  };
  const divisionPlace = id => {
    const t = team(id), rows = Stats.standings(S(), t.league, 'division')[t.division] || [];
    return rows.findIndex(r => r.teamId === id) + 1;
  };

  // ════════════════════════════════════════════════════════════════════════
  // UI state
  // ════════════════════════════════════════════════════════════════════════
  const ui = {
    view: 'dashboard', busy: false, progress: '', modal: null, blockers: null,
    rosterTab: 'NHL', rosterTeam: null, schedLeague: 'NHL', standLeague: 'NHL', standGroup: 'division',
    leadLeague: 'NHL', leadType: 'REG', inboxFilter: 'all', lineSel: null,
    pickTeam: 'TOR', saves: null, welcomeSaves: null,
    tradePartner: null, trade: { mine: { players: [], picks: [], retain: {} }, theirs: { players: [], picks: [], retain: {} } }, tradeTabMine: 'NHL', tradeTabTheirs: 'NHL', shop: null,
  };

  // ════════════════════════════════════════════════════════════════════════
  // Header and tabs
  // ════════════════════════════════════════════════════════════════════════
  function headerHTML() {
    const s = S(), me = user(), t = team(me), r = t.record, phase = s.calendar.phase;
    const place = divisionPlace(me);
    let status = `${rec(r)} · ${r.pts} pts · ${ordinal(place)} ${t.division.charAt(0) + t.division.slice(1).toLowerCase()}`;
    if (s.playoffs) {
      const sr = Playoffs.seriesOf(s, me);
      status = sr ? `${Playoffs.roundName(sr.round)} · ${Game.seriesStatus(sr.id)}` : 'Missed the playoffs';
    }
    const b = (kind, label, primary) => `<button class="btn${primary ? ' primary' : ''}" data-act="sim" data-kind="${kind}"${ui.busy ? ' disabled' : ''}>${label}</button>`;
    if (offseason()) status = `${seasonLabel(statSeason())}: ${status}`;
    const sims = {
      PRESEASON: [b('day', 'Advance day', true), b('phase', 'Sim to opening night')],
      REGULAR_SEASON: [b('day', 'Advance day', true), b('next', 'Play next game'), b('week', 'Sim week'), b('month', 'Sim month'), b('phase', 'Sim to playoffs')],
      PLAYOFFS: [b('day', 'Advance day', true), b('next', 'Play next game'), b('phase', 'Sim playoffs')],
      SEASON_END: [b('day', 'Advance day', true), b('phase', 'Sim to the draft')],
      DRAFT: Draft.userOnClock(s) ? [`<button class="btn primary" data-act="view" data-view="draft"${ui.busy ? ' disabled' : ''}>You're on the clock →</button>`] : [b('day', 'Continue the draft', true)],
      RE_SIGNING: [b('day', 'Advance day', true), b('week', 'Sim week'), b('phase', 'Sim to free agency')],
      FREE_AGENCY: [b('day', 'Advance day', true), b('week', 'Sim week'), b('month', 'Sim month'), b('phase', 'Sim to training camp')],
    }[phase];
    return `<header class="topbar"><div class="topbar-in">
      <div class="brand">${chip(me, { big: true })}<div><div class="tname">${esc(teamName(me))}</div><div class="rec">${esc(status)}</div></div></div>
      <div class="when"><b>${esc(fmtDate(s.calendar.date, { year: 'numeric' }))}</b><span>${esc(PHASE_LABEL[phase])}</span></div>
      <div class="simbar">
        ${ui.busy ? `<span class="busy">Simulating… ${esc(ui.progress)}</span>` : ''}
        ${sims.join('')}
        <button class="btn" data-act="saves"${ui.busy ? ' disabled' : ''}>Save / Load</button>
        <button class="btn" data-act="new-game"${ui.busy ? ' disabled' : ''}>New game</button>
      </div>
    </div></header>`;
  }

  const TABS = [['dashboard', 'Dashboard'], ['roster', 'Roster'], ['lines', 'Lines'], ['schedule', 'Schedule'], ['standings', 'Standings'],
                ['leaders', 'Leaders'], ['playoffs', 'Playoffs'], ['draft', 'Draft'], ['contracts', 'Contracts'], ['market', 'Free agents'], ['trade', 'Trades'], ['news', 'News'],
                ['history', 'History'], ['inbox', 'Inbox']];
  function tabsHTML() {
    const s = S(), unread = s.inbox.filter(m => !m.read).length;
    const counts = { inbox: unread, draft: Draft.userOnClock(s) ? '!' : 0, market: s.pending.faOffers.filter(o => o.teamId === user()).length, trade: s.pending.tradeOffers.length,
                     contracts: ['SEASON_END', 'DRAFT', 'RE_SIGNING'].includes(s.calendar.phase) ? expiring().length : 0 };
    return `<nav class="tabs"><div class="tabs-in">${TABS.map(([v, label]) =>
      `<button class="tab${ui.view === v ? ' on' : ''}" data-act="view" data-view="${v}">${label}${counts[v] ? `<span class="count">${counts[v]}</span>` : ''}</button>`).join('')}</div></nav>`;
  }
  // Your players whose deals run out at the end of this league year and haven't been extended.
  const expiring = () => { const t = team(user()); return [...t.roster.nhl, ...t.roster.ahl].map(P).filter(p => p.contract && p.contract.type !== 'PTO' && p.contract.expiresAfterSeason === S().calendar.season && !p.extension); };

  // ════════════════════════════════════════════════════════════════════════
  // Dashboard
  // ════════════════════════════════════════════════════════════════════════
  function dashboardHTML() {
    const s = S(), me = user(), games = Calendar.teamGames(s, me, statSeason());

    if (next) {

        <div class="matchup">${chip(opp, { big: true })}<div><b>${home ? 'vs' : '@'} ${esc(teamName(opp))}</b>
          <div class="muted small">${rec(team(opp).record)} · ${team(opp).record.pts} pts · ${ordinal(divisionPlace(opp))} in division</div></div></div>
        ${mine === null ? '<p class="muted small">Win chance unavailable (a lineup is incomplete).</p>' : `

        <div class="small muted">Win chance <b style="color:var(--ink)">${Math.round(mine * 100)}%</b> · expected goals ${(home ? wp.xgHome : wp.xgAway).toFixed(1)}–${(home ? wp.xgAway : wp.xgHome).toFixed(1)}</div>`}

    } else if (!offseason()) {
      const sr = s.playoffs && Playoffs.seriesOf(s, me);
      cards.push(`<div class="card"><h2>Next game</h2><p class="muted">${sr && sr.loser === me ? 'You were eliminated. The playoffs continue without you.' : s.playoffs && !sr ? 'You missed the playoffs. The postseason continues without you.' : 'No game scheduled yet.'}</p></div>`);
    }

    // Last result
    if (last) {
      const r = resultFor(last, me), opp = last.homeId === me ? last.awayId : last.homeId;
      cards.push(`<div class="card"><h2>Last result<span class="right muted">${esc(fmtDate(last.date))}</span></h2>
        <div class="matchup"><span class="bigscore wl ${r.code}">${r.label} ${esc(r.score)}</span><span class="vs">${last.homeId === me ? 'vs' : '@'}</span>${chip(opp)} ${esc(teamName(opp))}</div>
        <div style="margin-top:8px"><a data-act="box" data-id="${last.id}">Box score →</a></div></div>`);
    }

    // Division
    const rows = Stats.standings(s, 'NHL', 'division')[team(me).division];
    cols[1].push(`<div class="card"><h2>${esc(team(me).division.charAt(0) + team(me).division.slice(1).toLowerCase())} division<span class="right"><a data-act="view" data-view="standings">All standings →</a></span></h2>
      <table class="t"><thead><tr><th></th><th>Team</th><th class="num">GP</th><th class="num">Record</th><th class="num">PTS</th><th class="num">Diff</th></tr></thead><tbody>
      ${rows.map((x, i) => `<tr class="${x.teamId === me ? 'me' : ''}${i === 2 ? ' cut' : ''}"><td class="rk">${i + 1}</td><td>${chip(x.teamId)} ${esc(team(x.teamId).name)}</td><td class="num">${x.gp}</td><td class="num">${rec(x)}</td><td class="num"><b>${x.pts}</b></td><td class="num">${signed(x.diff)}</td></tr>`).join('')}
      </tbody></table></div>`);

    // Team leaders (first column, under the game cards)
    const nhl = Select.orgPlayers(s, me).filter(p => p.position !== 'G').map(p => ({ p, t: totals(p, { league: 'NHL', teamId: me }) })).filter(x => x.t.gp);
    const top = (key, n = 3) => [...nhl].sort((a, b) => (b.t[key] || 0) - (a.t[key] || 0)).slice(0, n);
    nhl.forEach(x => { x.t.pts = (x.t.g || 0) + (x.t.a || 0); });
    const gl = Select.orgPlayers(s, me).filter(p => p.position === 'G').map(p => ({ p, t: totals(p, { league: 'NHL', teamId: me }) })).filter(x => x.t.gp)
      .sort((a, b) => b.t.gp - a.t.gp)[0];
    cards.push(`<div class="card"><h2>Team leaders</h2>${nhl.length ? `<table class="t"><tbody>
      ${[['pts', 'Points'], ['g', 'Goals'], ['a', 'Assists']].map(([k, label]) => `<tr class="sub"><td colspan="2">${label}</td></tr>${top(k).map(x => `<tr><td>${plink(x.p)}</td><td class="num"><b>${x.t[k] || 0}</b></td></tr>`).join('')}`).join('')}
      ${gl ? `<tr class="sub"><td colspan="2">Goalie</td></tr><tr><td>${plink(gl.p)}</td><td class="num">${gl.t.w}-${gl.t.l}-${gl.t.otl} · ${pct3(1 - gl.t.ga / Math.max(1, gl.t.sa))}</td></tr>` : ''}
      </tbody></table>` : '<p class="muted">No games played yet.</p>'}</div>`);

    // Injuries
    const hurt = Select.orgPlayers(s, me).filter(p => p.condition.injury && (p.assignment === 'NHL' || p.assignment === 'AHL'))
      .sort((a, b) => (a.assignment === b.assignment ? b.condition.injury.daysOut - a.condition.injury.daysOut : a.assignment === 'NHL' ? -1 : 1));
    cols[1].push(`<div class="card"><h2>Injuries<span class="right muted">${hurt.length}</span></h2>${hurt.length ? `<table class="t"><tbody>${hurt.map(p =>
      `<tr><td><span class="pos">${p.position}</span> ${plink(p)} <span class="badge">${p.assignment}</span></td><td class="muted small">${esc(p.condition.injury.type)}</td><td class="num">${p.condition.injury.daysOut}d</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Everyone is healthy.</p>'}</div>`);

    // Awards
    const aw = s.history.awards.find(a => a.season === statSeason());
    if (aw) cols[2].push(`<div class="card"><h2>Season awards</h2><table class="t"><tbody>${aw.list.map(a => `<tr><td class="muted small">${esc(a.name)}</td><td>${a.playerId ? `${plink(P(a.playerId))} ${(a.teamIds || []).map(chip).join(' ')}` : `${chip(a.teamId)} ${esc(teamName(a.teamId))}`}</td><td class="num">${a.value !== undefined ? (a.key === 'GOALIE' ? pct3(a.value) : a.value) : ''}</td></tr>`).join('')}</tbody></table></div>`);

    // Around the league (Phase 6 news feed)
    const news = [...(s.news || [])].reverse().slice(0, 7);
    cols[2].push(`<div class="card"><h2>Around the league<span class="right"><a data-act="view" data-view="news">All news →</a></span></h2>${news.length ? news.map(newsItem).join('') : '<p class="muted">No news yet.</p>'}</div>`);

    // Inbox
    const msgs = [...s.inbox].reverse().slice(0, 6);
    cols[2].push(`<div class="card"><h2>Inbox<span class="right"><a data-act="view" data-view="inbox">All messages →</a></span></h2>${msgs.length ? msgs.map(msgHTML).join('') : '<p class="muted">No messages yet.</p>'}</div>`);

    // League leaders
    const lead = Stats.leaders(s, { stat: 'pts', n: 5, season: statSeason() });
    cols[2].push(`<div class="card"><h2>League scoring<span class="right"><a data-act="view" data-view="leaders">Leaders →</a></span></h2>${lead.length ? `<table class="t"><tbody>${lead.map((x, i) =>
      `<tr><td class="rk">${i + 1}</td><td>${plink(P(x.playerId))} ${x.teamIds.map(chip).join(' ')}</td><td class="num">${x.totals.g}+${x.totals.a}</td><td class="num"><b>${x.value}</b></td></tr>`).join('')}</tbody></table>` : '<p class="muted">No games played yet.</p>'}</div>`);

    return out.join('') + `<div class="grid">${cols.map(c => `<div class="stack">${c.join('')}</div>`).join('')}</div>`;
  }

  // ── Offseason: what's happening and what needs doing ──
  const userPicksLeft = () => Season.userPicks(S());

  function offseasonCard() {

      ['Re-signing window · to June 30', 'Re-sign or qualify your expiring players; sign your prospects'],
      ['Free agency · from July 1', 'Contracts roll over; unsigned players hit the market'],
      ['Training camp · September 20', 'New schedule; rosters cut to 23'],
    ];

    if (['SEASON_END', 'DRAFT', 'RE_SIGNING'].includes(ph) && expiring().length) todo.push(`<a data-act="view" data-view="contracts">${expiring().length} expiring contracts</a>`);
