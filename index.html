            pen[i] = 2;
            const offender = rng.weighted(Un[i].skaters, e => Math.max(1, 100 - e.discipline + e.physicality / 2));
            line(offender.id).pim += 2;
            penList.push({ period: period + 1, sec: m * 60 + rng.int(m === 0 ? 8 : 1, 59), side: i, playerId: offender.id, minutes: 2 });
          }
        }
      }
      return false;
    }

    for (let m = 0; m < 60; m++) tick(m, 'REG');
    let decidedIn = 'REG', shootout = null;
    if (goals[0] === goals[1]) {
      decidedIn = 'OT';
      if (ctx.playoff) {                                    // penalties carry over; play until someone scores
        const end = 60 + CONFIG.playoffs.otPeriodMinutes * CONFIG.playoffs.maxOtPeriods;
        let m = 60;
        while (m < end && !tick(m, 'OT5')) m++;
        if (goals[0] === goals[1]) throw new Error('Playoff game exceeded the overtime limit');
      } else {
        pen[0] = pen[1] = 0;
        for (let m = 60; m < 60 + S.otMinutes; m++) if (tick(m, 'OT3')) break;
        if (goals[0] === goals[1]) { decidedIn = 'SO'; shootout = runShootout(T, N, rng); }
      }
    }
    const winner = decidedIn === 'SO' ? shootout.winner : goals[0] > goals[1] ? 0 : 1;
    const score = [goals[0] + (decidedIn === 'SO' && winner === 0 ? 1 : 0), goals[1] + (decidedIn === 'SO' && winner === 1 ? 1 : 0)];

    goalList.sort((a, b) => a.sec - b.sec);
    if (decidedIn !== 'SO') {                               // GWG: the winner's goal that broke the loser's final total
      const gw = goalList.filter(g => g.side === winner)[goals[1 - winner]];
      if (gw) line(gw.scorer).gwg++;
    }
    gl[winner].decision = 'W';
    gl[1 - winner].decision = decidedIn === 'REG' || ctx.playoff ? 'L' : 'OTL';
    if (goals[1 - winner] === 0) gl[winner].so = 1;

    const skaters = {};
    for (const [id, x] of lines) skaters[id] = x;
    const starScore = id => { const x = skaters[id]; return 3 * x.g + 2 * x.a + 0.15 * x.sog + 0.5 * x.gwg; };
    const goalieScore = g => 0.12 * (g.sa - g.ga) - g.ga + (g.decision === 'W' ? 1.5 : 0) + (g.so ? 3 : 0);
    const stars = [...Object.keys(skaters).map(id => [id, starScore(id)]), ...gl.map(g => [g.id, goalieScore(g)])]
      .sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1)).slice(0, 3).map(x => x[0]);

    return { homeId: ctx.home.teamId, awayId: ctx.away.teamId, score, decidedIn, winner, playoff: !!ctx.playoff,
             otPeriods: Math.max(0, shots[0].length - 3), shots, goals: goalList, penalties: penList.sort((a, b) => a.sec - b.sec), skaters, goalies: gl, shootout, stars };
  }

  function runShootout(T, N, rng) {
    const R = S.shootout.rounds, sc = [0, 0], attempts = [];
    const p = (i, e) => S.shootout.base * Math.exp(S.shootout.kShooter * (e.soSkill - N.so))
                                      * Math.exp(-S.shootout.kGoalie * (T[1 - i].goalie.rating - N.g));
    for (let r = 0; r < 40; r++) {
      for (let i = 0; i < 2; i++) {
        const e = T[i].soOrder[r % T[i].soOrder.length];
        const made = rng.next() < p(i, e);
        if (made) sc[i]++;
        attempts.push({ side: i, playerId: e.id, scored: made });
        if (r < R) {                                        // stop once the best-of-R is decided
          const rem0 = R - (r + 1), rem1 = R - (r + (i === 1 ? 1 : 0));
          if (sc[0] > sc[1] + rem1) return { winner: 0, attempts };
          if (sc[1] > sc[0] + rem0) return { winner: 1, attempts };
        }
      }
      if (r >= R - 1 && sc[0] !== sc[1]) return { winner: sc[0] > sc[1] ? 0 : 1, attempts };
    }
    return { winner: rng.chance(0.5) ? 0 : 1, attempts };
  }

  // ── closed-form pre-game win probability (BLUEPRINT §3.3) ─────────────────
  function winProbability(s, homeId, awayId, date = s.calendar.date, type = 'REG') {
    const league = s.teams[homeId].league;
    const N = ensureNorms(s, league, date);
    const H = aggregates(buildSide(s, homeId, date, type)), A = aggregates(buildSide(s, awayId, date, type));
    const xg = (X, Y, venue) => {
      const fin = S.baseSh * X.fin * Math.exp(S.kShooter * (X.sq - N.sq)) * Math.exp(-S.kGoalie * (Y.g - N.g));
      return venue * fin * (
          S.xg.evMinutes * S.shots.EV * Math.exp(S.kShot * ((X.off - N.off) - (Y.def - N.def)))
        + S.xg.ppMinutes * S.shots.PP * S.finish.PP * Math.exp(S.kShot * ((X.pp - N.off) - (Y.pk - N.def)))
        + S.xg.ppMinutes * S.shots.SH * S.finish.SH);
    };
    const xh = xg(H, A, S.home), xa = xg(A, H, S.away);
    const pois = (k, l) => { let p = Math.exp(-l); for (let i = 1; i <= k; i++) p *= l / i; return p; };
    let w = 0, tie = 0;
    for (let i = 0; i <= 12; i++) for (let j = 0; j <= 12; j++) { const pr = pois(i, xh) * pois(j, xa); if (i > j) w += pr; else if (i === j) tie += pr; }
    const home = w + tie * (xh / (xh + xa));
    return { home, away: 1 - home, xgHome: xh, xgAway: xa };
  }

  function playGame(s, gameId, rng) {
    const g = s.games[gameId];
    if (g.played) throw new Error(`Game ${gameId} was already played`);
    const norms = ensureNorms(s, g.league, g.date);
    const box = simulate({ norms, playoff: g.type === 'PO', home: buildSide(s, g.homeId, g.date, g.type), away: buildSide(s, g.awayId, g.date, g.type) }, rng);
    Stats.applyBoxScore(s, g, box);
    return box;
  }

  function playDate(s, date, rng) {
    let n = 0;
    for (const id of s.scheduleByDate[date] || []) if (!s.games[id].played) { playGame(s, id, rng); n++; }
    return n;
  }

  // Headless helper: play every unplayed game dated ≤ untilDate, in date order. (Phase 3's advanceDay
  // replaces this for real play; tests and reports use it directly.)
  function playThrough(s, rng, untilDate = '9999-12-31') {
    let n = 0;
    for (const d of Calendar.gameDates(s)) { if (d > untilDate) break; n += playDate(s, d, rng); }
    return n;
  }

  return { perf, effSkater, buildSide, aggregates, computeNorms, ensureNorms, simulate, winProbability, playGame, playDate, playThrough };
})();

// ════════════════════════════════════════════════════════════════════════════
// §13 Stats — applying box scores, stat lines, team records, standings, leaders
// ════════════════════════════════════════════════════════════════════════════

const Stats = (() => {
  const SKATER = () => ({ gp: 0, g: 0, a: 0, pim: 0, pm: 0, sog: 0, ppg: 0, ppa: 0, shg: 0, sha: 0, gwg: 0, toiSec: 0, fow: 0, fol: 0 });
  const GOALIE = () => ({ gp: 0, gs: 0, w: 0, l: 0, otl: 0, sa: 0, ga: 0, so: 0, toiSec: 0 });
  // Archived (retired) players keep their lines as arrays: [season, teamId, league, type, ...values in key order].
  const keysFor = position => Object.keys(position === 'G' ? GOALIE() : SKATER());
  const packLine = (L, position) => [L.season, L.teamId, L.league, L.type, ...keysFor(position).map(k => L[k])];
  const unpackLine = (a, position) => { const L = { season: a[0], teamId: a[1], league: a[2], type: a[3] }; keysFor(position).forEach((k, i) => { L[k] = a[4 + i]; }); return L; };

  function lineFor(p, season, teamId, league, type) {
    let L = p.stats.find(x => x.season === season && x.teamId === teamId && x.league === league && x.type === type);
    if (!L) { L = { season, teamId, league, type, ...(p.position === 'G' ? GOALIE() : SKATER()) }; p.stats.push(L); }
    return L;
  }

  function applyRecord(t, gf, ga, decidedIn, won, home) {
    const r = t.record, split = home ? r.home : r.away;
    r.gp++; r.gf += gf; r.ga += ga;
    if (won) { r.w++; r.pts += 2; split.w++; if (decidedIn !== 'SO') r.row++; if (decidedIn === 'REG') r.rw++; }
    else if (decidedIn === 'REG') { r.l++; split.l++; }
    else { r.otl++; r.pts++; split.otl++; }
    const code = won ? 'W' : decidedIn === 'REG' ? 'L' : 'O';
    r.last10 = [...r.last10, code].slice(-10);
    r.streak = r.streak[0] === code ? code + (Number(r.streak.slice(1)) + 1) : code + '1';
  }

  // Storage policy keeps saves small: full box scores only for the user's NHL/AHL teams.
  function storedBox(s, g, box) {
    const user = s.meta.userTeamId, userAhl = s.teams[user].affiliateId;
    const isUser = [g.homeId, g.awayId].some(id => id === user || id === userAhl);
    const policy = isUser ? 'full' : CONFIG.stats.boxScores[g.league];
    if (policy === 'none') return null;
    const out = {
      shots: box.shots.map(p => p.slice()),
      goals: box.goals.map(x => [x.period, x.sec, x.side, x.scorer, x.a1, x.a2, x.strength]),
      penalties: box.penalties.map(x => [x.period, x.sec, x.side, x.playerId, x.minutes]),
      goalies: box.goalies.map(x => [x.id, x.side, x.sa, x.ga, x.toi, x.decision]),
      stars: box.stars,
      shootout: box.shootout ? box.shootout.attempts.map(x => [x.side, x.playerId, x.scored ? 1 : 0]) : null,
      skaters: null,
    };
    if (policy === 'full') {
      out.skaters = Object.entries(box.skaters).map(([id, x]) => [id, x.side, x.g, x.a, x.sog, x.pm, x.pim, x.toi, x.ppg, x.shg, x.fow, x.fol]);
    }
    return out;
  }

  function applyBoxScore(s, g, box) {
    const teamIds = [g.homeId, g.awayId];
    const countsForCareer = g.league === 'NHL' && g.type === 'REG';
    for (const [id, x] of Object.entries(box.skaters)) {
      s.players[id].condition.lastPlayed = g.date;
      if (countsForCareer) s.players[id].career.nhlGP++;
      const L = lineFor(s.players[id], g.season, teamIds[x.side], g.league, g.type);
      L.gp++; L.g += x.g; L.a += x.a; L.pim += x.pim; L.pm += x.pm; L.sog += x.sog;
      L.ppg += x.ppg; L.ppa += x.ppa; L.shg += x.shg; L.sha += x.sha; L.gwg += x.gwg;
      L.toiSec += x.toi; L.fow += x.fow; L.fol += x.fol;
    }
    for (const x of box.goalies) {
      s.players[x.id].condition.lastPlayed = g.date;
      if (countsForCareer) s.players[x.id].career.nhlGP++;
      const L = lineFor(s.players[x.id], g.season, teamIds[x.side], g.league, g.type);
      L.gp++; L.gs++; L.sa += x.sa; L.ga += x.ga; L.toiSec += x.toi; L.so += x.so;
      if (x.decision === 'W') L.w++; else if (x.decision === 'L') L.l++; else if (x.decision === 'OTL') L.otl++;
    }
    if (g.type === 'REG') {                                 // playoff games live in the series, not the standings
      applyRecord(s.teams[g.homeId], box.score[0], box.score[1], box.decidedIn, box.winner === 0, true);
      applyRecord(s.teams[g.awayId], box.score[1], box.score[0], box.decidedIn, box.winner === 1, false);
    }
    g.played = true;
    g.result = { home: box.score[0], away: box.score[1], decidedIn: box.decidedIn, otPeriods: box.otPeriods,
                 shots: [U.sum(box.shots[0]), U.sum(box.shots[1])] };
    g.boxScore = storedBox(s, g, box);
  }

  // Readable box score for the UI, from the compact stored form.
  function boxScoreView(s, gameId) {
    const g = s.games[gameId];
    if (!g.played) return null;
    const b = g.boxScore, side = i => (i === 0 ? g.homeId : g.awayId);
    if (!b) return { gameId, result: g.result, detail: false };
    return {
      gameId, date: g.date, home: g.homeId, away: g.awayId, result: g.result, detail: true,
      shotsByPeriod: { [g.homeId]: b.shots[0], [g.awayId]: b.shots[1] },
      goals: b.goals.map(([period, sec, sd, scorer, a1, a2, strength]) => ({ period, clock: clock(sec), teamId: side(sd), scorer, assists: [a1, a2].filter(Boolean), strength })),
      penalties: b.penalties.map(([period, sec, sd, playerId, minutes]) => ({ period, clock: clock(sec), teamId: side(sd), playerId, minutes })),
      goalies: b.goalies.map(([id, sd, sa, ga, toi, decision]) => ({ playerId: id, teamId: side(sd), sa, saves: sa - ga, ga, svPct: sa ? (sa - ga) / sa : null, toiSec: toi, decision })),
      stars: b.stars,
      shootout: b.shootout && b.shootout.map(([sd, playerId, scored]) => ({ teamId: side(sd), playerId, scored: !!scored })),
      skaters: b.skaters && b.skaters.map(([id, sd, g_, a, sog, pm, pim, toi, ppg, shg, fow, fol]) =>
        ({ playerId: id, teamId: side(sd), g: g_, a, pts: g_ + a, sog, pm, pim, toiSec: toi, ppg, shg, fow, fol })),
    };
  }
  const clock = sec => { const inP = sec % 1200; return `${Math.floor(inP / 60)}:${String(inP % 60).padStart(2, '0')}`; };

  // groupBy: 'league' → rows; 'conference' | 'division' → { key: rows }
  function standings(s, league = 'NHL', groupBy = 'division') {
    const rows = Object.values(s.teams).filter(t => t.league === league).map(t => {
      const r = t.record;
      return { teamId: t.id, conference: t.conference, division: t.division, ...r, ptsPct: r.gp ? r.pts / (2 * r.gp) : 0, diff: r.gf - r.ga };
    });
    const cmp = (a, b) => b.pts - a.pts || b.ptsPct - a.ptsPct || b.rw - a.rw || b.row - a.row || b.w - a.w || b.diff - a.diff || b.gf - a.gf || (a.teamId < b.teamId ? -1 : 1);
    rows.sort(cmp);
    if (groupBy === 'league') return rows;
    const out = {};
    for (const r of rows) (out[r[groupBy]] = out[r[groupBy]] || []).push(r);
    return out;
  }

  const DERIVED = {
    pts: L => L.g + L.a,
    svPct: L => (L.sa ? (L.sa - L.ga) / L.sa : 0),
    gaa: L => (L.toiSec ? L.ga * 3600 / L.toiSec : 0),
    toiPerGP: L => (L.gp ? L.toiSec / L.gp : 0),
    foPct: L => (L.fow + L.fol ? L.fow / (L.fow + L.fol) : 0),
  };

  // Season totals per player (summed across teams if traded), filtered and ranked.
  function leaders(s, { league = 'NHL', season = s.calendar.season, type = 'REG', stat = 'pts', n = 10, position = null, minGP = 0, ascending = stat === 'gaa' } = {}) {
    const rows = [];
    for (const p of Object.values(s.players)) {
      const isG = p.position === 'G';
      if (position === 'G' ? !isG : position === 'D' ? p.position !== 'D' : position === 'F' ? !Ratings.isForward(p.position) : false) continue;
      const lines = p.stats.filter(L => L.league === league && L.season === season && L.type === type);
      if (!lines.length) continue;
      const tot = {};
      for (const L of lines) for (const [k, v] of Object.entries(L)) if (typeof v === 'number' && k !== 'season') tot[k] = (tot[k] || 0) + v;
      if ((tot.gp || 0) < minGP) continue;
      const value = DERIVED[stat] ? DERIVED[stat](tot) : tot[stat];
      if (!Number.isFinite(value)) continue;                 // e.g. a skater stat for a goalie
      rows.push({ playerId: p.id, name: Select.fullName(p), position: p.position, teamIds: lines.map(L => L.teamId), value, totals: tot });
    }
    rows.sort((a, b) => (ascending ? a.value - b.value : b.value - a.value) || (a.playerId < b.playerId ? -1 : 1));
    return rows.slice(0, n);
  }

  // Stat-based season awards (generic names; no league trademarks).
  function awards(s, season) {
    const one = rows => (rows.length ? { playerId: rows[0].playerId, value: rows[0].value, teamIds: rows[0].teamIds } : {});
    const table = standings(s, 'NHL', 'league');
    const pts = leaders(s, { season, stat: 'pts', n: 5000 });
    const rookies = pts.filter(r => { const p = s.players[r.playerId]; return U.seasonAge(p.birthDate, season) <= 26 && p.career.nhlGP - r.totals.gp < 25; });
    let goalies = leaders(s, { season, stat: 'svPct', position: 'G', minGP: 40, n: 1 });
    if (!goalies.length) goalies = leaders(s, { season, stat: 'svPct', position: 'G', minGP: 10, n: 1 });
    const champ = s.playoffs && s.playoffs.championId;
    const poPts = champ ? leaders(s, { season, type: 'PO', stat: 'pts', n: 5000 }).filter(r => r.teamIds.includes(champ)) : [];
    return [
      { key: 'CHAMPION', name: 'Champions', teamId: champ || null },
      { key: 'PLAYOFF_MVP', name: 'Playoff MVP (points, champions)', ...one(poPts) },
      { key: 'BEST_RECORD', name: 'Best regular-season record', teamId: table[0].teamId, value: table[0].pts },
      { key: 'POINTS', name: 'Scoring title', ...one(pts) },
      { key: 'GOALS', name: 'Goal-scoring title', ...one(leaders(s, { season, stat: 'g', n: 1 })) },
      { key: 'DEFENSEMAN', name: 'Top defenseman (points)', ...one(leaders(s, { season, stat: 'pts', position: 'D', n: 1 })) },
      { key: 'GOALIE', name: 'Top goaltender (save %, 40+ GP)', ...one(goalies) },
      { key: 'ROOKIE', name: 'Top rookie (points)', ...one(rookies) },
      { key: 'MVP', name: 'Most valuable player', ...one(mvp(s, season, pts)) },
      ...allStars(s, season),
    ].filter(a => a.teamId || a.playerId);
  }

  // MVP (Phase 6): points per 82 games, weighted by how good his team was (60+ GP).
  function mvp(s, season, pts) {
    const pct = id => { const r = s.teams[id] && s.teams[id].record; return r && r.gp ? r.pts / (2 * r.gp) : 0.5; };
    return pts.filter(r => r.totals.gp >= 60).map(r => ({ ...r, value: Math.round(r.totals.pts / r.totals.gp * 82 * (0.85 + 0.3 * pct(r.teamIds[r.teamIds.length - 1]))) }))
      .sort((a, b) => b.value - a.value || (a.playerId < b.playerId ? -1 : 1));
  }
  // All-Star team (Phase 6): the best C, LW, RW (points), two D (points + half their plus/minus) and G (save % with
  // 40+ games, wins break ties), 50+ games for skaters.
  function allStars(s, season) {
    const chosen = new Set(), out = [];
    const pick = (key, name, rows) => { const r = rows.find(x => !chosen.has(x.playerId)); if (r) { chosen.add(r.playerId); out.push({ key, name, playerId: r.playerId, value: r.value, teamIds: r.teamIds }); } };
    const by = (pos, score) => leaders(s, { season, stat: 'pts', n: 5000, minGP: 50 }).filter(r => r.position === pos).map(r => ({ ...r, value: score(r.totals) })).sort((a, b) => b.value - a.value);
    pick('ALLSTAR_C', 'All-Star team: center', by('C', t => t.g + t.a));
    pick('ALLSTAR_LW', 'All-Star team: left wing', by('LW', t => t.g + t.a));
    pick('ALLSTAR_RW', 'All-Star team: right wing', by('RW', t => t.g + t.a));
    const d = by('D', t => Math.round(t.g + t.a + 0.5 * t.pm));
    pick('ALLSTAR_D1', 'All-Star team: defense', d); pick('ALLSTAR_D2', 'All-Star team: defense', d);
    pick('ALLSTAR_G', 'All-Star team: goalie', leaders(s, { season, stat: 'svPct', position: 'G', minGP: 40, n: 5 }));
    return out;
  }

  return { lineFor, applyBoxScore, boxScoreView, standings, leaders, awards, DERIVED, packLine, unpackLine };
})();

// ════════════════════════════════════════════════════════════════════════════
// §13b Records — career totals, milestones, single-game / single-season / career records, franchise records and
//      the Hall of Fame (Phase 6). Record holders live in s.history.records; career totals are always derived:
//      NHL regular-season lines plus career.prior, an estimate of a generated veteran's career before 2026-27.
// ════════════════════════════════════════════════════════════════════════════

const Records = (() => {
  const R = CONFIG.records;
  const grp = p => (p.position === 'G' ? 'G' : p.position === 'D' ? 'D' : 'F');
  const empty = () => ({ game: {}, season: {}, career: {}, team: {} });
  const STATS = { skater: { game: ['g', 'a', 'pts'], season: ['g', 'a', 'pts', 'pm', 'ppg'], career: ['gp', 'g', 'a', 'pts'], milestones: ['g', 'a', 'pts', 'gp'] },
                  goalie: { game: ['saves'], season: ['w', 'so'], career: ['gp', 'w', 'so'], milestones: ['w', 'so', 'gp'] } };
  const LIVE = ['g', 'a', 'pts', 'pm', 'ppg', 'w', 'so'];          // single-season records tracked game by game
  const LABEL = { g: 'goals', a: 'assists', pts: 'points', gp: 'games played', w: 'wins', so: 'shutouts', pm: 'plus/minus',
                  ppg: 'power-play goals', saves: 'saves', svPct: 'save percentage', gaa: 'goals-against average',
                  teamPts: 'points by a team', teamW: 'wins by a team', teamGF: 'goals by a team', teamGA: 'fewest goals against' };

  // A generated veteran's NHL career before the league's first season, from per-game rates fitted to simulated
  // seasons at his career-average OVR (deterministic, ±15%).
  function priorFor(s, p) {
    const gp = p.career.nhlGP;
    if (!(gp > 0)) return null;
    const g = grp(p), P = R.prior[g], age = U.seasonAge(p.birthDate, s.calendar.season);
    const avg = p.ovr + U.clamp((age - 29) * 0.6, -4, 3);
    const rate = (r, k) => Math.max(0.004, (r[0] + r[1] * (avg - P.ovr)) * U.clamp(1 + 0.15 * U.hashNormal(`${s.meta.seed}:${p.id}:prior:${k}`), 0.6, 1.4));
    if (g === 'G') { const starts = gp * P.startShare; return { gp, w: Math.round(starts * rate(P.w, 'w')), so: Math.round(starts * rate(P.so, 'so')) }; }
    return { gp, g: Math.round(gp * rate(P.g, 'g')), a: Math.round(gp * rate(P.a, 'a')), pim: Math.round(gp * rate(P.pim, 'pim')) };
  }
  const add = (t, L) => { for (const k of ['gp', 'g', 'a', 'pim', 'pm', 'ppg', 'w', 'so', 'sa', 'ga', 'toiSec']) t[k] += L[k] || 0; };
  const zero = () => ({ gp: 0, g: 0, a: 0, pim: 0, pm: 0, ppg: 0, w: 0, so: 0, sa: 0, ga: 0, toiSec: 0 });
  // NHL regular-season career totals (prior estimate included). Works for archived players too (Select.person).
  function careerTotals(p) {
    const t = zero();
    for (const L of p.stats) if (L.league === 'NHL' && L.type === 'REG') add(t, L);
    const pr = p.career && p.career.prior;
    if (pr) for (const k of ['gp', 'g', 'a', 'pim', 'w', 'so']) t[k] += pr[k] || 0;
    t.pts = t.g + t.a;
    return t;
  }
  function seasonTotals(p, season, teamId = null) {
    const t = zero();
    for (const L of p.stats) if (L.league === 'NHL' && L.type === 'REG' && L.season === season && (!teamId || L.teamId === teamId)) add(t, L);
    t.pts = t.g + t.a;
    return t;
  }
  const entry = (p, value, extra = {}) => ({ value, playerId: p.id, name: Select.fullName(p), position: p.position, ...extra });
  const everyone = s => [...Object.values(s.players).filter(p => p.stats.length || (p.career.prior && p.career.prior.gp)),
                         ...Object.keys(s.history.retired || {}).map(id => Select.person(s, id))];

  // ── After every NHL regular-season game: feats, milestones, records, streaks ──
  function afterGame(s, g, box, events) {
    if (g.league !== 'NHL' || g.type !== 'REG') return;
    const rec = s.history.records, N = CONFIG.news, date = g.date, season = g.season;
    const teamOf = side => (side === 0 ? g.homeId : g.awayId);
    const crossed = (list, before, after) => (list || []).filter(m => before < m && after >= m);
    const one = (p, teamId, kind, inc) => {
      const S = STATS[kind], car = careerTotals(p), sea = seasonTotals(p, season);
      // Single game: news only when a record from an earlier season falls.
      for (const k of S.game) {
        const v = inc[k], cur = rec.game[k];
        if (!(v > 0) || (cur && v <= cur.value)) continue;
        if (cur && cur.season < season) events.push({ kind: 'RECORD', scope: 'game', stat: k, date, playerId: p.id, teamId, value: v, prev: cur });
        rec.game[k] = entry(p, v, { teamId, season, date, gameId: g.id });
      }
      // Single season (counting stats, live; finalized when the regular season ends).
      for (const k of S.season) {
        const v = sea[k], cur = rec.season[k];
        if (!(v > 0) || (cur && v <= cur.value)) continue;
        const prev = cur && cur.season < season ? cur : cur && cur.prev ? cur.prev : null;
        if (cur && cur.season < season) events.push({ kind: 'RECORD', scope: 'season', stat: k, date, playerId: p.id, teamId, value: v, prev: cur });
        rec.season[k] = entry(p, v, { teamId, season, prev });
      }
      // Career: passing the all-time leader.
      for (const k of S.career) {
        const v = car[k], cur = rec.career[k];
        if (cur && v <= cur.value) continue;
        if (cur && cur.playerId !== p.id) events.push({ kind: 'RECORD', scope: 'career', stat: k, date, playerId: p.id, teamId, value: v, prev: cur });
        rec.career[k] = entry(p, v, { teamId });
      }
      // Milestones (career thresholds and big seasons), each announced once: the game that crossed it.
      for (const k of S.milestones) for (const m of crossed(R.career[k], car[k] - inc[k], car[k])) events.push({ kind: 'MILESTONE', scope: 'career', stat: k, value: m, date, playerId: p.id, teamId });
      if (kind === 'skater') for (const [k, list] of Object.entries(R.season)) for (const m of crossed(list, sea[k] - inc[k], sea[k])) events.push({ kind: 'MILESTONE', scope: 'season', stat: k, value: m, date, playerId: p.id, teamId });
    };
    for (const [id, x] of Object.entries(box.skaters)) {
      const p = s.players[id], teamId = teamOf(x.side), pts = x.g + x.a;
      if (x.g >= N.hatTrick) events.push({ kind: 'FEAT', feat: x.g >= 4 ? `${x.g}-goal game` : 'hat trick', date, playerId: id, teamId, gameId: g.id, g: x.g, a: x.a });
      else if (pts >= N.bigGame) events.push({ kind: 'FEAT', feat: `${pts}-point game`, date, playerId: id, teamId, gameId: g.id, g: x.g, a: x.a });
      one(p, teamId, 'skater', { g: x.g, a: x.a, pts, gp: 1, pm: x.pm, ppg: x.ppg });
    }
    for (const x of box.goalies) one(s.players[x.id], teamOf(x.side), 'goalie', { saves: x.sa - x.ga, w: x.decision === 'W' ? 1 : 0, so: x.so || 0, gp: 1 });
    for (const id of [g.homeId, g.awayId]) {
      const st = s.teams[id].record.streak, n = Number(st.slice(1));
      if ((st[0] === 'W' && N.winStreaks.includes(n)) || (st[0] === 'L' && N.loseStreaks.includes(n))) events.push({ kind: 'STREAK', date, teamId: id, won: st[0] === 'W', n });
    }
  }

  // ── The end of the regular season: finalize single-season records (rates, team records, counting stats) ──
  function endRegularSeason(s, events) {
    const rec = s.history.records, season = s.calendar.season, date = s.calendar.date;
    // The final leader replaces the live mark if he beat the best of earlier seasons; otherwise that best stands.
    // Counting stats were announced live when the old mark fell; rate stats are announced now.
    const set = (k, best, better, mk) => {
      const cur = rec.season[k], prev = cur && cur.season === season ? cur.prev || null : cur || null;
      if (!best || (prev && !better(best.value, prev.value))) { if (prev) rec.season[k] = prev; else delete rec.season[k]; return; }
      const fresh = mk(best), announced = LIVE.includes(k) && cur && cur.season === season;
      if (prev && !announced) events.push({ kind: 'RECORD', scope: 'season', stat: k, date, playerId: fresh.playerId, teamId: fresh.teamId, value: fresh.value, prev });
      rec.season[k] = fresh;
    };
    const lead = (stat, opts = {}) => Stats.leaders(s, { season, stat, n: 1, ...opts })[0];
    const mkP = r => ({ value: r.value, playerId: r.playerId, name: r.name, position: r.position, teamId: r.teamIds[r.teamIds.length - 1], season });
    for (const k of ['g', 'a', 'pts', 'pm', 'ppg']) set(k, lead(k), (a, b) => a > b, mkP);
    set('w', lead('w', { position: 'G' }), (a, b) => a > b, mkP);
    set('so', lead('so', { position: 'G' }), (a, b) => a > b, mkP);
    set('svPct', lead('svPct', { position: 'G', minGP: R.minGoalieGP }), (a, b) => a > b, mkP);
    set('gaa', lead('gaa', { position: 'G', minGP: R.minGoalieGP, ascending: true }), (a, b) => a < b, mkP);
    const teams = Select.nhlTeams(s).filter(t => t.record.gp >= 60);
    const best = (f, low = false) => teams.map(t => ({ t, v: f(t.record) })).sort((a, b) => (low ? a.v - b.v : b.v - a.v))[0];
    const mkT = x => ({ value: x.v, teamId: x.t.id, name: `${x.t.city} ${x.t.name}`, season });
    const team = (k, f, low) => {
      const b = best(f, low), cur = rec.team[k];
      if (!b || (cur && (low ? b.v >= cur.value : b.v <= cur.value))) return;
      if (cur) events.push({ kind: 'RECORD', scope: 'team', stat: k, date, teamId: b.t.id, value: b.v, prev: cur });
      rec.team[k] = mkT(b);
    };
    team('teamPts', r => r.pts); team('teamW', r => r.w); team('teamGF', r => r.gf); team('teamGA', r => r.ga, true);
  }

  // Career record holders from scratch (a new league, or an old save): no news.
  function rebuild(s) {
    const rec = s.history.records = s.history.records || empty();
    rec.career = {};
    for (const p of everyone(s)) {
      const t = careerTotals(p), kind = p.position === 'G' ? 'goalie' : 'skater';
      for (const k of STATS[kind].career) if (t[k] > 0 && (!rec.career[k] || t[k] > rec.career[k].value)) rec.career[k] = entry(p, t[k], { teamId: p.teamId || null });
    }
    return rec;
  }

  // All-time leaders (active and retired), for the Records page.
  function careerLeaders(s, stat, n = 10, { goalies = stat === 'w' || stat === 'so' } = {}) {
    return everyone(s).filter(p => (p.position === 'G') === goalies || stat === 'gp')
      .map(p => ({ p, t: careerTotals(p) })).filter(x => x.t[stat] > 0)
      .sort((a, b) => b.t[stat] - a.t[stat] || (a.p.id < b.p.id ? -1 : 1)).slice(0, n)
      .map(x => ({ playerId: x.p.id, name: Select.fullName(x.p), position: x.p.position, value: x.t[stat], active: !x.p.archived && x.p.assignment !== 'RETIRED', teamId: x.p.teamId || null }));
  }

  // One franchise's records: best single seasons by its players, its career leaders, its best team seasons.
  function franchise(s, teamId) {
    const seasonBest = {}, careers = [];
    for (const p of everyone(s)) {
      const by = {}, tot = zero();
      for (const L of p.stats) {
        if (L.league !== 'NHL' || L.type !== 'REG' || L.teamId !== teamId) continue;
        (by[L.season] = by[L.season] || zero()); add(by[L.season], L); add(tot, L);
      }
      if (!tot.gp) continue;
      tot.pts = tot.g + tot.a;
      careers.push({ playerId: p.id, name: Select.fullName(p), position: p.position, ...tot });
      for (const [season, t] of Object.entries(by)) {
        t.pts = t.g + t.a;
        for (const k of p.position === 'G' ? ['w', 'so'] : ['g', 'a', 'pts']) {
          if (!seasonBest[k] || t[k] > seasonBest[k].value) seasonBest[k] = { value: t[k], playerId: p.id, name: Select.fullName(p), position: p.position, season: Number(season) };
        }
      }
    }
    const leaders = k => careers.filter(c => k === 'w' || k === 'so' ? c.position === 'G' : k === 'gp' || c.position !== 'G').sort((a, b) => b[k] - a[k]).slice(0, 5);
    const seasons = (s.history.seasons || []).map(x => { const i = x.nhl.findIndex(r => r[0] === teamId), r = x.nhl[i]; return r && { season: x.season, w: r[2], l: r[3], otl: r[4], pts: r[5], gf: r[6], ga: r[7], place: i + 1, champion: x.championId === teamId, round: x.playoffRound[teamId] || 0 }; }).filter(Boolean);
    return { seasonBest, leaders: { pts: leaders('pts'), g: leaders('g'), gp: leaders('gp'), w: leaders('w') }, seasons,
             titles: seasons.filter(x => x.champion).map(x => x.season), best: [...seasons].sort((a, b) => b.pts - a.pts)[0] || null };
  }

  // ── Hall of Fame: checked when a notable retiree is archived ──
  const MAJOR = ['MVP', 'POINTS', 'GOALS', 'DEFENSEMAN', 'GOALIE', 'PLAYOFF_MVP'];
  const majorAwards = (s, id) => s.history.awards.reduce((n, a) => n + a.list.filter(x => x.playerId === id && MAJOR.includes(x.key)).length, 0);
  function hallOfFameCase(s, p) {
    const H = CONFIG.hallOfFame, t = careerTotals(p), peak = Math.max((p.dev && p.dev.peakOvr) || 0, p.ovr || 0), awards = majorAwards(s, p.id);
    const reasons = [];
    if (p.position === 'G') {
      if (t.w >= H.goalieWins) reasons.push(`${t.w} wins`);
      if (peak >= H.goaliePeak && t.gp >= H.goalieGP) reasons.push(`peak OVR ${peak}`);
    } else {
      if (t.pts >= H.points) reasons.push(`${t.pts} points`);
      if (t.g >= H.goals) reasons.push(`${t.g} goals`);
      if (peak >= H.peakOvr && t.gp >= H.peakGP) reasons.push(`peak OVR ${peak}`);
    }
    if (awards >= H.majorAwards) reasons.push(`${awards} major awards`);
    return { inducted: reasons.length > 0, reasons, totals: t, peak, awards };
  }
  function induct(s, p, season, events) {
    const c = hallOfFameCase(s, p);
    if (!c.inducted) return null;
    const t = c.totals, row = { playerId: p.id, name: Select.fullName(p), position: p.position, inducted: season, retiredSeason: p.retired ? p.retired.season : season - 1,
                                peakOvr: c.peak, gp: t.gp, g: t.g, a: t.a, pts: t.pts, w: t.w, so: t.so, reasons: c.reasons };
    s.history.hallOfFame.push(row);
    events.push({ kind: 'HOF', date: s.calendar.date, playerId: p.id, row });
    return row;
  }

  // Single-season and team records from past seasons still on file (an old save): no news.
  function backfill(s) {
    const rec = s.history.records;
    for (const x of s.history.seasons || []) {
      const lead = (stat, opts = {}) => Stats.leaders(s, { season: x.season, stat, n: 1, ...opts })[0];
      const put = (k, r, better) => { if (r && Number.isFinite(r.value) && (!rec.season[k] || better(r.value, rec.season[k].value))) rec.season[k] = { value: r.value, playerId: r.playerId, name: r.name, position: r.position, teamId: r.teamIds[r.teamIds.length - 1], season: x.season }; };
      for (const k of ['g', 'a', 'pts', 'pm', 'ppg']) put(k, lead(k), (a, b) => a > b);
      put('w', lead('w', { position: 'G' }), (a, b) => a > b); put('so', lead('so', { position: 'G' }), (a, b) => a > b);
      put('svPct', lead('svPct', { position: 'G', minGP: R.minGoalieGP }), (a, b) => a > b);
      put('gaa', lead('gaa', { position: 'G', minGP: R.minGoalieGP, ascending: true }), (a, b) => a < b);
      for (const r of x.nhl.filter(r => r[1] >= 60)) {
        const t = s.teams[r[0]], mk = v => ({ value: v, teamId: r[0], name: t ? `${t.city} ${t.name}` : r[0], season: x.season });
        for (const [k, v, low] of [['teamPts', r[5]], ['teamW', r[2]], ['teamGF', r[6]], ['teamGA', r[7], true]]) {
          if (!rec.team[k] || (low ? v < rec.team[k].value : v > rec.team[k].value)) rec.team[k] = mk(v);
        }
      }
    }
  }

  // "63", ".931", "2.01" — a record value for display.
  const fmt = (stat, v) => (stat === 'svPct' ? Number(v).toFixed(3).replace(/^0/, '') : stat === 'gaa' ? Number(v).toFixed(2) : stat === 'pm' && v > 0 ? `+${v}` : String(v));

  return { LABEL, STATS, fmt, empty, backfill, priorFor, careerTotals, seasonTotals, afterGame, endRegularSeason, rebuild, careerLeaders, franchise,
           majorAwards, hallOfFameCase, induct };
})();

// ════════════════════════════════════════════════════════════════════════════
// §13c News — the league-wide feed (Phase 6): engine events become one-line stories in s.news (newest last,
//      capped at CONFIG.news.max). Your own team's news also goes to the inbox (Season.post).
// ════════════════════════════════════════════════════════════════════════════

const News = (() => {
  const N = CONFIG.news;
  const TAGS = { trade: 'Trades', signing: 'Signings', injury: 'Injuries', game: 'Games', milestone: 'Milestones', record: 'Records',
                 award: 'Awards', draft: 'Draft', retire: 'Retirements', league: 'League' };
  const ordinalN = n => { const sfx = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (sfx[(v - 20) % 10] || sfx[v] || sfx[0]); };
  function post(s, events) {
    if (!s.news) s.news = [];
    const team = id => (s.teams[id] ? `${s.teams[id].city} ${s.teams[id].name}` : id);
    const ab = id => (s.teams[id] ? s.teams[id].abbrev : id);
    const who = id => { const p = Select.person(s, id); return p ? Select.fullName(p) : 'A former player'; };
    const add = (e, tag, text, { teamIds = e.teamId ? [e.teamId] : [], playerId = e.playerId || null } = {}) =>
      s.news.push({ id: U.nextId(s, 'news', 'n_', 6), date: e.date, tag, text, teamIds, playerId });
    const recordText = e => {
      const v = Records.fmt(e.stat, e.value);
      const was = e.prev ? ` (old mark: ${e.prev.name ? `${e.prev.name}, ` : ''}${Records.fmt(e.stat, e.prev.value)}${e.prev.season ? ` in ${Season.seasonLabel(e.prev.season)}` : ''})` : '';
      if (e.scope === 'career') return `${who(e.playerId)} (${ab(e.teamId)}) passes ${e.prev.name} for the most career ${Records.LABEL[e.stat]} in league history: ${v}`;
      if (e.scope === 'team') return `${team(e.teamId)} set a league record for ${Records.LABEL[e.stat]} in a season: ${v}${was}`;
      return `${who(e.playerId)} (${ab(e.teamId)}) sets the single-${e.scope} record for ${Records.LABEL[e.stat]}: ${v}${was}`;
    };
    for (const e of events) {
      const p = e.playerId ? Select.person(s, e.playerId) : null;
      switch (e.kind) {
        case 'TRADE': {
          const r = s.history.trades.find(x => x.id === e.tradeId);
          if (r) add(e, 'trade', `${ab(r.teams[0])} acquire ${Trade.describe(s, r, r.teams[1])} from ${ab(r.teams[1])} for ${Trade.describe(s, r, r.teams[0])}`, { teamIds: r.teams });
          break;
        }
        case 'SIGNING':
          if (e.via !== 'DEPTH' && p && p.ovr >= N.signingOvr) add(e, 'signing', `${who(e.playerId)} (${p.position}, ${p.ovr}) signs with the ${team(e.teamId)}: ${U.money(e.capHit)} × ${e.years}`);
          break;
        case 'RE_SIGN':
          if (p && p.ovr >= N.reSignOvr) add(e, 'signing', `${who(e.playerId)} (${p.position}, ${p.ovr}) re-signs with the ${team(e.teamId)}: ${U.money(e.capHit)} × ${e.years}`);
          break;
        case 'INJURY':
          if (p && p.ovr >= N.injuryOvr && e.days >= N.injuryDays && p.assignment === 'NHL') add(e, 'injury', `${who(e.playerId)} (${ab(e.teamId)}, ${p.ovr}) is out about ${Math.round(e.days / 7)} weeks: ${e.type.toLowerCase()}`);
          break;
        case 'FEAT':
          add(e, 'game', `${who(e.playerId)} (${ab(e.teamId)}): ${e.feat}, ${e.g} G ${e.a} A`);
          break;
        case 'STREAK':
          add(e, 'game', e.won ? `The ${team(e.teamId)} have won ${e.n} straight` : `The ${team(e.teamId)} have lost ${e.n} straight`);
          break;
        case 'MILESTONE':
          add(e, 'milestone', e.scope === 'season' ? `${who(e.playerId)} (${ab(e.teamId)}) reaches ${e.value} ${Records.LABEL[e.stat]} this season`
            : e.stat === 'gp' ? `${who(e.playerId)} (${ab(e.teamId)}) plays his ${ordinalN(e.value)} NHL game` : `${who(e.playerId)} (${ab(e.teamId)}) records his ${ordinalN(e.value)} career ${e.stat === 'w' ? 'win' : e.stat === 'so' ? 'shutout' : Records.LABEL[e.stat].replace(/s$/, '')}`);
          break;
        case 'RECORD':
          add(e, 'record', recordText(e));
          break;
        case 'AWARDS':
          for (const a of e.list) if (a.playerId) add({ ...e, playerId: a.playerId }, 'award', `${a.name}: ${who(a.playerId)}${(a.teamIds || []).length ? ` (${a.teamIds.map(ab).join('/')})` : ''}`, { teamIds: a.teamIds || [] });
          break;
        case 'CHAMPION':
          add(e, 'league', `The ${team(e.teamId)} win the championship, defeating the ${team(e.finalistId)}`, { teamIds: [e.teamId, e.finalistId] });
          break;
        case 'SERIES':
          add(e, 'league', `${Playoffs.roundName(e.round)}: the ${team(e.winner)} eliminate the ${team(e.loser)} (${e.wins})`, { teamIds: [e.winner, e.loser] });
          break;
        case 'DRAFT_LOTTERY':
          if (e.lottery[0]) add(e, 'draft', `Draft lottery: the ${team(e.lottery[0].teamId)} win the #1 pick (from #${e.lottery[0].from})`, { teamIds: [e.lottery[0].teamId] });
          break;
        case 'DRAFTED':
          if (e.overall === 1) add(e, 'draft', `The ${team(e.teamId)} select ${who(e.playerId)} (${p ? p.position : ''}) first overall`);
          break;
        case 'RETIRE':
          if (p && ((p.dev && p.dev.peakOvr >= N.retireOvr) || p.career.nhlGP >= N.retireGP)) add(e, 'retire', `${who(e.playerId)} retires after ${p.career.nhlGP} NHL games (peak OVR ${(p.dev && p.dev.peakOvr) || p.ovr})`);
          break;
        case 'HOF':
          add(e, 'retire', `Hall of Fame: ${e.row.name} (${e.row.position}) is inducted: ${e.row.reasons.join(', ')}`);
          break;
        case 'STRATEGY':
          if (e.to === 'REBUILD' || e.from === 'REBUILD') add(e, 'league', e.to === 'REBUILD' ? `The ${team(e.teamId)} are retooling: expect them to sell` : `The ${team(e.teamId)} are back in the race`);
          break;
        case 'SEASON_PREVIEW':
          add(e, 'league', `Season preview: the favorites are ${e.favorites.map(f => `${ab(f.teamId)} (${Math.round(f.odds * 100)}%)`).join(', ')}; long shots ${e.longShots.map(f => ab(f.teamId)).join(', ')}`, { teamIds: e.favorites.map(f => f.teamId) });
          break;
        case 'CALENDAR':
          if (e.id === 'TRADE_DEADLINE') {
            const season = s.history.trades.filter(x => x.season === s.calendar.season), late = season.filter(x => U.daysBetween(x.date, e.date) < CONFIG.trade.classify.deadlineDays);
            add(e, 'trade', `The trade deadline has passed: ${late.length} trades in the final two weeks, ${season.length} this season`, { teamIds: [] });
          }
          break;
        case 'FREE_AGENCY':
          if (e.top && e.top.length) add(e, 'signing', `Free agency opens. Top of the market: ${e.top.map(id => { const q = s.players[id]; return `${who(id)} (${q.position}, ${q.ovr})`; }).join(', ')}`, { teamIds: [] });
          break;
        default:
      }
    }
    if (s.news.length > N.max) s.news.splice(0, s.news.length - N.max);
  }
  return { TAGS, post };
})();

// ════════════════════════════════════════════════════════════════════════════
// §14 Condition — energy and injuries (BLUEPRINT §2.2)
// ════════════════════════════════════════════════════════════════════════════

const Condition = (() => {
  const C = CONFIG.condition, I = CONFIG.injury;
  const staminaFactor = p => C.drain.staminaMid - p.attributes.stamina / C.drain.staminaDiv;

  function drain(p, toiSec, isGoalie) {
    const d = isGoalie ? C.drain.goalie * staminaFactor(p) * (toiSec / 3600)
                       : C.drain.skater * (toiSec / 60 / C.drain.skaterRefToi) * staminaFactor(p);
    p.condition.energy = Math.max(0, p.condition.energy - d);
  }

  function injuryChance(p, toiSec, isGoalie) {
    const exposure = isGoalie ? I.goalieFactor * toiSec / 3600 : toiSec / 60 / I.refToi;
    return I.perGame * exposure * p.dev.injuryProneness * (1.6 - p.attributes.durability / 100)
         * (p.condition.energy < I.lowEnergyBelow ? I.lowEnergyMult : 1);
  }

  function injure(s, rng, p, date, cause, events) {
    const sev = I.severities[rng.weightedIndex(I.severities.map(x => x.p))];
    const days = rng.int(sev.days[0], sev.days[1]);
    p.condition.injury = { type: rng.pick(sev.types), severity: sev.key, daysOut: days, since: date, cause };
    events.push({ kind: 'INJURY', date, playerId: p.id, teamId: p.teamId, days, severity: sev.key, type: p.condition.injury.type, cause });
  }

  // After a game: every player who dressed loses energy and may get hurt (chance computed before the drain).
  function afterGame(s, g, box, rng, events) {
    for (const [id, x] of Object.entries(box.skaters)) {
      const p = s.players[id], chance = injuryChance(p, x.toi, false);
      drain(p, x.toi, false);
      if (rng.next() < chance) injure(s, rng, p, g.date, 'game', events);
    }
    for (const x of box.goalies) {
      const p = s.players[x.id], chance = injuryChance(p, x.toi, true);
      drain(p, x.toi, true);
      if (rng.next() < chance) injure(s, rng, p, g.date, 'game', events);
    }
  }

  // Overnight: everyone recovers energy and counts down injuries; rostered players can get hurt in practice.
  function nightly(s, rng, playedToday, date, events) {
    for (const p of Object.values(s.players)) {
      if (p.assignment === 'RETIRED') continue;
      const c = p.condition;
      c.energy = Math.min(100, c.energy + C.recovery.base + C.recovery.perStamina * p.attributes.stamina + (playedToday.has(p.id) ? 0 : C.recovery.restBonus));
      if (c.injury) {
        if (--c.injury.daysOut <= 0) { events.push({ kind: 'RETURN', date, playerId: p.id, teamId: p.teamId, type: c.injury.type }); c.injury = null; }
      } else if ((p.assignment === 'NHL' || p.assignment === 'AHL') && !playedToday.has(p.id) && rng.next() < I.practicePerDay) {
        injure(s, rng, p, date, 'practice', events);
      }
    }
  }

  return { drain, injuryChance, injure, afterGame, nightly };
})();

// ════════════════════════════════════════════════════════════════════════════
// §15 Roster — NHL/AHL moves: injured reserve, call-ups, send-downs (through waivers), AHL tryouts (PTO),
//     cap compliance, summer sorting and training-camp cuts.
//     AI orgs are managed automatically every morning; so is the user's org when settings.autoRoster is on.
// ════════════════════════════════════════════════════════════════════════════

const Roster = (() => {
  const R = CONFIG.roster, NEED = { F: 12, D: 6, G: 2 };
  const group = p => (p.position === 'G' ? 'G' : p.position === 'D' ? 'D' : 'F');
  const isActive = p => p.rosterStatus !== 'IR' && p.rosterStatus !== 'LTIR';
  const healthy = p => !p.condition.injury && !p.waivers;
  const byOvr = (a, b) => b.ovr - a.ovr || (a.id < b.id ? -1 : 1);
  const nhl = (s, org) => s.teams[org].roster.nhl.map(id => s.players[id]);
  const ahl = (s, org) => s.teams[org].roster.ahl.map(id => s.players[id]);
  const count = list => { const c = { F: 0, D: 0, G: 0 }; for (const p of list) c[group(p)]++; return c; };
  const isPTO = p => !!p.contract && p.contract.type === 'PTO';
  // Who goes down first: emergency recalls, then players who can go without waivers, then the lowest-rated.
  const downOrder = (a, b) => (b.emergencyRecall ? 1 : 0) - (a.emergencyRecall ? 1 : 0)
    || (Contracts.waiverExempt(b) ? 1 : 0) - (Contracts.waiverExempt(a) ? 1 : 0) || a.ovr - b.ovr || (a.id < b.id ? 1 : -1);

  function status(s, org) {
    const active = nhl(s, org).filter(isActive);
    return { active: active.length, ready: count(active.filter(healthy)), contracts: Contracts.contractCount(s, org) };
  }

  // What stops this org's NHL team from playing tonight.
  function problems(s, org) {
    const st = status(s, org), out = [];
    if (st.active > R.nhlMax) out.push(`${st.active} players on the active roster (max ${R.nhlMax}): send someone down`);
    if (st.ready.F + st.ready.D < R.minSkatersDressed) out.push(`only ${st.ready.F + st.ready.D} healthy skaters (need ${R.minSkatersDressed}): call someone up`);
    if (st.ready.G < R.minGoaliesDressed) out.push(`only ${st.ready.G} healthy goalie(s) (need ${R.minGoaliesDressed}): call one up`);
    const over = -Contracts.capSpace(s, org);
    if (over > 0) out.push(`payroll is ${U.money(over)} over the cap: send a player down (or buy one out in the offseason)`);
    return out;
  }

  const log = (s, date, type, p, teamId, note = '') => s.transactions.push({ date, type, playerId: p.id, teamId, note });
  function move(s, p, from, to) {
    const r = s.teams[p.teamId].roster;
    r[from] = r[from].filter(id => id !== p.id);
    r[to].push(p.id);
    p.assignment = to === 'nhl' ? 'NHL' : 'AHL';
    p.rosterStatus = 'ACTIVE';
  }

  const fitsCap = (s, p) => Contracts.callUpCost(p.contract) <= Contracts.capSpace(s, p.teamId) + 1;

  function callUp(s, playerId, date, { emergency = false } = {}) {
    const p = s.players[playerId];
    if (!p || !p.teamId || !s.teams[p.teamId].roster.ahl.includes(playerId)) throw new Error('Only players on your AHL roster can be called up');
    if (isPTO(p)) throw new Error(`${Select.fullName(p)} is on an AHL tryout and can't be called up`);
    if (!p.contract) throw new Error(`${Select.fullName(p)} has no NHL contract`);
    if (status(s, p.teamId).active >= R.nhlMax) throw new Error(`The active roster is full (${R.nhlMax}): send someone down first`);
    if (p.waivers) throw new Error(`${Select.fullName(p)} is on waivers`);
    if (!emergency && !fitsCap(s, p)) throw new Error(`Not enough cap space for ${Select.fullName(p)} (${U.money(Contracts.callUpCost(p.contract))}; space ${U.money(Math.max(0, Contracts.capSpace(s, p.teamId)))})`);
    move(s, p, 'ahl', 'nhl');
    if (emergency) p.emergencyRecall = true;
    log(s, date, emergency ? 'EMERGENCY_RECALL' : 'CALL_UP', p, p.teamId);
    return p;
  }

  // In-season, a player who isn't waiver-exempt goes on waivers first: he sits on the AHL list, unavailable,
  // until tomorrow morning, when any NHL team may claim him (Roster.processWaivers).
  function sendDown(s, playerId, date) {
    const p = s.players[playerId];
    if (!p || !p.teamId || !s.teams[p.teamId].roster.nhl.includes(playerId)) throw new Error('Only players on your NHL roster can be sent down');
    if (p.rosterStatus === 'IR' || p.rosterStatus === 'LTIR') throw new Error(`${Select.fullName(p)} is on injured reserve`);
    const waive = Contracts.waiversApply(s) && !Contracts.waiverExempt(p);
    move(s, p, 'nhl', 'ahl');
    delete p.emergencyRecall;
    if (waive) {
      p.waivers = { placedOn: date, fromTeamId: p.teamId };
      s.pending.waivers.push({ playerId: p.id, fromTeamId: p.teamId, placedOn: date, userClaim: false });
    }
    log(s, date, waive ? 'WAIVE' : 'SEND_DOWN', p, p.teamId);
    return p;
  }

  function placeOnIR(s, p, date) {
    const long = p.condition.injury && p.condition.injury.daysOut >= CONFIG.injury.ltirDays;
    if (long && p.contract) {
      const space = Contracts.capSpace(s, p.teamId);
      p.ltirRelief = Math.max(0, p.contract.capHit - Math.max(0, space));
    }
    p.rosterStatus = long ? 'LTIR' : 'IR';
    log(s, date, p.rosterStatus, p, p.teamId, p.condition.injury ? p.condition.injury.type : '');
  }
  function activate(s, p, date) { p.rosterStatus = 'ACTIVE'; delete p.ltirRelief; log(s, date, 'ACTIVATE', p, p.teamId); }

  // ── Waivers ──
  // Claim order: worst points percentage first (last season's table early in the season).
  function claimOrder(s) {
    const last = s.history.seasons && s.history.seasons[s.history.seasons.length - 1];
    const lastPct = last ? Object.fromEntries(last.nhl.map(r => [r[0], r[5] / Math.max(1, 2 * r[1])])) : {};
    const pct = t => (t.record.gp >= 10 ? t.record.pts / (2 * t.record.gp) : lastPct[t.id] !== undefined ? lastPct[t.id] : 0.5);
    return Select.nhlTeams(s).sort((a, b) => pct(a) - pct(b) || (a.id < b.id ? -1 : 1)).map(t => t.id);
  }
  // Would this AI team claim p? He has to beat its weakest dressed player at his position, on a sane contract.
  function wantsClaim(s, org, p) {
    const W = CONFIG.waivers, g = group(p);
    if (U.seasonAge(p.birthDate, s.calendar.season) > W.claimMaxAge) return false;
    if (p.contract.capHit > W.claimMaxOverpay * Contracts.fairCap(p.ovr, p.position)) return false;
    if (Contracts.capSpace(s, org) < p.contract.capHit || Contracts.contractCount(s, org) >= R.contractMax) return false;
    const mine = nhl(s, org).filter(x => group(x) === g && healthy(x) && isActive(x)).map(x => x.ovr).sort((a, b) => b - a);
    const weakest = mine.length >= NEED[g] ? mine[NEED[g] - 1] : 0;
    return p.ovr >= weakest + W.claimMargin;
  }
  function processWaivers(s, date, events) {
    const due = s.pending.waivers.filter(w => w.placedOn < date);
    if (!due.length) return;
    s.pending.waivers = s.pending.waivers.filter(w => w.placedOn >= date);
    const order = claimOrder(s), user = s.meta.userTeamId;
    for (const w of due) {
      const p = s.players[w.playerId];
      if (!p || !p.waivers || p.teamId !== w.fromTeamId) continue;
      delete p.waivers;
      const claimer = order.find(org => org !== w.fromTeamId && (org === user
        ? w.userClaim && Contracts.capSpace(s, org) >= p.contract.capHit && Contracts.contractCount(s, org) < R.contractMax
        : wantsClaim(s, org, p)));
      if (!claimer) { events.push({ kind: 'WAIVERS', date, type: 'CLEARED', playerId: p.id, teamId: w.fromTeamId }); continue; }
      const from = s.teams[w.fromTeamId].roster;
      from.ahl = from.ahl.filter(id => id !== p.id);
      p.teamId = claimer; p.assignment = 'NHL'; p.rosterStatus = 'ACTIVE';
      s.teams[claimer].roster.nhl.push(p.id);
      log(s, date, 'WAIVER_CLAIM', p, claimer, `from ${w.fromTeamId}`);
      events.push({ kind: 'WAIVERS', date, type: 'CLAIMED', playerId: p.id, teamId: claimer, fromTeamId: w.fromTeamId });
      refreshLines(s, w.fromTeamId); refreshLines(s, claimer);
    }
  }

  // Get under the cap ceiling: swap expensive NHL players for cheaper AHL ones at the same position (or just
  // send down a surplus player). Each move saves the cap hit up to the buried allowance.
  function ensureCap(s, org, date, moves) {
    for (let guard = 0; guard < 8 && Contracts.capSpace(s, org) < 0; guard++) {
      const st = status(s, org);
      let best = null;
      for (const d of nhl(s, org).filter(p => isActive(p) && p.contract)) {
        const save = Contracts.callUpCost(d.contract), g = group(d);
        if (st.ready[g] > NEED[g] && healthy(d)) { const v = save - 0.05 * 1e6 * d.ovr / 10; if (!best || v > best.v) best = { v, d, u: null, save }; }
        for (const u of ahl(s, org).filter(x => group(x) === g && healthy(x) && x.contract && !isPTO(x))) {
          const net = save - Contracts.callUpCost(u.contract);
          if (net <= 0) continue;
          const v = net - 50_000 * Math.max(0, d.ovr - u.ovr);
          if (!best || v > best.v) best = { v, d, u, save: net };
        }
      }
      if (!best) return false;
      const g = group(best.d);
      sendDown(s, best.d.id, date); moves.push([best.d.waivers ? 'WAIVE' : 'SEND_DOWN', best.d]);
      if (best.u && status(s, org).ready[g] < NEED[g]) {
        const emergency = !fitsCap(s, best.u);
        callUp(s, best.u.id, date, { emergency }); moves.push([emergency ? 'EMERGENCY_RECALL' : 'CALL_UP', best.u]);
      }
    }
    return Contracts.capSpace(s, org) >= 0;
  }

  // ── Summer and training camp ──
  // The org's best players by position: 2 G, 8 D, 13 F (topped up to 23 with the best remaining skaters).
  function bestRoster(players) {
    const pick = (g, n) => players.filter(p => group(p) === g).sort(byOvr).slice(0, n);
    const chosen = new Set([...pick('G', 2), ...pick('D', 8), ...pick('F', 13)].map(p => p.id));
    for (const p of players.filter(x => group(x) !== 'G' && !chosen.has(x.id)).sort(byOvr)) { if (chosen.size >= R.nhlMax) break; chosen.add(p.id); }
    return chosen;
  }
  // Offseason (no waivers): AI orgs put their best 23 on the NHL list, if that fits under the cap.
  function offseasonSort(s, org) {
    const t = s.teams[org], all = [...nhl(s, org), ...ahl(s, org)].filter(p => p.contract && !isPTO(p));
    const chosen = bestRoster(all);
    const before = { nhl: t.roster.nhl.slice(), ahl: t.roster.ahl.slice() };
    const keepPTO = t.roster.ahl.filter(id => isPTO(s.players[id]));
    t.roster.nhl = all.filter(p => chosen.has(p.id)).map(p => p.id);
    t.roster.ahl = [...all.filter(p => !chosen.has(p.id)).map(p => p.id), ...keepPTO];
    if (Contracts.capPayroll(s, org) > CONFIG.cap.upper && Contracts.capPayroll(s, org) > payrollOf(s, org, before)) { t.roster.nhl = before.nhl; t.roster.ahl = before.ahl; }
    for (const id of t.roster.nhl) s.players[id].assignment = 'NHL';
    for (const id of t.roster.ahl) s.players[id].assignment = 'AHL';
  }
  const payrollOf = (s, org, lists) => {
    const t = s.teams[org], cur = { nhl: t.roster.nhl, ahl: t.roster.ahl };
    t.roster.nhl = lists.nhl; t.roster.ahl = lists.ahl;
    const v = Contracts.capPayroll(s, org);
    t.roster.nhl = cur.nhl; t.roster.ahl = cur.ahl;
    return v;
  };
  // Training camp: the best 23 make the team (non-exempt cuts go through waivers), then cap compliance.
  function preseasonCuts(s, org, date, moves, rng) {
    for (const p of [...nhl(s, org), ...ahl(s, org)]) if (healthy(p) && !isActive(p)) activate(s, p, date);
    const all = [...nhl(s, org), ...ahl(s, org)].filter(p => p.contract && !isPTO(p) && !p.waivers);
    const chosen = bestRoster(all.filter(p => !p.condition.injury || p.condition.injury.daysOut < 14));
    for (const p of nhl(s, org)) if (!chosen.has(p.id) && isActive(p) && !(p.condition.injury && p.condition.injury.daysOut >= 14)) { sendDown(s, p.id, date); moves.push([p.waivers ? 'WAIVE' : 'SEND_DOWN', p]); }
    for (const p of ahl(s, org)) {
      if (!chosen.has(p.id) || !p.contract || isPTO(p) || status(s, org).active >= R.nhlMax) continue;
      if (fitsCap(s, p)) { callUp(s, p.id, date); moves.push(['CALL_UP', p]); }
    }
    fixNHL(s, org, date, moves, rng);
    ensureCap(s, org, date, moves);
  }

  // AHL emergency: best free agent at the position on a professional tryout; if the pool is empty,
  // a minor-league depth player is "called up from the ECHL" (generated).
  function signPTO(s, rng, org, grp, date) {
    const fits = p => group(p) === grp && healthy(p);
    let p = Select.freeAgents(s).filter(fits).sort(byOvr)[0];
    if (!p) {
      const pos = grp === 'F' ? rng.pick(['C', 'LW', 'RW']) : grp;
      p = Factory.registerPlayer(s, Factory.makePlayer(rng, { pos, tier: 'AHL_DEPTH', age: rng.int(23, 30), season: s.calendar.season }));
    }
    s.pending.faOffers = s.pending.faOffers.filter(o => o.playerId !== p.id);
    p.market = null;
    p.teamId = org; p.assignment = 'AHL'; p.rosterStatus = 'ACTIVE';
    p.contract = { type: 'PTO', capHit: 0, yearsRemaining: 1, expiresAfterSeason: s.calendar.season, ahlSalary: 50_000, clauses: { nmc: false, ntc: false } };
    s.teams[org].roster.ahl.push(p.id);
    log(s, date, 'SIGN_PTO', p, org);
    return p;
  }

  function release(s, p, date) {
    const org = p.teamId, r = s.teams[org].roster;
    r.nhl = r.nhl.filter(id => id !== p.id); r.ahl = r.ahl.filter(id => id !== p.id);
    p.teamId = null; p.assignment = 'FA'; p.contract = null; p.rosterStatus = 'ACTIVE';
    log(s, date, 'RELEASE', p, org);
  }

  // Nobody in the system can fill a position (everyone hurt): sign the best free agent there (or a generated
  // minor-leaguer) to a one-year minimum deal in the AHL, ready to be called up.
  function emergencySign(s, rng, org, grp, date) {
    let p = Select.freeAgents(s).filter(x => group(x) === grp && healthy(x)).sort(byOvr)[0];
    if (!p) {
      const pos = grp === 'F' ? rng.pick(['C', 'LW', 'RW']) : grp;
      p = Factory.registerPlayer(s, Factory.makePlayer(rng, { pos, tier: 'AHL_DEPTH', age: rng.int(23, 30), season: s.calendar.season }));
      p.career.signedAt = 22; p.career.proSeasons = U.seasonAge(p.birthDate, s.calendar.season) - 22;
    }
    s.pending.faOffers = s.pending.faOffers.filter(o => o.playerId !== p.id);
    p.market = null; delete p.lastTeamId;
    p.teamId = org; p.assignment = 'AHL'; p.rosterStatus = 'ACTIVE';
    p.contract = Contracts.newContract(CONFIG.cap.minSalary, 1, s.calendar.season);
    if (p.career.signedAt === null || p.career.signedAt === undefined) p.career.signedAt = U.seasonAge(p.birthDate, s.calendar.season);
    s.teams[org].roster.ahl.push(p.id);
    log(s, date, 'EMERGENCY_SIGN', p, org);
    return p;
  }

  function fixNHL(s, org, date, moves, rng = null) {
    // Free one active spot: send down the weakest healthy player from a position group with a surplus,
    // otherwise move the longest-injured active player to IR.
    const makeRoom = () => {
      for (let guard = 0; status(s, org).active >= R.nhlMax && guard < 10; guard++) {
        const st = status(s, org);
        const down = nhl(s, org).filter(p => isActive(p) && healthy(p) && st.ready[group(p)] > NEED[group(p)]).sort(downOrder)[0];
        if (down) { sendDown(s, down.id, date); moves.push(['SEND_DOWN', down]); continue; }
        const hurt = nhl(s, org).filter(p => isActive(p) && !healthy(p)).sort((a, b) => b.condition.injury.daysOut - a.condition.injury.daysOut)[0];
        if (!hurt) return false;
        placeOnIR(s, hurt, date); moves.push(['IR', hurt]);
      }
      return status(s, org).active < R.nhlMax;
    };
    for (const grp of ['G', 'D', 'F']) {
      for (let guard = 0; status(s, org).ready[grp] < NEED[grp] && guard < 6; guard++) {
        let pool = ahl(s, org).filter(p => group(p) === grp && healthy(p) && p.contract && !isPTO(p));
        if (!pool.length && rng && (Contracts.contractCount(s, org) < R.contractMax || s.teams[org].controller !== 'USER' || s.settings.autoRoster !== false)) {
          const p = emergencySign(s, rng, org, grp, date); moves.push(['EMERGENCY_SIGN', p]); pool = [p];
        }
        if (!pool.length || !makeRoom()) break;
        // Best player who fits under the cap; if nobody fits, the cheapest comes up as an emergency recall.
        const fit = pool.filter(p => fitsCap(s, p)).sort(byOvr)[0];
        const up = fit || pool.sort((a, b) => a.contract.capHit - b.contract.capHit || byOvr(a, b))[0];
        callUp(s, up.id, date, { emergency: !fit }); moves.push([fit ? 'CALL_UP' : 'EMERGENCY_RECALL', up]);
      }
    }
    // Emergency recalls go back as soon as the team can dress a full lineup without them.
    for (const p of nhl(s, org).filter(x => x.emergencyRecall && isActive(x) && healthy(x))) {
      if (status(s, org).ready[group(p)] > NEED[group(p)]) { sendDown(s, p.id, date); moves.push(['SEND_DOWN', p]); }
    }
    for (let guard = 0; status(s, org).active > R.nhlMax && guard < 10; guard++) {
      const st = status(s, org);
      const down = nhl(s, org).filter(p => isActive(p) && healthy(p) && st.ready[group(p)] > NEED[group(p)]).sort(downOrder)[0];
      if (down) { sendDown(s, down.id, date); moves.push(['SEND_DOWN', down]); continue; }
      const hurt = nhl(s, org).filter(p => isActive(p) && !healthy(p))[0];
      if (!hurt) break;
      placeOnIR(s, hurt, date); moves.push(['IR', hurt]);
    }
  }

  function fixAHL(s, rng, org, date, moves) {
    const ready = count(ahl(s, org).filter(healthy));
    for (const grp of ['G', 'D', 'F']) {
      while (ready[grp] < NEED[grp]) { moves.push(['SIGN_PTO', signPTO(s, rng, org, grp, date)]); ready[grp]++; }
    }
    for (const p of ahl(s, org).filter(isPTO)) {              // release tryouts once they're surplus
      const now = count(ahl(s, org).filter(healthy));
      if (healthy(p) && now[group(p)] > NEED[group(p)] + 1) { release(s, p, date); moves.push(['RELEASE', p]); }
    }
  }

  // Morning roster pass for every org (in-season). Returns events for the user's org.
  function dailyMoves(s, rng, date, events) {
    const user = s.meta.userTeamId;
    processWaivers(s, date, events);
    for (const t of Select.nhlTeams(s)) {
      const moves = [];
      for (const p of nhl(s, t.id)) {
        if (p.condition.injury && isActive(p) && p.condition.injury.daysOut >= CONFIG.injury.irDays) { placeOnIR(s, p, date); moves.push(['IR', p]); }
        else if (!p.condition.injury && !isActive(p)) { activate(s, p, date); moves.push(['ACTIVATE', p]); }
      }
      if (t.id !== user || s.settings.autoRoster !== false) { fixNHL(s, t.id, date, moves, rng); ensureCap(s, t.id, date, moves); }
      fixAHL(s, rng, t.id, date, moves);
      if (moves.length) refreshLines(s, t.id);
      if (t.id === user) for (const [type, p] of moves) events.push({ kind: 'ROSTER', date, type, playerId: p.id, teamId: t.id, auto: true });
    }
  }

  // After roster moves, rebuild auto lines (manual lines are kept if still legal) for the org's two teams.
  function refreshLines(s, org) { for (const id of [org, s.teams[org].affiliateId]) Lineup.prepare(s, id); }

  return { NEED, group, isActive, healthy, status, problems, callUp, sendDown, placeOnIR, activate, signPTO, release, dailyMoves, refreshLines,
           claimOrder, wantsClaim, processWaivers, ensureCap, bestRoster, offseasonSort, preseasonCuts, fixNHL, fixAHL };
})();

// ════════════════════════════════════════════════════════════════════════════
// §16 Playoffs — 16 teams (top 3 per division + 2 wild cards per conference), best-of-7, 2-2-1-1-1
// ════════════════════════════════════════════════════════════════════════════

const Playoffs = (() => {
  const P = CONFIG.playoffs;

  function seedTable(s) {
    const league = Stats.standings(s, 'NHL', 'league');
    const rank = Object.fromEntries(league.map((r, i) => [r.teamId, i]));
    const byDiv = Stats.standings(s, 'NHL', 'division');
    const conferences = [...new Set(league.map(r => r.conference))].sort();
    const series = [], labels = {};
    for (const conf of conferences) {
      const divs = Object.keys(byDiv).filter(d => byDiv[d][0].conference === conf).sort();
      const tops = divs.map(d => byDiv[d].slice(0, P.divisionSpots).map(r => r.teamId));
      const taken = new Set(tops.flat());
      const wc = league.filter(r => r.conference === conf && !taken.has(r.teamId)).slice(0, P.wildCards).map(r => r.teamId);
      divs.forEach((d, k) => tops[k].forEach((id, n) => { labels[id] = `${d.slice(0, 3)} ${n + 1}`; }));
      wc.forEach((id, n) => { labels[id] = `WC${n + 1}`; });
      const better = rank[tops[0][0]] < rank[tops[1][0]] ? 0 : 1;       // best division winner draws WC2
      divs.forEach((d, k) => {
        series.push([tops[k][0], k === better ? wc[1] : wc[0], conf]);
        series.push([tops[k][1], tops[k][2], conf]);
      });
    }
    return { series, rank, labels };
  }

  function makeSeries(s, round, idx, a, b, conference) {
    const rank = s.playoffs.rank, [high, low] = rank[a] <= rank[b] ? [a, b] : [b, a];
    return { id: `R${round}-${idx + 1}`, round, conference, high, low, wins: { [high]: 0, [low]: 0 }, games: [], winner: null, loser: null };
  }

  function scheduleGame(s, sr, date) {
    const n = sr.games.length, highHome = P.homePattern[n] === 1;
    const id = U.nextId(s, 'game', 'g_', 6);
    s.games[id] = { id, season: s.playoffs.season, date, league: 'NHL', type: 'PO', homeId: highHome ? sr.high : sr.low, awayId: highHome ? sr.low : sr.high,
                    played: false, result: null, boxScore: null, seriesId: sr.id, gameNumber: n + 1 };
    (s.scheduleByDate[date] = s.scheduleByDate[date] || []).push(id);
    sr.games.push(id);
  }

  function start(s, events) {
    const { series, rank, labels } = seedTable(s);
    s.playoffs = { season: s.calendar.season, rank, labels, rounds: [], championId: null, finalistId: null };
    const first = U.addDays(s.calendar.date, P.startGapDays - 1);
    s.playoffs.rounds.push(series.map(([a, b, conf], i) => makeSeries(s, 1, i, a, b, conf)));
    for (const sr of s.playoffs.rounds[0]) scheduleGame(s, sr, first);
    const user = s.meta.userTeamId, mine = s.playoffs.rounds[0].find(sr => sr.high === user || sr.low === user);
    events.push({ kind: 'PLAYOFFS_START', date: s.calendar.date, teamId: user, qualified: !!mine, seriesId: mine ? mine.id : null });
  }

  const current = s => s.playoffs.rounds[s.playoffs.rounds.length - 1];
  const seriesById = (s, id) => s.playoffs.rounds.flat().find(sr => sr.id === id);
  const seriesOf = (s, teamId) => {
    for (let r = s.playoffs.rounds.length - 1; r >= 0; r--) { const sr = s.playoffs.rounds[r].find(x => x.high === teamId || x.low === teamId); if (sr) return sr; }
    return null;
  };

  function afterGames(s, playedIds, events) {
    for (const id of playedIds) {
      const g = s.games[id];
      if (g.type !== 'PO') continue;
      const sr = seriesById(s, g.seriesId);
      const w = g.result.home > g.result.away ? g.homeId : g.awayId;
      sr.wins[w]++;
      if (sr.wins[w] === P.seriesWins) {
        sr.winner = w; sr.loser = w === sr.high ? sr.low : sr.high;
        events.push({ kind: 'SERIES', date: g.date, seriesId: sr.id, round: sr.round, winner: sr.winner, loser: sr.loser, wins: `${sr.wins[sr.winner]}–${sr.wins[sr.loser]}` });
      } else scheduleGame(s, sr, U.addDays(g.date, P.gameGapDays));
    }
    const round = current(s);
    if (!round.every(sr => sr.winner)) return;
    if (round.length === 1) {
      s.playoffs.championId = round[0].winner; s.playoffs.finalistId = round[0].loser;
      events.push({ kind: 'CHAMPION', date: s.games[round[0].games[round[0].games.length - 1]].date, teamId: round[0].winner, finalistId: round[0].loser });
      return;
    }
    const last = round.flatMap(sr => sr.games.map(id => s.games[id].date)).sort().pop();
    const r = round[0].round + 1;
    const next = [];
    for (let i = 0; i < round.length; i += 2) {
      const conf = round[i].conference === round[i + 1].conference ? round[i].conference : null;
      next.push(makeSeries(s, r, i / 2, round[i].winner, round[i + 1].winner, conf));
    }
    s.playoffs.rounds.push(next);
    for (const sr of next) scheduleGame(s, sr, U.addDays(last, P.roundGapDays));
  }

  const roundName = n => ['First round', 'Second round', 'Conference final', 'Final'][n - 1] || `Round ${n}`;
  return { seedTable, start, afterGames, seriesById, seriesOf, current, roundName };
})();

// ════════════════════════════════════════════════════════════════════════════
// §17 Draft — lottery, class generation, AI draft boards, picks
// ════════════════════════════════════════════════════════════════════════════

const Draft = (() => {
  const D = CONFIG.draft;
  const pickKey = (year, round, org) => `pk_${year}_${round}_${org}`;
  const hashNormal = key => Math.sqrt(-2 * Math.log(Math.max(1e-9, U.hash01(`${key}:a`)))) * Math.cos(2 * Math.PI * U.hash01(`${key}:b`));

  // Non-playoff teams worst-first with a lottery (lotteryDraws draws; nobody jumps more than maxJump places),
  // then playoff teams by the round they went out in (fewer points first). The champion picks last.
  function order(s, rng) {
    const worstFirst = Stats.standings(s, 'NHL', 'league').reverse();
    const out = {};
    if (s.playoffs) {
      for (const round of s.playoffs.rounds) for (const sr of round) if (sr.loser) out[sr.loser] = sr.round;
      if (s.playoffs.championId) out[s.playoffs.championId] = 5;
    }
    const non = worstFirst.filter(r => !out[r.teamId]).map(r => r.teamId);
    const po = worstFirst.filter(r => out[r.teamId]).sort((a, b) => out[a.teamId] - out[b.teamId]).map(r => r.teamId);
    // Draw d is for pick d. A winner more than maxJump places back moves up exactly maxJump, and pick d goes to
    // the worst remaining team instead. Everyone else fills the open picks in standings order.
    const orig = Object.fromEntries(non.map((id, i) => [id, i]));
    const at = {}, placed = new Set(), winners = [];
    const put = (id, slot) => { while (at[slot] !== undefined) slot++; at[slot] = id; placed.add(id); };
    for (let d = 0; d < Math.min(D.lotteryDraws, non.length); d++) {
      if (at[d] !== undefined) continue;
      const cands = non.filter(id => !placed.has(id));
      const w = cands[rng.weightedIndex(cands.map(id => D.lotteryOdds[orig[id]] || 0.5))];
      winners.push(w);
      if (orig[w] - d <= D.maxJump) put(w, d);
      else { put(w, orig[w] - D.maxJump); put(non.find(id => !placed.has(id)), d); }
    }
    const rest = non.filter(id => !placed.has(id)), ord = [];
    for (let i = 0; i < non.length; i++) ord.push(at[i] !== undefined ? at[i] : rest.shift());
    const lottery = winners.map(id => ({ teamId: id, from: orig[id] + 1, to: ord.indexOf(id) + 1 }));
    return { order: [...ord, ...po], lottery, nonPlayoff: non.length };
  }

  // A class of 18-year-olds plus undrafted 19- and 20-year-olds re-entering. The consensus ranking carries
  // scouting error (scoutSd); each team adds its own (teamSd) when it builds its board.
  function generateClass(s, rng, year) {
    for (let i = 0; i < D.classSize; i++) {
      const p = Factory.makePlayer(rng, { pos: rng.weightedKey(D.positions), tier: rng.weightedKey(D.classTiers), age: 18, season: year });
      Factory.registerPlayer(s, p);
      p.assignment = 'PROSPECT'; p.teamId = null;
    }
    const pool = Object.values(s.players).filter(p => p.assignment === 'PROSPECT');
    for (const p of pool) {
      p.scouting.consensus = U.round(p.dev.potential + rng.normal(0, D.scoutSd) + D.readiness * (p.ovr - p.dev.potential + 17)
        - (p.position === 'G' ? D.goalieDiscount : 0), 2);
    }
    return pool.sort((a, b) => b.scouting.consensus - a.scouting.consensus || (a.id < b.id ? -1 : 1)).map(p => p.id);
  }

  // SEASON_END: order, lottery and class for the June draft.
  function setup(s, rng, events) {
    const season = s.calendar.season, year = season + 1;
    const { order: ord, lottery, nonPlayoff } = order(s, rng);
    const picks = [];
    for (let round = 1; round <= D.rounds; round++) {
      ord.forEach((org, i) => {
        const id = pickKey(year, round, org);
        if (!s.draftPicks[id]) s.draftPicks[id] = { id, year, round, originalTeamId: org, ownerTeamId: org, usedOnPlayerId: null };
        picks.push({ id, overall: (round - 1) * ord.length + i + 1, round, original: org, teamId: null, playerId: null });
      });
    }
    const date = [U.seasonDate(season, D.mmdd), U.addDays(s.calendar.date, D.minDaysAfterFinal)].sort()[1];
    s.draft = { year, season, date, order: ord, lottery, nonPlayoff, picks, index: 0, pool: generateClass(s, rng, year), done: false, finished: false };
    events.push({ kind: 'DRAFT_LOTTERY', date: s.calendar.date, year, lottery,
                  userPicks: picks.filter(pk => ownerOf(s, pk) === s.meta.userTeamId).map(pk => pk.overall) });
  }

  const ownerOf = (s, pk) => (s.draftPicks[pk.id] ? s.draftPicks[pk.id].ownerTeamId : pk.original);
  const current = s => (s.draft && !s.draft.done ? s.draft.picks[s.draft.index] : null);
  const userOnClock = s => { const pk = current(s); return !!pk && ownerOf(s, pk) === s.meta.userTeamId && !s.settings.autoDraft; };
  const boardScore = (s, org, p) => p.scouting.consensus + D.teamSd * hashNormal(`${s.meta.seed}:${org}:${p.id}`);
  function aiChoice(s, org) {
    let best = null, bv = -Infinity;
    for (const id of s.draft.pool) { const v = boardScore(s, org, s.players[id]); if (v > bv) { bv = v; best = id; } }
    return best;
  }

  function pick(s, playerId, events) {
    const d = s.draft, pk = current(s);
    if (!pk) throw new Error('The draft is over');
    const idx = d.pool.indexOf(playerId);
    if (idx < 0) throw new Error('That player is not available');
    const org = ownerOf(s, pk), p = s.players[playerId];
    d.pool.splice(idx, 1);
    p.teamId = org;
    p.assignment = DATA.nationalities[p.nationality].european && U.hash01(`${p.id}:eu`) < 0.7 ? 'EUROPE' : 'JUNIOR';
    p.career.draft = { year: d.year, round: pk.round, overall: pk.overall, teamId: org };
    s.teams[org].roster.reserve.push(p.id);
    pk.playerId = p.id; pk.teamId = org;
    s.draftPicks[pk.id].usedOnPlayerId = p.id;
    if (++d.index >= d.picks.length || !d.pool.length) d.done = true;
    s.transactions.push({ date: s.calendar.date, type: 'DRAFT', playerId: p.id, teamId: org, note: `#${pk.overall} overall` });
    events.push({ kind: 'DRAFTED', date: s.calendar.date, playerId: p.id, teamId: org, overall: pk.overall, round: pk.round });
    return pk;
  }

  // AI picks until the user is on the clock or the draft is over.
  function run(s, events) {
    while (current(s) && !userOnClock(s)) pick(s, aiChoice(s, ownerOf(s, current(s))), events);
    return { userOnClock: userOnClock(s) };
  }

  // After the draft: undrafted 18/19-year-olds re-enter next year, older ones with a future become free agents,
  // the rest leave hockey. Used picks become history; a new future draft year is created.
  function finish(s, events) {
    const d = s.draft;
    if (!d || d.finished) return;
    for (const id of d.pool) {
      const p = s.players[id];
      if (U.seasonAge(p.birthDate, d.year) < D.reentryBelowAge && p.dev.potential >= CONFIG.tiers.AHL_DEPTH[0]) continue;
      if (p.dev.potential >= D.undraftedFaPotential) { p.assignment = 'FA'; p.market = { since: s.calendar.date, decideOn: null }; }
      else { p.assignment = 'RETIRED'; p.retired = { season: d.season, age: U.seasonAge(p.birthDate, d.year), undrafted: true }; }
    }
    d.pool = [];
    s.history.draftClasses[d.year] = d.picks.map(pk => [pk.overall, pk.round, pk.teamId, pk.playerId]);
    for (const pk of d.picks) delete s.draftPicks[pk.id];
    const year = d.year + CONFIG.generation.futureDraftYears;
    for (let round = 1; round <= D.rounds; round++) {
      for (const t of Select.nhlTeams(s)) {
        const id = pickKey(year, round, t.id);
        if (!s.draftPicks[id]) s.draftPicks[id] = { id, year, round, originalTeamId: t.id, ownerTeamId: t.id, usedOnPlayerId: null };
      }
    }
    d.finished = true;
  }

  return { order, generateClass, setup, ownerOf, current, userOnClock, boardScore, aiChoice, pick, run, finish };
})();

// ════════════════════════════════════════════════════════════════════════════
// §18 Market — re-signing, qualifying offers, entry-level deals, free agency, depth signings
// ════════════════════════════════════════════════════════════════════════════

const Market = (() => {
  const M = CONFIG.market, A = CONFIG.market.ai, K = CONFIG.contracts, C = CONFIG.cap, R = CONFIG.roster, D = CONFIG.draft;
  const group = p => (p.position === 'G' ? 'G' : p.position === 'D' ? 'D' : 'F');
  const isOpen = s => !M.closedPhases.includes(s.calendar.phase);
  const name = p => Select.fullName(p);
  const log = (s, date, type, p, teamId, note = '') => s.transactions.push({ date, type, playerId: p.id, teamId, note });

  // ── Lineup strength index (CONFIG.depth): how much a player would improve an org ──
  function strength(groups) {
    let v = 0;
    for (const g of ['F', 'D', 'G']) {
      const w = CONFIG.depth[g], list = groups[g];
      for (let i = 0; i < w.length; i++) v += CONFIG.depth.mix[g] * w[i] * (i < list.length ? list[i] : 40);
    }
    return v;
  }
  function groupsOf(players) {
    const out = { F: [], D: [], G: [] };
    for (const p of players) out[group(p)].push(p.ovr);
    for (const g in out) out[g].sort((a, b) => b - a);
    return out;
  }
  const withOvr = (groups, g, ovr) => ({ ...groups, [g]: [...groups[g], ovr].sort((a, b) => b - a) });
  const gainOf = (groups, p) => strength(withOvr(groups, group(p), p.ovr)) - strength(groups);
  // Org players under contract in `season` (or qualified RFAs), excluding tryouts and long-term injuries.
  const depthPlayers = (s, org, season) => {
    const t = s.teams[org];
    return [...t.roster.nhl, ...t.roster.ahl].map(id => s.players[id])
      .filter(p => (Contracts.contractIn(p, season) || p.qualified) && !(p.condition.injury && p.condition.injury.daysOut > 60));
  };
  const orgDepth = (s, org, season = Contracts.contractStart(s)) => groupsOf(depthPlayers(s, org, season));

  // ── How players see teams ──
  function strengthTable(s) {
    const vals = Object.fromEntries(Select.nhlTeams(s).map(t => [t.id, Ratings.teamOverall(s, t.id).overall]));
    const xs = Object.values(vals), mu = U.mean(xs), sd = Math.sqrt(U.mean(xs.map(x => (x - mu) ** 2))) || 1;
    const sorted = [...xs].sort((a, b) => a - b);
    return { z: id => (vals[id] - mu) / sd, pct: id => sorted.indexOf(vals[id]) / Math.max(1, sorted.length - 1) };
  }
  const appeal = (s, p, org, table) => 1 + M.appeal.strength * p.personality.winDesire * table.z(org)
    + (org === p.lastTeamId ? M.appeal.loyalty * p.personality.loyalty : 0);

  // Will a pending UFA re-sign with his own team? Loyalty, team quality and role vs greed (stable within a season).
  function willing(s, p, table = strengthTable(s)) {
    if (Contracts.faStatus(s, p) === 'RFA') return true;
    const regular = Contracts.nhlGamesIn(p, s.calendar.season) >= 40 ? 1 : 0.3;
    const noise = U.hash01(`${s.meta.seed}:${p.id}:${s.calendar.season}:stay`);
    const v = 0.45 * p.personality.loyalty + 0.25 * table.pct(p.teamId) + 0.15 * regular - 0.2 * p.personality.greed + 0.3 * (noise - 0.5);
    return v >= K.willing;
  }

  // ── Free-agent asks and offers ──
  const daysOn = (s, p) => (p.market && p.market.since ? Math.max(0, U.daysBetween(p.market.since, s.calendar.date)) : 30);
  const decay = (s, p) => Math.max(M.floor, 1 - M.decayPerDay * daysOn(s, p));
  // A free agent's ask for `years` (before how he feels about the team making the offer).
  const ask = (s, p, years) => U.clamp(U.roundTo(Contracts.demand(s, p, years, { market: true }) * decay(s, p), C.rounding), C.minSalary, Contracts.maxContract());
  // The cap hit `org` must offer for him to accept `years`.
  const askFrom = (s, p, org, years, table = strengthTable(s)) => U.clamp(U.roundTo(ask(s, p, years) / appeal(s, p, org, table), C.rounding), C.minSalary, Contracts.maxContract());
  const maxTerm = (p, org) => (p.lastTeamId === org ? C.maxTermResign : C.maxTermFA);
  const aiTerm = (s, p, start = Contracts.contractStart(s)) => {
    const age = U.seasonAge(p.birthDate, start), cap = A.maxTermByAge.find(([a]) => age <= a)[1];
    return Math.max(1, Math.min(cap, Contracts.preferredTerm(s, p, start)));
  };
