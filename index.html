      <span>Payroll <b>${U.money(Contracts.capPayroll(s, org))}</b> <span class="muted">of ${U.money(Contracts.capCeiling(s, org))} ceiling</span></span>
      <span>Cap space <b>${U.money(Math.max(0, Contracts.capSpace(s, org)))}</b></span>
      ${early ? `<span>Next season committed <b>${U.money(Contracts.projectedPayroll(s, org, s.calendar.season + 1))}</b></span>` : ''}
      <span>Active roster <b>${st.active}/${CONFIG.roster.nhlMax}</b></span>
      <span>Contracts <b>${st.contracts}/${CONFIG.roster.contractMax}</b></span>
      ${team(org).ai && team(org).ai.strategy ? `<span>${stratBadge(org)} <span class="muted small">playoff odds ${Math.round((team(org).ai.odds || 0) * 100)}%</span></span>` : ''}
      <span class="spacer"></span>
      ${mine ? `<label class="small"><input type="checkbox" data-change="auto-roster"${s.settings.autoRoster !== false ? ' checked' : ''}> Auto-manage call-ups and injured reserve</label>` : ''}
    </div></div>`;
    const ids = tab === 'NHL' ? r.nhl : tab === 'AHL' ? r.ahl : r.reserve;
    const players = ids.map(P);
    const league = tab === 'AHL' ? 'AHL' : 'NHL';
    const groups = tab === 'NHL'
      ? [['Forwards', players.filter(p => Roster.isActive(p) && Ratings.isForward(p.position))], ['Defense', players.filter(p => Roster.isActive(p) && p.position === 'D')],
         ['Goalies', players.filter(p => Roster.isActive(p) && p.position === 'G')], ['Injured reserve', players.filter(p => !Roster.isActive(p))]]
      : [['Forwards', players.filter(p => Ratings.isForward(p.position))], ['Defense', players.filter(p => p.position === 'D')], ['Goalies', players.filter(p => p.position === 'G')]];
    const action = p => {
      if (!mine) return '';
      if (tab === 'RES') {
        const ready = Market.prospectReady(s, p);
        return `<button class="btn small${ready ? ' primary' : ''}" data-act="sign-elc" data-id="${p.id}"${s.calendar.phase === 'PLAYOFFS' ? ' disabled title="Not during the playoffs"' : ''} title="${ready ? 'Staff recommend signing him' : 'Entry-level contract'}">Sign ELC</button>`;
      }
      if (tab === 'NHL') {
        if (!Roster.isActive(p)) return '';
        const waive = Contracts.waiversApply(s) && !Contracts.waiverExempt(p);
        return `<button class="btn small" data-act="${waive ? 'waive' : 'senddown'}" data-id="${p.id}"${p.condition.injury ? ' disabled title="Injured players can\'t be sent down"' : ''}${waive ? ' title="Not waiver-exempt: he must clear waivers first"' : ''}>${waive ? 'Waive' : 'Send down'}</button>`;
      }
      const why = p.contract && p.contract.type === 'PTO' ? 'Tryout players can\'t be called up' : !p.contract ? 'No NHL contract' : p.condition.injury ? 'Injured' : p.waivers ? 'On waivers' : '';
      return `<button class="btn small" data-act="callup" data-id="${p.id}"${why ? ` disabled title="${esc(why)}"` : ''}>Call up</button>`;
    };
    const rightsNote = p => { const last = CONFIG.draft.rightsUntilAge - U.seasonAge(p.birthDate, s.calendar.season + 1); return last <= 0 ? '<span class="badge bad">Rights lapse Jul 1</span>' : last === 1 ? '<span class="badge warn">Sign by next summer</span>' : ''; };
    const contractCell = p => {
      const c = p.contract;
      if (!c) return tab === 'RES' ? `<td class="num muted">${p.career.draft ? `#${p.career.draft.overall} · ${p.career.draft.year}` : ''}</td><td class="num">${rightsNote(p)}</td>` : '<td class="num muted">unsigned</td><td></td>';
      if (c.type === 'PTO') return '<td class="num muted">tryout</td><td></td>';
      const last = c.expiresAfterSeason === s.calendar.season && !p.extension;
      return `<td class="num">${U.money(c.capHit)}${c.type === 'ELC' ? ' <span class="muted small">ELC</span>' : ''}</td><td class="num">${c.yearsRemaining}${last ? ` <span class="badge${early ? ' warn' : ''}">${Contracts.faStatus(s, p)}</span>` : ''}</td>`;
    };
    const table = (title, list) => {
      if (!list.length) return '';
      const goalie = list[0].position === 'G';
      list.sort((a, b) => b.ovr - a.ovr);
      const head = goalie ? '<th class="num">GP</th><th class="num">W-L-OT</th><th class="num">SV%</th><th class="num">GAA</th><th class="num">SO</th>'
                          : '<th class="num">GP</th><th class="num">G</th><th class="num">A</th><th class="num">P</th><th class="num">+/-</th><th class="num">TOI</th>';
      const row = p => {
        const t = totals(p, { league });
        const stats = goalie
          ? `<td class="num">${t.gp || 0}</td><td class="num">${t.gp ? `${t.w}-${t.l}-${t.otl}` : '–'}</td><td class="num">${t.sa ? pct3(1 - t.ga / t.sa) : '–'}</td><td class="num">${t.toiSec ? (t.ga * 3600 / t.toiSec).toFixed(2) : '–'}</td><td class="num">${t.so || 0}</td>`
          : `<td class="num">${t.gp || 0}</td><td class="num">${t.g || 0}</td><td class="num">${t.a || 0}</td><td class="num"><b>${(t.g || 0) + (t.a || 0)}</b></td><td class="num">${t.gp ? signed(t.pm) : '–'}</td><td class="num">${t.gp ? mmss(t.toiSec / t.gp) : '–'}</td>`;
        return `<tr><td><span class="pos">${p.position}</span></td><td>${plink(p)} ${statusBadges(p)}</td><td class="num">${age(p)}</td>
          <td>${ovr(p.ovr)}</td><td><span class="badge" title="Scouted ceiling">${ceiling(p)}</span></td>
          <td>${energyBar(p.condition.energy)}</td>${stats}
          ${contractCell(p)}<td class="num nowrap">${action(p)}</td></tr>`;
      };
      return `<div class="card"><h2>${esc(title)}<span class="right muted">${list.length}</span></h2><div class="scroll"><table class="t"><thead><tr><th></th><th>Player</th><th class="num">Age</th><th>OVR</th><th>Ceiling</th><th>Energy</th>${head}<th class="num">${tab === 'RES' ? 'Drafted' : 'Cap hit'}</th><th class="num">${tab === 'RES' ? 'Rights' : 'Yrs'}</th><th></th></tr></thead><tbody>${list.map(row).join('')}</tbody></table></div></div>`;
    };
    return `<div class="toolbar">${teamSelect}${seg('rosterTab', [['NHL', `NHL · ${team(org).abbrev}`], ['AHL', `AHL · ${team(team(org).affiliateId).abbrev}`], ['RES', 'Unsigned prospects']], tab)}</div>
      ${tab === 'NHL' ? summary : ''}
      <div class="stack">${groups.map(([title, list]) => table(title, list)).join('') || '<div class="card muted">Nobody here.</div>'}</div>`;
  }

  // ════════════════════════════════════════════════════════════════════════
  // Lines (click one player, then another, to swap them)
  // ════════════════════════════════════════════════════════════════════════
  function linesHTML() {
    const s = S(), me = user(), lu = team(me).lineup;
    if (offseason()) return `<div class="banner acc">It's the offseason. Lines are rebuilt from your roster when training camp opens on September 20.</div>`;
    const dressed = new Set([...lu.F.flat(), ...lu.D.flat(), ...lu.G]);
    const slot = (key, id, slotName) => {
      if (!id) return `<div class="slot"><span class="pos">${slotName}</span><span class="nm muted">empty</span></div>`;
      const p = P(id), f = Lineup.fit(p, slotName);
      return `<button class="slot${ui.lineSel === key ? ' sel' : ''}${f < 1 ? ' off' : ''}" data-act="slot" data-key="${key}">
        <span class="pos">${slotName}</span><span class="nm">${esc(p.lastName)}</span>${ovr(p.ovr)}
        <span class="sub">${energyBar(p.condition.energy)}${f < 1 ? `<b>${p.position} playing ${slotName} (${Math.round(f * 100)}%)</b>` : `<span>${esc(p.firstName)}</span>`} ${statusBadges(p)}</span></button>`;
    };
    const fwd = lu.F.map((l, i) => `<div class="line"><span class="lbl">L${i + 1}</span>${l.map((id, k) => slot(`F:${i}:${k}`, id, Lineup.SLOTS[k])).join('')}</div>`).join('');
    const def = lu.D.map((pr, i) => `<div class="line" style="--n:2"><span class="lbl">P${i + 1}</span>${pr.map((id, k) => slot(`D:${i}:${k}`, id, 'D')).join('')}</div>`).join('');
    const gl = `<div class="line" style="--n:2"><span class="lbl">G</span>${[0, 1].map(k => slot(`G:${k}`, lu.G[k], 'G')).join('')}</div>`;
    const scratched = team(me).roster.nhl.map(P).filter(p => Roster.isActive(p) && !p.condition.injury && !dressed.has(p.id));
    const unit = (label, ids) => `<tr><td class="muted small nowrap">${label}</td><td>${ids.map(id => `<span class="nowrap">${plink(P(id), P(id).lastName)}<span class="pos">${P(id).position}</span></span>`).join(' ')}</td></tr>`;
    return `<div class="toolbar">
        <span class="badge ${lu.autoLines ? 'acc' : 'warn'}">${lu.autoLines ? 'Auto lines' : 'Manual lines'}</span>
        <span class="muted small">${lu.autoLines ? 'Rebuilt before every game from ratings and position fit. Swap any two players to take over.' : 'Kept while legal; replaced by auto lines if someone is hurt.'} Select a player, then the one to swap with.</span>
        <span class="spacer"></span>
        <button class="btn" data-act="swap-goalies">Swap starter / backup</button>
        <button class="btn" data-act="reset-lines"${lu.autoLines ? ' disabled' : ''}>Reset to auto lines</button>
      </div>
      <div class="grid wide">
        <div class="card"><h2>Forward lines</h2><div class="lines">${fwd}</div></div>
        <div class="stack">
          <div class="card"><h2>Defense pairs</h2><div class="lines">${def}</div></div>
          <div class="card"><h2>Goalies</h2><div class="lines">${gl}</div><p class="muted small" style="margin:8px 0 0">With auto lines the backup also starts the second night of back-to-backs and whenever the starter is worn down.</p></div>
        </div>
        <div class="card"><h2>Special teams<span class="right muted">built from the dressed players</span></h2><table class="t"><tbody>
          ${unit('PP1', lu.PP[0])}${unit('PP2', lu.PP[1])}${unit('PK1', lu.PK[0])}${unit('PK2', lu.PK[1])}</tbody></table></div>
        <div class="card"><h2>Healthy scratches<span class="right muted">${scratched.length}</span></h2>${scratched.length ? `<div class="scratches">${scratched.map(p => slot(`X:${p.id}`, p.id, p.position)).join('')}</div>` : '<p class="muted">Nobody: every active player is dressed.</p>'}</div>
      </div>`;
  }

  function onSlot(key) {
    if (!ui.lineSel || ui.lineSel === key) { ui.lineSel = ui.lineSel === key ? null : key; return render(); }
    const a = ui.lineSel, b = key, me = user(), cur = team(me).lineup;
    ui.lineSel = null;
    const lu = JSON.parse(JSON.stringify({ F: cur.F, D: cur.D, G: cur.G }));
    const get = k => { const [kind, x, y] = k.split(':'); return kind === 'F' ? lu.F[x][y] : kind === 'D' ? lu.D[x][y] : kind === 'G' ? lu.G[x] : x; };
    const set = (k, v) => { const [kind, x, y] = k.split(':'); if (kind === 'F') lu.F[x][y] = v; else if (kind === 'D') lu.D[x][y] = v; else if (kind === 'G') lu.G[x] = v; };
    const isGoalie = k => P(get(k)).position === 'G';
    if (a[0] === 'X' && b[0] === 'X') { ui.lineSel = b; return render(); }
    if (isGoalie(a) !== isGoalie(b)) { toast('Goalies can only swap with goalies.', 'bad'); return render(); }
    const va = get(a), vb = get(b);
    if (a[0] !== 'X') set(a, vb);
    if (b[0] !== 'X') set(b, va);
    const res = Game.setLines(me, lu);
    if (!res.ok) toast(res.problems[0], 'bad');
    render();
  }

  // ════════════════════════════════════════════════════════════════════════
  // Schedule
  // ════════════════════════════════════════════════════════════════════════
  function scheduleHTML() {
    const s = S(), me = ui.schedLeague === 'AHL' ? team(user()).affiliateId : user();
    const games = Calendar.teamGames(s, me, statSeason());
    let w = 0, l = 0, o = 0, month = '';
    const rows = games.map(g => {
      const home = g.homeId === me, opp = home ? g.awayId : g.homeId;
      const m = new Date(`${g.date}T12:00:00Z`).toLocaleDateString('en-US', { timeZone: 'UTC', month: 'long', year: 'numeric' });
      const head = m !== month ? `<tr class="sub"><td colspan="6">${esc(m)}</td></tr>` : '';
      month = m;
      let res = '<td class="muted">–</td><td></td>';
      if (g.played) {
        const r = resultFor(g, me);
        if (g.type === 'REG') { if (r.code === 'W') w++; else if (r.code === 'L') l++; else o++; }
        res = `<td><span class="wl ${r.code}">${r.label}</span> ${esc(r.score)}</td><td class="num muted">${g.type === 'REG' ? `${w}-${l}-${o}` : ''}</td>`;
      }
      return `${head}<tr${g.played ? '' : ' class="muted"'}><td class="nowrap">${esc(fmtDate(g.date))}</td><td class="nowrap">${home ? 'vs' : '@'} ${chip(opp)} ${esc(team(opp).name)}</td>
        <td>${g.type === 'PO' ? `<span class="badge acc">Playoffs G${g.gameNumber}</span>` : ''}</td>${res}<td class="num">${g.played ? `<a data-act="box" data-id="${g.id}">Box</a>` : ''}</td></tr>`;
    });
    return `<div class="toolbar">${seg('schedLeague', [['NHL', `NHL · ${team(user()).abbrev}`], ['AHL', `AHL · ${team(team(user()).affiliateId).abbrev}`]], ui.schedLeague)}
      <span class="muted small">${games.filter(g => g.played).length} of ${games.length} played</span></div>
      <div class="card"><div class="scroll"><table class="t"><thead><tr><th>Date</th><th>Opponent</th><th></th><th>Result</th><th class="num">Record</th><th></th></tr></thead><tbody>${rows.join('')}</tbody></table></div></div>`;
  }

  // ════════════════════════════════════════════════════════════════════════
  // Standings
  // ════════════════════════════════════════════════════════════════════════
  function standingsTable(rows, { cutAfter = null, start = 1 } = {}) {
    const l10 = r => { const c = { W: 0, L: 0, O: 0 }; for (const x of r.last10) c[x]++; return `${c.W}-${c.L}-${c.O}`; };
    const strk = r => (r.streak ? r.streak.replace(/^O/, 'OT') : '–');
    return `<div class="scroll"><table class="t"><thead><tr><th></th><th>Team</th><th class="num">GP</th><th class="num">W</th><th class="num">L</th><th class="num">OTL</th><th class="num">PTS</th><th class="num">P%</th><th class="num">RW</th><th class="num">ROW</th><th class="num">GF</th><th class="num">GA</th><th class="num">Diff</th><th class="num">L10</th><th class="num">Strk</th></tr></thead><tbody>
      ${rows.map((r, i) => `<tr class="${isUserTeam(r.teamId) ? 'me' : ''}${cutAfter !== null && i === cutAfter - 1 ? ' cut' : ''}"><td class="rk">${start + i}</td><td class="nowrap">${chip(r.teamId)} ${esc(teamName(r.teamId))}</td>
        <td class="num">${r.gp}</td><td class="num">${r.w}</td><td class="num">${r.l}</td><td class="num">${r.otl}</td><td class="num"><b>${r.pts}</b></td><td class="num">${r.gp ? pct3(r.ptsPct) : '–'}</td>
        <td class="num">${r.rw}</td><td class="num">${r.row}</td><td class="num">${r.gf}</td><td class="num">${r.ga}</td><td class="num">${signed(r.diff)}</td><td class="num">${l10(r)}</td><td class="num">${strk(r)}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
  const titleCase = x => x.charAt(0) + x.slice(1).toLowerCase();

  function wildCardHTML(s) {
    const div = Stats.standings(s, 'NHL', 'division'), league = Stats.standings(s, 'NHL', 'league');
    return ['EAST', 'WEST'].map(conf => {
      const divs = Object.keys(div).filter(d => div[d][0].conference === conf).sort();
      const top = new Set(divs.flatMap(d => div[d].slice(0, 3).map(r => r.teamId)));
      const wc = league.filter(r => r.conference === conf && !top.has(r.teamId));
      return `<div class="card"><h2>${titleCase(conf)}ern conference</h2>
        ${divs.map(d => `<div class="section-title" style="margin-top:6px">${titleCase(d)}</div>${standingsTable(div[d].slice(0, 3))}`).join('')}
        <div class="section-title" style="margin-top:10px">Wild card</div>${standingsTable(wc, { cutAfter: 2 })}</div>`;
    }).join('');
  }

  function standingsHTML() {
    const s = S(), lg = ui.standLeague, group = lg === 'AHL' && ui.standGroup === 'wildcard' ? 'division' : ui.standGroup;
    let body;
    if (group === 'wildcard') body = wildCardHTML(s);
    else if (group === 'league') body = `<div class="card">${standingsTable(Stats.standings(s, lg, 'league'))}</div>`;
    else {
      const g = Stats.standings(s, lg, group);
      body = Object.keys(g).sort((a, b) => (g[a][0].conference + a).localeCompare(g[b][0].conference + b))
        .map(k => `<div class="card"><h2>${esc(titleCase(k))}${group === 'conference' ? 'ern conference' : ''}</h2>${standingsTable(g[k], { cutAfter: group === 'division' && lg === 'NHL' ? 3 : null })}</div>`).join('');
    }
    return `<div class="toolbar">${seg('standLeague', [['NHL', 'NHL'], ['AHL', 'AHL']], lg)}
      ${seg('standGroup', [['division', 'Division'], ...(lg === 'NHL' ? [['wildcard', 'Wild card']] : []), ['conference', 'Conference'], ['league', 'League']], group)}
      <span class="muted small">${lg === 'NHL' ? 'Top 3 in each division plus 2 wild cards per conference make the playoffs.' : ''}</span></div>
      <div class="grid full">${body}</div>`;
  }

  // ════════════════════════════════════════════════════════════════════════
  // Leaders
  // ════════════════════════════════════════════════════════════════════════
  function leadersHTML() {
    const s = S(), league = ui.leadLeague, type = ui.leadType;
    const cur = statSeason(), played = Object.values(s.games).some(g => g.played && g.season === cur);
    const season = played || !s.history.seasons.length ? cur : cur - 1;
    const teams = Object.values(s.teams).filter(t => t.league === league);
    const avgGP = U.mean(teams.map(t => t.record.gp));
    const minG = type === 'PO' ? 2 : Math.max(3, Math.round(avgGP * 0.35));
    const card = (title, opts, fmt = v => v) => {
      const rows = Stats.leaders(s, { league, type, season, n: 10, ...opts });
      return `<div class="card"><h2>${esc(title)}${opts.minGP ? `<span class="right muted">min ${opts.minGP} GP</span>` : ''}</h2>${rows.length ? `<table class="t"><tbody>${rows.map((r, i) =>
        `<tr class="${r.teamIds.some(isUserTeam) ? 'me' : ''}"><td class="rk">${i + 1}</td><td>${plink(P(r.playerId))} <span class="pos">${r.position}</span></td><td class="nowrap">${r.teamIds.map(chip).join(' ')}</td><td class="num"><b>${fmt(r.value)}</b></td></tr>`).join('')}</tbody></table>` : '<p class="muted">No games yet.</p>'}</div>`;
    };
    return `<div class="toolbar">${seg('leadLeague', [['NHL', 'NHL'], ['AHL', 'AHL']], league)}${seg('leadType', [['REG', 'Regular season'], ['PO', 'Playoffs']], type)}<span class="muted small">${seasonLabel(season)}${season < cur || offseason() ? ' · final' : ''}</span></div>
      <div class="grid">
        ${card('Points', { stat: 'pts' })}${card('Goals', { stat: 'g' })}${card('Assists', { stat: 'a' })}
        ${card('Plus / minus', { stat: 'pm', minGP: minG }, signed)}${card('Power-play goals', { stat: 'ppg' })}${card('Points — defensemen', { stat: 'pts', position: 'D' })}
        ${card('Wins', { stat: 'w', position: 'G' })}${card('Save percentage', { stat: 'svPct', position: 'G', minGP: minG }, pct3)}
        ${card('Goals-against average', { stat: 'gaa', position: 'G', minGP: minG }, v => v.toFixed(2))}${card('Shutouts', { stat: 'so', position: 'G' })}
      </div>`;
  }

  // ════════════════════════════════════════════════════════════════════════
  // Playoffs
  // ════════════════════════════════════════════════════════════════════════
  function playoffsHTML() {
    const s = S();
    if (!s.playoffs) {
      return `<div class="banner acc">The playoffs start after the regular season ends on ${esc(fmtDate(Calendar.seasonSpan(s, 'NHL').last))}. The top 3 in each division plus 2 wild cards per conference qualify.</div>
        <div class="grid wide">${wildCardHTML(s)}</div>`;
    }
    const po = s.playoffs, sizes = [8, 4, 2, 1];
    const seriesCard = sr => {
      const row = id => `<div class="row ${sr.winner ? (sr.winner === id ? 'win' : 'lose') : ''}">${chip(id)}<span>${esc(team(id).name)} <span class="seed">${esc(po.labels[id] || '')}</span></span><span class="w">${sr.wins[id]}</span></div>`;
      return `<div class="series${sr.high === user() || sr.low === user() ? ' me' : ''}" data-act="series" data-id="${sr.id}">${row(sr.high)}${row(sr.low)}</div>`;
    };
    const cols = sizes.map((n, r) => {
      const round = po.rounds[r];
      const body = round ? round.map(seriesCard).join('') : Array.from({ length: n }, () => '<div class="series"><div class="row lose"><span></span><span>TBD</span><span></span></div><div class="row lose"><span></span><span>TBD</span><span></span></div></div>').join('');
      return `<div class="round"><h3>${Playoffs.roundName(r + 1)}</h3>${body}</div>`;
    }).join('');
    const banner = po.championId ? `<div class="banner good">${chip(po.championId)} ${esc(teamName(po.championId))} win the championship, defeating ${esc(teamName(po.finalistId))}.</div>` : '';
    return `${banner}<div class="card"><div class="bracket">${cols}</div></div>`;
  }

  // ════════════════════════════════════════════════════════════════════════
  // Inbox
  // ════════════════════════════════════════════════════════════════════════
  function inboxHTML() {
    const s = S(), list = [...s.inbox].reverse().filter(m => ui.inboxFilter === 'all' || !m.read);
    return `<div class="toolbar">${seg('inboxFilter', [['all', 'All'], ['unread', 'Unread']], ui.inboxFilter)}<span class="spacer"></span>
      <button class="btn" data-act="mark-read">Mark all read</button></div>
      <div class="card">${list.length ? list.map(msgHTML).join('') : '<p class="muted">Nothing here.</p>'}</div>`;
  }

  // ════════════════════════════════════════════════════════════════════════
  // Draft
  // ════════════════════════════════════════════════════════════════════════
  const nat = p => `<span class="muted small">${esc(p.nationality)}</span>`;
  function prospectRow(p, rank, canPick) {
    const inches = Math.round(p.heightCm / 2.54);
    return `<tr><td class="rk">${rank}</td><td><span class="pos">${p.position}</span> ${plink(p)} ${nat(p)}</td><td class="num">${U.seasonAge(p.birthDate, S().draft ? S().draft.year : S().calendar.season + 1)}</td>
      <td>${ovr(p.ovr)}</td><td><span class="badge">${ceiling(p)}</span></td><td class="muted small nowrap hide-sm">${Math.floor(inches / 12)}′${inches % 12}″ · ${esc(p.style.replace('_', '-').toLowerCase())}</td>
      <td class="num">${canPick ? `<button class="btn small primary" data-act="draft-pick" data-id="${p.id}">Draft</button>` : ''}</td></tr>`;
  }
  function draftHTML() {
    const s = S(), me = user(), d = s.draft;
    const live = d && !d.finished;
    if (!live) {
      const year = s.calendar.season + 1;
      const mine = Select.picksOwnedBy(s, me).filter(pk => pk.year === year).sort((a, b) => a.round - b.round);
      const table = Stats.standings(s, 'NHL', 'league'), rank = table.length - table.findIndex(r => r.teamId === me);
      const last = d && d.finished ? d : null;
      return `<div class="banner acc">The ${year} draft is in late June, after the playoffs. The class is revealed (and the lottery drawn) when the season ends.</div>
        <div class="grid wide">
          <div class="card"><h2>Your ${year} picks</h2><table class="t"><tbody>${mine.map(pk => `<tr><td>Round ${pk.round}</td><td>${pk.originalTeamId === me ? 'Own pick' : `via ${chip(pk.originalTeamId)}`}</td></tr>`).join('') || '<tr><td class="muted">No picks.</td></tr>'}</tbody></table>
            ${s.calendar.phase === 'REGULAR_SEASON' ? `<p class="muted small">On today's standings you'd pick around #${rank} in each round (lottery aside).</p>` : ''}</div>
          ${last ? `<div class="card"><h2>${last.year} draft: your picks</h2><table class="t"><tbody>${last.picks.filter(pk => pk.teamId === me).map(pk => `<tr><td class="rk">#${pk.overall}</td><td>${plink(P(pk.playerId))}</td><td><span class="pos">${P(pk.playerId).position}</span></td><td><span class="badge">${ceiling(P(pk.playerId))}</span></td></tr>`).join('') || '<tr><td class="muted">None.</td></tr>'}</tbody></table></div>
          <div class="card"><h2>${last.year} first round</h2><table class="t"><tbody>${last.picks.slice(0, 32).map(pk => `<tr class="${pk.teamId === me ? 'me' : ''}"><td class="rk">${pk.overall}</td><td>${chip(pk.teamId)}</td><td>${plink(P(pk.playerId))} <span class="pos">${P(pk.playerId).position}</span></td></tr>`).join('')}</tbody></table></div>` : ''}
        </div>`;
    }
    const onClock = Draft.userOnClock(s), cur = Draft.current(s);
    const picksLeft = userPicksLeft();
    const lottery = `<div class="card"><h2>Lottery</h2><table class="t"><tbody>${d.lottery.map(l => `<tr><td>${chip(l.teamId)} ${esc(teamName(l.teamId))}</td><td class="num">${l.from} → <b>${l.to}</b></td></tr>`).join('')}</tbody></table>
      <p class="muted small">Non-playoff teams pick 1–${d.nonPlayoff} (worst record first, after the lottery); the champion picks last.</p></div>`;
    const status = s.calendar.phase === 'DRAFT'
      ? (onClock ? `<div class="banner good"><b>You're on the clock</b> with pick #${cur.overall} (round ${cur.round}). Choose a player below, or <a data-act="draft-auto">let your staff pick</a>.</div>`
                 : d.done ? '<div class="banner acc">The draft is complete. Advance a day to open the re-signing window.</div>'
                 : `<div class="banner acc">On the clock: pick #${cur.overall}, ${chip(Draft.ownerOf(s, cur))}. Continue the draft from the top bar.</div>`)
      : `<div class="banner acc">Draft day is ${esc(fmtDate(d.date))}. Your picks: ${picksLeft.map(n => `#${n}`).join(', ') || 'none'}. Scout the class below.</div>`;
    const n = ui.draftShow || 60;
    const board = d.pool.slice(0, n).map(id => P(id));
    const made = d.picks.filter(pk => pk.playerId).slice(-12).reverse();
    return `${status}
      <div class="toolbar"><label class="small"><input type="checkbox" data-change="auto-draft"${s.settings.autoDraft ? ' checked' : ''}> Let my staff make my picks</label>
        <span class="muted small">Ceilings are your scouts' read; rankings are the consensus board.</span></div>
      <div class="grid wide">
        <div class="card"><h2>Big board<span class="right muted">${d.pool.length} available</span></h2><div class="scroll"><table class="t"><thead><tr><th></th><th>Prospect</th><th class="num">Age</th><th>OVR</th><th>Ceiling</th><th class="hide-sm">Profile</th><th></th></tr></thead><tbody>
          ${board.map((p, i) => prospectRow(p, i + 1, onClock)).join('')}</tbody></table></div>
          ${d.pool.length > n ? `<div style="margin-top:8px"><button class="btn small" data-act="set" data-key="draftShow" data-val="${n + 60}">Show more</button></div>` : ''}</div>
        <div class="stack">
          <div class="card"><h2>Your picks</h2><table class="t"><tbody>${d.picks.filter(pk => Draft.ownerOf(s, pk) === me || pk.teamId === me).map(pk => `<tr class="${pk === cur ? 'me' : ''}"><td class="rk">#${pk.overall}</td><td class="muted small">Rd ${pk.round}</td><td>${pk.playerId ? `${plink(P(pk.playerId))} <span class="pos">${P(pk.playerId).position}</span>` : pk === cur ? '<b>on the clock</b>' : '<span class="muted">—</span>'}</td></tr>`).join('')}</tbody></table></div>
          ${made.length ? `<div class="card"><h2>Latest picks</h2><table class="t"><tbody>${made.map(pk => `<tr class="${pk.teamId === me ? 'me' : ''}"><td class="rk">${pk.overall}</td><td>${chip(pk.teamId)}</td><td>${plink(P(pk.playerId))} <span class="pos">${P(pk.playerId).position}</span></td><td><span class="badge">${ceiling(P(pk.playerId))}</span></td></tr>`).join('')}</tbody></table></div>` : ''}
          ${lottery}
        </div>
      </div>`;
  }

  // ════════════════════════════════════════════════════════════════════════
  // Contracts: expiring deals, qualifying offers, extensions, prospects, dead cap
  // ════════════════════════════════════════════════════════════════════════
  function contractsHTML() {
    const s = S(), me = user(), t = team(me), ph = s.calendar.phase, season = s.calendar.season;
    const inWindow = ['SEASON_END', 'DRAFT', 'RE_SIGNING'].includes(ph);
    const nextSeason = season + 1;
    const committed = Contracts.projectedPayroll(s, me, nextSeason);
    const head = `<div class="card"><div class="toolbar" style="margin:0">
      <span>This season <b>${U.money(Contracts.capPayroll(s, me))}</b> <span class="muted">of ${U.money(CONFIG.cap.upper)}</span></span>
      <span>${seasonLabel(nextSeason)} committed <b>${U.money(committed)}</b> <span class="muted">(${U.money(Math.max(0, CONFIG.cap.upper - committed))} free)</span></span>
      <span>Contracts <b>${Contracts.contractCount(s, me)}/${CONFIG.roster.contractMax}</b></span><span class="spacer"></span>
      <label class="small"><input type="checkbox" data-change="auto-contracts"${s.settings.autoContracts ? ' checked' : ''}> Staff handle my contracts every summer</label></div></div>`;
    const list = expiring().sort((a, b) => b.ovr - a.ovr);
    const row = p => {
      const st = Contracts.faStatus(s, p), pref = Contracts.preferredTerm(s, p, nextSeason);
      const askNow = Market.reSignPrice(s, p, pref);
      const problem = Market.reSignProblem(s, p, pref);
      const willing = st === 'RFA' ? '<span class="muted small">RFA: negotiates</span>' : Market.willing(s, p) ? '<span class="badge good">Open to staying</span>' : `<span class="badge warn" title="He'd rather test free agency">Wants ${Math.round((CONFIG.contracts.unwillingPremium - 1) * 100)}% more to stay</span>`;
      const keep = Market.recommend(s, p) ? '<span class="badge acc">Keep</span>' : '<span class="muted small">Let go</span>';
      const qual = st === 'RFA' && inWindow ? `<label class="small nowrap"><input type="checkbox" data-change="qualify" data-id="${p.id}"${p.qualified ? ' checked' : ''}> Qualify</label>` : '';
      return `<tr><td><span class="pos">${p.position}</span> ${plink(p)}</td><td class="num">${age(p)}</td><td>${ovr(p.ovr)}</td><td class="hide-sm"><span class="badge">${ceiling(p)}</span></td>
        <td class="num hide-sm">${U.money(p.contract.capHit)}</td><td><span class="badge">${st}</span></td><td>${willing}</td><td class="hide-sm">${keep}</td>
        <td class="num nowrap">${U.money(askNow)} × ${pref}</td><td class="num nowrap">${qual} <button class="btn small" data-act="resign" data-id="${p.id}"${problem && /test free agency|last year|expired|already/.test(problem) ? ` disabled title="${esc(problem)}"` : ''}>Re-sign…</button></td></tr>`;
    };
    const extended = [...t.roster.nhl, ...t.roster.ahl].map(P).filter(p => p.extension);
    const prospects = t.roster.reserve.map(P).sort((a, b) => b.dev.potential - a.dev.potential);
    const dead = t.finances.deadCap.filter(x => x.toSeason >= season);
    return `${head}
      <div class="card"><h2>${inWindow ? 'Expiring on July 1' : `Final year (${seasonLabel(season)})`}<span class="right muted">${list.length}</span></h2>
        <p class="muted small" style="margin-top:0">${inWindow
          ? 'Re-sign anyone you want to keep before July 1. RFAs you <b>qualify</b> but don\'t sign get a one-year arbitration award; everyone else becomes a free agent. <a data-act="staff-contracts">Apply staff recommendations</a>.'
          : 'Players in the last year of their deals. A re-signing now is an extension that starts next season; RFA qualifying offers are made after the season.'}</p>
        ${list.length ? `<div class="scroll"><table class="t"><thead><tr><th>Player</th><th class="num">Age</th><th>OVR</th><th class="hide-sm">Ceiling</th><th class="num hide-sm">Cap hit</th><th>Status</th><th>Mood</th><th class="hide-sm">Staff</th><th class="num">Asking</th><th></th></tr></thead><tbody>${list.map(row).join('')}</tbody></table></div>` : '<p class="muted">Nobody.</p>'}</div>
      ${extended.length ? `<div class="card"><h2>Extensions (start next season)</h2><table class="t"><tbody>${extended.map(p => `<tr><td>${plink(p)}</td><td class="num">${U.money(p.extension.capHit)} × ${p.extension.yearsRemaining}</td><td class="muted small">through ${seasonLabel(p.extension.expiresAfterSeason)}</td></tr>`).join('')}</tbody></table></div>` : ''}
      <div class="card"><h2>Unsigned draft picks<span class="right muted">${prospects.length}</span></h2>
        <p class="muted small" style="margin-top:0">Rights last until the league year a prospect turns ${CONFIG.draft.rightsUntilAge}. Signing one uses an entry-level contract and a contract slot; he joins your AHL roster.</p>
        ${prospects.length ? `<div class="scroll"><table class="t"><thead><tr><th>Prospect</th><th class="num">Age</th><th>OVR</th><th>Ceiling</th><th class="hide-sm">Drafted</th><th class="hide-sm">Plays</th><th class="hide-sm"></th><th></th></tr></thead><tbody>${prospects.map(p => {
          const left = CONFIG.draft.rightsUntilAge - U.seasonAge(p.birthDate, season + 1);
          return `<tr><td><span class="pos">${p.position}</span> ${plink(p)}</td><td class="num">${age(p)}</td><td>${ovr(p.ovr)}</td><td><span class="badge">${ceiling(p)}</span></td>
            <td class="muted small nowrap hide-sm">${p.career.draft ? `${p.career.draft.year} · #${p.career.draft.overall}` : ''}</td><td class="muted small hide-sm">${p.assignment === 'EUROPE' ? 'Europe' : 'Junior'}</td>
            <td class="hide-sm">${left <= 0 ? '<span class="badge bad">Rights lapse Jul 1</span>' : left === 1 ? '<span class="badge warn">Last summer to sign</span>' : ''} ${Market.prospectReady(s, p) ? '<span class="badge acc">Staff: sign</span>' : ''}</td>
            <td class="num"><button class="btn small" data-act="sign-elc" data-id="${p.id}"${ph === 'PLAYOFFS' ? ' disabled' : ''}>Sign ELC</button></td></tr>`;
        }).join('')}</tbody></table></div>` : '<p class="muted">None.</p>'}</div>
      ${dead.length ? `<div class="card"><h2>Dead cap (buyouts)</h2><table class="t"><tbody>${dead.map(x => `<tr><td>${esc(x.name || x.playerId)}</td><td class="num">${U.money(x.amount)} a season</td><td class="muted small">${seasonLabel(x.fromSeason)} → ${seasonLabel(x.toSeason)}</td></tr>`).join('')}</tbody></table></div>` : ''}`;
  }

  // ════════════════════════════════════════════════════════════════════════
  // Free agents and the waiver wire
  // ════════════════════════════════════════════════════════════════════════
  function marketHTML() {
    const s = S(), me = user(), open = marketOpen(), table = Market.strengthTable(s);
    const space = Contracts.capSpace(s, me), committed = Market.committed(s, me);
    const mine = s.pending.faOffers.filter(o => o.teamId === me);
    const offerRow = o => {
      const p = P(o.playerId), st = Game.offerStatus(o.playerId);
      const label = !st.mineAcceptable ? '<span class="badge bad">Below his ask</span>' : st.leading ? '<span class="badge good">Leading</span>' : '<span class="badge warn">Outbid</span>';
      return `<tr><td><span class="pos">${p.position}</span> ${plink(p)}</td><td>${ovr(p.ovr)}</td><td class="num nowrap">${U.money(o.capHit)} × ${o.years}</td><td>${label}</td><td class="muted small nowrap">${st.offers} offer${st.offers > 1 ? 's' : ''} · decides ${st.decideOn ? esc(fmtShort(st.decideOn)) : '—'}</td>
        <td class="num nowrap"><button class="btn small" data-act="offer" data-id="${p.id}">Change</button> <button class="btn small danger" data-act="withdraw" data-id="${p.id}">Withdraw</button></td></tr>`;
    };
    const grp = ui.faGroup || 'all';
    const inGroup = p => grp === 'all' || (grp === 'F' ? Ratings.isForward(p.position) : p.position === grp);
    const fas = Select.freeAgents(s).filter(inGroup).sort((a, b) => b.ovr - a.ovr || a.id.localeCompare(b.id));
    const n = ui.faShow || 50;
    const row = p => {
      const pref = Contracts.preferredTerm(s, p), askMe = Market.askFrom(s, p, me, pref, table), offers = Market.offersFor(s, p.id);
      const myOffer = offers.find(o => o.teamId === me);
      return `<tr class="${myOffer ? 'me' : ''}"><td><span class="pos">${p.position}</span> ${plink(p)}</td><td class="num">${age(p)}</td><td>${ovr(p.ovr)}</td><td class="hide-sm"><span class="badge">${ceiling(p)}</span></td>
        <td class="hide-sm">${p.lastTeamId ? chip(p.lastTeamId) : '<span class="muted small">—</span>'}</td><td class="num nowrap">${U.money(askMe)} × ${pref}</td>
        <td class="num hide-sm">${offers.length || ''}</td><td class="muted small nowrap hide-sm">${p.market && p.market.decideOn ? esc(fmtShort(p.market.decideOn)) : ''}</td>
        <td class="num"><button class="btn small${myOffer ? '' : ' primary'}" data-act="offer" data-id="${p.id}"${open ? '' : ' disabled title="Free agency opens July 1"'}>${myOffer ? 'Change' : 'Offer…'}</button></td></tr>`;
    };
    const waivers = s.pending.waivers.filter(w => w.fromTeamId !== me);
    const waiverRow = w => {
      const p = P(w.playerId), c = p.contract;
      return `<tr><td><span class="pos">${p.position}</span> ${plink(p)}</td><td class="num">${age(p)}</td><td>${ovr(p.ovr)}</td><td>${chip(w.fromTeamId)}</td><td class="num nowrap">${U.money(c.capHit)} × ${c.yearsRemaining}</td>
        <td class="num"><label class="small nowrap"><input type="checkbox" data-change="claim" data-id="${p.id}"${w.userClaim ? ' checked' : ''}> Claim</label></td></tr>`;
    };
    return `<div class="card"><div class="toolbar" style="margin:0">
        <span>Cap space <b>${U.money(Math.max(0, space))}</b>${committed ? ` <span class="muted">(${U.money(Math.max(0, space - committed))} after your offers)</span>` : ''}</span>
        <span>Contracts <b>${Contracts.contractCount(s, me)}/${CONFIG.roster.contractMax}</b></span>
        <span class="muted small">${open ? 'Players decide a day or three after their first offer and take the best one (money, term, and how much they like your team).' : 'The market is closed until July 1. You can browse the pool.'}</span></div></div>
      ${waivers.length ? `<div class="card"><h2>Waiver wire<span class="right muted">claims are processed tomorrow morning, worst record first</span></h2><div class="scroll"><table class="t"><thead><tr><th>Player</th><th class="num">Age</th><th>OVR</th><th>From</th><th class="num">Contract</th><th></th></tr></thead><tbody>${waivers.map(waiverRow).join('')}</tbody></table></div></div>` : ''}
      ${mine.length ? `<div class="card"><h2>Your offers</h2><div class="scroll"><table class="t"><tbody>${mine.map(offerRow).join('')}</tbody></table></div></div>` : ''}
      <div class="toolbar">${seg('faGroup', [['all', 'All'], ['F', 'Forwards'], ['D', 'Defense'], ['G', 'Goalies']], grp)}<span class="muted small">${fas.length} unsigned</span></div>
      <div class="card"><div class="scroll"><table class="t"><thead><tr><th>Player</th><th class="num">Age</th><th>OVR</th><th class="hide-sm">Ceiling</th><th class="hide-sm">Last team</th><th class="num">Asking from you</th><th class="num hide-sm">Offers</th><th class="hide-sm">Decides</th><th></th></tr></thead><tbody>
        ${fas.slice(0, n).map(row).join('') || '<tr><td class="muted">Nobody.</td></tr>'}</tbody></table></div>
        ${fas.length > n ? `<div style="margin-top:8px"><button class="btn small" data-act="set" data-key="faShow" data-val="${n + 50}">Show more</button></div>` : ''}</div>`;
  }

  // ════════════════════════════════════════════════════════════════════════
  // Trades: the builder (your assets ↔ theirs), offers to you, shopping a player, the league's trade log
  // ════════════════════════════════════════════════════════════════════════
  const STRAT = { CONTENDER: ['Contender', 'good'], BUBBLE: ['Bubble', ''], REBUILD: ['Rebuilding', 'warn'] };
  const stratBadge = id => {
    const a = team(id).ai;
    if (!a || !a.strategy) return '';
    const [label, cls] = STRAT[a.strategy];
    return `<span class="badge ${cls}" title="Playoff odds ${Math.round((a.odds || 0) * 100)}% · strength rank ${a.rank || '–'}">${label}</span>`;
  };
  const roundName = r => ['1st', '2nd', '3rd'][r - 1] || `${r}th`;
  const pickLabel = pk => `${pk.year} ${roundName(pk.round)}${pk.originalTeamId !== pk.ownerTeamId ? ` (${team(pk.originalTeamId).abbrev})` : ''}`;
  const emptyTrade = () => ({ mine: { players: [], picks: [], retain: {} }, theirs: { players: [], picks: [], retain: {} } });
  const partnerId = () => {
    const s = S();
    if (!ui.tradePartner || !team(ui.tradePartner) || ui.tradePartner === user()) ui.tradePartner = Select.nhlTeams(s).filter(t => t.id !== user()).sort((a, b) => a.city.localeCompare(b.city))[0].id;
    return ui.tradePartner;
  };
  // Drop anything that has moved since it was picked (a trade, a release, a used pick).
  function cleanTrade() {
    const s = S(), them = partnerId(), t = ui.trade;
    const keep = (org, g) => {
      g.players = g.players.filter(id => s.players[id] && s.players[id].teamId === org);
      g.picks = g.picks.filter(id => s.draftPicks[id] && s.draftPicks[id].ownerTeamId === org && !s.draftPicks[id].usedOnPlayerId);
      for (const id of Object.keys(g.retain)) if (!g.players.includes(id)) delete g.retain[id];
    };
    keep(user(), t.mine); keep(them, t.theirs);
  }
  const currentDeal = () => ({ teams: [user(), partnerId()], give: { [user()]: ui.trade.mine, [partnerId()]: ui.trade.theirs } });
  const dealEmpty = () => !ui.trade.mine.players.length && !ui.trade.mine.picks.length && !ui.trade.theirs.players.length && !ui.trade.theirs.picks.length;
  function loadDeal(deal) {
    const me = user(), them = deal.teams[0] === me ? deal.teams[1] : deal.teams[0];
    ui.tradePartner = them;
    ui.trade = { mine: JSON.parse(JSON.stringify(deal.give[me])), theirs: JSON.parse(JSON.stringify(deal.give[them])) };
    ui.trade.mine.retain = ui.trade.mine.retain || {}; ui.trade.theirs.retain = ui.trade.theirs.retain || {};
  }
  // One side of a deal as links: "Jane Doe (C, 84) · 2027 1st (MTL)".
  function sideHTML(deal, org) {
    const s = S(), g = deal.give[org];
    const items = [...g.players.map(id => { const p = P(id); return `${plink(p)} <span class="muted small">${p.position}, ${p.ovr}${g.retain && g.retain[id] ? `, ${Math.round(g.retain[id] * 100)}% retained` : ''}</span>`; }),
                   ...g.picks.map(id => esc(pickLabel(s.draftPicks[id])))];
    return items.join(' · ') || '<span class="muted">nothing</span>';
  }
  const meterHTML = (pv, empty) => {
    if (empty) return '<p class="muted small" style="margin:6px 0 0">Choose players or picks from either side below.</p>';
    const pct = U.clamp(pv.interest / 2, 0, 1) * 100, color = pv.accept ? 'var(--good)' : pv.problems.length ? 'var(--bad)' : pv.interest >= 0.9 ? 'var(--warn)' : 'var(--bad)';
    return `<div class="meter" title="Their interest"><i style="width:${pct.toFixed(1)}%;background:${color}"></i><b></b></div>
      <div class="small"><b style="color:${color}">${esc(pv.reply)}</b></div>`;
  };
  function tradeHTML() {
    const s = S(), me = user(), them = partnerId(), st = Game.tradeStatus();
    cleanTrade();
    const deal = currentDeal(), empty = dealEmpty(), pv = empty ? null : Game.evaluateTrade(deal);
    const nextYear = Trade.capSeason(s) > s.calendar.season;
    const status = !st.open ? '<span class="badge bad">Trades closed until the season ends</span>'
      : st.daysToDeadline !== null ? `<span class="badge${st.deadlineWindow ? ' warn' : ''}">Deadline ${esc(fmtShort(st.deadline))}${st.daysToDeadline > 0 ? ` · ${st.daysToDeadline} day${st.daysToDeadline === 1 ? '' : 's'}` : ' · today'}</span>`
      : '<span class="badge good">Trade market open</span>';
    const partnerSel = `<select data-change="trade-partner">${Select.nhlTeams(s).filter(t => t.id !== me).sort((a, b) => a.city.localeCompare(b.city)).map(t =>
      `<option value="${t.id}"${t.id === them ? ' selected' : ''}>${esc(t.city)} ${esc(t.name)} · ${STRAT[t.ai.strategy] ? STRAT[t.ai.strategy][0] : ''}</option>`).join('')}</select>`;
    const ai = team(them).ai || {};
    const toolbar = `<div class="toolbar">${partnerSel}${stratBadge(them)}<span class="muted small">playoff odds ${Math.round((ai.odds || 0) * 100)}% · cap space ${U.money(Math.max(0, Contracts.capSpace(s, them)))}</span>
      <span class="spacer"></span>${status}<span class="small muted">Difficulty</span>${segAct('trade-difficulty', [['EASY', 'Easy'], ['NORMAL', 'Normal'], ['HARD', 'Hard']], s.settings.tradeDifficulty)}</div>`;

    // Offers to you
    const offers = s.pending.tradeOffers;
    const offersCard = offers.length ? `<div class="card"><h2>Offers to you<span class="right muted">${offers.length}</span></h2><div class="scroll"><table class="t"><thead><tr><th>From</th><th>They give</th><th>You give</th><th>Expires</th><th></th></tr></thead><tbody>
      ${offers.map(o => `<tr><td class="nowrap">${chip(o.fromTeamId)} ${stratBadge(o.fromTeamId)}</td><td>${sideHTML(o.deal, o.fromTeamId)}</td><td>${sideHTML(o.deal, me)}</td><td class="muted small nowrap">${esc(fmtShort(o.expires))}</td>
        <td class="num nowrap"><button class="btn small primary" data-act="trade-accept" data-id="${o.id}"${st.open ? '' : ' disabled'}>Accept</button> <button class="btn small" data-act="trade-edit" data-id="${o.id}">Edit</button> <button class="btn small danger" data-act="trade-decline" data-id="${o.id}">Decline</button></td></tr>`).join('')}
      </tbody></table></div></div>` : '';

    // The deal so far
    const selList = (org, side) => {
      const g = ui.trade[side], items = [];
      for (const id of g.players) {
        const p = P(id), c = p.contract;
        const ret = side === 'mine' && c && c.type !== 'PTO' && Contracts.contractIn(p, Trade.capSeason(s)) === c
          ? ` <select class="small" data-change="trade-retain" data-id="${id}" title="Keep paying part of his cap hit through ${seasonLabel(c.expiresAfterSeason)}">${[0, 0.25, 0.5].map(x => `<option value="${x}"${(g.retain[id] || 0) === x ? ' selected' : ''}>${x ? `retain ${x * 100}%` : 'no retention'}</option>`).join('')}</select>` : '';
        items.push(`<li><span class="pos">${p.position}</span> ${plink(p)} ${ovr(p.ovr)} <span class="muted small">${c ? `${U.money(c.capHit)} × ${c.yearsRemaining}` : 'unsigned'}</span>${ret} <a class="small" data-act="trade-remove" data-side="${side}" data-kind="player" data-id="${id}">remove</a></li>`);
      }
      for (const id of g.picks) items.push(`<li>${esc(pickLabel(s.draftPicks[id]))} <span class="muted small">proj. #${Math.round(Trade.projectedSlot(s, s.draftPicks[id]))}</span> <a class="small" data-act="trade-remove" data-side="${side}" data-kind="pick" data-id="${id}">remove</a></li>`);
      return items.length ? `<ul class="tlist">${items.join('')}</ul>` : '<p class="muted small" style="margin:0">Nothing yet.</p>';
    };
    const capLine = org => {
      if (!pv) return '';
      const c = pv.cap[org], over = c.after > c.ceiling;
      return `<div class="small">${chip(org)} payroll${nextYear ? ' next season' : ''} ${U.money(c.before)} → <b style="color:${over ? 'var(--bad)' : 'inherit'}">${U.money(c.after)}</b> <span class="muted">of ${U.money(c.ceiling)}</span></div>`;
    };
    const summary = `<div class="card"><h2>Trade with the ${esc(teamName(them))}</h2>
      <div class="trade-sides"><div><div class="section-title">You give</div>${selList(me, 'mine')}</div><div><div class="section-title">You get</div>${selList(them, 'theirs')}</div></div>
      ${meterHTML(pv, empty)}
      ${pv ? `<div class="stack" style="gap:2px;margin-top:8px">${capLine(me)}${capLine(them)}</div>` : ''}
      <div class="toolbar" style="margin:12px 0 0"><button class="btn primary" data-act="trade-propose"${empty || !st.open ? ' disabled' : ''}>Propose trade</button>
        <button class="btn" data-act="trade-suggest"${empty || !st.open ? ' disabled' : ''} title="Your staff ask what they'd want from you">What would it take?</button>
        <button class="btn" data-act="trade-clear"${empty ? ' disabled' : ''}>Clear</button>
        <span class="muted small">${esc(STRAT[ai.strategy] ? `They're ${ai.strategy === 'REBUILD' ? 'rebuilding: they want youth and picks, and can absorb salary' : ai.strategy === 'CONTENDER' ? 'contending: they want help now and mind the cap' : 'on the bubble: they weigh now and later about equally'}.` : '')}</span></div></div>`;

    // Asset lists
    const assets = (org, side, tabKey) => {
      const tab = ui[tabKey] || 'NHL', r = team(org).roster, other = org === me ? them : me, sel = ui.trade[side];
      const tabs = seg(tabKey, [['NHL', 'NHL'], ['AHL', 'AHL'], ['RES', 'Prospects'], ['PICKS', 'Picks']], tab);
      let rows;
      if (tab === 'PICKS') {
        const picks = Select.picksOwnedBy(s, org).filter(pk => !pk.usedOnPlayerId).sort((a, b) => a.year - b.year || a.round - b.round || a.originalTeamId.localeCompare(b.originalTeamId));
        rows = picks.map(pk => { const on = sel.picks.includes(pk.id);
          return `<tr class="${on ? 'me' : ''}"><td><input type="checkbox" data-change="trade-asset" data-side="${side}" data-kind="pick" data-id="${pk.id}"${on ? ' checked' : ''}></td><td>${esc(pickLabel(pk))}</td><td class="num muted small">proj. #${Math.round(Trade.projectedSlot(s, pk))}</td></tr>`; }).join('');
        return `<div class="toolbar" style="margin-bottom:8px">${tabs}</div><div class="scroll"><table class="t"><tbody>${rows || '<tr><td class="muted">No picks.</td></tr>'}</tbody></table></div>`;
      }
      const ids = tab === 'NHL' ? r.nhl : tab === 'AHL' ? r.ahl : r.reserve;
      const list = ids.map(P).sort((a, b) => b.ovr - a.ovr);
      rows = list.map(p => {
        const why = Trade.assetProblem(s, org, { type: 'player', id: p.id }, other), on = sel.players.includes(p.id), c = p.contract;
        const cl = c && c.clauses && (c.clauses.nmc || c.clauses.ntc) ? `<span class="badge" title="Waived only to join a contender">${c.clauses.nmc ? 'NMC' : 'NTC'}</span>` : '';
        return `<tr class="${on ? 'me' : ''}"><td><input type="checkbox" data-change="trade-asset" data-side="${side}" data-kind="player" data-id="${p.id}"${on ? ' checked' : ''}${why && !on ? ` disabled title="${esc(why)}"` : ''}></td>
          <td><span class="pos">${p.position}</span> ${plink(p)} ${cl} ${p.condition.injury ? `<span class="badge bad">Out ${p.condition.injury.daysOut}d</span>` : ''}</td><td class="num">${age(p)}</td><td>${ovr(p.ovr)}</td>
          <td class="hide-sm"><span class="badge">${ceiling(p)}</span></td><td class="num">${c && c.type !== 'PTO' ? `${U.money(c.capHit)} × ${c.yearsRemaining}` : '<span class="muted small">unsigned</span>'}</td></tr>`;
      }).join('');
      return `<div class="toolbar" style="margin-bottom:8px">${tabs}</div><div class="scroll"><table class="t"><thead><tr><th></th><th>Player</th><th class="num">Age</th><th>OVR</th><th class="hide-sm">Ceiling</th><th class="num">Contract</th></tr></thead><tbody>${rows || '<tr><td colspan="6" class="muted">Nobody here.</td></tr>'}</tbody></table></div>`;
    };
    const lists = `<div class="trade-grid"><div class="card"><h2>Your assets</h2>${assets(me, 'mine', 'tradeTabMine')}</div>
      <div class="card"><h2>${chip(them)} ${esc(team(them).name)} assets</h2>${assets(them, 'theirs', 'tradeTabTheirs')}</div></div>`;

    // Shop a player
    const shopPlayers = [...team(me).roster.nhl, ...team(me).roster.ahl, ...team(me).roster.reserve].map(P).filter(p => !Trade.assetProblem(s, me, { type: 'player', id: p.id })).sort((a, b) => b.ovr - a.ovr);
    const shop = ui.shop && ui.shop.date === s.calendar.date ? ui.shop : null;
    const shopCard = `<div class="card"><h2>Shop a player<span class="right muted">each team's best offer</span></h2>
      <div class="toolbar"><select id="shopSel">${shopPlayers.map(p => `<option value="${p.id}"${shop && shop.playerId === p.id ? ' selected' : ''}>${esc(p.position)} ${esc(Select.fullName(p))} (${p.ovr})</option>`).join('')}</select>
        <button class="btn" data-act="shop"${st.open && shopPlayers.length ? '' : ' disabled'}>Find offers</button></div>
      ${shop ? (shop.offers.length ? `<div class="scroll"><table class="t"><thead><tr><th>Team</th><th>They'd give</th><th></th></tr></thead><tbody>${shop.offers.map((o, i) =>
        `<tr><td class="nowrap">${chip(o.teamId)} ${stratBadge(o.teamId)}</td><td>${o.fair ? '<span class="badge good" title="Your staff value what you get above what you give">Staff: good value</span> ' : ''}${sideHTML(o.deal, o.teamId)}${o.deal.give[me].players.length + o.deal.give[me].picks.length > 1 ? `<div class="muted small">and they want: ${sideHTML(o.deal, me)}</div>` : ''}</td>
          <td class="num"><button class="btn small" data-act="shop-load" data-i="${i}">Load</button></td></tr>`).join('')}</tbody></table></div>`
        : `<p class="muted small">Nobody is offering anything for ${esc(Select.fullName(P(shop.playerId)))} right now.</p>`) : '<p class="muted small" style="margin:0">See what other teams would give, then load an offer into the builder to adjust or propose it.</p>'}</div>`;

    // The league's trades
    const log = [...s.history.trades].reverse().slice(0, 25);
    const logCard = `<div class="card"><h2>Recent trades<span class="right muted">${s.history.trades.filter(x => x.season === s.calendar.season).length} this season</span></h2>${log.length ? `<div class="scroll"><table class="t"><tbody>${log.map(x => {
      const [a, b] = x.teams;
      return `<tr class="${x.teams.includes(me) ? 'me' : ''}"><td class="muted small nowrap">${esc(fmtShort(x.date))}</td><td class="small">${chip(a)} get ${esc(Trade.describe(s, x, b))}<br>${chip(b)} get ${esc(Trade.describe(s, x, a))}</td></tr>`;
    }).join('')}</tbody></table></div>` : '<p class="muted">No trades yet.</p>'}</div>`;

    return `${st.open ? '' : '<div class="banner warn">The trade deadline has passed. Trades reopen the day after the final.</div>'}${toolbar}${offersCard}${summary}${lists}<div class="grid wide" style="margin-top:14px">${shopCard}${logCard}</div>`;
  }
  // A segmented control whose buttons fire an action instead of setting a UI key.
  const segAct = (act, options, current) => `<div class="seg">${options.map(([v, label]) =>
    `<button data-act="${act}" data-val="${v}" class="${String(current) === String(v) ? 'on' : ''}">${esc(label)}</button>`).join('')}</div>`;

  // ── Phase 6: awards on a player card, the Hall of Fame badge, the news feed ──
  const hofBadge = id => ((S().history.hallOfFame || []).some(h => h.playerId === id) ? '<span class="badge good">Hall of Fame</span>' : '');
  function awardsCard(id) {
    const won = S().history.awards.flatMap(a => a.list.filter(x => x.playerId === id).map(x => ({ season: a.season, name: x.name })));
    if (!won.length && !hofBadge(id)) return '';
    return `<div class="card"><h2>Honours ${hofBadge(id)}</h2>${won.length ? `<table class="t"><tbody>${won.reverse().map(w => `<tr><td class="muted small nowrap">${seasonLabel(w.season)}</td><td>${esc(w.name)}</td></tr>`).join('')}</tbody></table>` : ''}</div>`;
  }
  const NEWS_FILTERS = [['all', 'All news'], ['mine', 'Your team'], ...Object.entries(HFM.News.TAGS)];
  const newsTag = t => `<span class="badge${t === 'record' || t === 'milestone' ? ' good' : t === 'trade' ? ' acc' : t === 'injury' ? ' bad' : ''}">${esc(HFM.News.TAGS[t] || t)}</span>`;
  const newsItem = n => `<div class="msg read"><span></span><span class="t">${n.teamIds.slice(0, 2).map(chip).join(' ')} ${n.playerId ? `<a data-act="player" data-id="${n.playerId}">${esc(n.text)}</a>` : esc(n.text)}</span>
    <span class="nowrap">${newsTag(n.tag)} <span class="muted small">${esc(fmtShort(n.date))}</span></span></div>`;
  function newsHTML() {
    const s = S(), f = ui.newsFilter || 'all', me = user(), n = ui.newsShow || 100;
    const list = [...(s.news || [])].reverse().filter(x => f === 'all' || (f === 'mine' ? x.teamIds.includes(me) || x.teamIds.includes(team(me).affiliateId) : x.tag === f));
    return `<div class="toolbar"><select data-change="news-filter">${NEWS_FILTERS.map(([v, l]) => `<option value="${v}"${v === f ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>
        <span class="muted small">${list.length} stor${list.length === 1 ? 'y' : 'ies'} · trades, signings, injuries, big games, streaks, milestones, records and awards from around the league</span></div>
      <div class="card">${list.length ? list.slice(0, n).map(newsItem).join('') : '<p class="muted">No news yet.</p>'}
        ${list.length > n ? `<div style="margin-top:8px"><button class="btn small" data-act="set" data-key="newsShow" data-val="${n + 100}">Show more</button></div>` : ''}</div>`;
  }

  // ════════════════════════════════════════════════════════════════════════
  // History
  // ════════════════════════════════════════════════════════════════════════
  function historyHTML() {
    const tab = ui.histTab || 'seasons';
    const head = `<div class="toolbar">${seg('histTab', [['seasons', 'Seasons'], ['records', 'Records'], ['hof', 'Hall of Fame'], ['teams', 'Teams']], tab)}</div>`;
    return head + ({ seasons: historySeasonsHTML, records: recordsHTML, hof: hallOfFameHTML, teams: franchiseHTML }[tab] || historySeasonsHTML)();
  }

  // ── Records: single game, single season, team seasons, all-time leaders ──
  function recordsHTML() {
    const s = S(), R = HFM.Records, rec = s.history.records || { game: {}, season: {}, career: {}, team: {} };
    const label = k => esc(R.LABEL[k].charAt(0).toUpperCase() + R.LABEL[k].slice(1));
    const holder = r => (r.playerId ? `${plink(P(r.playerId), r.name)}` : esc(r.name));
    const rows = (obj, keys, extra) => keys.filter(k => obj[k]).map(k => `<tr><td>${label(k)}</td><td class="num"><b>${esc(R.fmt(k, obj[k].value))}</b></td><td>${holder(obj[k])}</td><td>${obj[k].teamId ? chip(obj[k].teamId) : ''}</td><td class="muted small nowrap">${extra(obj[k])}</td></tr>`).join('');
    const card = (title, body, note = '') => `<div class="card"><h2>${title}</h2>${body ? `<div class="scroll"><table class="t"><tbody>${body}</tbody></table></div>` : '<p class="muted">None yet.</p>'}${note ? `<p class="muted small" style="margin:8px 0 0">${note}</p>` : ''}</div>`;
    const seasonCard = card('Single season', rows(rec.season, ['g', 'a', 'pts', 'pm', 'ppg', 'w', 'so', 'svPct', 'gaa'], r => (r.season ? seasonLabel(r.season) : '')), `Regular season; goalies need ${CONFIG.records.minGoalieGP}+ games for save % and GAA.`);
    const gameCard = card('Single game', rows(rec.game, ['g', 'a', 'pts', 'saves'], r => (r.date ? fmtShort(r.date) + ' ' + seasonLabel(r.season) : '')));
    const teamCard = card('Team, single season', rows(rec.team, ['teamPts', 'teamW', 'teamGF', 'teamGA'], r => (r.season ? seasonLabel(r.season) : '')));
    const leaders = (stat, title) => {
      const list = R.careerLeaders(s, stat, 10);
      return `<div class="card"><h2>${title}</h2>${list.length ? `<table class="t"><tbody>${list.map((x, i) => `<tr><td class="rk">${i + 1}</td><td>${plink(P(x.playerId), x.name)} <span class="pos">${x.position}</span>${x.active ? '' : ' <span class="muted small">retired</span>'}</td><td>${x.teamId ? chip(x.teamId) : ''}</td><td class="num"><b>${x.value}</b></td></tr>`).join('')}</tbody></table>` : '<p class="muted">None yet.</p>'}</div>`;
    };
    return `<div class="grid wide">${seasonCard}${teamCard}${gameCard}</div>
      <div class="section-title" style="margin:16px 0 8px">All-time leaders (NHL regular season)</div>
      <div class="grid">${leaders('pts', 'Points')}${leaders('g', 'Goals')}${leaders('a', 'Assists')}${leaders('gp', 'Games played')}${leaders('w', 'Goalie wins')}${leaders('so', 'Shutouts')}</div>
      <p class="muted small">Career totals include an estimate of each veteran's career before ${seasonLabel(CONFIG.START_SEASON)}, the league's first season.</p>`;
  }

  // ── Hall of Fame ──
  function hallOfFameHTML() {
    const s = S(), H = CONFIG.hallOfFame, list = [...(s.history.hallOfFame || [])].reverse();
    const line = h => (h.position === 'G' ? `${h.gp} GP · ${h.w} W · ${h.so} SO` : `${h.gp} GP · ${h.g} G · ${h.a} A · ${h.pts} P`);
    return `<div class="card"><h2>Hall of Fame<span class="right muted">${list.length} member${list.length === 1 ? '' : 's'}</span></h2>
      ${list.length ? `<div class="scroll"><table class="t"><thead><tr><th>Class</th><th>Player</th><th class="num">Peak</th><th>Career</th><th class="hide-sm">Why</th></tr></thead><tbody>${list.map(h =>
        `<tr><td class="nowrap">${h.inducted}</td><td>${plink(P(h.playerId), h.name)} <span class="pos">${h.position}</span></td><td class="num">${ovr(h.peakOvr)}</td><td class="small">${line(h)}</td><td class="muted small hide-sm">${esc(h.reasons.join(' · '))}</td></tr>`).join('')}</tbody></table></div>`
        : '<p class="muted">Nobody yet. Players are inducted when they retire.</p>'}
      <p class="muted small" style="margin:8px 0 0">Inducted on retirement with any of: ${H.points}+ points, ${H.goals}+ goals, a peak of ${H.peakOvr}+ OVR over ${H.peakGP}+ games, ${H.goalieWins}+ goalie wins (or a ${H.goaliePeak}+ peak over ${H.goalieGP}+ games), or ${H.majorAwards}+ major awards.</p></div>`;
  }

  // ── A franchise's history and records ──
  function franchiseHTML() {
    const s = S(), id = ui.histTeam && team(ui.histTeam) && team(ui.histTeam).league === 'NHL' ? ui.histTeam : user(), F = HFM.Records.franchise(s, id);
    const sel = `<select data-change="hist-team">${Select.nhlTeams(s).sort((a, b) => a.city.localeCompare(b.city)).map(t => `<option value="${t.id}"${t.id === id ? ' selected' : ''}>${esc(t.city)} ${esc(t.name)}</option>`).join('')}</select>`;
    const roundNames = { 1: 'First round', 2: 'Second round', 3: 'Conference final', 4: 'Final' };
    const seasons = [...F.seasons].reverse().map(x => `<tr><td>${seasonLabel(x.season)}</td><td class="num">${x.w}-${x.l}-${x.otl}</td><td class="num"><b>${x.pts}</b></td><td class="num">${ordinal(x.place)}</td><td>${x.champion ? '<span class="badge good">Champions</span>' : x.round ? esc(roundNames[x.round]) : '<span class="muted">Missed</span>'}</td></tr>`).join('');
    const best = Object.entries(F.seasonBest).map(([k, r]) => `<tr><td>${esc(HFM.Records.LABEL[k])}</td><td class="num"><b>${r.value}</b></td><td>${plink(P(r.playerId), r.name)}</td><td class="muted small">${seasonLabel(r.season)}</td></tr>`).join('');
    const lead = (k, title) => `<div class="card"><h2>${title}</h2>${F.leaders[k].length ? `<table class="t"><tbody>${F.leaders[k].map((x, i) => `<tr><td class="rk">${i + 1}</td><td>${plink(P(x.playerId), x.name)} <span class="pos">${x.position}</span></td><td class="num"><b>${k === 'pts' ? x.g + x.a : x[k]}</b></td></tr>`).join('')}</tbody></table>` : '<p class="muted">None yet.</p>'}</div>`;
    return `<div class="toolbar">${sel}${chip(id, { big: true })}<span class="muted small">${F.titles.length ? `Champions: ${F.titles.map(seasonLabel).join(', ')}` : 'No championships yet'}${F.best ? ` · best season ${seasonLabel(F.best.season)} (${F.best.pts} pts)` : ''}</span></div>
      <div class="grid wide">
        <div class="card"><h2>Seasons</h2>${seasons ? `<div class="scroll"><table class="t"><thead><tr><th>Season</th><th class="num">Record</th><th class="num">PTS</th><th class="num">League</th><th>Playoffs</th></tr></thead><tbody>${seasons}</tbody></table></div>` : '<p class="muted">No completed seasons yet.</p>'}</div>
        <div class="card"><h2>Franchise records, single season</h2>${best ? `<table class="t"><tbody>${best}</tbody></table>` : '<p class="muted">None yet.</p>'}</div>
      </div>
      <div class="section-title" style="margin:16px 0 8px">Franchise leaders (games with this team, since ${seasonLabel(CONFIG.START_SEASON)})</div>
      <div class="grid">${lead('pts', 'Points')}${lead('g', 'Goals')}${lead('gp', 'Games')}${lead('w', 'Goalie wins')}</div>`;
  }

  function historySeasonsHTML() {
    const s = S(), me = user(), H = s.history;
    const seasons = [...H.seasons].reverse();
    const roundNames = { 1: 'First round', 2: 'Second round', 3: 'Conference final', 4: 'Final' };
    const mine = seasons.map(x => {
      const i = x.nhl.findIndex(r => r[0] === me), r = x.nhl[i];
      const po = x.championId === me ? '<span class="badge good">Champions</span>' : x.playoffRound[me] ? esc(roundNames[x.playoffRound[me]] || '') : '<span class="muted">Missed</span>';
      return `<tr><td>${seasonLabel(x.season)}</td><td class="num">${r[2]}-${r[3]}-${r[4]}</td><td class="num"><b>${r[5]}</b></td><td class="num">${r[6]}–${r[7]}</td><td class="num">${ordinal(i + 1)}</td><td>${po}</td></tr>`;
    }).join('');
    const champs = seasons.map(x => `<tr class="${x.championId === me ? 'me' : ''}"><td>${seasonLabel(x.season)}</td><td>${chip(x.championId)} ${esc(teamName(x.championId))}</td><td class="muted small">def. ${chip(x.finalistId)}</td></tr>`).join('');
    const awards = [...H.awards].reverse().map(a => `<div class="card"><h2>${seasonLabel(a.season)} awards</h2><table class="t"><tbody>${a.list.filter(x => x.playerId).map(x => `<tr><td class="muted small">${esc(x.name)}</td><td>${plink(P(x.playerId))} ${(x.teamIds || []).map(chip).join(' ')}</td></tr>`).join('')}</tbody></table></div>`).join('');
    const drafts = Object.keys(H.draftClasses).sort().reverse().map(y => {
      const picks = H.draftClasses[y].filter(r => r[2] === me);
      return `<tr class="sub"><td colspan="3">${y}</td></tr>${picks.map(r => `<tr><td class="rk">#${r[0]}</td><td>${plink(P(r[3]))} <span class="pos">${P(r[3]).position}</span></td><td class="num">${P(r[3]).missing ? '' : ovr(P(r[3]).ovr)}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">No picks</td></tr>'}`;
    }).join('');
    const greats = Object.values(H.retired || {}).sort((a, b) => b.nhlGP - a.nhlGP).slice(0, 15);
    if (!seasons.length) return '<div class="banner acc">History starts when your first season ends: champions, your finishes, awards, drafts and retirements.</div>';
    return `<div class="grid wide">
      <div class="card"><h2>${esc(teamName(me))}</h2><div class="scroll"><table class="t"><thead><tr><th>Season</th><th class="num">Record</th><th class="num">PTS</th><th class="num">GF–GA</th><th class="num">League</th><th>Playoffs</th></tr></thead><tbody>${mine}</tbody></table></div></div>
      <div class="card"><h2>Champions</h2><table class="t"><tbody>${champs}</tbody></table></div>
      <div class="card"><h2>Your draft picks</h2><table class="t"><tbody>${drafts || '<tr><td class="muted">None yet.</td></tr>'}</tbody></table></div>
      ${H.trades && H.trades.some(x => x.teams.includes(me)) ? `<div class="card"><h2>Your trades</h2><div class="scroll"><table class="t"><tbody>${[...H.trades].reverse().filter(x => x.teams.includes(me)).slice(0, 30).map(x => {
        const them = x.teams[0] === me ? x.teams[1] : x.teams[0];
        return `<tr><td class="muted small nowrap">${esc(fmtShort(x.date))} ${seasonLabel(x.season)}</td><td>${chip(them)}</td><td class="small">got ${esc(HFM.Trade.describe(s, x, them))}<br><span class="muted">gave ${esc(HFM.Trade.describe(s, x, me))}</span></td></tr>`;
      }).join('')}</tbody></table></div></div>` : ''}
      ${greats.length ? `<div class="card"><h2>Notable retirements</h2><table class="t"><tbody>${greats.map(r => `<tr><td>${plink(P(r.id))} <span class="pos">${r.position}</span></td><td class="num">${r.nhlGP} GP</td><td class="num">peak ${ovr(r.peakOvr)}</td><td class="muted small">${seasonLabel(r.retired.season)}</td></tr>`).join('')}</tbody></table></div>` : ''}
    </div><div class="grid">${awards}</div>`;
  }

  // ── Contract dialogs ──
  function offerModalHTML(id) {
    const s = S(), p = P(id), me = user(), opts = Game.faOptions(id), st = Game.offerStatus(id);
    const pref = st.preferredTerm, yrs = ui.offerYears && ui.offerYears <= opts.length ? ui.offerYears : (st.mine ? st.mine.years : Math.min(pref, opts.length));
    const ask = opts[yrs - 1].capHit;
    const cap = ui.offerCap !== undefined && ui.offerCap !== null ? ui.offerCap : st.mine && st.mine.years === yrs ? st.mine.capHit : ask;
    const space = Contracts.capSpace(s, me) - Market.committed(s, me, id);
    return `<div class="card"><div class="matchup">${ovr(p.ovr)}<div><b>${esc(Select.fullName(p))}</b> <span class="pos">${p.position}</span> · age ${age(p)} · ceiling ${ceiling(p)}
        <div class="muted small">${p.lastTeamId ? `Last played for ${chip(p.lastTeamId)} · ` : ''}prefers ${pref} year${pref > 1 ? 's' : ''} · ${st.offers} offer${st.offers === 1 ? '' : 's'} so far${st.decideOn ? ` · decides ${esc(fmtDate(st.decideOn))}` : ''}</div></div></div></div>
      <div class="card"><h2>What he's asking from you</h2><table class="t"><thead><tr><th>Term</th><th class="num">Cap hit</th><th class="num">Total</th><th></th></tr></thead><tbody>
        ${opts.map(o => `<tr class="${o.years === yrs ? 'me' : ''}"><td>${o.years} year${o.years > 1 ? 's' : ''}${o.years === pref ? ' <span class="badge acc">preferred</span>' : ''}</td><td class="num">${U.money(o.capHit)}</td><td class="num muted">${U.money(o.capHit * o.years)}</td>
          <td class="num"><button class="btn small" data-act="offer-term" data-years="${o.years}">Choose</button></td></tr>`).join('')}</tbody></table></div>
      <div class="card"><div class="toolbar" style="margin:0"><div class="field"><label class="small muted" for="offerCap">Cap hit ($M) for ${yrs} year${yrs > 1 ? 's' : ''}</label>
        <input id="offerCap" type="number" min="${CONFIG.cap.minSalary / 1e6}" max="${Contracts.maxContract() / 1e6}" step="0.025" value="${(cap / 1e6).toFixed(3)}"></div>
        <span class="spacer"></span><button class="btn primary" data-act="offer-submit" data-id="${id}" data-years="${yrs}" style="align-self:end">${st.mine ? 'Update offer' : 'Make offer'}</button></div>
        <p class="muted small" style="margin:8px 0 0">Your cap space for this offer: ${U.money(Math.max(0, space))}. At or above his ask he'll consider it; the best offer on his decision day wins.</p></div>`;
  }
  function resignModalHTML(id) {
    const s = S(), p = P(id), opts = Game.reSignOptions(id), st = Contracts.faStatus(s, p), pref = Contracts.preferredTerm(s, p, s.calendar.season + 1);
    const inSeason = !['SEASON_END', 'DRAFT', 'RE_SIGNING'].includes(s.calendar.phase);
    return `<div class="card"><div class="matchup">${ovr(p.ovr)}<div><b>${esc(Select.fullName(p))}</b> <span class="pos">${p.position}</span> · age ${age(p)} · <span class="badge">${st}</span>
        <div class="muted small">Now ${U.money(p.contract.capHit)} through ${seasonLabel(p.contract.expiresAfterSeason)}. ${inSeason ? 'An extension starts next season.' : 'The new deal starts next season.'}</div></div></div></div>
      <div class="card"><table class="t"><thead><tr><th>Term</th><th class="num">Cap hit</th><th class="num">Total</th><th></th></tr></thead><tbody>
        ${opts.map(o => `<tr><td>${o.years} year${o.years > 1 ? 's' : ''}${o.years === pref ? ' <span class="badge acc">preferred</span>' : ''}</td><td class="num">${U.money(o.capHit)}</td><td class="num muted">${U.money(o.capHit * o.years)}</td>
          <td class="num">${o.problem ? `<span class="muted small">${esc(o.problem)}</span>` : `<button class="btn small primary" data-act="resign-sign" data-id="${id}" data-years="${o.years}">Sign</button>`}</td></tr>`).join('')}</tbody></table></div>`;

  function confirmHTML({ text, act, id, label }) {
    return `<p>${text}</p><div class="toolbar" style="margin:0"><span class="spacer"></span><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="${act}" data-id="${id}">${esc(label)}</button></div>`;
